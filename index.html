<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>DUCK HEIST · El Banco del Pan</title>
    <meta name="description" content="Patos, pan y un atraco imposible. Un roguelite pixel art con armas absurdas, objetos, secretos y seis pisos que robar." />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #0a0a1a; overflow: hidden; }
      @font-face { font-family: 'PixelFont'; src: local('Courier New'); }
    </style>
    <script>
    /* DH_V0_5_0_CANVAS_BADGE */
    (() => {
      const VERSION = 'v0.5.0';
      const nativeRAF = window.requestAnimationFrame.bind(window);
      const drawVersion = () => {
        const canvas = document.querySelector('canvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        if (!ctx) return;
        ctx.save();
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.globalAlpha = 0.92;
        ctx.textAlign = 'left';
        ctx.textBaseline = 'top';
        ctx.font = '700 8px "Chakra Petch", monospace';
        ctx.fillStyle = '#e8d79a';
        ctx.shadowColor = 'rgba(0,0,0,.95)';
        ctx.shadowBlur = 2;
        ctx.fillText(VERSION, 10, 10);
        ctx.restore();
      };
      window.requestAnimationFrame = (callback) => nativeRAF((time) => {
        callback(time);
        drawVersion();
      });
      window.addEventListener('load', () => nativeRAF(drawVersion), { once: true });
    })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
