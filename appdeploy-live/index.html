<script>
(function(){
  const badge=document.querySelector('[data-duck-heist-version]');
  if(!badge)return;
  function placeVersion(){
    const canvases=[...document.querySelectorAll('canvas')];
    if(!canvases.length){badge.style.visibility='hidden';return;}
    let gameCanvas=canvases[0],best=0;
    for(const canvas of canvases){
      const r=canvas.getBoundingClientRect();
      const area=r.width*r.height;
      if(area>best){best=area;gameCanvas=canvas;}
    }
    const r=gameCanvas.getBoundingClientRect();
    badge.style.left=(r.left+24)+'px';
    badge.style.top=(r.top+24)+'px';
    badge.style.visibility='visible';
  }
  const observer=new MutationObserver(placeVersion);
  observer.observe(document.documentElement,{childList:true,subtree:true});
  addEventListener('resize',placeVersion,{passive:true});
  addEventListener('orientationchange',placeVersion,{passive:true});
  requestAnimationFrame(function tick(){placeVersion();requestAnimationFrame(tick);});
})();
</script>
