name: Step 1 apply exact render parity

on:
  push:
    branches: [step1-source-sync]
    paths:
      - '.github/workflows/step1-apply-render-exact.yml'

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: step1-source-sync
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply exact approved render details
        run: |
          set -euxo pipefail
          git apply --check step1-parity/render-exact.patch
          git apply step1-parity/render-exact.patch
          grep -q "drawDifficultySkull" src/game/render.ts
          grep -q 'MONEDAS' src/game/render.ts
      - run: npm ci
      - name: TypeScript validation
        run: npx tsc --noEmit
      - name: Vite source build
        run: npx vite build
      - name: Upload validated source build
        uses: actions/upload-artifact@v4
        with:
          name: step1-render-exact-build
          path: dist
          retention-days: 1
      - name: Commit exact render parity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game/render.ts
          git commit -m 'Match approved v0.4.3 render details'
          git push origin HEAD:step1-source-sync
