name: Materialize Duck Heist source

on:
  push:
    branches:
      - feature/macro-pato
  workflow_dispatch:

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: duck-heist-playable-bfvyg1-1788926588197-src
        run: npm install --no-audit --no-fund

      - name: Build and materialize game source
        working-directory: duck-heist-playable-bfvyg1-1788926588197-src
        run: npm run build

      - name: Upload materialized source
        uses: actions/upload-artifact@v4
        with:
          name: duckgame-materialized
          path: duck-heist-playable-bfvyg1-1788926588197-src/src/duckgame
          if-no-files-found: error
          retention-days: 1
