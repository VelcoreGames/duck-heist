name: inspect auth redirect settings
on:
  push:
    branches: [feat/v080-email-first-accounts]
    paths:
      - '.github/workflows/v080-auth-settings-inspect.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v080-email-first-accounts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read public Auth settings
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const cfg=JSON.parse(fs.readFileSync('public/velcore-cloud.json','utf8'));
          const res=await fetch(cfg.supabaseUrl+'/auth/v1/settings',{headers:{apikey:cfg.anonKey}});
          const body=await res.json();
          console.log('AUTH_SETTINGS_FULL',JSON.stringify(body));
          if(!res.ok)process.exit(1);
          JS
      - name: Remove temporary workflow
        if: always()
        run: |
          rm -f .github/workflows/v080-auth-settings-inspect.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'ci: remove auth settings inspection'
            git push origin HEAD:feat/v080-email-first-accounts
          fi
