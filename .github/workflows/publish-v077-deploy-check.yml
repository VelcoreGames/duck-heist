name: Publish Duck Heist v0.7.7 Deploy Check

on:
  push:
    paths:
      - '.github/workflows/publish-v077-deploy-check.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate source and build
        run: |
          grep -q 'duck-heist-build' index.html
          grep -q '0.7.7-deploy-check' index.html
          grep -q 'canvas2d-chibi-remastered-v5' src/game/graphics/playerChibiRemastered.ts
          npx tsc --noEmit
          npx vite build --outDir /tmp/duck-heist-v077 --emptyOutDir
          test -s /tmp/duck-heist-v077/index.html
          grep -q '0.7.7-deploy-check' /tmp/duck-heist-v077/index.html
          grep -q 'canvas2d-chibi-remastered-v5' /tmp/duck-heist-v077/index.html
      - name: Promote v0.7.7
        run: |
          npm version 0.7.7 --no-git-tag-version
          printf '0.7.7\n' > VERSION
          rm -rf web-release dist
          mkdir -p web-release
          cp -a /tmp/duck-heist-v077/. web-release/
          node scripts/publish-release.mjs
      - name: Validate promoted release
        run: |
          test -s web-release/index.html
          test -s dist/index.html
          grep -q '"version": "0.7.7"' package.json
          grep -q '^0.7.7$' VERSION
          grep -q '0.7.7-deploy-check' web-release/index.html
          grep -q 'canvas2d-chibi-remastered-v5' web-release/index.html
          cmp web-release/index.html dist/index.html
      - name: Commit v0.7.7
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A index.html web-release dist VERSION package.json package-lock.json
          git commit -m 'Release Duck Heist v0.7.7 deployment verification build'
          git pull --rebase origin main
          git push origin HEAD:main
