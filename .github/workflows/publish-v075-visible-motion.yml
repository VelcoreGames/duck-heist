name: Publish Duck Heist v0.7.5 Visible Motion

on:
  push:
    paths:
      - '.github/workflows/publish-v075-visible-motion.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply player motion patch
        run: python scripts/patch-v075-player.py
      - name: Validate source and build
        run: |
          npx tsc --noEmit
          grep -q "rt.state = 'shoot'" src/game/graphics/playerChibiRemastered.ts
          grep -q "vertical ? 2.45" src/game/graphics/playerChibiRemastered.ts
          grep -q "canvas2d-chibi-remastered-v4" src/game/graphics/playerChibiRemastered.ts
          npx vite build --outDir /tmp/duck-heist-v075 --emptyOutDir
          test -s /tmp/duck-heist-v075/index.html
          grep -q 'canvas2d-chibi-remastered-v4' /tmp/duck-heist-v075/index.html
      - name: Promote v0.7.5
        run: |
          npm version 0.7.5 --no-git-tag-version
          printf '0.7.5\n' > VERSION
          rm -rf web-release dist
          mkdir -p web-release
          cp -a /tmp/duck-heist-v075/. web-release/
          node scripts/publish-release.mjs
      - name: Validate promoted release
        run: |
          test -s web-release/index.html
          test -s dist/index.html
          grep -q '"version": "0.7.5"' package.json
          grep -q '^0.7.5$' VERSION
          grep -q 'canvas2d-chibi-remastered-v4' web-release/index.html
          cmp web-release/index.html dist/index.html
      - name: Commit v0.7.5
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A src/game/graphics/playerChibiRemastered.ts web-release dist VERSION package.json package-lock.json
          git commit -m 'Release Duck Heist v0.7.5 visible vertical walk and shot feedback'
          git pull --rebase origin main
          git push origin HEAD:main
