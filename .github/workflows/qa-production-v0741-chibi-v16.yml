name: QA Production v0.7.41 Chibi V16

on:
  push:
    paths:
      - '.github/workflows/qa-production-v0741-chibi-v16.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wait for v0.7.41 on live domain
        run: |
          expected='0.7.41-chibi-v16-weapon-perspective'
          ok=0
          for i in $(seq 1 24); do
            html="$(curl -fsSL --max-time 20 "https://velcoregames.com/?qa=v0741-preflight&t=$(date +%s%N)" || true)"
            if printf '%s' "$html" | grep -q "$expected"; then
              echo "live build ready on attempt $i"
              ok=1
              break
            fi
            echo "waiting for live build ($i/24)"
            sleep 10
          done
          test "$ok" = 1

      - name: Install Chromium QA runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Exercise live player motion and combat
        env:
          PROD_URL: https://velcoregames.com/?qa=v0741-playwright
        run: |
          mkdir -p /tmp/duck-heist-v0741-prod-qa
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const assert = require('assert');
          const expectedBuild='0.7.41-chibi-v16-weapon-perspective';
          const expectedRenderer='canvas2d-chibi-atlas-v16';
          const expectedFrames='464-raster-chibi-v16';
          const out='/tmp/duck-heist-v0741-prod-qa';
          const errors=[],failedRequests=[],badResponses=[],samples={};
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));

          async function ds(page){return page.evaluate(()=>({
            build:document.querySelector('meta[name="duck-heist-build"]')?.getAttribute('content')||'',
            renderer:document.documentElement.dataset.duckHeistPlayerRenderer||'',
            frames:document.documentElement.dataset.duckHeistPlayerFrames||'',
            state:document.documentElement.dataset.duckHeistPlayerState||'',
            visualFrame:document.documentElement.dataset.duckHeistPlayerVisualFrame||'',
          }));}
          async function shot(page,key,label,delay){
            await page.keyboard.down(key); await sleep(delay);
            const d=await ds(page); assert.strictEqual(d.state,'shoot',`${label}: ${JSON.stringify(d)}`);
            await page.screenshot({path:`${out}/${label}.png`,fullPage:true});
            await page.keyboard.up(key); await sleep(240); return d;
          }
          async function move(page,key,label){
            await page.keyboard.down(key); await sleep(150); const a=await ds(page);
            assert.strictEqual(a.state,'walk',`${label} start: ${JSON.stringify(a)}`);
            await sleep(330); const b=await ds(page); assert.strictEqual(b.state,'walk');
            assert.notStrictEqual(a.visualFrame,b.visualFrame,`${label} frame stalled`);
            await page.screenshot({path:`${out}/${label}.png`,fullPage:true});
            await page.keyboard.up(key); await sleep(170); return {a,b};
          }

          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({viewport:{width:1440,height:1000},deviceScaleFactor:1});
            const page=await context.newPage();
            page.on('console',m=>{if(m.type()==='error')errors.push(`console:${m.text()}`)});
            page.on('pageerror',e=>errors.push(`pageerror:${e.message}`));
            page.on('requestfailed',r=>failedRequests.push(`${r.method()} ${r.url()} :: ${r.failure()?.errorText||'failed'}`));
            page.on('response',r=>{if(r.status()>=400)badResponses.push(`${r.status()} ${r.url()}`)});
            const response=await page.goto(`${process.env.PROD_URL}&t=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:60000});
            assert(response&&response.ok(),`production returned ${response?.status()}`); await sleep(2200);
            const pre=await ds(page); assert.strictEqual(pre.build,expectedBuild);
            await page.screenshot({path:`${out}/00-menu.png`,fullPage:true});
            const canvas=page.locator('canvas[role="application"]'); assert.strictEqual(await canvas.count(),1); await canvas.focus();
            await page.keyboard.press('Enter');
            let started=false;
            for(let i=0;i<4;i++){await sleep(900);const d=await ds(page);if(d.renderer===expectedRenderer&&d.frames===expectedFrames){started=true;break;}await page.keyboard.press('Enter');}
            assert(started,`renderer did not start ${JSON.stringify(await ds(page))}`);
            await sleep(3000);
            samples.idle=await ds(page); assert.strictEqual(samples.idle.state,'idle');
            await page.screenshot({path:`${out}/01-idle.png`,fullPage:true});

            samples.up=await move(page,'w','02-walk-up');
            samples.down=await move(page,'s','03-walk-down');
            samples.right=await move(page,'d','04-walk-right');

            await page.keyboard.down('d'); await sleep(100); await page.keyboard.press('Shift'); await sleep(55);
            samples.dash=await ds(page); assert.strictEqual(samples.dash.state,'dash');
            await page.screenshot({path:`${out}/05-dash-right.png`,fullPage:true}); await page.keyboard.up('d'); await sleep(390);

            samples.shootRight=await shot(page,'ArrowRight','06-shoot-right',45);
            samples.shootDown=await shot(page,'ArrowDown','07-shoot-down',45);
            samples.shootUp=await shot(page,'ArrowUp','08-shoot-up',45);
            samples.final=await ds(page);
            assert.strictEqual(samples.final.renderer,expectedRenderer); assert.strictEqual(samples.final.frames,expectedFrames);
            assert.strictEqual(errors.length,0,errors.join(' | ')); assert.strictEqual(failedRequests.length,0,failedRequests.join(' | ')); assert.strictEqual(badResponses.length,0,badResponses.join(' | '));
            fs.writeFileSync(`${out}/qa.json`,JSON.stringify({samples,errors,failedRequests,badResponses},null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Upload production screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duck-heist-v0741-production-qa
          path: /tmp/duck-heist-v0741-prod-qa
          if-no-files-found: warn
          retention-days: 7
