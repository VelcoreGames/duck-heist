name: v0.8.0 email-first account QA
on:
  push:
    branches: [feat/v080-email-first-accounts]
    paths:
      - '.github/workflows/v080-email-first-account-qa.yml'

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v080-email-first-accounts
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Guard v0.8.0
        run: |
          node -e "const p=require('./package.json'); if(p.version!=='0.8.0') throw new Error('version changed')"
          test "$(tr -d '\r\n' < VERSION)" = "0.8.0"
      - run: npx tsc --noEmit
      - run: npm run build

      - name: Validate email-first database rules
        env:
          PGPASSWORD: postgres
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          create role anon;
          create role authenticated;
          create schema auth;
          create table auth.users(id uuid primary key,email_confirmed_at timestamptz);
          create function auth.uid() returns uuid language sql stable as $$
            select nullif(current_setting('request.jwt.claim.sub',true),'')::uuid
          $$;
          SQL
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20260922_email_first_auth.sql
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          do $qa$
          declare
            u1 uuid:='11111111-1111-4111-8111-111111111111';
            u2 uuid:='22222222-2222-4222-8222-222222222222';
            u3 uuid:='33333333-3333-4333-8333-333333333333';
            r jsonb;
          begin
            insert into auth.users(id,email_confirmed_at) values(u1,null),(u2,now()),(u3,now());

            perform set_config('request.jwt.claim.sub',u1::text,true);
            r:=public.vg_auth_claim_username('PatoLadron');
            if r->>'code'<>'email_not_verified' then raise exception 'unverified email claimed username %',r; end if;

            perform set_config('request.jwt.claim.sub',u2::text,true);
            r:=public.vg_auth_claim_username('PatoLadron');
            if coalesce((r->>'ok')::boolean,false) is not true then raise exception 'verified user failed claim %',r; end if;

            perform set_config('request.jwt.claim.sub',u3::text,true);
            r:=public.vg_auth_claim_username('patoladron');
            if r->>'code'<>'username_taken' then raise exception 'duplicate username accepted %',r; end if;
            if jsonb_array_length(r->'suggestions')<>3 then raise exception 'missing numbered suggestions %',r; end if;
            if lower(r->'suggestions'->>0)<>'patoladron2' then raise exception 'unexpected suggestion %',r; end if;

            r:=public.vg_auth_claim_username(r->'suggestions'->>0);
            if coalesce((r->>'ok')::boolean,false) is not true then raise exception 'suggested username was not available %',r; end if;

            r:=public.vg_auth_save_game_save('duck-heist',0,'{"schemaVersion":1,"gameVersion":"0.8.0","storage":{"duckheist_save":"{\"bestFloor\":4}"}}'::jsonb,'ci-device',false);
            if coalesce((r->>'ok')::boolean,false) is not true or (r->>'revision')::int<>1 then raise exception 'cloud save failed %',r; end if;
            r:=public.vg_auth_load_game_save('duck-heist');
            if (r->>'revision')::int<>1 then raise exception 'cloud load failed %',r; end if;
          end
          $qa$;
          SQL

      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Browser verification, password visibility and username flow
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/vg-email-http.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in {1..60}; do curl -fsS http://127.0.0.1:4173/duck-heist/ >/dev/null && break; sleep .25; done
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1191,height:900}});
          const errors=[];
          page.on('pageerror',e=>errors.push('pageerror '+String(e)));
          page.on('console',m=>{if(m.type()==='error')errors.push('console '+m.text());});

          let profile='';
          let saveRevision=0;
          await page.route('http://127.0.0.1:4173/velcore-cloud.json',r=>r.fulfill({
            status:200,contentType:'application/json',
            body:JSON.stringify({supabaseUrl:'https://cloud.test',anonKey:'sb_publishable_test_12345678901234567890'})
          }));
          await page.route('https://cloud.test/auth/v1/**',async route=>{
            const url=route.request().url();
            const body=route.request().postDataJSON?.()||{};
            if(url.includes('/signup'))return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({
              id:'11111111-1111-4111-8111-111111111111',email:body.email,email_confirmed_at:null
            })});
            if(url.includes('/token?grant_type=password'))return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({
              access_token:'access-token',refresh_token:'refresh-token',expires_in:3600,
              user:{id:'11111111-1111-4111-8111-111111111111',email:body.email||'duck@example.com',email_confirmed_at:'2026-09-22T20:00:00Z'}
            })});
            if(url.endsWith('/user'))return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({
              id:'11111111-1111-4111-8111-111111111111',email:'duck@example.com',email_confirmed_at:'2026-09-22T20:00:00Z'
            })});
            if(url.includes('/resend')||url.includes('/recover')||url.includes('/logout'))return route.fulfill({status:200,contentType:'application/json',body:'{}'});
            return route.fulfill({status:200,contentType:'application/json',body:'{}'});
          });
          await page.route('https://cloud.test/rest/v1/rpc/**',async route=>{
            const name=route.request().url().split('/').pop();
            if(name==='vg_auth_get_profile')return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify(profile?{ok:true,code:'ok',username:profile}:{ok:false,code:'not_found'})});
            if(name==='vg_auth_claim_username'){
              const b=route.request().postDataJSON();
              if(String(b.p_username).toLowerCase()==='patoladron')return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({ok:false,code:'username_taken',suggestions:['PatoLadron2','PatoLadron3','PatoLadron4']})});
              profile=String(b.p_username);
              return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({ok:true,code:'created',username:profile})});
            }
            if(name==='vg_auth_load_game_save')return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({ok:false,code:'not_found'})});
            if(name==='vg_auth_save_game_save'){
              saveRevision++;
              return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({ok:true,code:'saved',revision:saveRevision,updated_at:'2026-09-22T20:00:00Z'})});
            }
            return route.fulfill({status:404,contentType:'application/json',body:JSON.stringify({message:'unknown rpc '+name})});
          });

          await page.goto('http://127.0.0.1:4173/duck-heist/',{waitUntil:'networkidle'});
          await page.getByRole('button',{name:'CREAR CUENTA',exact:true}).click();
          if((await page.locator('input[name="email"]').count())!==1)throw new Error('email signup input missing');
          if(await page.locator('input[name="username"]').count())throw new Error('username must not be requested before verification');
          await page.locator('input[name="email"]').fill('duck@example.com');
          await page.locator('input[name="password"]').fill('PanSeguro_123');
          if(await page.locator('input[name="password"]').getAttribute('type')!=='password')throw new Error('password starts visible');
          await page.getByRole('button',{name:'Ver contraseña'}).click();
          if(await page.locator('input[name="password"]').getAttribute('type')!=='text')throw new Error('password visibility toggle failed');
          await page.getByRole('button',{name:'Ocultar contraseña'}).click();
          if(await page.locator('input[name="password"]').getAttribute('type')!=='password')throw new Error('password hide toggle failed');
          await page.locator('.vg-account-primary').click();
          await page.getByText('VERIFICA TU CORREO',{exact:true}).waitFor();
          if(await page.locator('input[name="username"]').count())throw new Error('username shown before verification');

          await page.getByRole('button',{name:'YA VERIFIQUÉ MI CORREO'}).click();
          await page.getByText('ELIGE TU USUARIO',{exact:true}).waitFor();
          await page.locator('input[name="username"]').fill('PatoLadron');
          await page.locator('.vg-account-primary').click();
          await page.getByRole('button',{name:'PatoLadron2',exact:true}).waitFor();
          await page.getByRole('button',{name:'PatoLadron2',exact:true}).click();
          await page.locator('.vg-account-primary').click();
          await page.getByText('PatoLadron2',{exact:true}).waitFor();
          if(saveRevision<1)throw new Error('initial account progress was not saved');

          const mobile=await browser.newPage({viewport:{width:390,height:844}});
          await mobile.route('http://127.0.0.1:4173/velcore-cloud.json',r=>r.fulfill({status:200,contentType:'application/json',body:JSON.stringify({supabaseUrl:'https://cloud.test',anonKey:'sb_publishable_test_12345678901234567890'})}));
          await mobile.goto('http://127.0.0.1:4173/duck-heist/',{waitUntil:'networkidle'});
          const overflow=await mobile.evaluate(()=>document.documentElement.scrollWidth>innerWidth+1);
          if(overflow)throw new Error('mobile horizontal overflow');

          const audit=await browser.newPage({viewport:{width:1191,height:900}});
          await audit.goto('http://127.0.0.1:4173/duck-heist/?auditoria=1',{waitUntil:'networkidle'});
          await audit.waitForFunction(()=>window.duckHeistAudit);
          const report=await audit.evaluate(()=>window.duckHeistAudit);
          if(report.failures.length)throw new Error('selftest '+report.failures.join(' | '));
          if(report.passed<452)throw new Error('selftest count regressed '+report.passed);
          if(errors.length)throw new Error(errors.join(' | '));
          console.log(JSON.stringify({passwordToggle:true,verificationBeforeUsername:true,usernameSuggestion:'PatoLadron2',saveRevision,selftests:report.passed,runtimeErrors:errors},null,2));
          await browser.close();
          JS

      - name: Refresh dist and remove temporary workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          rm -f .github/workflows/v080-email-first-account-qa.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'build: refresh email-first account bundle'
            git push origin HEAD:feat/v080-email-first-accounts
          fi
