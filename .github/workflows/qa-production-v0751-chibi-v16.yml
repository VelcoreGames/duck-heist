name: QA Production v0.7.51 Chibi V16

on:
  push:
    paths:
      - '.github/workflows/qa-production-v0751-chibi-v16.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wait for Hostinger production build
        run: |
          expected='0.7.51-chibi-v16-terminal-screens'
          mkdir -p /tmp/v0751-production-qa
          for i in $(seq 1 30); do
            curl -fsSL --retry 2 --retry-delay 2 "https://velcoregames.com/?qa=v0751&t=$(date +%s%N)" -o /tmp/v0751-production.html || true
            if grep -Fq "$expected" /tmp/v0751-production.html 2>/dev/null; then
              cp /tmp/v0751-production.html /tmp/v0751-production-qa/index.html
              echo "Hostinger production is on $expected"
              exit 0
            fi
            echo "Attempt $i/30: production has not switched yet"
            sleep 10
          done
          echo 'Hostinger did not expose v0.7.51 in time'
          exit 1

      - name: Verify exact released inline app is deployed
        run: |
          python - <<'PY'
          from pathlib import Path
          prod=Path('/tmp/v0751-production.html').read_bytes().rstrip(b'\r\n')
          rel=Path('web-release/index.html').read_bytes().rstrip(b'\r\n')
          if prod != rel:
              raise SystemExit('Hostinger HTML does not byte-match web-release after trailing newline normalization')
          PY
          grep -q '0.7.51-chibi-v16-terminal-screens' /tmp/v0751-production.html
          grep -q '464-raster-chibi-v16' /tmp/v0751-production.html
          grep -q 'canvas2d-chibi-atlas-v16' /tmp/v0751-production.html
          grep -q 'v16.8-death-focus' /tmp/v0751-production.html
          grep -q 'celebrating: true' src/game/render.ts
          grep -q 'dead: true' src/game/render.ts
          grep -q 'ctx.scale(.78, .78)' src/game/render.ts
          grep -q 'ctx.scale(.75, .75)' src/game/render.ts
          ! grep -q 'drawDuck(ctx, 0, 0, f' src/game/render.ts
          echo 'Hostinger is serving the exact released v0.7.51 inline app'

      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify deterministic production gameplay smoke
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');const fs=require('fs'),assert=require('assert');
          const out='/tmp/v0751-production-qa',expected='0.7.51-chibi-v16-terminal-screens',sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const errors=[],failed=[],bad=[],samples={};
          async function ds(p){return p.evaluate(()=>({build:document.querySelector('meta[name="duck-heist-build"]')?.content||'',renderer:document.documentElement.dataset.duckHeistPlayerRenderer||'',frames:document.documentElement.dataset.duckHeistPlayerFrames||'',fx:document.documentElement.dataset.duckHeistPlayerFx||'',state:document.documentElement.dataset.duckHeistPlayerState||'',visualFrame:document.documentElement.dataset.duckHeistPlayerVisualFrame||''}));}
          async function start(p){await p.goto(`https://velcoregames.com/?qa=v0751-smoke&t=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:60000});await sleep(1800);assert.strictEqual((await ds(p)).build,expected);const c=p.locator('canvas[role="application"]');assert.strictEqual(await c.count(),1);await c.focus();await p.keyboard.press('Enter');for(let i=0;i<6;i++){await sleep(850);const d=await ds(p);if(d.renderer==='canvas2d-chibi-atlas-v16'&&d.frames==='464-raster-chibi-v16'&&d.fx==='v16.8-death-focus')break;await p.keyboard.press('Enter');}await sleep(3200);const d=await ds(p);assert.strictEqual(d.state,'idle');assert.strictEqual(d.renderer,'canvas2d-chibi-atlas-v16');assert.strictEqual(d.frames,'464-raster-chibi-v16');return d;}
          async function move(p,key,label){await p.keyboard.down(key);await sleep(160);const a=await ds(p);await sleep(320);const b=await ds(p);await p.keyboard.up(key);await sleep(180);assert.strictEqual(a.state,'walk',`${label}: first walk sample`);assert.strictEqual(b.state,'walk',`${label}: second walk sample`);assert.notStrictEqual(a.visualFrame,b.visualFrame,`${label}: walk frame did not advance`);samples[`walk_${label}`]={a,b};}
          async function shoot(p,key,label){await p.keyboard.down(key);let hit=null;for(let i=0;i<35;i++){await sleep(16);const d=await ds(p);if(d.state==='shoot'){hit=d;break;}}await p.keyboard.up(key);assert(hit,`${label}: shoot not observed`);samples[`shoot_${label}`]=hit;await sleep(420);}
          (async()=>{const browser=await chromium.launch({headless:true});const context=await browser.newContext({viewport:{width:1440,height:1000},deviceScaleFactor:1});const p=await context.newPage();p.on('console',m=>{if(m.type()==='error')errors.push(m.text())});p.on('pageerror',e=>errors.push(e.message));p.on('requestfailed',r=>failed.push(`${r.method()} ${r.url()} ${r.failure()?.errorText||''}`));p.on('response',r=>{if(r.status()>=400)bad.push(`${r.status()} ${r.url()}`)});
          samples.idle=await start(p);await move(p,'w','up');await move(p,'s','down');await move(p,'d','right');await p.keyboard.down('d');await sleep(90);await p.keyboard.press('Shift');await sleep(55);samples.dash=await ds(p);await p.keyboard.up('d');assert.strictEqual(samples.dash.state,'dash');await sleep(850);await shoot(p,'ArrowRight','right');await shoot(p,'ArrowDown','down');await shoot(p,'ArrowUp','up');samples.final=await ds(p);assert.strictEqual(samples.final.build,expected);assert.strictEqual(samples.final.renderer,'canvas2d-chibi-atlas-v16');assert.strictEqual(samples.final.frames,'464-raster-chibi-v16');await p.screenshot({path:`${out}/01-production-smoke.png`,fullPage:true});assert.strictEqual(errors.length,0,errors.join(' | '));assert.strictEqual(failed.length,0,failed.join(' | '));assert.strictEqual(bad.length,0,bad.join(' | '));fs.writeFileSync(`${out}/qa.json`,JSON.stringify({scope:'v0.7.51 exact released bundle + deterministic core gameplay smoke. Victory/GAME OVER V16 presentation was independently screenshot-verified in candidate run 34795392326.',samples,errors,failed,bad},null,2));await browser.close();})().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Upload production QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duck-heist-v0751-production-qa
          path: /tmp/v0751-production-qa
          if-no-files-found: warn
          retention-days: 7
