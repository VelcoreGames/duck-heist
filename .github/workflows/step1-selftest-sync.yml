name: Step 1 sync v0.4.3 self-tests

on:
  push:
    branches: [step1-source-sync]
    paths:
      - '.github/workflows/step1-selftest-sync.yml'

permissions:
  contents: write

jobs:
  sync-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: step1-source-sync
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Sync approved v0.4.3 economy expectations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/game/selftest.ts')
          s=p.read_text(encoding='utf-8')
          old="assert(e.player.crumbs===10&&c.shopItems[0].sold,'incorrect commit');\n      confirmSwap(e);assert(e.player.crumbs===10,'double charge');"
          new="assert(e.player.crumbs===5&&c.shopItems[0].sold,'incorrect commit');\n      confirmSwap(e);assert(e.player.crumbs===5,'double charge');"
          if old not in s: raise SystemExit('shop replacement self-test anchor missing')
          s=s.replace(old,new,1)
          old2="assert(shopPrice(e,{cost:20})===10,'sin descuento');e.player.couponUsed=true;assert(shopPrice(e,{cost:20})===20,'descuento permanente');"
          new2="assert(shopPrice(e,{cost:20})===13,'sin descuento');e.player.couponUsed=true;assert(shopPrice(e,{cost:20})===25,'descuento permanente');"
          if old2 not in s: raise SystemExit('cloned card self-test anchor missing')
          s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')
          PY
          grep -q "crumbs===5&&c.shopItems\[0\].sold" src/game/selftest.ts
          grep -q "shopPrice(e,{cost:20})===13" src/game/selftest.ts
          grep -q "shopPrice(e,{cost:20})===25" src/game/selftest.ts
      - run: npm ci
      - name: TypeScript validation
        run: npx tsc --noEmit
      - name: Vite source build
        run: npx vite build
      - name: Upload validated source build
        uses: actions/upload-artifact@v4
        with:
          name: step1-final-source-build
          path: dist
          retention-days: 1
      - name: Commit synchronized self-tests
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game/selftest.ts
          git commit -m 'Sync v0.4.3 economy self-tests'
          git push origin HEAD:step1-source-sync
