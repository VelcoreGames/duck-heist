name: Endless v0.6.3 auto rounds QA
on:
  push:
    branches: [endless-auto-rounds]
    paths:
      - '.github/workflows/endless-auto-rounds-qa.yml'
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: endless-auto-rounds
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Auto-flow assertions
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = "0.6.3"
          grep -Fq "nextRoundTimer:number" src/game/types.ts
          grep -Fq "queueNextEndlessRound" src/game/engine.ts
          grep -Fq "engine.state === GameState.ENDLESS_REWARD" src/game/engine.ts
          grep -Fq "SIGUIENTE · RONDA" src/game/render.ts
          ! grep -Fq "ENTER · SIGUIENTE RONDA" src/game/render.ts
          grep -Fq "const VERSION = 'v0.6.3';" dist/index.html
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Browser no-click start smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/duck-server.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in {1..40}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep .25; done
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1191,height:900}});
          const errors=[];
          page.on('pageerror',e=>errors.push(String(e)));
          page.on('console',m=>{if(m.type()==='error') errors.push(m.text());});
          await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
          await page.waitForFunction(()=>document.querySelectorAll('canvas').length>=2);
          const menu=await page.screenshot();
          await page.keyboard.press('ArrowDown');
          await page.keyboard.press('Enter');
          await page.waitForTimeout(220);
          const difficulty=await page.screenshot();
          if(menu.equals(difficulty)) throw new Error('Endless difficulty did not open');
          await page.keyboard.press('Enter');
          // No more input: intro + quick message must advance to round 1 automatically.
          await page.waitForTimeout(3300);
          const round1=await page.screenshot();
          if(difficulty.equals(round1)) throw new Error('Round 1 did not auto-start');
          const state=await page.evaluate(()=>({
            overflowX:document.documentElement.scrollWidth>innerWidth,
            overflowY:document.documentElement.scrollHeight>innerHeight,
            canvases:[...document.querySelectorAll('canvas')].map(c=>({w:c.width,h:c.height}))
          }));
          if(errors.length) throw new Error('Runtime errors: '+errors.join(' | '));
          if(state.overflowX||state.overflowY) throw new Error('Page overflow');
          console.log(JSON.stringify(state));
          await browser.close();
          JS
      - name: Cleanup temporary QA
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/endless-auto-rounds-qa.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: remove temporary v0.6.3 auto-round QA'
          git push origin HEAD:endless-auto-rounds
