name: QA Production v0.7.39 Chibi V16

on:
  push:
    paths:
      - '.github/workflows/qa-production-v0739-chibi-v16.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium QA runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Exercise live production build
        env:
          PROD_URL: https://velcoregames.com/?qa=v0739-playwright
        run: |
          mkdir -p /tmp/duck-heist-prod-qa
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const assert = require('assert');

          const expectedBuild = '0.7.39-chibi-v16-premium-motion';
          const expectedRenderer = 'canvas2d-chibi-atlas-v16';
          const expectedFrames = '464-raster-chibi-v16';
          const outDir = '/tmp/duck-heist-prod-qa';
          const errors = [];
          const failedRequests = [];
          const badResponses = [];
          const samples = {};
          const sleep = ms => new Promise(r => setTimeout(r, ms));

          async function dataset(page) {
            return page.evaluate(() => ({
              build: document.querySelector('meta[name="duck-heist-build"]')?.getAttribute('content') || '',
              renderer: document.documentElement.dataset.duckHeistPlayerRenderer || '',
              frames: document.documentElement.dataset.duckHeistPlayerFrames || '',
              state: document.documentElement.dataset.duckHeistPlayerState || '',
              visualFrame: document.documentElement.dataset.duckHeistPlayerVisualFrame || '',
            }));
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              viewport: { width: 1440, height: 1000 },
              deviceScaleFactor: 1,
              userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36',
            });
            const page = await context.newPage();
            page.on('console', msg => { if (msg.type() === 'error') errors.push(`console: ${msg.text()}`); });
            page.on('pageerror', err => errors.push(`pageerror: ${err.message}`));
            page.on('requestfailed', req => failedRequests.push(`${req.method()} ${req.url()} :: ${req.failure()?.errorText || 'failed'}`));
            page.on('response', res => { if (res.status() >= 400) badResponses.push(`${res.status()} ${res.url()}`); });

            const url = `${process.env.PROD_URL}&t=${Date.now()}`;
            const response = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 60000 });
            assert(response && response.ok(), `production returned ${response?.status()}`);
            await sleep(2500);

            const preflight = await page.evaluate(() => ({
              title: document.title,
              href: location.href,
              build: document.querySelector('meta[name="duck-heist-build"]')?.getAttribute('content') || '',
              readyState: document.readyState,
              canvases: Array.from(document.querySelectorAll('canvas')).map(c => ({ role: c.getAttribute('role'), label: c.getAttribute('aria-label'), className: c.className, width: c.width, height: c.height })),
            }));
            fs.writeFileSync(`${outDir}/preflight.json`, JSON.stringify({ preflight, errors, failedRequests, badResponses }, null, 2));
            await page.screenshot({ path: `${outDir}/00-menu.png`, fullPage: true });
            console.log('PREFLIGHT', JSON.stringify({ preflight, errors, failedRequests, badResponses }, null, 2));
            assert.strictEqual(preflight.build, expectedBuild, `wrong live build: ${preflight.build}`);
            assert.strictEqual(errors.length, 0, `preflight browser errors: ${errors.join(' | ')}`);
            assert.strictEqual(failedRequests.length, 0, `preflight failed requests: ${failedRequests.join(' | ')}`);

            const gameCanvas = page.locator('canvas[role="application"]');
            assert.strictEqual(await gameCanvas.count(), 1, 'accessible game canvas missing');
            await gameCanvas.focus();
            await page.keyboard.press('Enter');

            // INICIAR ATRACO is selected by default. Wait until the V16 player is actually drawing.
            let started = false;
            for (let attempt = 0; attempt < 3; attempt++) {
              await sleep(900);
              const d = await dataset(page);
              if (d.renderer === expectedRenderer && d.frames === expectedFrames) { started = true; break; }
              await page.keyboard.press('Enter');
            }
            assert(started, `player renderer did not start: ${JSON.stringify(await dataset(page))}`);

            // A new run opens the floor/room title card. Confirm it before testing movement.
            await page.keyboard.press('Enter');
            await sleep(800);
            samples.loaded = await dataset(page);
            assert.strictEqual(samples.loaded.renderer, expectedRenderer);
            assert.strictEqual(samples.loaded.frames, expectedFrames);
            await page.screenshot({ path: `${outDir}/01-idle.png`, fullPage: true });

            async function movementSample(key, label) {
              await page.keyboard.down(key);
              await sleep(150);
              const first = await dataset(page);
              assert.strictEqual(first.state, 'walk', `${label} did not enter walk: ${JSON.stringify(first)}`);
              await sleep(320);
              const second = await dataset(page);
              assert.strictEqual(second.state, 'walk', `${label} walk did not persist`);
              assert.notStrictEqual(first.visualFrame, second.visualFrame, `${label} walk frame did not advance`);
              await page.screenshot({ path: `${outDir}/${label}.png`, fullPage: true });
              await page.keyboard.up(key);
              await sleep(160);
              return { first, second };
            }

            samples.up = await movementSample('w', '02-walk-up');
            samples.down = await movementSample('s', '03-walk-down');

            await page.keyboard.down('d');
            await sleep(100);
            await page.keyboard.press('Shift');
            await sleep(45);
            samples.dash = await dataset(page);
            assert.strictEqual(samples.dash.state, 'dash', `dash state missing: ${JSON.stringify(samples.dash)}`);
            await page.screenshot({ path: `${outDir}/04-dash-right.png`, fullPage: true });
            await page.keyboard.up('d');
            await sleep(360);

            await page.keyboard.down('ArrowRight');
            await sleep(55);
            samples.shoot = await dataset(page);
            assert.strictEqual(samples.shoot.state, 'shoot', `shoot state missing: ${JSON.stringify(samples.shoot)}`);
            await page.screenshot({ path: `${outDir}/05-shoot-right.png`, fullPage: true });
            await page.keyboard.up('ArrowRight');
            await sleep(220);

            samples.final = await dataset(page);
            assert.strictEqual(await gameCanvas.count(), 1, 'game canvas disappeared after input QA');
            assert.strictEqual(errors.length, 0, `browser errors: ${errors.join(' | ')}`);
            assert.strictEqual(failedRequests.length, 0, `failed requests: ${failedRequests.join(' | ')}`);
            assert.strictEqual(badResponses.length, 0, `bad responses: ${badResponses.join(' | ')}`);

            fs.writeFileSync(`${outDir}/qa.json`, JSON.stringify({ url, samples, errors, failedRequests, badResponses }, null, 2));
            console.log('QA', JSON.stringify({ expectedBuild, samples, errors, failedRequests, badResponses }, null, 2));
            await browser.close();
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          NODE
      - name: Upload visual QA captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duck-heist-v0739-production-qa
          path: /tmp/duck-heist-prod-qa
          if-no-files-found: warn
          retention-days: 7