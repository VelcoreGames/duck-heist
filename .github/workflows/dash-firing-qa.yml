name: Dash firing v0.6.6 QA
on:
  push:
    branches: [fix/dash-keep-firing]
    paths:
      - '.github/workflows/dash-firing-qa.yml'
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dash-keep-firing
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Static dash-fire assertions
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = "0.6.6"
          grep -Fq "player.fireCooldown <= 0 && player.switchAnim <= 6)" src/game/engine.ts
          ! grep -Fq "player.fireCooldown <= 0 && player.switchAnim <= 6 && player.dashTimer<=0" src/game/engine.ts
          ! grep -Fq "engine.mouseDown=false;engine.player.shootFlash=0;" src/App.tsx
          grep -Fq "const VERSION = 'v0.6.6';" dist/index.html
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Browser held-fire dash smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/duck-server.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in {1..40}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep .25; done
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1191,height:900}});
          const errors=[];
          page.on('pageerror',e=>errors.push(String(e)));
          page.on('console',m=>{if(m.type()==='error')errors.push(m.text());});
          await page.goto('http://127.0.0.1:4173/?auditoria=1',{waitUntil:'networkidle'});
          await page.waitForFunction(()=>window.duckHeistEngine && document.querySelectorAll('canvas').length>=2);

          // Start endless quickly.
          await page.keyboard.press('ArrowDown');
          await page.keyboard.press('Enter');
          await page.waitForTimeout(160);
          await page.keyboard.press('Enter');
          await page.waitForFunction(()=>window.duckHeistEngine?.gameMode==='endless'&&window.duckHeistEngine?.state==='PLAYING',{timeout:5000});

          // Aim to the right side of the game canvas.
          const canvas=page.locator('canvas[role="application"]');
          const box=await canvas.boundingBox();
          if(!box) throw new Error('No game canvas');
          await page.mouse.move(box.x+box.width*.76,box.y+box.height*.50);

          await page.evaluate(()=>{
            const e=window.duckHeistEngine;
            e.player.fireCooldown=0;
            e.player.dashCooldown=0;
            e.player.dashTimer=0;
            e.player.shotCounter=0;
          });

          await page.mouse.down({button:'left'});
          await page.waitForTimeout(120);
          const beforeDash=await page.evaluate(()=>({
            mouseDown:window.duckHeistEngine.mouseDown,
            shots:window.duckHeistEngine.player.shotCounter
          }));
          if(!beforeDash.mouseDown||beforeDash.shots<1) throw new Error('Held fire never started: '+JSON.stringify(beforeDash));

          await page.evaluate(()=>{window.duckHeistEngine.player.fireCooldown=0;});
          await page.mouse.down({button:'right'});
          const dashStart=await page.evaluate(()=>({
            mouseDown:window.duckHeistEngine.mouseDown,
            dash:window.duckHeistEngine.player.dashTimer,
            shots:window.duckHeistEngine.player.shotCounter
          }));
          if(!dashStart.mouseDown) throw new Error('Right-click dash cancelled held left fire: '+JSON.stringify(dashStart));
          if(dashStart.dash<=0) throw new Error('Dash did not start: '+JSON.stringify(dashStart));

          await page.waitForTimeout(45);
          const duringDash=await page.evaluate(()=>({
            mouseDown:window.duckHeistEngine.mouseDown,
            dash:window.duckHeistEngine.player.dashTimer,
            shots:window.duckHeistEngine.player.shotCounter
          }));
          if(!duringDash.mouseDown) throw new Error('Held fire was lost during dash: '+JSON.stringify(duringDash));
          if(duringDash.dash<=0) throw new Error('Dash ended before assertion: '+JSON.stringify(duringDash));
          if(duringDash.shots<=dashStart.shots) throw new Error('Shot counter did not increase during dash: '+JSON.stringify({dashStart,duringDash}));

          await page.mouse.up({button:'right'});
          await page.mouse.up({button:'left'});
          if(errors.length) throw new Error('Runtime errors: '+errors.join(' | '));
          console.log(JSON.stringify({beforeDash,dashStart,duringDash},null,2));
          await browser.close();
          JS
      - name: Cleanup temporary QA
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/dash-firing-qa.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: remove temporary v0.6.6 dash-fire QA'
          git push origin HEAD:fix/dash-keep-firing
