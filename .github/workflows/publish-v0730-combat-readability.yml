name: Publish Duck Heist v0.7.30 Combat Readability Chibi

on:
  push:
    paths:
      - '.github/workflows/publish-v0730-combat-readability.yml'
      - 'scripts/patch-v0730.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply v0.7.30 combat readability
        run: python3 scripts/patch-v0730.py
      - name: Validate source and build
        run: |
          test -s src/game/graphics/chibiCombatReadabilityV3.ts
          grep -q 'drawChibiEnemyHealthV3' src/game/graphics/chibiCombatReadabilityV3.ts
          grep -q 'drawChibiEnemyTelegraphV3' src/game/graphics/chibiCombatReadabilityV3.ts
          grep -q 'drawChibiEnemyHealthV3' src/game/render.ts
          grep -q 'drawChibiEnemyTelegraphV3' src/game/render.ts
          grep -q '0.7.30-combat-readability-chibi' index.html
          npx tsc --noEmit
          npx vite build --outDir /tmp/duck-heist-v0730 --emptyOutDir
          test -s /tmp/duck-heist-v0730/index.html
          grep -q '0.7.30-combat-readability-chibi' /tmp/duck-heist-v0730/index.html
      - name: Promote v0.7.30
        run: |
          npm version 0.7.30 --no-git-tag-version
          printf '0.7.30\n' > VERSION
          rm -rf web-release dist
          mkdir -p web-release
          cp -a /tmp/duck-heist-v0730/. web-release/
          node scripts/publish-release.mjs
      - name: Validate promoted release
        run: |
          test -s web-release/index.html
          test -s dist/index.html
          grep -q '"version": "0.7.30"' package.json
          grep -q '^0.7.30$' VERSION
          grep -q '0.7.30-combat-readability-chibi' web-release/index.html
          cmp web-release/index.html dist/index.html
      - name: Commit v0.7.30
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A index.html src/game/graphics/chibiCombatReadabilityV3.ts src/game/render.ts web-release dist VERSION package.json package-lock.json
          git commit -m 'Release Duck Heist v0.7.30 combat readability chibi'
          git pull --rebase origin main
          git push origin HEAD:main
