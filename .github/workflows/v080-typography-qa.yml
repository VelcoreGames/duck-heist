name: v0.8.0 Sora Roboto typography QA
on:
  push:
    branches: [feat/v080-sora-roboto-typography]
    paths:
      - '.github/workflows/v080-typography-qa.yml'

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v080-sora-roboto-typography
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Refresh lockfile
        run: npm install --package-lock-only

      - run: npm ci

      - name: Guard v0.8.0
        run: |
          node -e "const p=require('./package.json'); if(p.version!=='0.8.0') throw new Error('version changed')"
          test "$(tr -d '\r\n' < VERSION)" = "0.8.0"

      - run: npx tsc --noEmit
      - run: npm run build

      - name: Validate typography source rules
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const css=fs.readFileSync('src/index.css','utf8');
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          if(!pkg.dependencies['@fontsource/sora'])throw new Error('Sora dependency missing');
          if(!pkg.dependencies['@fontsource/roboto'])throw new Error('Roboto dependency missing');
          for(const imp of [
            '@fontsource/sora/latin-600.css',
            '@fontsource/sora/latin-700.css',
            '@fontsource/roboto/latin-400.css',
            '@fontsource/roboto/latin-500.css',
            '@fontsource/roboto/latin-700.css'
          ])if(!css.includes(imp))throw new Error('missing import '+imp);
          if(!css.includes("html,body,#root"))throw new Error('root typography missing');
          if(!css.includes("font-family:'Roboto',Arial,sans-serif"))throw new Error('Roboto family missing');
          if(!css.includes("font-family:'Sora',Arial,sans-serif"))throw new Error('Sora family missing');
          const pageCss=css.slice(css.indexOf('VELCORE GAMES · brand system'));
          if(/font-family:'Bungee'|font-family:Bungee|font-family:'Chakra Petch'/i.test(pageCss))throw new Error('legacy display font remains in Velcore Games page styles');
          console.log(JSON.stringify({sora:true,roboto:true,version:'0.8.0'},null,2));
          JS

      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Browser typography QA
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/typography-http.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in {1..60}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep .25; done

          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const errors=[];
          const inspect=async(viewport,path)=>{
            const page=await browser.newPage({viewport});
            page.on('pageerror',e=>errors.push('pageerror '+path+' '+e));
            page.on('console',m=>{if(m.type()==='error')errors.push('console '+path+' '+m.text());});
            await page.goto('http://127.0.0.1:4173'+path,{waitUntil:'networkidle'});
            const overflow=await page.evaluate(()=>({
              iw:innerWidth,
              doc:document.documentElement.scrollWidth,
              body:document.body.scrollWidth
            }));
            if(overflow.doc>overflow.iw+1||overflow.body>overflow.iw+1)throw new Error('overflow '+path+' '+JSON.stringify(overflow));
            return page;
          };

          for(const viewport of [{width:1440,height:900},{width:390,height:844}]){
            const home=await inspect(viewport,'/');
            const typography=await home.evaluate(()=>({
              body:getComputedStyle(document.body).fontFamily,
              hero:getComputedStyle(document.querySelector('.vg-hero h1')).fontFamily,
              cardTitle:getComputedStyle(document.querySelector('.vg-game-card h2')).fontFamily,
              cardSubtitle:getComputedStyle(document.querySelector('.vg-game-card h3')).fontFamily,
              paragraph:getComputedStyle(document.querySelector('.vg-hero p')).fontFamily,
              nav:getComputedStyle(document.querySelector('.vg-header-copy')).fontFamily,
              footer:getComputedStyle(document.querySelector('.vg-footer')).fontFamily
            }));
            for(const key of ['hero','cardTitle','cardSubtitle']){
              if(!typography[key].toLowerCase().includes('sora'))throw new Error(key+' not Sora '+typography[key]);
            }
            for(const key of ['body','paragraph','nav','footer']){
              if(!typography[key].toLowerCase().includes('roboto'))throw new Error(key+' not Roboto '+typography[key]);
            }
            await home.close();

            const account=await inspect(viewport,'/duck-heist/');
            const accountType=await account.evaluate(()=>({
              heading:getComputedStyle(document.querySelector('.vg-account-card h1')).fontFamily,
              subtitle:getComputedStyle(document.querySelector('.vg-account-sub')).fontFamily,
              button:getComputedStyle(document.querySelector('.vg-account-tabs button')).fontFamily,
              label:getComputedStyle(document.querySelector('.vg-account-form label')).fontFamily,
              input:getComputedStyle(document.querySelector('.vg-account-form input')).fontFamily
            }));
            if(!accountType.heading.toLowerCase().includes('sora'))throw new Error('account heading not Sora');
            for(const key of ['subtitle','button','label','input']){
              if(!accountType[key].toLowerCase().includes('roboto'))throw new Error('account '+key+' not Roboto '+accountType[key]);
            }
            await account.close();
          }

          const audit=await browser.newPage({viewport:{width:1191,height:900}});
          audit.on('pageerror',e=>errors.push('audit '+e));
          audit.on('console',m=>{if(m.type()==='error')errors.push('audit '+m.text());});
          await audit.goto('http://127.0.0.1:4173/duck-heist/?auditoria=1',{waitUntil:'networkidle'});
          await audit.waitForFunction(()=>window.duckHeistAudit);
          const report=await audit.evaluate(()=>window.duckHeistAudit);
          if(report.failures.length)throw new Error(report.failures.join(' | '));
          if(report.passed<452)throw new Error('selftests regressed '+report.passed);
          if(errors.length)throw new Error(errors.join(' | '));
          console.log(JSON.stringify({desktop:true,mobile:true,overflow:false,selftests:report.passed,runtimeErrors:errors},null,2));
          await browser.close();
          JS

      - name: Refresh dist and remove temporary workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          rm -f .github/workflows/v080-typography-qa.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'build: refresh Sora Roboto typography bundle'
            git push origin HEAD:feat/v080-sora-roboto-typography
          fi
