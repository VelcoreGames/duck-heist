name: Apply Velcore Games auth emails
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-auth-emails-now.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply hosted templates if token exists
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: nohiktjbysfkhtiqdbjy
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "TOKEN_PRESENT=false"
            exit 12
          fi
          echo "TOKEN_PRESENT=true"
          npm run email:apply
      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          rm -f .github/workflows/apply-auth-emails-now.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'ci: remove temporary auth email apply workflow'
            git push origin HEAD:main
          fi
