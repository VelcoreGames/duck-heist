name: Publish Duck Heist v0.7.2 Polished Player

on:
  push:
    paths:
      - '.github/workflows/publish-v072-polished-player.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Validate authored atlas
        run: |
          python - <<'PY'
          from PIL import Image
          p='src/assets/chibi/base-duck-approved-atlas.png'
          im=Image.open(p).convert('RGBA'); im.load()
          assert im.size==(600,120), im.size
          nonempty=0
          for r in range(4):
              for c in range(30):
                  fr=im.crop((c*20,r*30,(c+1)*20,(r+1)*30))
                  a=fr.getchannel('A')
                  if a.getbbox(): nonempty += 1
                  opaque=sum(1 for v in a.getdata() if v>0)
                  assert 5 < opaque < 540, (r,c,opaque)
          assert nonempty==120, nonempty
          print('validated 120 authored transparent frames')
          PY
      - name: Activate polished Canvas2D renderer
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/game/render.ts')
          s=p.read_text()
          old="import { drawChibiPlayerAtlasV4 } from './graphics/playerChibiAtlasV4';"
          new="import { drawChibiPlayerPolished } from './graphics/playerChibiPolished';"
          if old not in s and new not in s:
              raise SystemExit('expected player renderer import not found')
          s=s.replace(old,new)
          s=s.replace('drawChibiPlayerAtlasV4({','drawChibiPlayerPolished({')
          p.write_text(s)
          PY
          rm -f src/assets/chibi/base-duck-definitive-atlas.png
          rm -f src/game/graphics/playerChibiDefinitive.ts
          rm -f scripts/bake-definitive-player.py scripts/run-definitive-atlas-bake.py scripts/activate-definitive-player.py
      - name: Validate source and build
        run: |
          npx tsc --noEmit
          grep -q "drawChibiPlayerPolished" src/game/render.ts
          grep -q "POLISHED_DUCK_AUTHORED_FRAMES = 120" src/game/graphics/playerChibiPolished.ts
          ! grep -q "drawChibiPlayerDefinitive" src/game/render.ts
          npx vite build --outDir /tmp/duck-heist-v072 --emptyOutDir
          test -s /tmp/duck-heist-v072/index.html
          grep -q 'canvas2d-chibi-polished-v1' /tmp/duck-heist-v072/index.html
          grep -q '120-authored' /tmp/duck-heist-v072/index.html
      - name: Promote v0.7.2
        run: |
          npm version 0.7.2 --no-git-tag-version
          printf '0.7.2\n' > VERSION
          rm -rf web-release dist
          mkdir -p web-release
          cp -a /tmp/duck-heist-v072/. web-release/
          node scripts/publish-release.mjs
      - name: Validate promoted release
        run: |
          test -s web-release/index.html
          test -s dist/index.html
          grep -q '"version": "0.7.2"' package.json
          grep -q '^0.7.2$' VERSION
          grep -q 'canvas2d-chibi-polished-v1' web-release/index.html
          grep -q '120-authored' web-release/index.html
          cmp web-release/index.html dist/index.html
      - name: Commit v0.7.2
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A src/game/render.ts src/game/graphics src/assets/chibi scripts web-release dist VERSION package.json package-lock.json
          git commit -m 'Release Duck Heist v0.7.2 polished stable player'
          git pull --rebase origin main
          git push origin HEAD:main
