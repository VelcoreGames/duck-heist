name: Publish Duck Heist v0.7.47 Chibi V16 Death Focus

on:
  push:
    paths:
      - '.github/workflows/publish-v0747-chibi-v16-death-focus.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Apply approved V16.9 death focus
        run: |
          python scripts/patch-v0747-v16-death-focus.py
          sed -i 's/0.7.47-chibi-v16-death-focus-candidate/0.7.47-chibi-v16-death-focus/g' index.html
          npm version 0.7.47 --no-git-tag-version
          printf '0.7.47\n' > VERSION

      - name: Validate release source
        run: |
          grep -q 'function drawDownFocus' src/game/graphics/playerChibiAtlasV16.ts
          grep -q "v16.8-death-focus" src/game/graphics/playerChibiAtlasV16.ts
          grep -q 'p.flash > 0 && p.hp > 0' src/game/render.ts
          grep -q 'p.hp>0 && p.hp<=1' src/game/render.ts
          grep -q '0.7.47-chibi-v16-death-focus' index.html
          ! grep -q 'death-focus-candidate' index.html
          grep -q '"version": "0.7.47"' package.json
          grep -q 'const DRAW = 46' src/game/graphics/playerChibiAtlasV16.ts
          grep -q '464-raster-chibi-v16' src/game/graphics/playerChibiAtlasV16.ts
          grep -q 'deathTimer >= 36' src/game/engine.ts
          grep -q 'no hair' scripts/generate-player-chibi-v16.py
          grep -q 'no glasses' scripts/generate-player-chibi-v16.py
          npx tsc --noEmit
          git diff --check

      - name: Build v0.7.47 web release
        run: |
          rm -rf /tmp/duck-heist-v0747 web-release dist
          npx vite build --outDir /tmp/duck-heist-v0747 --emptyOutDir
          test -s /tmp/duck-heist-v0747/index.html
          grep -q '0.7.47-chibi-v16-death-focus' /tmp/duck-heist-v0747/index.html
          grep -q '464-raster-chibi-v16' /tmp/duck-heist-v0747/index.html
          grep -q 'canvas2d-chibi-atlas-v16' /tmp/duck-heist-v0747/index.html
          grep -q 'v16.8-death-focus' /tmp/duck-heist-v0747/index.html
          mkdir -p web-release
          cp -a /tmp/duck-heist-v0747/. web-release/
          node scripts/publish-release.mjs

      - name: Validate publish artifacts
        run: |
          test -s web-release/index.html
          test -s dist/index.html
          grep -q '^0.7.47$' VERSION
          grep -q '0.7.47-chibi-v16-death-focus' web-release/index.html
          grep -q '0.7.47-chibi-v16-death-focus' dist/index.html
          cmp web-release/index.html dist/index.html
          git diff --check

      - name: Commit v0.7.47 to main
        run: |
          git config user.name 'VelcoreGames'
          git config user.email 'contacto@velcore.com.mx'
          git add src/game/graphics/playerChibiAtlasV16.ts src/game/render.ts index.html package.json package-lock.json VERSION web-release dist
          git diff --cached --stat
          git diff --cached --quiet && { echo 'No release changes to commit'; exit 1; }
          git commit -m 'Release Duck Heist v0.7.47 Chibi V16 death focus'
          git pull --rebase origin main
          git push origin HEAD:main
