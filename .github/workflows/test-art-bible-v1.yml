name: Test Duck Heist Art Bible v1

on:
  push:
    branches:
      - feature/art-bible-v1
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: duck-heist-playable-bfvyg1-1788926588197-src
        run: npm install --no-audit --no-fund
      - name: Build
        working-directory: duck-heist-playable-bfvyg1-1788926588197-src
        run: npm run build
      - name: Verify Art Bible materialization
        working-directory: duck-heist-playable-bfvyg1-1788926588197-src
        run: |
          test -f src/duckgame/game/artBible.ts
          grep -q "DUCK_ART_BIBLE_VERSION='1.0'" src/duckgame/game/artBible.ts
          grep -q "drawCuteNoirWorldGrade" src/duckgame/game/render.ts
