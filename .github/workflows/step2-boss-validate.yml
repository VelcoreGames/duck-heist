name: Step 2 boss redesign validation
on:
  push:
    branches: [step2-boss-redesign]
    paths:
      - '.github/workflows/step2-boss-validate.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: step2-boss-redesign
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
      - name: Boss architecture assertions
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = "0.5.0"
          grep -Fq "SUBBOSS = 'SUBBOSS'" src/game/constants.ts
          grep -Fq "export const SUBBOSSES" src/game/data.ts
          grep -Fq "FLOOR_SUBBOSS_POOL" src/game/data.ts
          grep -Fq "case RoomType.SUBBOSS" src/game/engine.ts
          grep -Fq "FASE '+(phase+1)" src/game/engine.ts
          grep -Fq "const VERSION = 'v0.5.0';" dist/index.html
          test "$(git ls-files 'node_modules/**' | wc -l)" -eq 0
      - name: Remove temporary validation workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/step2-boss-validate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: remove temporary Step 2 validation'
          git push origin HEAD:step2-boss-redesign
