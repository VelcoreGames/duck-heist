name: QA Production v0.7.48 Chibi V16

on:
  push:
    paths:
      - '.github/workflows/qa-production-v0748-chibi-v16.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wait for Hostinger production build
        run: |
          expected='0.7.48-chibi-v16-floor-celebrate'
          for i in $(seq 1 30); do
            html="$(curl -fsSL --retry 2 --retry-delay 2 "https://velcoregames.com/?qa=v0748&t=$(date +%s%N)" || true)"
            if grep -Fq "$expected" <<<"$html"; then
              printf '%s' "$html" > /tmp/v0748-index.html
              echo "Hostinger production is on $expected"
              exit 0
            fi
            echo "Attempt $i/30: production has not switched yet"
            sleep 10
          done
          echo 'Hostinger did not expose v0.7.48 in time'
          exit 1

      - name: Verify Hostinger serves the v0.7.48 inline release bundle
        run: |
          mkdir -p /tmp/v0748-production-qa
          cp /tmp/v0748-index.html /tmp/v0748-production-qa/index.html

          # Duck Heist's release publisher inlines the Vite JS bundle into index.html.
          # Compare the functional markers in the actual Hostinger HTML against the
          # checked-in release rather than looking for a non-existent external JS file.
          grep -q '0.7.48-chibi-v16-floor-celebrate' /tmp/v0748-index.html
          grep -q '464-raster-chibi-v16' /tmp/v0748-index.html
          grep -q 'canvas2d-chibi-atlas-v16' /tmp/v0748-index.html
          grep -q 'v16.8-death-focus' /tmp/v0748-index.html
          grep -q 'celebrate' /tmp/v0748-index.html
          grep -q 'FLOOR_CLEAR' /tmp/v0748-index.html

          grep -q "type State = 'idle' | 'walk' | 'shoot' | 'dash' | 'hurt' | 'down' | 'interact' | 'celebrate'" src/game/graphics/playerChibiAtlasV16.ts
          grep -q "if (input.celebrating) return 'celebrate'" src/game/graphics/playerChibiAtlasV16.ts
          grep -q "celebrating: engine.state === GameState.FLOOR_CLEAR" src/game/render.ts
          grep -q '0.7.48-chibi-v16-floor-celebrate' web-release/index.html

          # Record hashes for audit. Hostinger can normalize the final newline, so the
          # semantic marker checks above are authoritative for the deployed inline app.
          sha256sum web-release/index.html /tmp/v0748-index.html | tee /tmp/v0748-production-qa/bundle-sha256.txt
          echo 'Hostinger exposes the v0.7.48 inline celebration release with expected V16 markers'

      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify production gameplay and renderer
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');
          const fs=require('fs'),assert=require('assert');
          const out='/tmp/v0748-production-qa',expected='0.7.48-chibi-v16-floor-celebrate';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const errors=[],failed=[],bad=[],samples={};
          async function ds(p){return p.evaluate(()=>({
            build:document.querySelector('meta[name="duck-heist-build"]')?.content||'',
            renderer:document.documentElement.dataset.duckHeistPlayerRenderer||'',
            frames:document.documentElement.dataset.duckHeistPlayerFrames||'',
            fx:document.documentElement.dataset.duckHeistPlayerFx||'',
            state:document.documentElement.dataset.duckHeistPlayerState||'',
            visualFrame:document.documentElement.dataset.duckHeistPlayerVisualFrame||''
          }));}
          async function start(p,label){
            await p.goto(`https://velcoregames.com/?qa=v0748-${label}&t=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:60000});
            await sleep(1800);assert.strictEqual((await ds(p)).build,expected);
            const c=p.locator('canvas[role="application"]');assert.strictEqual(await c.count(),1);await c.focus();await p.keyboard.press('Enter');
            for(let i=0;i<6;i++){await sleep(850);const d=await ds(p);if(d.renderer==='canvas2d-chibi-atlas-v16'&&d.frames==='464-raster-chibi-v16'&&d.fx==='v16.8-death-focus')break;await p.keyboard.press('Enter');}
            await sleep(3200);const d=await ds(p);assert.strictEqual(d.state,'idle');assert.strictEqual(d.renderer,'canvas2d-chibi-atlas-v16');assert.strictEqual(d.frames,'464-raster-chibi-v16');assert.strictEqual(d.fx,'v16.8-death-focus');return d;
          }
          async function move(p,key,label){await p.keyboard.down(key);await sleep(160);const a=await ds(p);await sleep(320);const b=await ds(p);await p.screenshot({path:`${out}/${label}.png`,fullPage:true});await p.keyboard.up(key);await sleep(180);assert.strictEqual(a.state,'walk');assert.strictEqual(b.state,'walk');assert.notStrictEqual(a.visualFrame,b.visualFrame);return {a,b};}
          async function shoot(p,key,label){await p.keyboard.down(key);let hit=null;for(let i=0;i<35;i++){await sleep(16);const d=await ds(p);if(d.state==='shoot'){hit=d;break;}}assert(hit,`${label}: shoot not observed`);await p.screenshot({path:`${out}/${label}.png`,fullPage:true});await p.keyboard.up(key);await sleep(420);return hit;}
          async function tryDeath(p,key,label){await start(p,`death-${label}`);let hurt=null,down=null;await p.keyboard.down(key);const t0=Date.now();while(Date.now()-t0<4200){const d=await ds(p);if(d.state==='hurt'&&!hurt)hurt={t:Date.now()-t0,...d};if(d.state==='down'){down={t:Date.now()-t0,...d};break;}await sleep(35);}await p.keyboard.up(key);if(!hurt&&!down){const t=Date.now();while(Date.now()-t<9000){const d=await ds(p);if(d.state==='hurt'){hurt={t:Date.now()-t0,...d};break;}if(d.state==='down'){down={t:Date.now()-t0,...d};break;}await sleep(40);}}if(hurt&&!down){const t=Date.now();while(Date.now()-t<50000){const d=await ds(p);if(d.state==='down'){down={t:Date.now()-t0,...d};break;}await sleep(40);}}return down?{hurt,down,direction:label}:null;}
          async function naturalDeath(p){for(const [key,label] of [['d','right'],['w','up'],['a','left'],['s','down']]){const r=await tryDeath(p,key,label);if(r)return r;}throw new Error('natural down state not reached');}
          (async()=>{
            const browser=await chromium.launch({headless:true});const context=await browser.newContext({viewport:{width:1440,height:1000},deviceScaleFactor:1});const p=await context.newPage();
            p.on('console',m=>{if(m.type()==='error')errors.push(m.text())});p.on('pageerror',e=>errors.push(e.message));p.on('requestfailed',r=>failed.push(`${r.method()} ${r.url()} ${r.failure()?.errorText||''}`));p.on('response',r=>{if(r.status()>=400)bad.push(`${r.status()} ${r.url()}`)});
            samples.idle=await start(p,'motion');await p.screenshot({path:`${out}/01-idle.png`,fullPage:true});samples.up=await move(p,'w','02-walk-up');samples.down=await move(p,'s','03-walk-down');samples.right=await move(p,'d','04-walk-right');
            await p.keyboard.down('d');await sleep(90);await p.keyboard.press('Shift');await sleep(55);samples.dash=await ds(p);assert.strictEqual(samples.dash.state,'dash');await p.screenshot({path:`${out}/05-dash.png`,fullPage:true});await p.keyboard.up('d');await sleep(850);
            await start(p,'shoot');samples.shootRight=await shoot(p,'ArrowRight','06-shoot-right');samples.shootDown=await shoot(p,'ArrowDown','07-shoot-down');samples.shootUp=await shoot(p,'ArrowUp','08-shoot-up');
            samples.death=await naturalDeath(p);assert.strictEqual(samples.death.down.state,'down');assert.strictEqual(samples.death.down.fx,'v16.8-death-focus');await p.screenshot({path:`${out}/09-down-natural.png`,fullPage:true});await sleep(750);await p.screenshot({path:`${out}/10-game-over.png`,fullPage:true});await p.keyboard.press('Enter');let restarted=null;for(let i=0;i<20;i++){await sleep(350);const d=await ds(p);if(d.state==='idle'||d.state==='walk'){restarted=d;break;}}assert(restarted,'restart after game over failed');samples.restarted=restarted;
            samples.final=await ds(p);assert.strictEqual(samples.final.build,expected);assert.strictEqual(samples.final.renderer,'canvas2d-chibi-atlas-v16');assert.strictEqual(samples.final.frames,'464-raster-chibi-v16');assert.strictEqual(errors.length,0,errors.join(' | '));assert.strictEqual(failed.length,0,failed.join(' | '));assert.strictEqual(bad.length,0,bad.join(' | '));
            fs.writeFileSync(`${out}/qa.json`,JSON.stringify({samples,errors,failed,bad},null,2));await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Upload production QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duck-heist-v0748-production-qa
          path: /tmp/v0748-production-qa
          if-no-files-found: warn
          retention-days: 7
