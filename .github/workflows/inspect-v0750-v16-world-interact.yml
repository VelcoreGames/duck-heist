name: Inspect Duck Heist v0.7.50 V16 World Interact

on:
  push:
    paths:
      - '.github/workflows/inspect-v0750-v16-world-interact.yml'
      - 'scripts/patch-v0750-v16-world-interact.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Apply world interaction candidate
        run: python scripts/patch-v0750-v16-world-interact.py

      - name: Validate candidate scope and presentation isolation
        run: |
          grep -q 'interactVisualTimer: number' src/game/types.ts
          grep -q 'switchAnim: 0, interactVisualTimer: 0' src/game/engine.ts
          grep -q 'if (player.interactVisualTimer > 0) player.interactVisualTimer--' src/game/engine.ts
          grep -q 'p.interactVisualTimer > 0 && !p.moving' src/game/render.ts
          grep -q '0.7.50-chibi-v16-world-interact-candidate' index.html
          grep -q 'const DRAW = 46' src/game/graphics/playerChibiAtlasV16.ts
          grep -q '464-raster-chibi-v16' src/game/graphics/playerChibiAtlasV16.ts
          grep -q 'v16.8-death-focus' src/game/graphics/playerChibiAtlasV16.ts
          # The new timer must not be used as a gameplay condition in engine.ts.
          ! grep -Eq 'if[[:space:]]*\([^\n]*interactVisualTimer|while[[:space:]]*\([^\n]*interactVisualTimer' src/game/engine.ts
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' index.html src/game/engine.ts src/game/render.ts src/game/types.ts | sort)"
          test "$changed" = "$expected"
          git diff --check

      - name: Add local-only QA engine hook
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/App.tsx');s=p.read_text()
          old='''    const engine = createEngine(wc, wctx, uctx);\n    engineRef.current = engine;\n'''
          new='''    const engine = createEngine(wc, wctx, uctx);\n    engineRef.current = engine;\n    (window as Window & { __duckQaEngine?: GameEngine }).__duckQaEngine = engine;\n'''
          if s.count(old)!=1: raise SystemExit('QA hook anchor mismatch')
          p.write_text(s.replace(old,new,1))
          PY

      - name: Validate TypeScript and build
        run: |
          npx tsc --noEmit
          npx vite build --outDir /tmp/v0750-build --emptyOutDir
          grep -q '0.7.50-chibi-v16-world-interact-candidate' /tmp/v0750-build/index.html
          grep -q '464-raster-chibi-v16' /tmp/v0750-build/index.html

      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify real E interaction and action priority
        run: |
          mkdir -p /tmp/v0750-review
          cd /tmp/v0750-build
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/v0750-http.log 2>&1 &
          echo $! >/tmp/v0750-http.pid
          cd "$GITHUB_WORKSPACE"
          node <<'NODE'
          const {chromium}=require('playwright');const fs=require('fs'),assert=require('assert');
          const out='/tmp/v0750-review',expected='0.7.50-chibi-v16-world-interact-candidate',sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const errors=[],failed=[],bad=[],samples={};
          async function ds(p){return p.evaluate(()=>{const e=window.__duckQaEngine,c=e?.contents.get(e.currentKey);return {build:document.querySelector('meta[name="duck-heist-build"]')?.content||'',renderer:document.documentElement.dataset.duckHeistPlayerRenderer||'',frames:document.documentElement.dataset.duckHeistPlayerFrames||'',fx:document.documentElement.dataset.duckHeistPlayerFx||'',state:document.documentElement.dataset.duckHeistPlayerState||'',visualFrame:document.documentElement.dataset.duckHeistPlayerVisualFrame||'',engineState:e?.state,interactVisualTimer:e?.player.interactVisualTimer,switchAnim:e?.player.switchAnim,moving:e?.player.moving,dashTimer:e?.player.dashTimer,chestOpened:c?.chest?.opened};});}
          async function start(p){await p.goto(`http://127.0.0.1:4173/?qa=v0750&t=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:60000});await sleep(1500);assert.strictEqual((await ds(p)).build,expected);const c=p.locator('canvas[role="application"]');await c.focus();await p.keyboard.press('Enter');for(let i=0;i<10;i++){await sleep(650);const d=await ds(p);if(d.engineState==='PLAYING'&&d.state==='idle')return d;await p.keyboard.press('Enter');}throw new Error('did not reach PLAYING idle');}
          async function observe(p,ms){const seen=[];const t0=Date.now();while(Date.now()-t0<ms){seen.push(await ds(p));await sleep(7);}return seen;}
          async function primeTimer(p,n=12){await p.evaluate(n=>{const e=window.__duckQaEngine;if(!e)throw new Error('engine missing');e.keys={};e.mouseDown=false;e.player.moving=false;e.player.shootFlash=0;e.player.dashTimer=0;e.player.hurtTimer=0;e.player.switchAnim=0;e.player.interactVisualTimer=n;},n);}
          (async()=>{const browser=await chromium.launch({headless:true});const context=await browser.newContext({viewport:{width:1440,height:1000},deviceScaleFactor:1});const p=await context.newPage();p.on('console',m=>{if(m.type()==='error')errors.push(m.text())});p.on('pageerror',e=>errors.push(e.message));p.on('requestfailed',r=>failed.push(`${r.method()} ${r.url()} ${r.failure()?.errorText||''}`));p.on('response',r=>{if(r.status()>=400)bad.push(`${r.status()} ${r.url()}`)});
          samples.idle=await start(p);assert.strictEqual(samples.idle.renderer,'canvas2d-chibi-atlas-v16');assert.strictEqual(samples.idle.frames,'464-raster-chibi-v16');assert.strictEqual(samples.idle.interactVisualTimer,0);

          // Put a real chest next to the player, then use the actual E input path.
          await p.evaluate(()=>{const e=window.__duckQaEngine;if(!e)throw new Error('engine missing');const c=e.contents.get(e.currentKey);if(!c)throw new Error('content missing');c.chest={x:e.player.x-3,y:e.player.y,opened:false};e.player.switchAnim=0;e.player.interactVisualTimer=0;});
          await p.keyboard.press('e');samples.chest=await observe(p,330);
          assert(samples.chest.some(x=>x.chestOpened===true),'E did not open the QA chest');
          assert(samples.chest.some(x=>(x.interactVisualTimer??0)>0),'successful chest did not start visual interaction timer');
          assert(samples.chest.every(x=>x.switchAnim===0),'world interaction unexpectedly changed weapon switch timer');
          const chestFrames=new Set(samples.chest.filter(x=>x.state==='interact').map(x=>x.visualFrame));
          assert(chestFrames.size>=7,`too few interact frames from real E chest: ${[...chestFrames].join(',')}`);
          assert(chestFrames.has('interact:11'),'real E chest did not reach authored interact frame 11');
          assert(samples.chest.some(x=>x.state==='idle'),'real E chest did not recover to idle');

          // Capture a second real E interaction mid-gesture without affecting the timing assertions above.
          await p.evaluate(()=>{const e=window.__duckQaEngine;if(!e)throw new Error('engine missing');const c=e.contents.get(e.currentKey);c.chest={x:e.player.x-3,y:e.player.y,opened:false};});await p.keyboard.press('e');
          for(let i=0;i<80;i++){await sleep(5);const d=await ds(p);if(d.visualFrame==='interact:5'){await p.screenshot({path:`${out}/01-world-interact.png`,fullPage:true});break;}}
          await sleep(280);

          // Locomotion suppresses the world gesture immediately so the player never slides in interact pose.
          await primeTimer(p,12);await p.keyboard.down('d');await sleep(45);samples.move=await ds(p);await p.keyboard.up('d');assert.strictEqual(samples.move.state,'walk');assert((samples.move.interactVisualTimer??0)>0,'visual timer unexpectedly vanished during movement');
          await p.screenshot({path:`${out}/02-move-interrupt.png`,fullPage:true});

          // Shoot remains fully available: this timer is not a fire gate.
          await primeTimer(p,12);await p.keyboard.down('ArrowRight');let shoot=null;for(let i=0;i<40;i++){await sleep(10);const d=await ds(p);if(d.state==='shoot'){shoot=d;break;}}await p.keyboard.up('ArrowRight');assert(shoot,'shoot was blocked by world interaction visual timer');assert((shoot.interactVisualTimer??0)>0,'shoot test outlived visual timer');samples.shoot=shoot;

          // Dash also wins immediately.
          await sleep(450);await primeTimer(p,12);await p.keyboard.down('d');await sleep(20);await p.keyboard.press('Shift');await sleep(30);samples.dash=await ds(p);await p.keyboard.up('d');assert.strictEqual(samples.dash.state,'dash');assert((samples.dash.interactVisualTimer??0)>0,'dash test outlived visual timer');

          assert.strictEqual(errors.length,0,errors.join(' | '));assert.strictEqual(failed.length,0,failed.join(' | '));assert.strictEqual(bad.length,0,bad.join(' | '));fs.writeFileSync(`${out}/qa.json`,JSON.stringify({samples:{idle:samples.idle,chestFrames:[...chestFrames],move:samples.move,shoot:samples.shoot,dash:samples.dash},errors,failed,bad},null,2));await browser.close();})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          kill "$(cat /tmp/v0750-http.pid)" || true

      - name: Upload candidate review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duck-heist-v0750-world-interact-candidate
          path: /tmp/v0750-review
          if-no-files-found: warn
          retention-days: 7
