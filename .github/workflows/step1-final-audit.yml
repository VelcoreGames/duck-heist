name: Step 1 final audit
on:
  push:
    branches: [step1-source-sync]
    paths:
      - '.github/workflows/step1-final-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: step1-source-sync
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Vite build
        run: npx vite build
      - name: Verify Step 1 parity markers
        run: |
          set -e
          echo CHECK_VERSION && test "$(cat VERSION)" = "0.4.3"
          echo CHECK_VIEWPORT && grep -Fq 'viewport-fit=cover' index.html
          echo CHECK_BADGE && grep -Fq "const VERSION = 'v0.4.3';" index.html
          echo CHECK_MONEDAS && grep -Fq "'MONEDAS'" src/game/render.ts
          echo CHECK_MIGAJAS && grep -Fq "'MIGAJAS'" src/game/render.ts
          echo CHECK_STATS && grep -Fq 'ESTADÍSTICAS DE LA RUN' src/game/render.ts
          echo CHECK_DIFFICULTY_STATE && grep -Fq "DIFFICULTY = 'DIFFICULTY'" src/game/constants.ts
          echo CHECK_MAD && grep -Fq "LOCO POR EL PAN" src/game/engine.ts
          echo CHECK_TAB && grep -Fq "k==='tab'" src/App.tsx
          echo CHECK_DANGER && grep -Fq "dangerEventActive" src/game/engine.ts
          echo CHECK_DIST_HTML && test -s dist/index.html
          echo CHECK_DIST_SINGLEFILE && grep -Fq 'ESTADÍSTICAS DE LA RUN' dist/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: step1-final-audit-build
          path: dist
          if-no-files-found: error
