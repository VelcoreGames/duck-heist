name: Step 1 final audit
on:
  push:
    branches: [step1-source-sync]
    paths:
      - '.github/workflows/step1-final-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: step1-source-sync
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Vite build
        run: npx vite build
      - name: Verify Step 1 parity markers
        run: |
          test "$(cat VERSION)" = "0.4.3"
          grep -q 'viewport-fit=cover' index.html
          grep -q "const VERSION = 'v0.4.3';" index.html
          grep -q "'MONEDAS'" src/game/render.ts
          grep -q "'MIGAJAS'" src/game/render.ts
          grep -q 'ESTADÍSTICAS DE LA RUN' src/game/render.ts
          grep -q "DIFFICULTY = 'DIFFICULTY'" src/game/constants.ts
          grep -q "LOCO POR EL PAN" src/game/render.ts
          grep -q "k==='tab'" src/App.tsx
          grep -q "dangerEventActive" src/game/engine.ts
          test -s dist/index.html
          test -n "$(find dist/assets -maxdepth 1 -type f -name '*.js' -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: step1-final-audit-build
          path: dist
          if-no-files-found: error
