name: Inspect Duck Heist v0.7.52 V16 Wardrobe Robber

on:
  push:
    paths:
      - '.github/workflows/inspect-v0752-v16-wardrobe-robber.yml'
      - 'scripts/patch-v0752-v16-wardrobe-robber.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Apply wardrobe robber candidate
        run: python scripts/patch-v0752-v16-wardrobe-robber.py

      - name: Validate candidate scope and overlay preservation
        run: |
          grep -q '0.7.52-chibi-v16-wardrobe-robber-candidate' index.html
          grep -q "if (skin.id === 'robber')" src/game/render.ts
          grep -q "if (s.id === 'robber')" src/game/render.ts
          grep -q 'ctx.scale(1.55, 1.55)' src/game/render.ts
          grep -q 'ctx.scale(.82, .82)' src/game/render.ts
          grep -q "drawDuckSkin(ctx, -8, -8, engine.frame, skin.id" src/game/render.ts
          grep -q "drawDuckSkin(ctx, -8, -8, engine.frame + i \* 7, s.id" src/game/render.ts
          grep -q "skinId: 'robber'" src/game/render.ts
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' index.html src/game/render.ts | sort)"
          test "$changed" = "$expected"
          git diff --check

      - name: Add local-only QA engine hook
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/App.tsx');s=p.read_text()
          old='''    const engine = createEngine(wc, wctx, uctx);\n    engineRef.current = engine;\n'''
          new='''    const engine = createEngine(wc, wctx, uctx);\n    engineRef.current = engine;\n    (window as Window & { __duckQaEngine?: GameEngine }).__duckQaEngine = engine;\n'''
          if s.count(old)!=1: raise SystemExit('QA hook anchor mismatch')
          p.write_text(s.replace(old,new,1))
          PY

      - name: Validate TypeScript and build
        run: |
          npx tsc --noEmit
          rm -rf /tmp/v0752-build
          npx vite build --outDir /tmp/v0752-build --emptyOutDir
          grep -q '0.7.52-chibi-v16-wardrobe-robber-candidate' /tmp/v0752-build/index.html
          grep -q '464-raster-chibi-v16' /tmp/v0752-build/index.html

      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Compare robber and overlay skins in wardrobe
        run: |
          mkdir -p /tmp/v0752-review
          cd /tmp/v0752-build
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/v0752-http.log 2>&1 &
          echo $! >/tmp/v0752-http.pid
          cd "$GITHUB_WORKSPACE"
          node <<'NODE'
          const {chromium}=require('playwright');const fs=require('fs'),assert=require('assert');
          const out='/tmp/v0752-review',expected='0.7.52-chibi-v16-wardrobe-robber-candidate',sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const errors=[],failed=[],bad=[],samples={};
          async function ds(p){return p.evaluate(()=>({build:document.querySelector('meta[name="duck-heist-build"]')?.content||'',renderer:document.documentElement.dataset.duckHeistPlayerRenderer||'',frames:document.documentElement.dataset.duckHeistPlayerFrames||'',state:document.documentElement.dataset.duckHeistPlayerState||'',visualFrame:document.documentElement.dataset.duckHeistPlayerVisualFrame||''}));}
          async function setWardrobe(p,index){await p.evaluate(index=>{const e=window.__duckQaEngine;if(!e)throw new Error('engine missing');e.state='WARDROBE';e.wardrobeIndex=index;e.wardrobeScroll=0;e.wardrobeScrollTarget=0;e.unlockedSkins=['robber','gangster','prisoner','baker','executive','pink','ninja','undercover','pirate','golden','king'];e.onStateChange?.(e.state);},index);await sleep(220);}
          (async()=>{const browser=await chromium.launch({headless:true});const context=await browser.newContext({viewport:{width:1440,height:1000},deviceScaleFactor:1});const p=await context.newPage();p.on('console',m=>{if(m.type()==='error')errors.push(m.text())});p.on('pageerror',e=>errors.push(e.message));p.on('requestfailed',r=>failed.push(`${r.method()} ${r.url()} ${r.failure()?.errorText||''}`));p.on('response',r=>{if(r.status()>=400)bad.push(`${r.status()} ${r.url()}`)});
          await p.goto(`http://127.0.0.1:4173/?qa=v0752&t=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:60000});await sleep(900);assert.strictEqual((await ds(p)).build,expected);assert.strictEqual(await p.locator('canvas[role="application"]').count(),1);
          await setWardrobe(p,0);samples.robberA=await ds(p);assert.strictEqual(samples.robberA.renderer,'canvas2d-chibi-atlas-v16');assert.strictEqual(samples.robberA.frames,'464-raster-chibi-v16');assert.strictEqual(samples.robberA.state,'idle');await sleep(260);samples.robberB=await ds(p);await p.screenshot({path:`${out}/01-robber-v16.png`,fullPage:true});
          await setWardrobe(p,1);await p.screenshot({path:`${out}/02-gangster-overlay.png`,fullPage:true});
          await setWardrobe(p,3);await p.screenshot({path:`${out}/03-baker-overlay.png`,fullPage:true});
          await setWardrobe(p,10);await p.screenshot({path:`${out}/04-king-overlay.png`,fullPage:true});
          assert.strictEqual(errors.length,0,errors.join(' | '));assert.strictEqual(failed.length,0,failed.join(' | '));assert.strictEqual(bad.length,0,bad.join(' | '));fs.writeFileSync(`${out}/qa.json`,JSON.stringify({samples,errors,failed,bad},null,2));await browser.close();})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          kill "$(cat /tmp/v0752-http.pid)" || true

      - name: Upload candidate review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duck-heist-v0752-wardrobe-robber-candidate
          path: /tmp/v0752-review
          if-no-files-found: warn
          retention-days: 7
