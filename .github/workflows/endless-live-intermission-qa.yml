name: Endless v0.6.5 live intermission QA
on:
  push:
    branches: [fix/endless-live-intermission]
    paths:
      - '.github/workflows/endless-live-intermission-qa.yml'
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/endless-live-intermission
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Static assertions
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = "0.6.5"
          grep -Fq "La arena y todo el botín recogible persisten entre rondas" src/game/engine.ts
          grep -Fq "engine.state=GameState.PLAYING" src/game/engine.ts
          grep -Fq "betweenRounds" src/game/render.ts
          ! grep -Fq "PREPÁRATE · RONDA 1" src/game/render.ts
          grep -Fq "const VERSION = 'v0.6.5';" dist/index.html
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Browser live-intermission smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/duck-server.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in {1..40}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep .25; done
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1191,height:900}});
          const errors=[];
          page.on('pageerror',e=>errors.push(String(e)));
          page.on('console',m=>{if(m.type()==='error')errors.push(m.text());});
          await page.goto('http://127.0.0.1:4173/?auditoria=1',{waitUntil:'networkidle'});
          await page.waitForFunction(()=>window.duckHeistEngine && document.querySelectorAll('canvas').length>=2);
          await page.keyboard.press('ArrowDown');
          await page.keyboard.press('Enter');
          await page.waitForTimeout(180);
          await page.keyboard.press('Enter');

          await page.waitForFunction(()=>{
            const e=window.duckHeistEngine;
            return e?.gameMode==='endless'&&e?.state==='PLAYING'&&e?.endless?.round===0&&e?.endless?.nextRoundTimer>0;
          },{timeout:5000});

          const x0=await page.evaluate(()=>window.duckHeistEngine.player.x);
          await page.keyboard.down('d');
          await page.waitForTimeout(260);
          await page.keyboard.up('d');
          const moving=await page.evaluate(()=>{
            const e=window.duckHeistEngine;
            return {x:e.player.x,state:e.state,round:e.endless.round,timer:e.endless.nextRoundTimer};
          });
          if(moving.state!=='PLAYING'||moving.round!==0)throw new Error('Initial message blocked gameplay: '+JSON.stringify(moving));
          if(moving.x<=x0+1)throw new Error('Player could not move during message: '+JSON.stringify({x0,moving}));

          await page.waitForFunction(()=>window.duckHeistEngine?.endless?.round===1&&window.duckHeistEngine?.state==='PLAYING',{timeout:4000});

          const injected=await page.evaluate(()=>{
            const e=window.duckHeistEngine,c=e.contents.get(e.currentKey);
            const weapon=e.player.weapons[0]?.id;
            c.pickups.push({x:62,y:62,type:'crumb',value:7,lifetime:99999});
            c.pickups.push({x:82,y:62,type:'golden_crumb',value:3,lifetime:99999});
            c.pickups.push({x:102,y:62,type:'croissant',value:1,lifetime:99999});
            if(weapon)c.items.push({x:122,y:62,itemId:weapon,isWeapon:true,isActive:false});
            c.enemies=[];e.endless.pendingEnemies=[];e.endless.roundActive=true;
            return {pickups:c.pickups.length,items:c.items.length,weapon,key:e.currentKey,x:e.player.x,y:e.player.y};
          });

          await page.waitForFunction(()=>{
            const e=window.duckHeistEngine;
            return e?.endless?.round===1&&!e?.endless?.roundActive&&e?.endless?.nextRoundTimer>0&&e?.state==='PLAYING';
          },{timeout:2000});

          const between=await page.evaluate(()=>{
            const e=window.duckHeistEngine,c=e.contents.get(e.currentKey);
            return {state:e.state,pickups:c.pickups.length,items:c.items.length,timer:e.endless.nextRoundTimer,x:e.player.x};
          });
          if(between.pickups<injected.pickups||between.items<injected.items)throw new Error('Floor loot disappeared at round end: '+JSON.stringify({injected,between}));

          const xb=between.x;
          await page.keyboard.down('a');
          await page.waitForTimeout(180);
          await page.keyboard.up('a');
          const movedBetween=await page.evaluate(()=>({x:window.duckHeistEngine.player.x,state:window.duckHeistEngine.state,timer:window.duckHeistEngine.endless.nextRoundTimer}));
          if(movedBetween.state!=='PLAYING'||movedBetween.x>=xb-1)throw new Error('Player cannot move between rounds: '+JSON.stringify({xb,movedBetween}));

          await page.waitForFunction(()=>window.duckHeistEngine?.endless?.round===2&&window.duckHeistEngine?.state==='PLAYING',{timeout:3500});
          const round2=await page.evaluate(()=>{
            const e=window.duckHeistEngine,c=e.contents.get(e.currentKey),room=e.map.rooms.get(e.currentKey);
            return {round:e.endless.round,key:e.currentKey,floor:e.map.floorIndex,roomFloor:room.floorIndex,pickups:c.pickups.length,items:c.items.length};
          });
          if(round2.key!=='0,0'||round2.floor!==0||round2.roomFloor!==0)throw new Error('Arena changed: '+JSON.stringify(round2));
          if(round2.pickups<injected.pickups||round2.items<injected.items)throw new Error('Floor loot did not persist into R2: '+JSON.stringify({injected,round2}));
          if(errors.length)throw new Error('Runtime errors: '+errors.join(' | '));
          console.log(JSON.stringify({x0,moving,injected,between,movedBetween,round2},null,2));
          await browser.close();
          JS
      - name: Cleanup temporary QA
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/endless-live-intermission-qa.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: remove temporary v0.6.5 live-intermission QA'
          git push origin HEAD:fix/endless-live-intermission
