name: Publish Duck Heist v0.7.38 Chibi V16 Polish

on:
  push:
    paths:
      - '.github/workflows/publish-v0738-chibi-v16-polish.yml'
      - 'scripts/patch-v0738-v16-art.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: pip install --disable-pip-version-check pillow

      - name: Polish V16 art and regenerate atlas
        run: |
          python scripts/patch-v0738-v16-art.py
          python scripts/generate-player-chibi-v16.py
          python - <<'PY'
          from PIL import Image
          im=Image.open('src/assets/chibi/base-duck-chibi-v16-atlas.png').convert('RGBA'); im.load()
          assert im.size==(7424,256),im.size
          assert sum(1 for r in range(4) for c in range(116) if im.crop((c*64,r*64,(c+1)*64,(r+1)*64)).getchannel('A').getbbox())==464
          # Late fall frames must keep meaningful pixels away from the atlas edge.
          for r in range(4):
              for c in range(78,88):
                  a=im.crop((c*64,r*64,(c+1)*64,(r+1)*64)).getchannel('A')
                  mask=a.point(lambda v:255 if v>64 else 0)
                  b=mask.getbbox(); assert b,(r,c)
                  assert b[0]>=1 and b[2]<=63,(r,c,b)
          print('validated V16 clipping, 464 frames, rear weapon polish')
          PY

      - name: Validate source and build
        run: |
          grep -q 'turn_sign\*4.2\*down' scripts/generate-player-chibi-v16.py
          grep -q "paste_gun(im,direction,(47,31+bob)" scripts/generate-player-chibi-v16.py
          grep -q '0.7.38-chibi-v16-polish' index.html
          npx tsc --noEmit
          npx vite build --outDir /tmp/duck-heist-v0738 --emptyOutDir
          test -s /tmp/duck-heist-v0738/index.html
          grep -q '0.7.38-chibi-v16-polish' /tmp/duck-heist-v0738/index.html
          grep -q '464-raster-chibi-v16' /tmp/duck-heist-v0738/index.html

      - name: Promote v0.7.38
        run: |
          npm version 0.7.38 --no-git-tag-version
          printf '0.7.38\n' > VERSION
          rm -rf web-release dist
          mkdir -p web-release
          cp -a /tmp/duck-heist-v0738/. web-release/
          node scripts/publish-release.mjs

      - name: Validate promoted release
        run: |
          test -s web-release/index.html
          test -s dist/index.html
          grep -q '"version": "0.7.38"' package.json
          grep -q '^0.7.38$' VERSION
          grep -q '0.7.38-chibi-v16-polish' web-release/index.html
          cmp web-release/index.html dist/index.html

      - name: Commit v0.7.38
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A scripts/generate-player-chibi-v16.py src/assets/chibi/base-duck-chibi-v16-atlas.png index.html web-release dist VERSION package.json package-lock.json
          git commit -m 'Release Duck Heist v0.7.38 chibi V16 polish'
          git pull --rebase origin main
          git push origin HEAD:main
