name: Publish Duck Heist v0.7.0 Definitive Player

on:
  push:
    paths:
      - '.github/workflows/publish-v070-definitive-player.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Restore canonical V5 art source
        run: |
          git fetch origin fix/base-duck-png-v5:refs/remotes/origin/fix/base-duck-png-v5
          mkdir -p src/assets/chibi
          git show "origin/fix/base-duck-png-v5:duck-heist-playable-bfvyg1-1788926588197-src/public/assets-v2/base-duck-final-atlas.png" > src/assets/chibi/base-duck-final-atlas.png
          python -c "from PIL import Image,ImageFile; ImageFile.LOAD_TRUNCATED_IMAGES=True; im=Image.open('src/assets/chibi/base-duck-final-atlas.png'); im.load(); assert im.size==(1040,208),im.size; print('canonical V5 source',im.size)"

      - name: Bake definitive atlas
        run: python scripts/run-definitive-atlas-bake.py

      - name: Activate definitive renderer
        run: python scripts/activate-definitive-player.py

      - name: Validate definitive atlas
        run: |
          python -c "from PIL import Image; from pathlib import Path; p=Path('src/assets/chibi/base-duck-definitive-atlas.png'); assert p.exists() and p.stat().st_size>10000; im=Image.open(p).convert('RGBA'); assert im.size==(3952,416); print('atlas',im.size,p.stat().st_size)"
          python -c "from PIL import Image; im=Image.open('src/assets/chibi/base-duck-definitive-atlas.png').convert('RGBA'); cell=52; states=[(0,0,16),(0,16,24),(0,40,16),(0,56,20),(1,0,12),(1,12,20),(1,32,16)]; n=sum(1 for d in range(4) for bank,start,count in states for i in range(count) if im.crop(((start+i)*cell,(d*2+bank)*cell,(start+i+1)*cell,(d*2+bank+1)*cell)).getbbox()); assert n==496,n; print('frames',n)"

      - name: Validate source and build
        run: |
          npx tsc --noEmit
          grep -q "DUCK_DEFINITIVE_BAKED_RASTER_FRAMES = 496" src/game/graphics/playerChibiDefinitive.ts
          grep -q "drawChibiPlayerDefinitive" src/game/render.ts
          grep -q "dead: p.hp <= 0" src/game/render.ts
          npx vite build --outDir /tmp/duck-heist-v070 --emptyOutDir
          test -s /tmp/duck-heist-v070/index.html

      - name: Promote v0.7.0
        run: |
          npm version 0.7.0 --no-git-tag-version
          printf '0.7.0\n' > VERSION
          rm -rf web-release dist
          mkdir -p web-release
          cp -a /tmp/duck-heist-v070/. web-release/
          node scripts/publish-release.mjs

      - name: Validate promoted release
        run: |
          test -s web-release/index.html
          test -s dist/index.html
          grep -q 'Duck Heist' web-release/index.html
          grep -q '"version": "0.7.0"' package.json
          grep -q '^0.7.0$' VERSION
          cmp web-release/index.html dist/index.html
          find web-release -type f | grep -q 'base-duck-definitive-atlas'

      - name: Commit v0.7.0 definitive player release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A src/assets/chibi/base-duck-final-atlas.png src/assets/chibi/base-duck-definitive-atlas.png src/game/render.ts web-release dist VERSION package.json package-lock.json
          if git diff --cached --quiet; then
            echo 'Release already up to date.'
            exit 0
          fi
          git commit -m 'Release Duck Heist v0.7.0 definitive player'
          git pull --rebase origin main
          git push origin HEAD:main
