name: Publish Duck Heist v0.7.1 Player Recovery

on:
  push:
    paths:
      - '.github/workflows/publish-v071-player-recovery.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Restore known-good authored atlas
        run: |
          git show c58d863f4fdcf95d0db26a8a6d1834fe12b6b09a:src/assets/chibi/base-duck-approved-atlas.png > src/assets/chibi/base-duck-approved-atlas.png
          python - <<'PY'
          from PIL import Image
          im=Image.open('src/assets/chibi/base-duck-approved-atlas.png').convert('RGBA'); im.load()
          assert im.size==(600,120), im.size
          cell=(20,30)
          nonempty=0
          for r in range(4):
              for c in range(30):
                  fr=im.crop((c*20,r*30,(c+1)*20,(r+1)*30))
                  a=fr.getchannel('A')
                  box=a.getbbox()
                  if box: nonempty+=1
                  opaque=sum(1 for v in a.getdata() if v>0)
                  assert opaque < 20*30*.9, (r,c,opaque)
          assert nonempty==120, nonempty
          print('validated 120 authored transparent frames')
          PY
      - name: Activate safe renderer
        run: python scripts/recover-v071-player.py
      - name: Validate source and build
        run: |
          npx tsc --noEmit
          grep -q "drawChibiPlayerAtlasV4" src/game/render.ts
          grep -q "CHIBI_BASE_DUCK_REAL_FRAMES = 120" src/game/graphics/playerChibiAtlasV4.ts
          npx vite build --outDir /tmp/duck-heist-v071 --emptyOutDir
          test -s /tmp/duck-heist-v071/index.html
      - name: Promote v0.7.1
        run: |
          npm version 0.7.1 --no-git-tag-version
          printf '0.7.1\n' > VERSION
          rm -rf web-release dist
          mkdir -p web-release
          cp -a /tmp/duck-heist-v071/. web-release/
          node scripts/publish-release.mjs
      - name: Validate release
        run: |
          test -s web-release/index.html
          test -s dist/index.html
          grep -q '"version": "0.7.1"' package.json
          grep -q '^0.7.1$' VERSION
          grep -q '120-real' web-release/index.html
          cmp web-release/index.html dist/index.html
      - name: Commit release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A src/assets/chibi/base-duck-approved-atlas.png src/game/render.ts web-release dist VERSION package.json package-lock.json
          git commit -m 'Release Duck Heist v0.7.1 validated player recovery'
          git pull --rebase origin main
          git push origin HEAD:main
