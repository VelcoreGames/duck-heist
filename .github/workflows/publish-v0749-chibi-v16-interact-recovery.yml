name: Publish Duck Heist v0.7.49 Chibi V16 Interact Recovery

on:
  push:
    paths:
      - '.github/workflows/publish-v0749-chibi-v16-interact-recovery.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Apply approved V16 interact recovery
        run: |
          python scripts/patch-v0749-v16-interact-recovery.py
          sed -i 's/0.7.49-chibi-v16-interact-recovery-candidate/0.7.49-chibi-v16-interact-recovery/g' index.html
          npm version 0.7.49 --no-git-tag-version
          printf '0.7.49\n' > VERSION

      - name: Validate release source
        run: |
          grep -q "return Math.min(COUNT.interact - 1, tick)" src/game/graphics/playerChibiAtlasV16.ts
          grep -q "rt.state === 'interact' && wanted === 'idle' && age < COUNT.interact" src/game/graphics/playerChibiAtlasV16.ts
          grep -q "state === 'celebrate'" src/game/graphics/playerChibiAtlasV16.ts
          grep -q '0.7.49-chibi-v16-interact-recovery' index.html
          ! grep -q 'interact-recovery-candidate' index.html
          grep -q '"version": "0.7.49"' package.json
          grep -q 'const DRAW = 46' src/game/graphics/playerChibiAtlasV16.ts
          grep -q '464-raster-chibi-v16' src/game/graphics/playerChibiAtlasV16.ts
          grep -q 'v16.8-death-focus' src/game/graphics/playerChibiAtlasV16.ts
          grep -q 'no hair' scripts/generate-player-chibi-v16.py
          grep -q 'no glasses' scripts/generate-player-chibi-v16.py
          npx tsc --noEmit
          git diff --check

      - name: Build v0.7.49 web release
        run: |
          rm -rf /tmp/duck-heist-v0749 web-release dist
          npx vite build --outDir /tmp/duck-heist-v0749 --emptyOutDir
          test -s /tmp/duck-heist-v0749/index.html
          grep -q '0.7.49-chibi-v16-interact-recovery' /tmp/duck-heist-v0749/index.html
          grep -q '464-raster-chibi-v16' /tmp/duck-heist-v0749/index.html
          grep -q 'canvas2d-chibi-atlas-v16' /tmp/duck-heist-v0749/index.html
          grep -q 'v16.8-death-focus' /tmp/duck-heist-v0749/index.html
          mkdir -p web-release
          cp -a /tmp/duck-heist-v0749/. web-release/
          node scripts/publish-release.mjs

      - name: Validate publish artifacts
        run: |
          test -s web-release/index.html
          test -s dist/index.html
          grep -q '^0.7.49$' VERSION
          grep -q '0.7.49-chibi-v16-interact-recovery' web-release/index.html
          grep -q '0.7.49-chibi-v16-interact-recovery' dist/index.html
          cmp web-release/index.html dist/index.html
          git diff --check

      - name: Commit v0.7.49 to main
        run: |
          git config user.name 'VelcoreGames'
          git config user.email 'contacto@velcore.com.mx'
          git add src/game/graphics/playerChibiAtlasV16.ts index.html package.json package-lock.json VERSION web-release dist
          git diff --cached --stat
          git diff --cached --quiet && { echo 'No release changes to commit'; exit 1; }
          git commit -m 'Release Duck Heist v0.7.49 Chibi V16 interact recovery'
          git pull --rebase origin main
          git push origin HEAD:main
