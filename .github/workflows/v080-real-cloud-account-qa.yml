name: v0.8.0 real cloud account QA
on:
  push:
    branches: [feat/v080-cloud-accounts]
    paths:
      - '.github/workflows/v080-real-cloud-account-qa.yml'

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v080-cloud-accounts
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Guard v0.8.0
        run: |
          node -e "const p=require('./package.json'); if(p.version!=='0.8.0') throw new Error('version changed')"
          test "$(tr -d '\r\n' < VERSION)" = "0.8.0"
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Real Supabase account, duplicate name and cross-device save
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/vg-real-http.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in {1..60}; do curl -fsS http://127.0.0.1:4173/duck-heist/ >/dev/null && break; sleep .25; done
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const username='QaReal'+String(Date.now()).slice(-9);
          const password='PanSeguro_Real_123';

          const first=await browser.newContext({viewport:{width:1191,height:900}});
          const p1=await first.newPage();
          const errors=[];
          p1.on('pageerror',e=>errors.push('p1 '+String(e)));
          p1.on('console',m=>{if(m.type()==='error')errors.push('p1 '+m.text());});
          await p1.goto('http://127.0.0.1:4173/duck-heist/',{waitUntil:'networkidle'});
          await p1.getByRole('button',{name:'CREAR CUENTA',exact:true}).click();
          await p1.locator('input[name="username"]').fill(username);
          await p1.locator('input[name="password"]').fill(password);
          await p1.locator('.vg-account-primary').click();
          await p1.getByText('GUARDA ESTE CÓDIGO',{exact:true}).waitFor({timeout:15000});
          const recovery=await p1.locator('.vg-recovery-code').textContent();
          if(!recovery?.startsWith('DH-'))throw new Error('recovery code missing');
          await p1.getByRole('button',{name:/YA LO GUARDÉ/}).click();
          await p1.getByText(username,{exact:true}).waitFor();

          const secondSignup=await browser.newContext({viewport:{width:1191,height:900}});
          const dup=await secondSignup.newPage();
          await dup.goto('http://127.0.0.1:4173/duck-heist/',{waitUntil:'networkidle'});
          await dup.getByRole('button',{name:'CREAR CUENTA',exact:true}).click();
          await dup.locator('input[name="username"]').fill(username);
          await dup.locator('input[name="password"]').fill(password);
          await dup.locator('.vg-account-primary').click();
          await dup.locator('.vg-username-suggestions button').first().waitFor({timeout:15000});
          const suggestions=await dup.locator('.vg-username-suggestions button').allTextContents();
          if(suggestions.length<1)throw new Error('duplicate username produced no suggestions');
          if(suggestions.some(x=>x.toLowerCase()===username.toLowerCase()))throw new Error('duplicate itself was suggested');

          await p1.evaluate(()=>{
            localStorage.setItem('duckheist_cross_device_qa',JSON.stringify({floor:5,achievement:'BANCO VACIADO',stamp:'real-cloud'}));
            window.dispatchEvent(new Event('duckheist:save'));
          });
          await p1.waitForTimeout(1800);

          const session=await p1.evaluate(()=>JSON.parse(localStorage.getItem('vg_account_session')||'null'));
          if(!session?.token)throw new Error('session missing');
          const config=await p1.evaluate(async()=>await (await fetch('/velcore-cloud.json')).json());
          const load=await p1.evaluate(async({config,token})=>{
            const res=await fetch(config.supabaseUrl+'/rest/v1/rpc/vg_load_game_save',{
              method:'POST',
              headers:{'Content-Type':'application/json','apikey':config.anonKey},
              body:JSON.stringify({p_session_token:token,p_game_slug:'duck-heist'})
            });
            return await res.json();
          },{config,token:session.token});
          if(!load.ok||!load.payload?.storage?.duckheist_cross_device_qa)throw new Error('cloud save did not contain test progress '+JSON.stringify(load));

          const second=await browser.newContext({viewport:{width:1191,height:900}});
          const p2=await second.newPage();
          p2.on('pageerror',e=>errors.push('p2 '+String(e)));
          p2.on('console',m=>{if(m.type()==='error')errors.push('p2 '+m.text());});
          await p2.goto('http://127.0.0.1:4173/duck-heist/',{waitUntil:'networkidle'});
          await p2.locator('input[name="username"]').fill(username);
          await p2.locator('input[name="password"]').fill(password);
          await p2.locator('.vg-account-primary').click();
          await p2.getByText(username,{exact:true}).waitFor({timeout:15000});
          const restored=await p2.evaluate(()=>JSON.parse(localStorage.getItem('duckheist_cross_device_qa')||'null'));
          if(restored?.floor!==5||restored?.stamp!=='real-cloud')throw new Error('second PC did not restore cloud progress '+JSON.stringify(restored));

          const audit=await browser.newPage({viewport:{width:1191,height:900}});
          await audit.goto('http://127.0.0.1:4173/duck-heist/?auditoria=1',{waitUntil:'networkidle'});
          await audit.waitForFunction(()=>window.duckHeistAudit);
          const report=await audit.evaluate(()=>window.duckHeistAudit);
          if(report.failures.length)throw new Error('selftests '+report.failures.join(' | '));
          if(report.passed<452)throw new Error('selftest count regressed');
          if(errors.length)throw new Error('runtime '+errors.join(' | '));

          console.log(JSON.stringify({username,suggestions,crossDeviceProgress:restored,selftests:report.passed,runtimeErrors:errors},null,2));
          await browser.close();
          JS
      - name: Refresh dist and remove temporary workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          rm -f .github/workflows/v080-real-cloud-account-qa.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'build: refresh real cloud account bundle'
            git push origin HEAD:feat/v080-cloud-accounts
          fi
