name: Publish Duck Heist v0.7.4 Motion Feedback

on:
  push:
    paths:
      - '.github/workflows/publish-v074-motion-feedback.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Validate remastered atlas
        run: |
          python - <<'PY'
          from PIL import Image
          p='src/assets/chibi/base-duck-remastered-atlas.png'
          im=Image.open(p).convert('RGBA'); im.load()
          assert im.size==(1200,240), im.size
          for r in range(4):
              for c in range(30):
                  fr=im.crop((c*40,r*60,(c+1)*40,(r+1)*60))
                  a=fr.getchannel('A')
                  meaningful=sum(1 for v in a.getdata() if v>64)
                  assert 20 < meaningful < 40*60*.82, (r,c,meaningful)
          print('validated remastered atlas')
          PY
      - name: Validate source and build
        run: |
          npx tsc --noEmit
          grep -q "drawChibiPlayerRemastered" src/game/render.ts
          grep -q "canvas2d-chibi-remastered-v3" src/game/graphics/playerChibiRemastered.ts
          grep -q "vertical ? 1.6" src/game/graphics/playerChibiRemastered.ts
          grep -q "drawShotGlow" src/game/graphics/playerChibiRemastered.ts
          npx vite build --outDir /tmp/duck-heist-v074 --emptyOutDir
          test -s /tmp/duck-heist-v074/index.html
          grep -q 'canvas2d-chibi-remastered-v3' /tmp/duck-heist-v074/index.html
      - name: Promote v0.7.4
        run: |
          npm version 0.7.4 --no-git-tag-version
          printf '0.7.4\n' > VERSION
          rm -rf web-release dist
          mkdir -p web-release
          cp -a /tmp/duck-heist-v074/. web-release/
          node scripts/publish-release.mjs
      - name: Validate promoted release
        run: |
          test -s web-release/index.html
          test -s dist/index.html
          grep -q '"version": "0.7.4"' package.json
          grep -q '^0.7.4$' VERSION
          grep -q 'canvas2d-chibi-remastered-v3' web-release/index.html
          cmp web-release/index.html dist/index.html
      - name: Commit v0.7.4
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A src/game/graphics/playerChibiRemastered.ts web-release dist VERSION package.json package-lock.json
          git commit -m 'Release Duck Heist v0.7.4 motion feedback pass'
          git pull --rebase origin main
          git push origin HEAD:main
