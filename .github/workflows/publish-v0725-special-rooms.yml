name: Publish Duck Heist v0.7.25 Special Rooms Chibi

on:
  push:
    paths:
      - '.github/workflows/publish-v0725-special-rooms.yml'
      - 'scripts/patch-v0725.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply v0.7.25 special rooms chibi
        run: python3 scripts/patch-v0725.py
      - name: Validate source and build
        run: |
          test -s src/game/graphics/chibiRoomDecorV3.ts
          grep -q 'drawChibiItemRoomDecorV3' src/game/graphics/chibiRoomDecorV3.ts
          grep -q 'drawChibiShopRoomDecorV3' src/game/graphics/chibiRoomDecorV3.ts
          grep -q 'drawChibiBossRoomDecorV3' src/game/graphics/chibiRoomDecorV3.ts
          grep -q 'drawChibiTreasureRoomDecorV3' src/game/graphics/chibiRoomDecorV3.ts
          grep -q 'drawChibiHiddenDoorV3' src/game/graphics/chibiRoomDecorV3.ts
          grep -q '0.7.25-special-rooms-chibi' index.html
          ! grep -q "ctx.fillStyle='#233843'" src/game/render.ts
          npx tsc --noEmit
          npx vite build --outDir /tmp/duck-heist-v0725 --emptyOutDir
          test -s /tmp/duck-heist-v0725/index.html
          grep -q '0.7.25-special-rooms-chibi' /tmp/duck-heist-v0725/index.html
      - name: Promote v0.7.25
        run: |
          npm version 0.7.25 --no-git-tag-version
          printf '0.7.25\n' > VERSION
          rm -rf web-release dist
          mkdir -p web-release
          cp -a /tmp/duck-heist-v0725/. web-release/
          node scripts/publish-release.mjs
      - name: Validate promoted release
        run: |
          test -s web-release/index.html
          test -s dist/index.html
          grep -q '"version": "0.7.25"' package.json
          grep -q '^0.7.25$' VERSION
          grep -q '0.7.25-special-rooms-chibi' web-release/index.html
          cmp web-release/index.html dist/index.html
      - name: Commit v0.7.25
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A index.html src/game/graphics/chibiRoomDecorV3.ts src/game/render.ts web-release dist VERSION package.json package-lock.json
          git commit -m 'Release Duck Heist v0.7.25 special rooms chibi'
          git pull --rebase origin main
          git push origin HEAD:main
