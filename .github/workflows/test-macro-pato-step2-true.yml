name: Test Macro Pato Step 2 True

on:
  push:
    branches:
      - feature/macro-pato-step2-true
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: duck-heist-playable-bfvyg1-1788926588197-src
        run: npm install --no-audit --no-fund
      - name: Build
        working-directory: duck-heist-playable-bfvyg1-1788926588197-src
        run: npm run build
      - name: Verify standalone Macro Pato renderer
        working-directory: duck-heist-playable-bfvyg1-1788926588197-src
        run: |
          grep -q "function drawMacroPato(" src/duckgame/game/sprites.ts
          grep -q "skin?.overlay==='macro_pato'" src/duckgame/game/sprites.ts
          grep -q "Golden sample del nuevo estilo chibi" src/duckgame/game/data.ts
          grep -q "Macro Pato is playable and stat-free" src/duckgame/game/selftest.ts
