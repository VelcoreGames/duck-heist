name: Publish Duck Heist v0.7.21 Tactical Chibi Consistency

on:
  push:
    paths:
      - '.github/workflows/publish-v0721-tactical-chibi.yml'
      - 'scripts/patch-v0721.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply v0.7.21 tactical chibi pass
        run: python3 scripts/patch-v0721.py
      - name: Validate source and build
        run: |
          grep -q "drawChibiPoliceDuckV3" src/game/tacticalSprites.ts
          grep -q "drawChibiBirdEnemyV3" src/game/tacticalSprites.ts
          grep -q "SPECIAL_ENEMIES.has(type)" src/game/render.ts
          grep -q "else if(SPECIAL_ENEMIES.has(d.enemy.type))" src/game/render.ts
          grep -q '0.7.21-tactical-chibi-consistency' index.html
          ! grep -q "drawGuardGoose" src/game/tacticalSprites.ts
          ! grep -q "drawPoliciaPato" src/game/tacticalSprites.ts
          npx tsc --noEmit
          npx vite build --outDir /tmp/duck-heist-v0721 --emptyOutDir
          test -s /tmp/duck-heist-v0721/index.html
          grep -q '0.7.21-tactical-chibi-consistency' /tmp/duck-heist-v0721/index.html
      - name: Promote v0.7.21
        run: |
          npm version 0.7.21 --no-git-tag-version
          printf '0.7.21\n' > VERSION
          rm -rf web-release dist
          mkdir -p web-release
          cp -a /tmp/duck-heist-v0721/. web-release/
          node scripts/publish-release.mjs
      - name: Validate promoted release
        run: |
          test -s web-release/index.html
          test -s dist/index.html
          grep -q '"version": "0.7.21"' package.json
          grep -q '^0.7.21$' VERSION
          grep -q '0.7.21-tactical-chibi-consistency' web-release/index.html
          cmp web-release/index.html dist/index.html
      - name: Commit v0.7.21
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A index.html src/game/tacticalSprites.ts src/game/render.ts web-release dist VERSION package.json package-lock.json
          git commit -m 'Release Duck Heist v0.7.21 tactical chibi consistency'
          git pull --rebase origin main
          git push origin HEAD:main
