name: Publish Duck Heist v0.5.1

on:
  push:
    paths:
      - '.github/workflows/publish-v051.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply GPU base duck correction
        run: node scripts/apply-v051-gpu-base-duck.mjs

      - name: Validate actual GPU integration
        run: |
          grep -q "createGpuBackend" src/game/graphics/playerChibiPreview.ts
          grep -q "webgl2-chibi" src/game/graphics/playerChibiPreview.ts
          grep -q "drawPlayerThroughGpu" src/game/graphics/playerChibiPreview.ts
          ! grep -A12 "function drawHead" src/game/graphics/playerChibiPreview.ts | grep -q "drawHair"
          npx tsc --noEmit --strict --target ES2020 --module ESNext \
            --moduleResolution bundler --lib ES2020,DOM,DOM.Iterable \
            --skipLibCheck src/game/graphics/*.ts src/game/graphics/gpu/*.ts
          npx vite build --outDir /tmp/duck-heist-v051 --emptyOutDir
          test -s /tmp/duck-heist-v051/index.html

      - name: Promote v0.5.1 source build
        run: |
          npm version 0.5.1 --no-git-tag-version
          printf '0.5.1\n' > VERSION
          rm -rf web-release dist
          mkdir -p web-release
          cp -a /tmp/duck-heist-v051/. web-release/
          node scripts/publish-release.mjs

      - name: Validate promoted release
        run: |
          test -s web-release/index.html
          test -s dist/index.html
          grep -q 'Duck Heist' web-release/index.html
          ! grep -R -q 'v0.4.3' web-release
          grep -q '"version": "0.5.1"' package.json
          grep -q '^0.5.1$' VERSION
          cmp web-release/index.html dist/index.html
          # New source must be represented in the built single-file release.
          grep -R -q 'webgl2-chibi' web-release
          grep -R -q 'canvas2d-fallback' web-release

      - name: Commit v0.5.1 release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A src/game/graphics/playerChibiPreview.ts web-release dist VERSION package.json package-lock.json
          if git diff --cached --quiet; then
            echo 'Release already up to date.'
            exit 0
          fi
          git commit -m 'Release Duck Heist v0.5.1 GPU base duck'
          git pull --rebase origin main
          git push origin HEAD:main
