name: Endless v0.6.2 balance QA
on:
  push:
    branches: [endless-balance-qa]
    paths:
      - '.github/workflows/endless-balance-qa.yml'
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: endless-balance-qa
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
      - name: Curve assertions
        run: |
          npx --yes tsx@4.20.5 <<'TS'
          import { endlessScale, endlessRoundKind, rewardRounds, endlessThreatRank } from './src/game/endless.ts';
          const assert=(v:boolean,m:string)=>{if(!v)throw new Error(m)};
          assert(endlessRoundKind(5)==='miniboss','R5');
          assert(endlessRoundKind(8)==='subboss','R8');
          assert(endlessRoundKind(10)==='boss','R10');
          const count=(start:number)=>Array.from({length:10},(_,i)=>start+i).filter(rewardRounds).length;
          assert(count(1)===5,'cycle1 rewards');
          assert(count(41)===4,'cycle5 rewards');
          assert(count(71)===3,'cycle8 rewards');
          assert(count(101)===2,'cycle11 rewards');
          const r1=endlessScale(1,'normal'),r50=endlessScale(50,'normal'),r100=endlessScale(100,'normal'),r150=endlessScale(150,'normal');
          assert(r1.hp===1,'R1 baseline');
          assert(r50.hp>3.5 && r100.hp>6 && r150.hp>9,'HP curve');
          assert(r100.speed<=1.48 && r150.speed<=1.48,'speed soft cap');
          assert(r100.fire>=.52 && r150.fire>=.52,'fire readability cap');
          assert(r100.eliteChance<=.78 && r150.eliteChance<=.78,'elite cap');
          assert(r100.maxActive===12 && r150.maxActive===12,'active cap');
          assert(r150.pressureGain>=r100.pressureGain,'pressure rises');
          assert(endlessThreatRank(100)==='NÉMESIS','R100 nemesis');
          console.log({r1,r50,r100,r150,rewards:[count(1),count(41),count(71),count(101)]});
          TS
      - name: Install Chromium smoke dependency
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Browser smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/duck-server.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in {1..40}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep .25; done
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1191,height:900}});
          const errors=[];
          page.on('pageerror',e=>errors.push(String(e)));
          page.on('console',m=>{if(m.type()==='error') errors.push(m.text());});
          await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
          await page.waitForFunction(()=>document.querySelectorAll('canvas').length>=2);
          const menu=await page.screenshot();
          await page.keyboard.press('ArrowDown');
          await page.keyboard.press('Enter');
          await page.waitForTimeout(250);
          const difficulty=await page.screenshot();
          if(menu.equals(difficulty)) throw new Error('Endless menu did not open difficulty');
          await page.keyboard.press('Enter');
          await page.waitForTimeout(1900);
          await page.keyboard.press('Enter');
          await page.waitForTimeout(1800);
          const round1=await page.screenshot();
          if(difficulty.equals(round1)) throw new Error('Endless round did not start');
          const dims=await page.evaluate(()=>({
            title:document.title,
            text:document.body.innerText,
            canvases:[...document.querySelectorAll('canvas')].map(c=>({w:c.width,h:c.height,rect:{w:c.getBoundingClientRect().width,h:c.getBoundingClientRect().height}})),
            overflowX:document.documentElement.scrollWidth>innerWidth,
            overflowY:document.documentElement.scrollHeight>innerHeight,
          }));
          if(errors.length) throw new Error('Runtime errors: '+errors.join(' | '));
          if(dims.overflowX||dims.overflowY) throw new Error('Page overflow');
          console.log(JSON.stringify(dims));
          await browser.close();
          JS
      - name: Release assertions
        run: |
          test "$(cat VERSION)" = "0.6.2"
          grep -Fq "const VERSION = 'v0.6.2';" dist/index.html
          grep -Fq "ATRACO SIN FIN" dist/index.html
          grep -Fq "máximo 2 acumulados" src/game/engine.ts
          grep -Fq "soft cap" src/game/engine.ts
      - name: Cleanup temporary QA
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/endless-balance-qa.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: remove temporary v0.6.2 balance QA'
          git push origin HEAD:endless-balance-qa
