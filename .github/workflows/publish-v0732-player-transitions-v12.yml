name: Publish Duck Heist v0.7.32 Player Transitions v12

on:
  push:
    paths:
      - '.github/workflows/publish-v0732-player-transitions-v12.yml'
      - 'scripts/patch-v0732.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply v0.7.32 player transitions
        run: python3 scripts/patch-v0732.py
      - name: Validate player source and build
        run: |
          grep -q 'canvas2d-chibi-remastered-v12' src/game/graphics/playerChibiRemastered.ts
          grep -q '120-authored-remastered-v12' src/game/graphics/playerChibiRemastered.ts
          grep -q 'drawCasing' src/game/graphics/playerChibiRemastered.ts
          grep -q 'moveStartAge' src/game/graphics/playerChibiRemastered.ts
          grep -q 'turnAge' src/game/graphics/playerChibiRemastered.ts
          grep -q '0.7.32-player-transitions-v12' index.html
          npx tsc --noEmit
          npx vite build --outDir /tmp/duck-heist-v0732 --emptyOutDir
          test -s /tmp/duck-heist-v0732/index.html
          grep -q '0.7.32-player-transitions-v12' /tmp/duck-heist-v0732/index.html
      - name: Promote v0.7.32
        run: |
          npm version 0.7.32 --no-git-tag-version
          printf '0.7.32\n' > VERSION
          rm -rf web-release dist
          mkdir -p web-release
          cp -a /tmp/duck-heist-v0732/. web-release/
          node scripts/publish-release.mjs
      - name: Validate promoted release
        run: |
          test -s web-release/index.html
          test -s dist/index.html
          grep -q '"version": "0.7.32"' package.json
          grep -q '^0.7.32$' VERSION
          grep -q '0.7.32-player-transitions-v12' web-release/index.html
          cmp web-release/index.html dist/index.html
      - name: Commit v0.7.32
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A index.html src/game/graphics/playerChibiRemastered.ts web-release dist VERSION package.json package-lock.json
          git commit -m 'Release Duck Heist v0.7.32 player transitions v12'
          git pull --rebase origin main
          git push origin HEAD:main
