name: Test Base Duck V4 Normalize

on:
  push:
    branches:
      - fix/base-duck-v4-normalize-frames
    paths:
      - 'duck-heist-playable-bfvyg1-1788926588197-src/**'
      - '.github/workflows/test-base-duck-v4-normalize.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: duck-heist-playable-bfvyg1-1788926588197-src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - name: Verify frame normalization
        run: |
          grep -q "getBaseDuckV4CleanSource" src/visual-v2/materializeBaseDuckSpriteSheetV4.mjs
          grep -q "a<210?0:255" src/visual-v2/materializeBaseDuckSpriteSheetV4.mjs
          grep -q "state==='walk')return {w:24,h:31}" src/visual-v2/materializeBaseDuckSpriteSheetV4.mjs
          grep -q "1.28,1.32" src/visual-v2/materializeBaseDuckSpriteSheetV4.mjs
          test -f dist/index.html
