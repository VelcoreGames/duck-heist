name: QA Production v0.7.54 Menu Difficulty Audio

on:
  push:
    paths:
      - '.github/workflows/qa-production-v0754-menu-difficulty-audio.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wait for Hostinger production build
        run: |
          expected='0.7.54-menu-difficulty-audio'
          mkdir -p /tmp/v0754-production-qa
          for i in $(seq 1 30); do
            curl -fsSL --retry 2 --retry-delay 2 "https://velcoregames.com/?qa=v0754&t=$(date +%s%N)" -o /tmp/v0754-production.html || true
            if grep -Fq "$expected" /tmp/v0754-production.html 2>/dev/null; then
              cp /tmp/v0754-production.html /tmp/v0754-production-qa/index.html
              echo "Hostinger production is on $expected"
              exit 0
            fi
            echo "Attempt $i/30: production has not switched yet"
            sleep 10
          done
          echo 'Hostinger did not expose v0.7.54 in time'
          exit 1

      - name: Verify exact released inline app is deployed
        run: |
          python - <<'PY'
          from pathlib import Path
          prod=Path('/tmp/v0754-production.html').read_bytes().rstrip(b'\r\n')
          rel=Path('web-release/index.html').read_bytes().rstrip(b'\r\n')
          if prod != rel:
              raise SystemExit('Hostinger HTML does not byte-match web-release after trailing newline normalization')
          PY
          grep -q '0.7.54-menu-difficulty-audio' /tmp/v0754-production.html
          grep -q 'EL BANCO ESTÁ ABIERTO' /tmp/v0754-production.html
          grep -q 'SILENCIAR TODO' /tmp/v0754-production.html
          grep -q 'IMPLACABLE' /tmp/v0754-production.html
          grep -q '464-raster-chibi-v16' /tmp/v0754-production.html
          grep -q 'canvas2d-chibi-atlas-v16' /tmp/v0754-production.html
          echo 'Hostinger is serving the exact released v0.7.54 inline app'

      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify production settings persistence and gameplay
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');const fs=require('fs'),assert=require('assert');
          const out='/tmp/v0754-production-qa',expected='0.7.54-menu-difficulty-audio',sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const errors=[],failed=[],bad=[],samples={};
          async function ds(p){return p.evaluate(()=>({build:document.querySelector('meta[name="duck-heist-build"]')?.content||'',renderer:document.documentElement.dataset.duckHeistPlayerRenderer||'',frames:document.documentElement.dataset.duckHeistPlayerFrames||'',state:document.documentElement.dataset.duckHeistPlayerState||''}));}
          async function saved(p){return p.evaluate(()=>JSON.parse(localStorage.getItem('duckheist_save')||'{}'));}
          async function press(p,key,n=1){for(let i=0;i<n;i++){await p.keyboard.press(key);await sleep(90);}}
          async function startGame(p){await p.goto(`https://velcoregames.com/?qa=v0754-game&t=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:60000});await sleep(1700);assert.strictEqual((await ds(p)).build,expected);const c=p.locator('canvas[role="application"]');await c.focus();await p.keyboard.press('Enter');for(let i=0;i<6;i++){await sleep(850);const d=await ds(p);if(d.state==='idle'&&d.frames==='464-raster-chibi-v16')break;await p.keyboard.press('Enter');}await sleep(3000);const d=await ds(p);assert.strictEqual(d.state,'idle');assert.strictEqual(d.renderer,'canvas2d-chibi-atlas-v16');assert.strictEqual(d.frames,'464-raster-chibi-v16');return d;}
          async function move(p,key,label){await p.keyboard.down(key);await sleep(180);const a=await ds(p);await sleep(300);const b=await ds(p);await p.keyboard.up(key);assert.strictEqual(a.state,'walk',`${label} first walk`);assert.strictEqual(b.state,'walk',`${label} second walk`);return {a,b};}
          async function shoot(p,key,label){await p.keyboard.down(key);let hit=null;for(let i=0;i<35;i++){await sleep(16);const d=await ds(p);if(d.state==='shoot'){hit=d;break;}}await p.keyboard.up(key);assert(hit,`${label}: shoot not observed`);await sleep(400);return hit;}
          (async()=>{const browser=await chromium.launch({headless:true});const context=await browser.newContext({viewport:{width:1440,height:1000},deviceScaleFactor:1});const p=await context.newPage();p.on('console',m=>{if(m.type()==='error')errors.push(m.text())});p.on('pageerror',e=>errors.push(e.message));p.on('requestfailed',r=>failed.push(`${r.method()} ${r.url()} ${r.failure()?.errorText||''}`));p.on('response',r=>{if(r.status()>=400)bad.push(`${r.status()} ${r.url()}`)});
          await p.goto(`https://velcoregames.com/?qa=v0754-ui&t=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:60000});await sleep(1500);assert.strictEqual((await ds(p)).build,expected);const c=p.locator('canvas[role="application"]');assert.strictEqual(await c.count(),1);await c.focus();await p.screenshot({path:`${out}/01-menu-production.png`,fullPage:true});
          await press(p,'s',5);await p.keyboard.press('Enter');await sleep(350);await p.screenshot({path:`${out}/02-settings-normal.png`,fullPage:true});
          await p.keyboard.press('ArrowRight');await sleep(150);let save=await saved(p);assert.strictEqual(save.settings.difficulty,'hard');samples.hard=save.settings;
          await p.keyboard.press('ArrowDown');await p.keyboard.press('Enter');await sleep(150);save=await saved(p);assert.strictEqual(save.settings.muted,true);assert.strictEqual(save.settings.master,.8);assert.strictEqual(save.settings.music,.35);assert.strictEqual(save.settings.sfx,.85);samples.muted=save.settings;await p.screenshot({path:`${out}/03-settings-hard-muted.png`,fullPage:true});
          await p.keyboard.press('Escape');await sleep(250);await p.screenshot({path:`${out}/04-menu-hard-muted.png`,fullPage:true});
          // Returning from settings keeps menuIndex on Configuración. Re-enter directly.
          await p.keyboard.press('Enter');await sleep(220);await p.keyboard.press('ArrowDown');await p.keyboard.press('Enter');await sleep(150);save=await saved(p);assert.strictEqual(save.settings.muted,false);assert.strictEqual(save.settings.difficulty,'hard');samples.unmuted=save.settings;await p.screenshot({path:`${out}/05-settings-audio-active.png`,fullPage:true});
          await p.keyboard.press('Escape');await sleep(220);samples.idle=await startGame(p);samples.right=await move(p,'d','right');samples.up=await move(p,'w','up');samples.down=await move(p,'s','down');await p.keyboard.down('d');await sleep(90);await p.keyboard.press('Shift');await sleep(55);samples.dash=await ds(p);await p.keyboard.up('d');assert.strictEqual(samples.dash.state,'dash');await sleep(800);samples.shootRight=await shoot(p,'ArrowRight','right');samples.shootDown=await shoot(p,'ArrowDown','down');samples.shootUp=await shoot(p,'ArrowUp','up');
          save=await saved(p);assert.strictEqual(save.settings.difficulty,'hard');assert.strictEqual(save.settings.muted,false);samples.persistedAfterReload=save.settings;
          assert.strictEqual(errors.length,0,errors.join(' | '));assert.strictEqual(failed.length,0,failed.join(' | '));assert.strictEqual(bad.length,0,bad.join(' | '));fs.writeFileSync(`${out}/qa.json`,JSON.stringify({scope:'exact Hostinger v0.7.54 bundle + difficulty selector persistence + global mute persistence + V16 gameplay smoke',samples,errors,failed,bad},null,2));await browser.close();})().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Upload production QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duck-heist-v0754-production-qa
          path: /tmp/v0754-production-qa
          if-no-files-found: warn
          retention-days: 7
