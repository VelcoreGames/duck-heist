name: Fix Duck Heist v0.4.2 menu badge

on:
  push:
    paths:
      - '.github/workflows/fix-v042-menu-badge.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Draw version inside the main-menu canvas
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('appdeploy-live/assets/index-BgUNQzP_.js')
          s=p.read_text(encoding='utf-8')
          marker='DH_V0_4_2_MENU_BADGE'
          if marker not in s:
              old='function aE(e){const t=e.ui;Bp(t,K/2,62,e.frame),'
              new='function aE(e){const t=e.ui;/*DH_V0_4_2_MENU_BADGE*/j(t,"v0.4.2",8,10,5.5,"#e8d79a","left",!0),Bp(t,K/2,62,e.frame),'
              count=s.count(old)
              if count!=1:
                  raise SystemExit(f'Expected exactly one main-menu renderer prefix, found {count}')
              s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8')
          PY

      - name: Validate and build
        run: |
          set -euxo pipefail
          node --check appdeploy-live/assets/index-BgUNQzP_.js
          grep -q 'DH_V0_4_2_MENU_BADGE' appdeploy-live/assets/index-BgUNQzP_.js
          grep -q 'DH_V0_4_2_CANVAS_BADGE' appdeploy-live/assets/index-BgUNQzP_.js
          grep -q 'DH_V0_4_2_BLINK' appdeploy-live/assets/index-BgUNQzP_.js
          npm run build
          test -s dist/index.html
          grep -q 'DH_V0_4_2_MENU_BADGE' dist/assets/index-BgUNQzP_.js
          grep -q 'DH_V0_4_2_CANVAS_BADGE' dist/assets/index-BgUNQzP_.js
          grep -q 'DH_V0_4_2_BLINK' dist/assets/index-BgUNQzP_.js

      - name: Commit corrected menu badge
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add appdeploy-live/assets/index-BgUNQzP_.js
          git commit -m 'Fix v0.4.2 version label inside main menu canvas'
          git push origin HEAD:main
