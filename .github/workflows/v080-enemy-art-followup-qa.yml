name: v0.8.0 Enemy visual overhaul QA
on:
  push:
    branches: [art/v080-enemy-visual-overhaul]
    paths:
      - '.github/workflows/v080-enemy-art-followup-qa.yml'

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: art/v080-enemy-visual-overhaul
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Guard v0.8.0
        run: |
          node -e "const p=require('./package.json'); if(p.version!=='0.8.0') throw new Error('package version changed: '+p.version)"
          test "$(tr -d '\r\n' < VERSION)" = "0.8.0"
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
      - name: Route artifact guard
        run: |
          test -f dist/duck-heist/index.html
          test -f dist/duck-heist-movil/index.html
          test -f dist/eca/index.html
          test -f dist/404.html
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Chromium selftests, collection and real gameplay smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/duck-heist-http.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in {1..60}; do curl -fsS http://127.0.0.1:4173/duck-heist/ >/dev/null && break; sleep .25; done
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';

          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1191,height:900}});
          const errors=[];
          page.on('pageerror',e=>errors.push('pageerror '+String(e)));
          page.on('console',m=>{ if(m.type()==='error') errors.push('console '+m.text()); });

          await page.goto('http://127.0.0.1:4173/duck-heist/?auditoria=1',{waitUntil:'networkidle'});
          await page.waitForFunction(()=>window.duckHeistAudit && window.duckHeistEngine);
          const audit=await page.evaluate(()=>window.duckHeistAudit);
          if(audit.failures.length) throw new Error('self audit: '+audit.failures.join(' | '));
          if(audit.passed < 452) throw new Error('unexpectedly low self-check count '+audit.passed);

          const collection=await page.evaluate(async()=>{
            const e=window.duckHeistEngine;
            const wait=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
            const samples=[];
            for(const tab of ['enemies','bosses']){
              const hashes=[];
              for(const idx of [0,1,2,5,9,17,31,47]){
                e.collectionTab=tab;e.collectionFilter='all';e.collectionIndex=idx;e.collectionScroll=0;e.state='COLLECTION';e.onStateChange?.('COLLECTION');await wait();
                const c=e.ui;if(!c)throw new Error('missing ui context');
                const d=c.getImageData(0,0,c.canvas.width,c.canvas.height).data;
                let opaque=0,hash=2166136261>>>0;
                for(let i=0;i<d.length;i+=97){opaque+=d[i+3]>0?1:0;hash=Math.imul(hash^d[i],16777619)>>>0;hash=Math.imul(hash^d[i+1],16777619)>>>0;hash=Math.imul(hash^d[i+2],16777619)>>>0;}
                if(opaque<400)throw new Error(tab+' '+idx+' rendered too sparse');
                hashes.push(hash);
              }
              if(new Set(hashes).size<6)throw new Error(tab+' visual samples insufficiently distinct '+JSON.stringify(hashes));
              samples.push({tab,uniqueHashes:new Set(hashes).size});
            }
            return samples;
          });

          // Start a real fresh heist via the same keyboard path a player uses.
          await page.evaluate(()=>localStorage.clear());
          await page.reload({waitUntil:'networkidle'});
          await page.waitForTimeout(250);
          await page.keyboard.press('Enter');
          await page.waitForTimeout(150);
          let state=await page.evaluate(()=>window.duckHeistEngine?.state);
          if(state==='DIFFICULTY'){await page.keyboard.press('Enter');await page.waitForTimeout(300);state=await page.evaluate(()=>window.duckHeistEngine?.state);}
          if(state!=='PLAYING')throw new Error('could not enter gameplay, state='+state);
          const before=await page.evaluate(()=>({x:window.duckHeistEngine.player.x,y:window.duckHeistEngine.player.y}));
          await page.keyboard.down('KeyD');await page.waitForTimeout(250);await page.keyboard.up('KeyD');await page.waitForTimeout(100);
          const after=await page.evaluate(()=>({x:window.duckHeistEngine.player.x,y:window.duckHeistEngine.player.y}));
          if(after.x===before.x&&after.y===before.y)throw new Error('real gameplay movement did not update player');

          await page.keyboard.press('Escape');await page.waitForTimeout(100);
          if((await page.evaluate(()=>window.duckHeistEngine.state))!=='PAUSED')throw new Error('ESC did not pause');
          await page.keyboard.press('Escape');await page.waitForTimeout(100);
          if((await page.evaluate(()=>window.duckHeistEngine.state))!=='PLAYING')throw new Error('ESC did not resume');

          const overflow=await page.evaluate(()=>({
            x:document.documentElement.scrollWidth>innerWidth+1,
            y:document.documentElement.scrollHeight>innerHeight+1
          }));
          if(overflow.x||overflow.y)throw new Error('overflow '+JSON.stringify(overflow));
          if(errors.length)throw new Error(errors.join(' | '));

          // Direct-route and root-hub smoke.
          const hub=await browser.newPage({viewport:{width:1191,height:900}});
          await hub.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
          if(!(await hub.locator('text=VELCORE').count()))throw new Error('root hub missing');
          const direct=await browser.newPage({viewport:{width:390,height:844}});
          await direct.goto('http://127.0.0.1:4173/duck-heist/',{waitUntil:'networkidle'});
          if((await direct.locator('canvas').count())<2)throw new Error('mobile direct Duck Heist route missing canvases');
          const mobileOverflow=await direct.evaluate(()=>({x:document.documentElement.scrollWidth>innerWidth+1,y:document.documentElement.scrollHeight>innerHeight+1}));
          if(mobileOverflow.x||mobileOverflow.y)throw new Error('mobile overflow '+JSON.stringify(mobileOverflow));

          console.log(JSON.stringify({auditPassed:audit.passed,collection,before,after,overflow,mobileOverflow,runtimeErrors:errors},null,2));
          await browser.close();
          JS
      - name: Rebuild tracked dist and remove temporary workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          rm -f .github/workflows/v080-enemy-art-followup-qa.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'build: refresh enemy visual overhaul bundle'
            git push origin HEAD:art/v080-enemy-visual-overhaul
          fi
