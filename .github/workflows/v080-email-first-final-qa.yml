name: v0.8.0 email-first final QA
on:
  push:
    branches: [feat/v080-email-first-accounts]
    paths:
      - '.github/workflows/v080-email-first-final-qa.yml'

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v080-email-first-accounts
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Guard v0.8.0
        run: |
          node -e "const p=require('./package.json'); if(p.version!=='0.8.0') throw new Error('package version changed')"
          test "$(tr -d '\r\n' < VERSION)" = "0.8.0"
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Route artifact guard
        run: |
          test -f dist/duck-heist/index.html
          test -f dist/duck-heist-movil/index.html
          test -f dist/eca/index.html
          test -f dist/404.html
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Final browser smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/email-final-http.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in {1..60}; do curl -fsS http://127.0.0.1:4173/duck-heist/ >/dev/null && break; sleep .25; done
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const errors=[];
          const page=await browser.newPage({viewport:{width:1191,height:900}});
          page.on('pageerror',e=>errors.push(String(e)));
          page.on('console',m=>{if(m.type()==='error')errors.push(m.text());});

          let verified=false,profile='',revision=0;
          await page.route('http://127.0.0.1:4173/velcore-cloud.json',r=>r.fulfill({
            status:200,contentType:'application/json',
            body:JSON.stringify({supabaseUrl:'https://cloud.test',anonKey:'sb_publishable_test_12345678901234567890'})
          }));
          await page.route('https://cloud.test/auth/v1/**',async route=>{
            const url=route.request().url(),body=route.request().postDataJSON?.()||{};
            if(url.includes('/signup'))return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({
              id:'11111111-1111-4111-8111-111111111111',email:body.email,email_confirmed_at:null
            })});
            if(url.includes('/token?grant_type=password')){
              if(!verified)return route.fulfill({status:400,contentType:'application/json',body:JSON.stringify({error_code:'email_not_confirmed',msg:'Email not confirmed'})});
              return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({
                access_token:'access-final',refresh_token:'refresh-final',expires_in:3600,
                user:{id:'11111111-1111-4111-8111-111111111111',email:'duck@velcoregames.com',email_confirmed_at:'2026-09-22T21:00:00Z'}
              })});
            }
            if(url.endsWith('/user'))return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({
              id:'11111111-1111-4111-8111-111111111111',email:'duck@velcoregames.com',email_confirmed_at:'2026-09-22T21:00:00Z'
            })});
            if(url.includes('/resend')||url.includes('/recover')||url.includes('/logout'))return route.fulfill({status:200,contentType:'application/json',body:'{}'});
            return route.fulfill({status:200,contentType:'application/json',body:'{}'});
          });
          await page.route('https://cloud.test/rest/v1/rpc/**',async route=>{
            const name=route.request().url().split('/').pop(),body=route.request().postDataJSON?.()||{};
            if(name==='vg_auth_get_profile')return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify(profile?{ok:true,code:'ok',username:profile}:{ok:false,code:'not_found'})});
            if(name==='vg_auth_claim_username'){
              if(String(body.p_username).toLowerCase()==='patoladron')return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({ok:false,code:'username_taken',suggestions:['PatoLadron2','PatoLadron3','PatoLadron4']})});
              profile=String(body.p_username);
              return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({ok:true,code:'created',username:profile})});
            }
            if(name==='vg_auth_load_game_save')return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({ok:false,code:'not_found'})});
            if(name==='vg_auth_save_game_save'){revision++;return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({ok:true,code:'saved',revision,updated_at:'2026-09-22T21:00:00Z'})});}
            return route.fulfill({status:404,contentType:'application/json',body:JSON.stringify({message:'unknown'})});
          });

          await page.goto('http://127.0.0.1:4173/duck-heist/',{waitUntil:'networkidle'});
          await page.getByRole('button',{name:'CREAR CUENTA',exact:true}).click();
          if(await page.locator('input[name="username"]').count())throw new Error('username appears before email verification');
          await page.locator('input[name="email"]').fill('duck@velcoregames.com');
          await page.locator('input[name="password"]').fill('PanSeguro_123');
          await page.getByRole('button',{name:'Ver contraseña'}).click();
          if(await page.locator('input[name="password"]').getAttribute('type')!=='text')throw new Error('show password failed');
          await page.getByRole('button',{name:'Ocultar contraseña'}).click();
          if(await page.locator('input[name="password"]').getAttribute('type')!=='password')throw new Error('hide password failed');
          await page.locator('.vg-account-primary').click();
          await page.getByText('VERIFICA TU CORREO',{exact:true}).waitFor();
          verified=true;
          await page.getByRole('button',{name:'YA VERIFIQUÉ MI CORREO'}).click();
          await page.getByText('ELIGE TU USUARIO',{exact:true}).waitFor();
          await page.locator('input[name="username"]').fill('PatoLadron');
          await page.locator('.vg-account-primary').click();
          await page.getByRole('button',{name:'PatoLadron2',exact:true}).click();
          await page.locator('.vg-account-primary').click();
          await page.getByText('PatoLadron2',{exact:true}).waitFor();
          if(revision<1)throw new Error('initial progress did not sync');

          const mobile=await browser.newPage({viewport:{width:390,height:844}});
          await mobile.goto('http://127.0.0.1:4173/duck-heist/?auditoria=1',{waitUntil:'networkidle'});
          const overflow=await mobile.evaluate(()=>document.documentElement.scrollWidth>innerWidth+1);
          if(overflow)throw new Error('mobile horizontal overflow');

          const audit=await browser.newPage({viewport:{width:1191,height:900}});
          await audit.goto('http://127.0.0.1:4173/duck-heist/?auditoria=1',{waitUntil:'networkidle'});
          await audit.waitForFunction(()=>window.duckHeistAudit);
          const report=await audit.evaluate(()=>window.duckHeistAudit);
          if(report.failures.length)throw new Error(report.failures.join(' | '));
          if(report.passed<452)throw new Error('selftests regressed');
          if(errors.length)throw new Error(errors.join(' | '));
          console.log(JSON.stringify({emailFirst:true,passwordVisibility:true,verificationBeforeUsername:true,uniqueUsernameSuggestions:true,cloudSaveRevision:revision,selftests:report.passed,mobileOverflow:false,runtimeErrors:errors},null,2));
          await browser.close();
          JS
      - name: Refresh dist and remove temporary workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          rm -f .github/workflows/v080-email-first-final-qa.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'build: refresh final email-first account bundle'
            git push origin HEAD:feat/v080-email-first-accounts
          fi
