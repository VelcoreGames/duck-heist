name: Inspect Duck Heist v0.7.54 Menu Difficulty Audio

on:
  push:
    paths:
      - '.github/workflows/inspect-v0754-menu-difficulty-audio.yml'
      - 'scripts/patch-v0754-menu-difficulty-audio.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Apply v0.7.54 candidate
        run: python scripts/patch-v0754-menu-difficulty-audio.py

      - name: Validate intended scope and mechanics
        run: |
          grep -q '0.7.54-menu-difficulty-audio-candidate' index.html
          grep -q "difficulty: DifficultyMode = 'normal'" src/game/engine.ts
          grep -q "key: 'difficulty'" src/game/engine.ts
          grep -q "key: 'muted'" src/game/engine.ts
          grep -q "settings.muted ? 0 : settings.master" src/game/engine.ts
          grep -q "settings.muted ? 0 : engine.settings.master" src/game/engine.ts
          grep -q "difficulty:'normal'" src/game/progress.ts
          grep -q 'EL BANCO ESTÁ ABIERTO' src/game/render.ts
          grep -q 'export function settingsRect' src/game/layout.ts
          ! grep -q 'La dificultad es progresiva: no hay un selector separado' src/game/render.ts
          ! grep -q 'floorScale(engine.map.floorIndex,' src/game/engine.ts
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' index.html src/App.tsx src/game/engine.ts src/game/layout.ts src/game/progress.ts src/game/render.ts src/game/types.ts | sort)"
          test "$changed" = "$expected"
          git diff --check

      - name: Add local-only QA engine hook
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/App.tsx');s=p.read_text()
          old='''    const engine = createEngine(wc, wctx, uctx);\n    engineRef.current = engine;\n'''
          new='''    const engine = createEngine(wc, wctx, uctx);\n    engineRef.current = engine;\n    (window as Window & { __duckQaEngine?: GameEngine }).__duckQaEngine = engine;\n'''
          if s.count(old)!=1: raise SystemExit('QA hook anchor mismatch')
          p.write_text(s.replace(old,new,1))
          PY

      - name: Validate TypeScript and build
        run: |
          npx tsc --noEmit
          rm -rf /tmp/v0754-build
          npx vite build --outDir /tmp/v0754-build --emptyOutDir
          grep -q '0.7.54-menu-difficulty-audio-candidate' /tmp/v0754-build/index.html
          grep -q 'canvas2d-chibi-atlas-v16' /tmp/v0754-build/index.html
          grep -q '464-raster-chibi-v16' /tmp/v0754-build/index.html

      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify settings behavior and capture screens
        run: |
          mkdir -p /tmp/v0754-review
          cd /tmp/v0754-build
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/v0754-http.log 2>&1 &
          echo $! >/tmp/v0754-http.pid
          cd "$GITHUB_WORKSPACE"
          node <<'NODE'
          const {chromium}=require('playwright');const fs=require('fs'),assert=require('assert');
          const out='/tmp/v0754-review',expected='0.7.54-menu-difficulty-audio-candidate',sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const errors=[],failed=[],bad=[],samples={};
          async function engine(p){return p.evaluate(()=>{const e=window.__duckQaEngine;if(!e)throw new Error('engine missing');return {state:e.state,settings:e.settings,menuIndex:e.menuIndex,settingsIndex:e.settingsIndex};});}
          async function show(p,state,extra={}){await p.evaluate(({state,extra})=>{const e=window.__duckQaEngine;if(!e)throw new Error('engine missing');Object.assign(e,extra);e.state=state;}, {state,extra});await sleep(180);}
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({viewport:{width:1440,height:1000},deviceScaleFactor:1});
            const p=await context.newPage();
            p.on('console',m=>{if(m.type()==='error')errors.push(m.text())});p.on('pageerror',e=>errors.push(e.message));p.on('requestfailed',r=>failed.push(`${r.method()} ${r.url()} ${r.failure()?.errorText||''}`));p.on('response',r=>{if(r.status()>=400)bad.push(`${r.status()} ${r.url()}`)});
            await p.goto(`http://127.0.0.1:4173/?qa=v0754&t=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:60000});await sleep(1000);
            const build=await p.evaluate(()=>document.querySelector('meta[name="duck-heist-build"]')?.content||'');assert.strictEqual(build,expected);
            assert.strictEqual(await p.locator('canvas[role="application"]').count(),1);
            samples.initial=await engine(p);assert.strictEqual(samples.initial.settings.difficulty,'normal');assert.strictEqual(samples.initial.settings.muted,false);
            await p.screenshot({path:`${out}/01-menu-clean.png`,fullPage:true});

            await show(p,'SETTINGS',{settingsIndex:0});
            await p.keyboard.press('ArrowRight');await sleep(120);
            let s=await engine(p);assert.strictEqual(s.settings.difficulty,'hard');
            await p.keyboard.press('ArrowDown');await p.keyboard.press('Enter');await sleep(120);
            s=await engine(p);assert.strictEqual(s.settings.muted,true);samples.changed=s;
            await p.screenshot({path:`${out}/02-settings-hard-muted.png`,fullPage:true});

            await p.keyboard.press('Escape');await sleep(150);
            await p.screenshot({path:`${out}/03-menu-hard-muted.png`,fullPage:true});

            await show(p,'SETTINGS',{settingsIndex:1});await p.keyboard.press('Enter');await sleep(100);
            s=await engine(p);assert.strictEqual(s.settings.muted,false);samples.unmuted=s;
            await p.screenshot({path:`${out}/04-settings-audio-active.png`,fullPage:true});

            assert.strictEqual(errors.length,0,errors.join(' | '));assert.strictEqual(failed.length,0,failed.join(' | '));assert.strictEqual(bad.length,0,bad.join(' | '));
            fs.writeFileSync(`${out}/qa.json`,JSON.stringify({scope:'v0.7.54 simplified main menu + real difficulty selector + persistent mute toggle',samples,errors,failed,bad},null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          kill "$(cat /tmp/v0754-http.pid)" || true

      - name: Upload candidate review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duck-heist-v0754-menu-difficulty-audio-candidate
          path: /tmp/v0754-review
          if-no-files-found: warn
          retention-days: 7
