name: v0.8.0 animation polish QA
on:
  push:
    branches: [polish/v080-animation-visuals]
    paths:
      - '.github/workflows/v080-animation-polish-qa.yml'
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish/v080-animation-visuals
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
      - name: Version invariant
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = "0.8.0"
          grep -Fq '"version": "0.8.0"' package.json
          grep -Fq "const VERSION = 'v0.8.0';" dist/index.html
          grep -Fq "idleBreath" src/game/sprites.ts
          grep -Fq "drawEndlessArenaMood" src/game/render.ts
          grep -Fq "dashHorizontal" src/game/render.ts
          grep -Fq "brightness(1.85)" src/game/render.ts
          grep -Fq "kick>2?6:kick>1?5:4" src/game/engine.ts
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Browser visual smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/duck-server.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in {1..40}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep .25; done
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1191,height:900}});
          const errors=[];
          page.on('pageerror',e=>errors.push(String(e)));
          page.on('console',m=>{if(m.type()==='error')errors.push(m.text());});
          await page.goto('http://127.0.0.1:4173/?auditoria=1',{waitUntil:'networkidle'});
          await page.waitForFunction(()=>window.duckHeistEngine && document.querySelectorAll('canvas').length>=2);
          await page.keyboard.press('ArrowDown');
          await page.keyboard.press('Enter');
          await page.waitForTimeout(150);
          await page.keyboard.press('Enter');
          await page.waitForFunction(()=>window.duckHeistEngine?.gameMode==='endless'&&window.duckHeistEngine?.state==='PLAYING',{timeout:5000});
          const canvas=page.locator('canvas[role="application"]');
          const box=await canvas.boundingBox();
          if(!box)throw new Error('No game canvas');
          await page.keyboard.down('d');
          await page.waitForTimeout(220);
          await page.keyboard.up('d');
          await page.mouse.move(box.x+box.width*.72,box.y+box.height*.52);
          await page.mouse.down({button:'left'});
          await page.waitForTimeout(140);
          await page.keyboard.press('Shift');
          await page.waitForTimeout(100);
          const state=await page.evaluate(()=>({
            version:document.documentElement.innerHTML.includes('v0.8.0'),
            state:window.duckHeistEngine.state,
            mode:window.duckHeistEngine.gameMode,
            dash:window.duckHeistEngine.player.dashTimer,
            shootFlash:window.duckHeistEngine.player.shootFlash,
            frame:window.duckHeistEngine.frame,
            overflowX:document.documentElement.scrollWidth>innerWidth,
            overflowY:document.documentElement.scrollHeight>innerHeight
          }));
          await page.mouse.up({button:'left'});
          if(errors.length)throw new Error('Runtime errors: '+errors.join(' | '));
          if(state.overflowX||state.overflowY)throw new Error('Page overflow');
          if(state.mode!=='endless'||state.state!=='PLAYING')throw new Error('Unexpected runtime state '+JSON.stringify(state));
          console.log(JSON.stringify(state,null,2));
          await browser.close();
          JS
      - name: Cleanup temporary QA
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/v080-animation-polish-qa.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: remove temporary v0.8.0 animation polish QA'
          git push origin HEAD:polish/v080-animation-visuals
