name: Publish Duck Heist v0.6.3 Player Motion Polish

on:
  push:
    paths:
      - '.github/workflows/publish-v063-player-motion.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply player motion upgrade
        run: python scripts/upgrade-v063-player-motion.py

      - name: Validate source
        run: |
          npx tsc --noEmit
          grep -q "CHIBI_BASE_DUCK_V5_RUNTIME_POSES = 448" src/game/graphics/playerChibiAtlasV5.ts
          grep -q "interacting: p.switchAnim > 0" src/game/render.ts
          grep -q "motion-v2" src/game/graphics/playerChibiAtlasV5.ts
          npx vite build --outDir /tmp/duck-heist-v063 --emptyOutDir
          test -s /tmp/duck-heist-v063/index.html

      - name: Promote v0.6.3
        run: |
          npm version 0.6.3 --no-git-tag-version
          printf '0.6.3\n' > VERSION
          rm -rf web-release dist
          mkdir -p web-release
          cp -a /tmp/duck-heist-v063/. web-release/
          node scripts/publish-release.mjs

      - name: Validate promoted release
        run: |
          test -s web-release/index.html
          test -s dist/index.html
          grep -q 'Duck Heist' web-release/index.html
          grep -q '"version": "0.6.3"' package.json
          grep -q '^0.6.3$' VERSION
          cmp web-release/index.html dist/index.html

      - name: Commit v0.6.3 release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A src/game/graphics/playerChibiAtlasV5.ts src/game/render.ts web-release dist VERSION package.json package-lock.json
          if git diff --cached --quiet; then
            echo 'Release already up to date.'
            exit 0
          fi
          git commit -m 'Release Duck Heist v0.6.3 player motion polish'
          git pull --rebase origin main
          git push origin HEAD:main
