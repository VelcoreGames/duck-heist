name: QA Production v0.7.49 Chibi V16

on:
  push:
    paths:
      - '.github/workflows/qa-production-v0749-chibi-v16.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wait for Hostinger production build
        run: |
          expected='0.7.49-chibi-v16-interact-recovery'
          mkdir -p /tmp/v0749-production-qa
          for i in $(seq 1 30); do
            curl -fsSL --retry 2 --retry-delay 2 "https://velcoregames.com/?qa=v0749&t=$(date +%s%N)" -o /tmp/v0749-production.html || true
            if grep -Fq "$expected" /tmp/v0749-production.html 2>/dev/null; then
              echo "Hostinger production is on $expected"
              cp /tmp/v0749-production.html /tmp/v0749-production-qa/index.html
              exit 0
            fi
            echo "Attempt $i/30: production has not switched yet"
            sleep 10
          done
          echo 'Hostinger did not expose v0.7.49 in time'
          exit 1

      - name: Verify exact released inline app is deployed
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          prod=Path('/tmp/v0749-production.html').read_bytes().rstrip(b'\r\n')
          rel=Path('web-release/index.html').read_bytes().rstrip(b'\r\n')
          print('production sha256',hashlib.sha256(prod).hexdigest())
          print('release    sha256',hashlib.sha256(rel).hexdigest())
          if prod != rel:
              raise SystemExit('Hostinger HTML does not byte-match web-release after trailing newline normalization')
          PY
          grep -q '0.7.49-chibi-v16-interact-recovery' /tmp/v0749-production.html
          grep -q '464-raster-chibi-v16' /tmp/v0749-production.html
          grep -q 'canvas2d-chibi-atlas-v16' /tmp/v0749-production.html
          grep -q 'v16.8-death-focus' /tmp/v0749-production.html
          grep -q "return Math.min(COUNT.interact - 1, tick)" src/game/graphics/playerChibiAtlasV16.ts
          grep -q "rt.state === 'interact' && wanted === 'idle' && age < COUNT.interact" src/game/graphics/playerChibiAtlasV16.ts
          echo 'Hostinger is serving the exact released v0.7.49 inline app'

      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify production gameplay and renderer
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');const fs=require('fs'),assert=require('assert');
          const out='/tmp/v0749-production-qa',expected='0.7.49-chibi-v16-interact-recovery',sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const errors=[],failed=[],bad=[],samples={};
          async function ds(p){return p.evaluate(()=>({build:document.querySelector('meta[name="duck-heist-build"]')?.content||'',renderer:document.documentElement.dataset.duckHeistPlayerRenderer||'',frames:document.documentElement.dataset.duckHeistPlayerFrames||'',fx:document.documentElement.dataset.duckHeistPlayerFx||'',state:document.documentElement.dataset.duckHeistPlayerState||'',visualFrame:document.documentElement.dataset.duckHeistPlayerVisualFrame||''}));}
          async function start(p,label){await p.goto(`https://velcoregames.com/?qa=v0749-${label}&t=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:60000});await sleep(1800);assert.strictEqual((await ds(p)).build,expected);const c=p.locator('canvas[role="application"]');assert.strictEqual(await c.count(),1);await c.focus();await p.keyboard.press('Enter');for(let i=0;i<6;i++){await sleep(850);const d=await ds(p);if(d.renderer==='canvas2d-chibi-atlas-v16'&&d.frames==='464-raster-chibi-v16'&&d.fx==='v16.8-death-focus')break;await p.keyboard.press('Enter');}await sleep(3200);const d=await ds(p);assert.strictEqual(d.state,'idle');assert.strictEqual(d.renderer,'canvas2d-chibi-atlas-v16');assert.strictEqual(d.frames,'464-raster-chibi-v16');assert.strictEqual(d.fx,'v16.8-death-focus');return d;}
          async function move(p,key,label){await p.keyboard.down(key);await sleep(160);const a=await ds(p);await sleep(320);const b=await ds(p);await p.screenshot({path:`${out}/${label}.png`,fullPage:true});await p.keyboard.up(key);await sleep(180);assert.strictEqual(a.state,'walk');assert.strictEqual(b.state,'walk');assert.notStrictEqual(a.visualFrame,b.visualFrame);return {a,b};}
          async function shoot(p,key,label){await p.keyboard.down(key);let hit=null;for(let i=0;i<35;i++){await sleep(16);const d=await ds(p);if(d.state==='shoot'){hit=d;break;}}assert(hit,`${label}: shoot not observed`);await p.screenshot({path:`${out}/${label}.png`,fullPage:true});await p.keyboard.up(key);await sleep(420);return hit;}
          async function tryDeath(p,key,label){await start(p,`death-${label}`);let hurt=null,down=null;await p.keyboard.down(key);const t0=Date.now();while(Date.now()-t0<4200){const d=await ds(p);if(d.state==='hurt'&&!hurt)hurt={t:Date.now()-t0,...d};if(d.state==='down'){down={t:Date.now()-t0,...d};break;}await sleep(35);}await p.keyboard.up(key);if(!hurt&&!down){const t=Date.now();while(Date.now()-t<9000){const d=await ds(p);if(d.state==='hurt'){hurt={t:Date.now()-t0,...d};break;}if(d.state==='down'){down={t:Date.now()-t0,...d};break;}await sleep(40);}}if(hurt&&!down){const t=Date.now();while(Date.now()-t<50000){const d=await ds(p);if(d.state==='down'){down={t:Date.now()-t0,...d};break;}await sleep(40);}}return down?{hurt,down,direction:label}:null;}
          async function naturalDeath(p){for(const [key,label] of [['d','right'],['w','up'],['a','left'],['s','down']]){const r=await tryDeath(p,key,label);if(r)return r;}throw new Error('natural down state not reached');}
          (async()=>{const browser=await chromium.launch({headless:true});const context=await browser.newContext({viewport:{width:1440,height:1000},deviceScaleFactor:1});const p=await context.newPage();p.on('console',m=>{if(m.type()==='error')errors.push(m.text())});p.on('pageerror',e=>errors.push(e.message));p.on('requestfailed',r=>failed.push(`${r.method()} ${r.url()} ${r.failure()?.errorText||''}`));p.on('response',r=>{if(r.status()>=400)bad.push(`${r.status()} ${r.url()}`)});
          samples.idle=await start(p,'motion');await p.screenshot({path:`${out}/01-idle.png`,fullPage:true});samples.up=await move(p,'w','02-walk-up');samples.down=await move(p,'s','03-walk-down');samples.right=await move(p,'d','04-walk-right');await p.keyboard.down('d');await sleep(90);await p.keyboard.press('Shift');await sleep(55);samples.dash=await ds(p);assert.strictEqual(samples.dash.state,'dash');await p.screenshot({path:`${out}/05-dash.png`,fullPage:true});await p.keyboard.up('d');await sleep(850);
          await start(p,'shoot');samples.shootRight=await shoot(p,'ArrowRight','06-shoot-right');samples.shootDown=await shoot(p,'ArrowDown','07-shoot-down');samples.shootUp=await shoot(p,'ArrowUp','08-shoot-up');samples.death=await naturalDeath(p);assert.strictEqual(samples.death.down.state,'down');await p.screenshot({path:`${out}/09-down-natural.png`,fullPage:true});await sleep(750);await p.keyboard.press('Enter');let restarted=null;for(let i=0;i<20;i++){await sleep(350);const d=await ds(p);if(d.state==='idle'||d.state==='walk'){restarted=d;break;}}assert(restarted,'restart after game over failed');samples.restarted=restarted;samples.final=await ds(p);assert.strictEqual(samples.final.build,expected);assert.strictEqual(samples.final.renderer,'canvas2d-chibi-atlas-v16');assert.strictEqual(samples.final.frames,'464-raster-chibi-v16');assert.strictEqual(errors.length,0,errors.join(' | '));assert.strictEqual(failed.length,0,failed.join(' | '));assert.strictEqual(bad.length,0,bad.join(' | '));fs.writeFileSync(`${out}/qa.json`,JSON.stringify({samples,errors,failed,bad},null,2));await browser.close();})().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Upload production QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duck-heist-v0749-production-qa
          path: /tmp/v0749-production-qa
          if-no-files-found: warn
          retention-days: 7
