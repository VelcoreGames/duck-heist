name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Upload dist artifact
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[build-dist]')
        uses: actions/upload-artifact@v4
        with:
          name: duck-heist-v1.5.2-dist
          path: dist/
          if-no-files-found: error
