name: Extract archived AppDeploy source reference

on:
  push:
    paths:
      - '.github/workflows/extract-appdeploy-source-reference.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact archived AppDeploy snapshot
        uses: actions/checkout@v4
        with:
          ref: fc214761adaedf60e8fe6a4dc3cedd3ea1b0d9e7
      - name: Extract archived source bundle
        run: |
          rm -rf /tmp/appdeploy-source
          mkdir -p /tmp/appdeploy-source
          unzip -q appdeploy-live/resources/duck-heist-source.zip -d /tmp/appdeploy-source
          find /tmp/appdeploy-source -maxdepth 4 -type f | sort > /tmp/appdeploy-source/FILELIST.txt
          sed -n '1,220p' /tmp/appdeploy-source/FILELIST.txt
      - name: Upload archived source
        uses: actions/upload-artifact@v4
        with:
          name: duck-heist-appdeploy-source-reference
          path: /tmp/appdeploy-source
          if-no-files-found: error
          retention-days: 7
