name: Endless Heist runtime QA
on:
  push:
    branches: [feature/endless-heist]
    paths:
      - '.github/workflows/endless-runtime-qa.yml'
permissions:
  contents: write
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/endless-heist
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm install --no-save --package-lock=false playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Browser sequence and stress QA
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/endless-server.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in {1..40}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep .25; done
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1191,height:900}});
          const errors=[];
          page.on('pageerror',e=>errors.push('pageerror:'+String(e)));
          page.on('console',m=>{if(m.type()==='error') errors.push('console:'+m.text());});
          await page.goto('http://127.0.0.1:4173/?auditoria=1',{waitUntil:'networkidle'});
          await page.waitForFunction(()=>window.duckHeistEngine && document.querySelectorAll('canvas').length>=2);
          await page.waitForTimeout(250);
          const E=()=>page.evaluate(()=>window.duckHeistEngine);
          let snap=await E();
          if(snap.state!=='MENU') throw new Error('Expected MENU, got '+snap.state);
          await page.keyboard.press('ArrowDown');
          await page.keyboard.press('Enter');
          await page.waitForFunction(()=>window.duckHeistEngine.state==='DIFFICULTY'&&window.duckHeistEngine.pendingMode==='endless');
          await page.keyboard.press('Enter');
          await page.waitForFunction(()=>window.duckHeistEngine.state==='HEIST_INTRO');
          await page.evaluate(()=>window.duckHeistEngine.heistIntroTimer=1);
          await page.waitForFunction(()=>window.duckHeistEngine.state==='ENDLESS_REWARD'&&window.duckHeistEngine.gameMode==='endless');
          const finish=async(expectedKind,expectedRound)=>{
            const s=await E();
            if(s.endless.round!==expectedRound) throw new Error('Round '+expectedRound+' expected, got '+s.endless.round);
            if(s.endless.roundKind!==expectedKind) throw new Error('Kind '+expectedKind+' expected, got '+s.endless.roundKind);
            if(s.state==='BOSS_INTRO'){
              await page.evaluate(()=>window.duckHeistEngine.bossIntroTimer=1);
              await page.waitForFunction(()=>window.duckHeistEngine.state==='PLAYING');
            }
            await page.evaluate(()=>{
              const e=window.duckHeistEngine;
              e.endless.pendingEnemies=[];
              const c=e.contents.get(e.currentKey); if(c)c.enemies=[];
            });
            await page.waitForFunction(()=>window.duckHeistEngine.state==='ENDLESS_REWARD');
            const after=await E();
            if(after.contents[0]){}
            const cleanup=await page.evaluate(()=>{
              const e=window.duckHeistEngine,c=e.contents.get(e.currentKey);
              return {items:c?.items.length??-1,pickups:c?.pickups.length??-1,puddles:c?.puddles.length??-1,projectiles:e.projectiles.length};
            });
            if(Object.values(cleanup).some(v=>v!==0)) throw new Error('Cleanup failed '+JSON.stringify(cleanup));
            if(after.endless.awaitingReward) await page.keyboard.press('r');
          };
          const expected=['combat','combat','combat','combat','miniboss','combat','special','subboss','combat','boss'];
          for(let r=1;r<=10;r++){
            await page.keyboard.press('Enter');
            await page.waitForFunction((round)=>window.duckHeistEngine.endless.round===round && ['PLAYING','BOSS_INTRO'].includes(window.duckHeistEngine.state),r);
            await finish(expected[r-1],r);
          }
          snap=await E();
          if(snap.endless.alert!==1) throw new Error('Alert after R10 expected 1, got '+snap.endless.alert);
          if(snap.endlessRecords.normal.round<10) throw new Error('Record did not reach 10');
          // Stress R50: Némesis
          await page.evaluate(()=>{const e=window.duckHeistEngine;e.endless.round=49;e.endless.awaitingReward=false;e.endless.rewardOptions=[];});
          await page.keyboard.press('Enter');
          await page.waitForFunction(()=>window.duckHeistEngine.endless.round===50&&window.duckHeistEngine.state==='BOSS_INTRO');
          snap=await E();
          if(snap.endless.threatRank!=='NÉMESIS') throw new Error('R50 must be NÉMESIS');
          if((await page.evaluate(()=>window.duckHeistEngine.contents.get(window.duckHeistEngine.currentKey).enemies.filter(x=>x.isBoss).length))!==1) throw new Error('R50 expected one boss');
          await page.evaluate(()=>window.duckHeistEngine.bossIntroTimer=1);
          await page.waitForFunction(()=>window.duckHeistEngine.state==='PLAYING');
          await page.evaluate(()=>{const e=window.duckHeistEngine;e.contents.get(e.currentKey).enemies=[];});
          await page.waitForFunction(()=>window.duckHeistEngine.state==='ENDLESS_REWARD');
          if((await E()).endless.awaitingReward) await page.keyboard.press('r');
          // Stress R100: curated double threat.
          await page.evaluate(()=>{const e=window.duckHeistEngine;e.endless.round=99;e.endless.awaitingReward=false;e.endless.rewardOptions=[];});
          await page.keyboard.press('Enter');
          await page.waitForFunction(()=>window.duckHeistEngine.endless.round===100&&window.duckHeistEngine.state==='BOSS_INTRO');
          snap=await E();
          if(snap.bossIntroName!=='DOBLE AMENAZA') throw new Error('R100 missing DOBLE AMENAZA');
          const bosses=await page.evaluate(()=>window.duckHeistEngine.contents.get(window.duckHeistEngine.currentKey).enemies.filter(x=>x.isBoss).map(x=>x.bossType));
          if(bosses.length!==2) throw new Error('R100 expected 2 bosses, got '+JSON.stringify(bosses));
          // Basic layout and no runtime errors.
          const layout=await page.evaluate(()=>({
            overflowX:document.documentElement.scrollWidth>innerWidth,
            overflowY:document.documentElement.scrollHeight>innerHeight,
            canvases:[...document.querySelectorAll('canvas')].map(c=>({w:c.width,h:c.height,rect:c.getBoundingClientRect().toJSON()}))
          }));
          if(layout.overflowX||layout.overflowY) throw new Error('Unexpected overflow');
          if(errors.length) throw new Error(errors.join(' | '));
          console.log(JSON.stringify({round10Alert:1,round50:'NÉMESIS',round100Bosses:bosses,layout},null,2));
          await browser.close();
          JS
      - name: Normal heist regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/endless-normal-server.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in {1..40}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep .25; done
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1191,height:900}});
          const errors=[];page.on('pageerror',e=>errors.push(String(e)));
          await page.goto('http://127.0.0.1:4173/?auditoria=1',{waitUntil:'networkidle'});
          await page.waitForFunction(()=>window.duckHeistEngine);
          await page.keyboard.press('Enter');
          await page.waitForFunction(()=>window.duckHeistEngine.state==='DIFFICULTY'&&window.duckHeistEngine.pendingMode==='heist');
          await page.keyboard.press('Enter');
          await page.waitForFunction(()=>window.duckHeistEngine.state==='HEIST_INTRO');
          await page.evaluate(()=>window.duckHeistEngine.heistIntroTimer=1);
          await page.waitForFunction(()=>window.duckHeistEngine.state==='FLOOR_INTRO');
          const s=await page.evaluate(()=>({mode:window.duckHeistEngine.gameMode,rooms:window.duckHeistEngine.map.rooms.size,state:window.duckHeistEngine.state}));
          if(s.mode!=='heist'||s.rooms<10)throw new Error('Normal heist regression '+JSON.stringify(s));
          if(errors.length)throw new Error(errors.join(' | '));
          console.log(JSON.stringify(s));
          await browser.close();
          JS
      - name: Cleanup workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/endless-runtime-qa.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: remove temporary endless runtime QA'
          git push origin HEAD:feature/endless-heist
