name: Publish Duck Heist v0.7.12 Premium Lobby

on:
  push:
    paths:
      - '.github/workflows/publish-v0712-premium-lobby.yml'
      - 'scripts/patch-v0712.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Apply v0.7.12 premium lobby patch
        run: python3 scripts/patch-v0712.py

      - name: Validate source and build
        run: |
          grep -q 'slabTiles = 4' src/game/graphics/lobbyArtV3.ts
          grep -q 'Gentle perimeter vignette' src/game/graphics/lobbyArtV3.ts
          grep -q '0.7.12-premium-lobby' index.html
          npx tsc --noEmit
          npx vite build --outDir /tmp/duck-heist-v0712 --emptyOutDir
          test -s /tmp/duck-heist-v0712/index.html
          grep -q '0.7.12-premium-lobby' /tmp/duck-heist-v0712/index.html
          grep -q 'canvas2d-chibi-remastered-v9' /tmp/duck-heist-v0712/index.html

      - name: Promote v0.7.12
        run: |
          npm version 0.7.12 --no-git-tag-version
          printf '0.7.12\n' > VERSION
          rm -rf web-release dist
          mkdir -p web-release
          cp -a /tmp/duck-heist-v0712/. web-release/
          node scripts/publish-release.mjs

      - name: Validate promoted release
        run: |
          test -s web-release/index.html
          test -s dist/index.html
          grep -q '"version": "0.7.12"' package.json
          grep -q '^0.7.12$' VERSION
          grep -q '0.7.12-premium-lobby' web-release/index.html
          grep -q 'canvas2d-chibi-remastered-v9' web-release/index.html
          cmp web-release/index.html dist/index.html

      - name: Commit v0.7.12
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A index.html src/game/graphics/lobbyArtV3.ts web-release dist VERSION package.json package-lock.json
          git commit -m 'Release Duck Heist v0.7.12 premium lobby polish'
          git pull --rebase origin main
          git push origin HEAD:main
