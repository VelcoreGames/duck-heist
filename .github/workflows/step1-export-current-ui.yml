name: Step 1 export current UI source

on:
  push:
    branches: [step1-source-sync]
    paths:
      - '.github/workflows/step1-export-current-ui.yml'

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload current UI source
        uses: actions/upload-artifact@v4
        with:
          name: step1-current-ui-source
          path: |
            src/App.tsx
            src/index.css
            src/main.tsx
            index.html
            vite.config.ts
          retention-days: 1
