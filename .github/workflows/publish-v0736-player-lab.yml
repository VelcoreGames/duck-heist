name: Publish Duck Heist v0.7.36 Player Visual Lab

on:
  push:
    paths:
      - '.github/workflows/publish-v0736-player-lab.yml'
      - 'scripts/patch-v0736-player-lab.py'
      - 'src/game/graphics/playerVisualLab.ts'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply v0.7.36 lab integration
        run: python3 scripts/patch-v0736-player-lab.py
      - name: Validate source and build
        run: |
          grep -q 'drawPlayerVisualLab' src/game/render.ts
          grep -q 'duckHeistPlayerLab' src/game/graphics/playerVisualLab.ts
          grep -q '0.7.36-player-lab' index.html
          npx tsc --noEmit
          npx vite build --outDir /tmp/duck-heist-v0736 --emptyOutDir
          test -s /tmp/duck-heist-v0736/index.html
          grep -q '0.7.36-player-lab' /tmp/duck-heist-v0736/index.html
          grep -q 'PLAYER VISUAL LAB' /tmp/duck-heist-v0736/index.html
      - name: Promote v0.7.36
        run: |
          npm version 0.7.36 --no-git-tag-version
          printf '0.7.36\n' > VERSION
          rm -rf web-release dist
          mkdir -p web-release
          cp -a /tmp/duck-heist-v0736/. web-release/
          node scripts/publish-release.mjs
      - name: Validate promoted release
        run: |
          test -s web-release/index.html
          test -s dist/index.html
          grep -q '"version": "0.7.36"' package.json
          grep -q '^0.7.36$' VERSION
          grep -q '0.7.36-player-lab' web-release/index.html
          cmp web-release/index.html dist/index.html
      - name: Commit v0.7.36
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A index.html src/game/render.ts src/game/graphics/playerVisualLab.ts web-release dist VERSION package.json package-lock.json
          git commit -m 'Release Duck Heist v0.7.36 player visual lab'
          git pull --rebase origin main
          git push origin HEAD:main
