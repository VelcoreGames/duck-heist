name: v0.8.0 complete menu redesign QA
on:
  push:
    branches: [redesign/v080-complete-menu-system]
    paths:
      - '.github/workflows/v080-complete-menu-redesign-qa.yml'
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/v080-complete-menu-system
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
      - name: Version and menu invariants
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = "0.8.0"
          grep -Fq '"version": "0.8.0"' package.json
          grep -Fq "const VERSION = 'v0.8.0';" dist/index.html
          grep -Fq "drawMenuHeader" src/game/ui.ts
          grep -Fq "drawMenuChoice" src/game/ui.ts
          grep -Fq "EXPEDIENTE 08-HEIST" src/game/render.ts
          grep -Fq "ARCHIVO DEL BANCO" src/game/collectionUI.ts
          grep -Fq "CAMBIO DE EQUIPO" src/game/render.ts
          grep -Fq "ATRACO EN PAUSA" src/game/render.ts
          grep -Fq "RECOMPENSA DE RONDA" src/game/render.ts
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Menu navigation and runtime smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/duck-menu-server.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in {1..40}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep .25; done
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1191,height:900}});
          const errors=[];
          page.on('pageerror',e=>errors.push(String(e)));
          page.on('console',m=>{if(m.type()==='error')errors.push(m.text());});
          await page.goto('http://127.0.0.1:4173/?auditoria=1',{waitUntil:'networkidle'});
          await page.waitForFunction(()=>window.duckHeistEngine && document.querySelectorAll('canvas').length>=2);

          const seen=[];
          const snap=async label=>{
            await page.waitForTimeout(90);
            const state=await page.evaluate(()=>({
              state:window.duckHeistEngine.state,
              menuIndex:window.duckHeistEngine.menuIndex,
              pauseIndex:window.duckHeistEngine.pauseIndex,
              overflowX:document.documentElement.scrollWidth>innerWidth,
              overflowY:document.documentElement.scrollHeight>innerHeight,
              canvasCount:document.querySelectorAll('canvas').length
            }));
            if(state.overflowX||state.overflowY)throw new Error(label+' caused page overflow');
            if(state.canvasCount<2)throw new Error(label+' lost game canvases');
            seen.push({label,...state});
          };

          await snap('main');
          for(let i=0;i<6;i++){await page.keyboard.press('ArrowDown');await snap('main-'+(i+1));}
          for(let i=0;i<6;i++)await page.keyboard.press('ArrowUp');

          await page.keyboard.press('Enter');
          await page.waitForFunction(()=>window.duckHeistEngine.state==='DIFFICULTY');
          await snap('difficulty');
          await page.keyboard.press('Escape');

          const openMenuIndex=async(index,label)=>{
            await page.evaluate(i=>window.duckHeistEngine.menuIndex=i,index);
            await page.keyboard.press('Enter');
            await page.waitForTimeout(120);
            await snap(label);
            await page.keyboard.press('Escape');
            await page.waitForFunction(()=>window.duckHeistEngine.state==='MENU');
          };
          await openMenuIndex(2,'upgrades');
          await openMenuIndex(3,'wardrobe');
          await openMenuIndex(4,'collection');
          await openMenuIndex(5,'how-to');
          await openMenuIndex(6,'settings');

          await page.evaluate(()=>window.duckHeistEngine.menuIndex=0);
          await page.keyboard.press('Enter');
          await page.waitForFunction(()=>window.duckHeistEngine.state==='DIFFICULTY');
          await page.keyboard.press('Enter');
          await page.waitForTimeout(1800);
          if((await page.evaluate(()=>window.duckHeistEngine.state))==='HEIST_INTRO'){
            await page.keyboard.press('Enter');await page.waitForTimeout(1200);
          }
          await page.waitForFunction(()=>window.duckHeistEngine.state==='PLAYING',{timeout:6000});
          await page.keyboard.press('Escape');
          await page.waitForFunction(()=>window.duckHeistEngine.state==='PAUSED');
          await snap('pause');

          await page.evaluate(()=>{
            const e=window.duckHeistEngine;e.state='ENDLESS_RESUME';
            e.endlessCheckpointRound=17;e.endlessCheckpointDifficulty='normal';
          });
          await snap('endless-resume');

          await page.evaluate(()=>{
            const e=window.duckHeistEngine;e.state='ENDLESS_REWARD';e.gameMode='endless';
            e.endless.round=25;e.endless.alert=5;e.endless.pressure=63;e.endless.marketOpen=true;e.endless.awaitingReward=false;
          });
          await snap('endless-market');

          await page.evaluate(()=>{
            const e=window.duckHeistEngine;e.state='PLAYING';
            e.swap={itemId:e.player.weapons[0].id,slot:0,from:'floor',srcIndex:0,worldX:e.player.x,worldY:e.player.y,roomKey:e.currentKey};
          });
          await snap('weapon-swap');

          await page.evaluate(()=>{
            const e=window.duckHeistEngine;e.swap=null;
            e.activeSwap={itemId:e.player.activeItem||'emergency_quack',from:'floor',srcIndex:0,worldX:e.player.x,worldY:e.player.y,roomKey:e.currentKey};
          });
          await snap('active-swap');

          await page.evaluate(()=>{const e=window.duckHeistEngine;e.activeSwap=null;e.gameMode='heist';e.state='GAME_OVER';e.endFrame=e.frame-90;});
          await snap('game-over');
          await page.evaluate(()=>{window.duckHeistEngine.state='VICTORY';});
          await snap('victory');

          if(errors.length)throw new Error('Runtime errors: '+errors.join(' | '));
          console.log(JSON.stringify(seen,null,2));
          await browser.close();
          JS
      - name: Cleanup temporary QA
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/v080-complete-menu-redesign-qa.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'chore: remove temporary v0.8.0 menu redesign QA'
            git push origin HEAD:redesign/v080-complete-menu-system
          fi
