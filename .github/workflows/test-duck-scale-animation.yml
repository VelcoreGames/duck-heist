name: Test Duck Scale Animation

on:
  push:
    branches:
      - migration/cloudflare-pages
    paths:
      - 'duck-heist-playable-bfvyg1-1788926588197-src/**'
      - '.github/workflows/test-duck-scale-animation.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: duck-heist-playable-bfvyg1-1788926588197-src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - name: Verify compact animated ducks
        run: |
          grep -q "logicalW:28,logicalH:28" src/visual-v2/materializeVisualEngineV2.mjs
          grep -q "walkBob=\[0,-2,0,1\]" src/visual-v2/materializeVisualEngineV2.mjs
          grep -q "walkH=\[32,35,32,34\]" src/gameplay/materializeMacroPatoSpriteAsset.mjs
          test -f dist/index.html
