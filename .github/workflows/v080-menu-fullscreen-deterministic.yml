name: v0.8.0 fullscreen menu deterministic QA
on:
  push:
    branches: [fix/v080-menu-fullscreen-escape]
    paths:
      - '.github/workflows/v080-menu-fullscreen-deterministic.yml'

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v080-menu-fullscreen-escape
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compile and version guard
        run: |
          node -e "const p=require('./package.json'); if(p.version!=='0.8.0') throw new Error('version changed')"
          test "$(tr -d '\r\n' < VERSION)" = "0.8.0"
          npx tsc --noEmit
          npm run build
      - name: Install browser
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Deterministic fullscreen event-flow QA
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/fs-det-http.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in {1..60}; do curl -fsS http://127.0.0.1:4173/duck-heist/ >/dev/null && break; sleep .25; done
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:1920,height:1080},screen:{width:1920,height:1080}});
          const page=await context.newPage();

          await page.addInitScript(()=>{
            let fakeFullscreen=false;
            Object.defineProperty(document,'fullscreenElement',{
              configurable:true,
              get(){return fakeFullscreen?document.documentElement:null;}
            });
            document.documentElement.requestFullscreen=async()=>{
              fakeFullscreen=true;
              document.dispatchEvent(new Event('fullscreenchange'));
            };
            document.exitFullscreen=async()=>{
              fakeFullscreen=false;
              document.dispatchEvent(new Event('fullscreenchange'));
            };
          });

          const errors=[];
          page.on('pageerror',e=>errors.push(String(e)));
          page.on('console',m=>{if(m.type()==='error')errors.push(m.text());});
          await page.goto('http://127.0.0.1:4173/duck-heist/?auditoria=1',{waitUntil:'networkidle'});
          await page.waitForFunction(()=>window.duckHeistEngine&&window.duckHeistAudit);
          await page.locator('canvas[role="application"]').focus();

          // F is global even though MENU is mouse-first.
          await page.keyboard.press('f');
          await page.waitForFunction(()=>!!document.fullscreenElement);
          await page.waitForTimeout(100);
          let state=await page.evaluate(()=>({
            game:window.duckHeistEngine.state,
            fs:!!document.fullscreenElement,
            stageW:document.querySelector('.duck-responsive-stage').getBoundingClientRect().width,
            innerW:innerWidth,
            logicalW:document.querySelector('canvas[aria-hidden="true"]').width
          }));
          if(state.game!=='MENU'||!state.fs)throw new Error('F failed from MENU '+JSON.stringify(state));
          if(Math.abs(state.stageW-state.innerW)>2)throw new Error('fullscreen stage not wide '+JSON.stringify(state));

          // Fullscreen menu uses the widened card geometry, not the old 145px card.
          const point=await page.evaluate(()=>{
            const stage=document.querySelector('.duck-responsive-stage').getBoundingClientRect();
            const wc=document.querySelector('canvas[aria-hidden="true"]');
            return {x:stage.left+200/wc.width*stage.width,y:stage.top+118/wc.height*stage.height};
          });
          await page.mouse.move(point.x,point.y);
          await page.waitForTimeout(80);
          const hover=await page.evaluate(()=>window.duckHeistEngine.menuIndex);
          if(hover!==1)throw new Error('wide fullscreen menu hitbox not active '+hover);

          // F again exits.
          await page.keyboard.press('f');
          await page.waitForFunction(()=>!document.fullscreenElement);
          if(await page.evaluate(()=>window.duckHeistEngine.state)!=='MENU')throw new Error('F exit changed MENU');

          // Gameplay: first ESC must not pause/navigate while fullscreen.
          await page.evaluate(()=>{window.duckHeistEngine.state='PLAYING';window.duckHeistEngine.onStateChange?.('PLAYING');});
          await page.keyboard.press('f');
          await page.waitForFunction(()=>!!document.fullscreenElement);
          await page.keyboard.press('Escape');
          await page.waitForTimeout(80);
          const afterFirstKey=await page.evaluate(()=>({state:window.duckHeistEngine.state,fs:!!document.fullscreenElement}));
          if(afterFirstKey.state!=='PLAYING')throw new Error('first ESC navigated game '+JSON.stringify(afterFirstKey));

          // Emulate the browser's native fullscreen exit caused by that first ESC.
          await page.evaluate(()=>document.exitFullscreen());
          await page.waitForFunction(()=>!document.fullscreenElement);
          if(await page.evaluate(()=>window.duckHeistEngine.state)!=='PLAYING')throw new Error('fullscreen exit changed game state');

          // Second ESC is now Duck Heist navigation: PLAYING -> PAUSED.
          await page.keyboard.press('Escape');
          await page.waitForTimeout(80);
          const afterSecond=await page.evaluate(()=>window.duckHeistEngine.state);
          if(afterSecond!=='PAUSED')throw new Error('second ESC failed '+afterSecond);

          const audit=await page.evaluate(()=>window.duckHeistAudit);
          if(audit.failures.length||audit.passed<452)throw new Error('selftests '+JSON.stringify(audit));
          if(errors.length)throw new Error('runtime '+errors.join(' | '));

          console.log(JSON.stringify({
            fFromMenu:true,
            menuExpandedToViewport:true,
            logicalWidth:state.logicalW,
            wideMenuHitbox:true,
            fAgainExits:true,
            firstEscapeGameState:afterFirstKey.state,
            secondEscapeGameState:afterSecond,
            selftests:audit.passed,
            runtimeErrors:errors.length,
            version:'0.8.0'
          },null,2));
          await browser.close();
          JS
      - name: Cleanup and rebuild dist
        if: always()
        run: |
          npm run build
          rm -f .github/workflows/v080-menu-fullscreen-deterministic.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'build: finalize menu fullscreen keyboard behavior'
            git push origin HEAD:fix/v080-menu-fullscreen-escape
          fi
