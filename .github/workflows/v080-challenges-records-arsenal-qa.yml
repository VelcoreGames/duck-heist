name: v0.8.0 challenges records arsenal QA
on:
  push:
    branches: [feature/v080-challenges-records-arsenal]
    paths:
      - '.github/workflows/v080-challenges-records-arsenal-qa.yml'
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v080-challenges-records-arsenal
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
      - name: Feature invariants
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = "0.8.0"
          grep -Fq '"version": "0.8.0"' package.json
          grep -Fq "const VERSION = 'v0.8.0';" dist/index.html
          grep -Fq "SINERGIAS" src/game/catalog.ts
          grep -Fq "CONTRATOS ROTATIVOS" src/game/careerUI.ts
          grep -Fq "RÉCORDS POR DIFICULTAD" src/game/careerUI.ts
          grep -Fq "ARSENAL · RENDIMIENTO ACUMULADO" src/game/careerUI.ts
          grep -Fq "trackWeaponDamage" src/game/engine.ts
          grep -Fq "duckheist_contracts" src/game/career.ts
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Functional browser QA
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/duck-advanced-career.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in {1..40}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep .25; done
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1191,height:900}});
          const errors=[];
          page.on('pageerror',e=>errors.push(String(e)));
          page.on('console',m=>{if(m.type()==='error')errors.push(m.text());});
          await page.goto('http://127.0.0.1:4173/?auditoria=1',{waitUntil:'networkidle'});
          await page.waitForFunction(()=>window.duckHeistEngine && document.querySelectorAll('canvas').length>=2);
          await page.evaluate(()=>{window.duckHeistEngine.testing=false;localStorage.clear();});
          const noOverflow=async label=>{
            await page.waitForTimeout(80);
            const v=await page.evaluate(()=>({
              state:window.duckHeistEngine.state,
              overflowX:document.documentElement.scrollWidth>innerWidth,
              overflowY:document.documentElement.scrollHeight>innerHeight
            }));
            if(v.overflowX||v.overflowY)throw new Error(label+' overflow');
            return v;
          };

          // Collection now has six categories and a synergy archive.
          await page.evaluate(()=>{
            const e=window.duckHeistEngine;
            e.state='COLLECTION';e.collectionTab='synergies';e.collectionIndex=0;
            e.discovered.synergies=['infernal_bread','twin_yolk'];
          });
          await noOverflow('synergy collection');

          // Career has six reachable views.
          await page.evaluate(()=>{const e=window.duckHeistEngine;e.state='CAREER';e.careerTab=0;});
          for(let i=0;i<6;i++){
            await page.evaluate(i=>window.duckHeistEngine.careerTab=i,i);
            await noOverflow('career tab '+i);
          }

          // Contract screen: force all metrics above the current baselines and verify auto rewards.
          const coins0=await page.evaluate(()=>window.duckHeistEngine.totalGoldenCrumbs);
          await page.evaluate(()=>{
            const e=window.duckHeistEngine;
            const big=100000;
            e.career.runs=big;e.career.wins=big;e.career.totalEnemies=big;e.career.totalBosses=big;
            e.career.totalDamage=big;e.career.totalRooms=big;e.career.endlessRuns=big;
            e.state='CAREER';e.careerTab=4;
          });
          await noOverflow('contracts');

          // Start a real run to validate weapon shot/damage/kill telemetry.
          await page.evaluate(()=>{
            const e=window.duckHeistEngine;
            e.career.runs=0;e.career.wins=0;e.career.totalEnemies=0;e.career.totalBosses=0;
            e.career.totalDamage=0;e.career.totalRooms=0;e.career.endlessRuns=0;
            e.menuIndex=0;e.state='MENU';
          });
          await page.keyboard.press('Enter');
          await page.waitForFunction(()=>window.duckHeistEngine.state==='DIFFICULTY');
          await page.keyboard.press('Enter');
          await page.waitForTimeout(1800);
          if((await page.evaluate(()=>window.duckHeistEngine.state))==='HEIST_INTRO'){
            await page.keyboard.press('Enter');await page.waitForTimeout(1200);
          }
          await page.waitForFunction(()=>window.duckHeistEngine.state==='PLAYING',{timeout:6000});

          // Inject one valid dummy enemy into current room for deterministic hit tracking.
          await page.evaluate(()=>{
            const e=window.duckHeistEngine,c=e.contents.get(e.currentKey);
            const id=987654,x=e.player.x+44,y=e.player.y;
            c.enemies=[{
              id,type:'policia_pato',x,y,vx:0,vy:0,hp:6,maxHp:6,speed:0,damage:0,size:14,score:1,
              behavior:'chaser',flying:false,fireRate:9999,fireCooldown:9999,projectileType:'enemy_bullet',
              hurtTimer:0,moveAngle:0,moveTimer:9999,telegraph:0,chargeTimer:0,burst:0,burstDelay:0,
              slowTimer:0,burn:0,elite:false,isBoss:false,bossType:'',bossPhase:0,attackTimer:9999,
              attackCooldown:9999,spawnAnim:0,dmgMul:1,shieldAngle:0,recover:0
            }];
            c.combatTimer=0;
            e.player.fireCooldown=0;e.projectiles=[];
          });
          await page.keyboard.down('ArrowRight');
          await page.waitForTimeout(350);
          await page.keyboard.up('ArrowRight');
          const telemetry=await page.evaluate(()=>window.duckHeistEngine.run.weaponStats.quack_blaster);
          if(!telemetry||telemetry.shots<1||telemetry.damage<=0||telemetry.kills<1)throw new Error('weapon telemetry failed '+JSON.stringify(telemetry));

          // Seed acquired item/synergy loadout, then die to commit run.
          await page.evaluate(()=>{
            const e=window.duckHeistEngine;
            e.run.itemIds=['bread_helmet','lucky_feather'];
            e.knownSynergies=['infernal_bread'];
            e.player.items=['bread_helmet','lucky_feather'];
            e.player.hp=0;
          });
          await page.waitForFunction(()=>window.duckHeistEngine.state==='GAME_OVER',{timeout:4000});

          const recorded=await page.evaluate(()=>({
            history:window.duckHeistEngine.runHistory[0],
            weapon:window.duckHeistEngine.career.weapons.quack_blaster,
            item:window.duckHeistEngine.career.items.bread_helmet,
            diff:window.duckHeistEngine.career.difficulty.normal,
            coins:window.duckHeistEngine.totalGoldenCrumbs,
            contracts:window.duckHeistEngine.contracts,
            save:JSON.parse(localStorage.getItem('duckheist_save')||'{}'),
            career:JSON.parse(localStorage.getItem('duckheist_career')||'{}'),
            contractSave:JSON.parse(localStorage.getItem('duckheist_contracts')||'{}')
          }));
          if(recorded.history?.weaponIds?.includes('quack_blaster')!==true)throw new Error('history weapon loadout missing');
          if(recorded.history?.itemIds?.includes('bread_helmet')!==true)throw new Error('history item loadout missing');
          if(recorded.history?.synergyIds?.includes('infernal_bread')!==true)throw new Error('history synergy loadout missing');
          if(!recorded.weapon||recorded.weapon.shots<1||recorded.weapon.damage<=0||recorded.weapon.kills<1)throw new Error('career weapon stat missing');
          if(!recorded.item||recorded.item.runs<1)throw new Error('career item stat missing');
          if(!recorded.diff||recorded.diff.runs<1)throw new Error('difficulty record missing');
          if(!recorded.contractSave.daily||!recorded.contractSave.weekly)throw new Error('contracts not persisted');
          if(!recorded.save.discovered?.synergies)throw new Error('synergy discovery collection missing from save schema');

          // Force metric completion after baselines, then record a second run via abandonment.
          const beforeReward=recorded.coins;
          await page.evaluate(()=>{
            const e=window.duckHeistEngine;
            for(const p of ['daily','weekly']){
              const b=e.contracts[p].baseline;
              e.career.runs=b.runs+1000;e.career.wins=b.wins+1000;e.career.totalEnemies=b.enemies+1000;
              e.career.totalBosses=b.bosses+1000;e.career.totalDamage=b.damage+100000;
              e.career.totalRooms=b.rooms+1000;e.career.endlessRuns=b.endlessRuns+1000;
            }
            e.runRecorded=false;e.run.time=120;e.run.seed='PAN-CONTRACT';e.state='PLAYING';
          });
          await page.keyboard.press('Escape');
          await page.waitForFunction(()=>window.duckHeistEngine.state==='PAUSED');
          await page.evaluate(()=>window.duckHeistEngine.pauseIndex=6);
          await page.keyboard.press('Enter');
          await page.waitForFunction(()=>window.duckHeistEngine.state==='CONFIRM');
          await page.keyboard.press('ArrowUp');
          await page.keyboard.press('Enter');
          await page.waitForFunction(()=>window.duckHeistEngine.state==='MENU');
          const reward=await page.evaluate(()=>({
            coins:window.duckHeistEngine.totalGoldenCrumbs,
            daily:[...window.duckHeistEngine.contracts.daily.rewarded],
            weekly:[...window.duckHeistEngine.contracts.weekly.rewarded]
          }));
          if(reward.coins<=beforeReward||reward.daily.length<1||reward.weekly.length<1)throw new Error('contract rewards not granted');

          if(errors.length)throw new Error('Runtime errors: '+errors.join(' | '));
          console.log(JSON.stringify({telemetry,recorded:{weapon:recorded.weapon,item:recorded.item,diff:recorded.diff},reward},null,2));
          await browser.close();
          JS
      - name: Cleanup temporary QA
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/v080-challenges-records-arsenal-qa.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'chore: remove temporary v0.8.0 challenges arsenal QA'
            git push origin HEAD:feature/v080-challenges-records-arsenal
          fi
