name: Publish Duck Heist v0.7.53 Premium Menu UI

on:
  push:
    paths:
      - '.github/workflows/publish-v0753-premium-menu-ui.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Apply approved premium front-end UI
        run: |
          python scripts/patch-v0753-premium-menu-ui.py
          sed -i 's/0.7.53-premium-menu-ui-candidate/0.7.53-premium-menu-ui/g' index.html
          npm version 0.7.53 --no-git-tag-version
          printf '0.7.53\n' > VERSION

      - name: Validate release source and scope
        run: |
          grep -q '0.7.53-premium-menu-ui' index.html
          ! grep -q 'premium-menu-ui-candidate' index.html
          grep -q '"version": "0.7.53"' package.json
          grep -q 'export function drawPremiumBackdrop' src/game/ui.ts
          grep -q 'export function drawPremiumPanel' src/game/ui.ts
          grep -q 'export function drawPremiumButton' src/game/ui.ts
          grep -q 'export function drawPremiumMeter' src/game/ui.ts
          grep -q 'EXPEDIENTE DEL ATRACO' src/game/render.ts
          grep -q 'AUDIO · VIDEO · ACCESIBILIDAD' src/game/render.ts
          grep -q 'NIVEL DE SEGURIDAD' src/game/render.ts
          grep -q 'ALERTA DE SEGURIDAD' src/game/render.ts
          grep -q 'canvas2d-chibi-atlas-v16' src/game/graphics/playerChibiAtlasV16.ts
          grep -q '464-raster-chibi-v16' src/game/graphics/playerChibiAtlasV16.ts
          grep -q 'no hair' scripts/generate-player-chibi-v16.py
          grep -q 'no glasses' scripts/generate-player-chibi-v16.py
          npx tsc --noEmit
          git diff --check

      - name: Build v0.7.53 web release
        run: |
          rm -rf /tmp/duck-heist-v0753 web-release dist
          npx vite build --outDir /tmp/duck-heist-v0753 --emptyOutDir
          test -s /tmp/duck-heist-v0753/index.html
          grep -q '0.7.53-premium-menu-ui' /tmp/duck-heist-v0753/index.html
          grep -q '464-raster-chibi-v16' /tmp/duck-heist-v0753/index.html
          grep -q 'canvas2d-chibi-atlas-v16' /tmp/duck-heist-v0753/index.html
          mkdir -p web-release
          cp -a /tmp/duck-heist-v0753/. web-release/
          node scripts/publish-release.mjs

      - name: Validate publish artifacts
        run: |
          test -s web-release/index.html
          test -s dist/index.html
          grep -q '^0.7.53$' VERSION
          grep -q '0.7.53-premium-menu-ui' web-release/index.html
          grep -q '0.7.53-premium-menu-ui' dist/index.html
          cmp web-release/index.html dist/index.html
          git diff --check

      - name: Commit v0.7.53 to main
        run: |
          git config user.name 'VelcoreGames'
          git config user.email 'contacto@velcore.com.mx'
          git add src/game/ui.ts src/game/render.ts index.html package.json package-lock.json VERSION web-release dist
          git diff --cached --stat
          git diff --cached --quiet && { echo 'No release changes to commit'; exit 1; }
          git commit -m 'Release Duck Heist v0.7.53 premium menu UI'
          git pull --rebase origin main
          git push origin HEAD:main
