name: Publish Duck Heist v0.7.3 Remastered Player

on:
  push:
    paths:
      - '.github/workflows/publish-v073-remastered-player.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Build remastered player atlas
        run: |
          python scripts/remaster-player-atlas.py
          python - <<'PY'
          from PIL import Image
          p='src/assets/chibi/base-duck-remastered-atlas.png'
          im=Image.open(p).convert('RGBA'); im.load()
          assert im.size==(1200,240), im.size
          nonempty=0
          for r in range(4):
              for c in range(30):
                  fr=im.crop((c*40,r*60,(c+1)*40,(r+1)*60))
                  a=fr.getchannel('A')
                  if a.getbbox(): nonempty += 1
                  opaque=sum(1 for v in a.getdata() if v>0)
                  assert 20 < opaque < 40*60*.90, (r,c,opaque)
          assert nonempty==120, nonempty
          print('validated 120 remastered authored frames')
          PY
      - name: Activate remastered player renderer
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/game/render.ts')
          s=p.read_text()
          old="import { drawChibiPlayerPolished } from './graphics/playerChibiPolished';"
          new="import { drawChibiPlayerRemastered } from './graphics/playerChibiRemastered';"
          if old not in s and new not in s:
              raise SystemExit('expected polished player renderer import not found')
          s=s.replace(old,new)
          s=s.replace('drawChibiPlayerPolished({','drawChibiPlayerRemastered({')
          p.write_text(s)
          PY
      - name: Validate source and build
        run: |
          npx tsc --noEmit
          grep -q "drawChibiPlayerRemastered" src/game/render.ts
          grep -q "REMASTERED_DUCK_AUTHORED_FRAMES = 120" src/game/graphics/playerChibiRemastered.ts
          grep -q "base-duck-remastered-atlas.png" src/game/graphics/playerChibiRemastered.ts
          npx vite build --outDir /tmp/duck-heist-v073 --emptyOutDir
          test -s /tmp/duck-heist-v073/index.html
          grep -q 'canvas2d-chibi-remastered-v2' /tmp/duck-heist-v073/index.html
          grep -q '120-authored-remastered' /tmp/duck-heist-v073/index.html
      - name: Promote v0.7.3
        run: |
          npm version 0.7.3 --no-git-tag-version
          printf '0.7.3\n' > VERSION
          rm -rf web-release dist
          mkdir -p web-release
          cp -a /tmp/duck-heist-v073/. web-release/
          node scripts/publish-release.mjs
      - name: Validate promoted release
        run: |
          test -s web-release/index.html
          test -s dist/index.html
          grep -q '"version": "0.7.3"' package.json
          grep -q '^0.7.3$' VERSION
          grep -q 'canvas2d-chibi-remastered-v2' web-release/index.html
          grep -q '120-authored-remastered' web-release/index.html
          cmp web-release/index.html dist/index.html
      - name: Commit v0.7.3
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A src/assets/chibi/base-duck-remastered-atlas.png src/game/render.ts src/game/graphics/playerChibiRemastered.ts scripts/remaster-player-atlas.py web-release dist VERSION package.json package-lock.json
          git commit -m 'Release Duck Heist v0.7.3 remastered player'
          git pull --rebase origin main
          git push origin HEAD:main
