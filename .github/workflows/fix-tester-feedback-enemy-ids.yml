name: Fix tester feedback enemy ids

on:
  push:
    branches: [tester-feedback-2026-09-09]
    paths:
      - .github/workflows/fix-tester-feedback-enemy-ids.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tester-feedback-2026-09-09
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Replace invalid enemy ids with baseline ids
        run: |
          sed -i "s/policia_escopeta/policia_rapido/g; s/policia_capitan/policia_pato/g" src/game/engine.ts
          ! grep -q "policia_escopeta\|policia_capitan" src/game/engine.ts
          grep -q "makeEnemy(i?'policia_rapido':'policia_pato'" src/game/engine.ts
          grep -q "makeEnemy(i?'dron_policial':'policia_pato'" src/game/engine.ts
      - run: npx tsc --noEmit
      - run: npx vite build --outDir candidate-dist --emptyOutDir
      - name: Commit corrected source
        run: |
          git add src/game/engine.ts
          git config user.name "VelcoreGames"
          git config user.email "contacto@velcore.com.mx"
          git commit -m "Use valid baseline enemy ids in boss patterns"
          git push origin HEAD:tester-feedback-2026-09-09
