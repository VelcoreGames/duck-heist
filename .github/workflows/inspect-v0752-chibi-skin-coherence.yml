name: Inspect Duck Heist v0.7.52 Chibi Skin Coherence

on:
  push:
    paths:
      - '.github/workflows/inspect-v0752-chibi-skin-coherence.yml'
      - 'scripts/patch-v0752-chibi-skin-coherence.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Apply modern skin coherence candidate
        run: python scripts/patch-v0752-chibi-skin-coherence.py

      - name: Validate candidate scope and cosmetic coverage
        run: |
          grep -q '0.7.52-chibi-skin-coherence-candidate' index.html
          grep -q 'const DRAW_SCALE = .66' src/game/graphics/playerChibiV3.ts
          grep -q 'type SkinOverlay' src/game/graphics/playerChibiV3.ts
          grep -q "case 'fedora'" src/game/graphics/playerChibiV3.ts
          grep -q "case 'chef'" src/game/graphics/playerChibiV3.ts
          grep -q "case 'ninja'" src/game/graphics/playerChibiV3.ts
          grep -q "case 'undercover'" src/game/graphics/playerChibiV3.ts
          grep -q "case 'pirate'" src/game/graphics/playerChibiV3.ts
          grep -q "case 'king'" src/game/graphics/playerChibiV3.ts
          grep -q "if (input.celebrating) return 'celebrate'" src/game/graphics/playerChibiV3.ts
          grep -q "if (input.interacting) return 'interact'" src/game/graphics/playerChibiV3.ts
          grep -q 'skinId: skin.id' src/game/render.ts
          grep -q 'skinId: s.id' src/game/render.ts
          ! grep -q 'drawDuckSkin' src/game/render.ts
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' index.html src/game/graphics/playerChibiV3.ts src/game/render.ts | sort)"
          test "$changed" = "$expected"
          git diff --check

      - name: Add local-only QA engine hook
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/App.tsx');s=p.read_text()
          old='''    const engine = createEngine(wc, wctx, uctx);\n    engineRef.current = engine;\n'''
          new='''    const engine = createEngine(wc, wctx, uctx);\n    engineRef.current = engine;\n    (window as Window & { __duckQaEngine?: GameEngine }).__duckQaEngine = engine;\n'''
          if s.count(old)!=1: raise SystemExit('QA hook anchor mismatch')
          p.write_text(s.replace(old,new,1))
          PY

      - name: Validate TypeScript and build
        run: |
          npx tsc --noEmit
          rm -rf /tmp/v0752-build
          npx vite build --outDir /tmp/v0752-build --emptyOutDir
          grep -q '0.7.52-chibi-skin-coherence-candidate' /tmp/v0752-build/index.html
          grep -q '464-raster-chibi-v16' /tmp/v0752-build/index.html
          grep -q 'canvas2d-chibi-atlas-v16' /tmp/v0752-build/index.html

      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Review all modern wardrobe identities and gameplay scale
        run: |
          mkdir -p /tmp/v0752-skin-review
          cd /tmp/v0752-build
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/v0752-skin-http.log 2>&1 &
          echo $! >/tmp/v0752-skin-http.pid
          cd "$GITHUB_WORKSPACE"
          node <<'NODE'
          const {chromium}=require('playwright');const fs=require('fs'),assert=require('assert');
          const out='/tmp/v0752-skin-review',expected='0.7.52-chibi-skin-coherence-candidate',sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const errors=[],failed=[],bad=[],samples={};
          const skins=['robber','gangster','prisoner','baker','executive','pink','ninja','undercover','pirate','golden','king'];
          async function ds(p){return p.evaluate(()=>({build:document.querySelector('meta[name="duck-heist-build"]')?.content||'',renderer:document.documentElement.dataset.duckHeistPlayerRenderer||'',frames:document.documentElement.dataset.duckHeistPlayerFrames||'',fx:document.documentElement.dataset.duckHeistPlayerFx||'',state:document.documentElement.dataset.duckHeistPlayerState||'',visualFrame:document.documentElement.dataset.duckHeistPlayerVisualFrame||''}));}
          async function setWardrobe(p,index,scroll=0){await p.evaluate(({index,scroll,skins})=>{const e=window.__duckQaEngine;if(!e)throw new Error('engine missing');e.state='WARDROBE';e.wardrobeIndex=index;e.wardrobeScroll=scroll;e.wardrobeScrollTarget=scroll;e.unlockedSkins=skins;e.onStateChange?.(e.state);},{index,scroll,skins});await sleep(260);}
          async function startGame(p){await p.goto(`http://127.0.0.1:4173/?qa=v0752-game&t=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:60000});await sleep(900);const c=p.locator('canvas[role="application"]');assert.strictEqual(await c.count(),1);await c.focus();await p.keyboard.press('Enter');for(let i=0;i<6;i++){await sleep(850);const d=await ds(p);if(d.state==='idle'&&d.frames==='464-raster-chibi-v16')break;await p.keyboard.press('Enter');}await sleep(3200);}
          (async()=>{const browser=await chromium.launch({headless:true});const context=await browser.newContext({viewport:{width:1440,height:1000},deviceScaleFactor:1});const p=await context.newPage();p.on('console',m=>{if(m.type()==='error')errors.push(m.text())});p.on('pageerror',e=>errors.push(e.message));p.on('requestfailed',r=>failed.push(`${r.method()} ${r.url()} ${r.failure()?.errorText||''}`));p.on('response',r=>{if(r.status()>=400)bad.push(`${r.status()} ${r.url()}`)});
          await p.goto(`http://127.0.0.1:4173/?qa=v0752-wardrobe&t=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:60000});await sleep(900);assert.strictEqual((await ds(p)).build,expected);assert.strictEqual(await p.locator('canvas[role="application"]').count(),1);
          await setWardrobe(p,0,0);samples.robber=await ds(p);assert.strictEqual(samples.robber.renderer,'canvas2d-chibi-atlas-v16');await p.screenshot({path:`${out}/01-robber.png`,fullPage:true});
          for (const [idx,name] of [[1,'gangster'],[2,'prisoner'],[3,'baker'],[4,'executive'],[6,'ninja'],[7,'undercover'],[8,'pirate'],[9,'golden'],[10,'king']]) {await setWardrobe(p,idx,idx>=8?95:0);const d=await ds(p);assert(['webgl2-chibi-v3','canvas2d-fallback'].includes(d.renderer),`${name}: unexpected renderer ${d.renderer}`);samples[name]=d;await p.screenshot({path:`${out}/${String(idx+1).padStart(2,'0')}-${name}.png`,fullPage:true});}
          await startGame(p);await p.evaluate(()=>{const e=window.__duckQaEngine;if(!e)throw new Error('engine missing');e.equippedSkin='gangster';});await sleep(350);samples.gameplayGangster=await ds(p);assert(['webgl2-chibi-v3','canvas2d-fallback'].includes(samples.gameplayGangster.renderer));await p.screenshot({path:`${out}/12-gameplay-gangster.png`,fullPage:true});
          await p.evaluate(()=>{const e=window.__duckQaEngine;if(!e)throw new Error('engine missing');e.equippedSkin='king';e.player.interactVisualTimer=12;});await sleep(120);samples.gameplayKing=await ds(p);await p.screenshot({path:`${out}/13-gameplay-king-interact.png`,fullPage:true});
          assert.strictEqual(errors.length,0,errors.join(' | '));assert.strictEqual(failed.length,0,failed.join(' | '));assert.strictEqual(bad.length,0,bad.join(' | '));fs.writeFileSync(`${out}/qa.json`,JSON.stringify({samples,errors,failed,bad},null,2));await browser.close();})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          kill "$(cat /tmp/v0752-skin-http.pid)" || true

      - name: Upload candidate review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duck-heist-v0752-chibi-skin-coherence-candidate
          path: /tmp/v0752-skin-review
          if-no-files-found: warn
          retention-days: 7
