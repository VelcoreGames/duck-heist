name: Publish Duck Heist v0.7.37 Chibi V16

on:
  push:
    paths:
      - '.github/workflows/publish-v0737-chibi-v16.yml'
      - 'scripts/generate-player-chibi-v16.py'
      - 'scripts/patch-v16-generator-source.py'
      - 'scripts/patch-v0737-activate-v16.py'
      - 'src/game/graphics/playerChibiAtlasV16.ts'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: pip install --disable-pip-version-check pillow

      - name: Harden and generate 464-frame chibi atlas
        run: |
          python scripts/patch-v16-generator-source.py
          python scripts/generate-player-chibi-v16.py
          python - <<'PY'
          from PIL import Image
          p='src/assets/chibi/base-duck-chibi-v16-atlas.png'
          im=Image.open(p).convert('RGBA'); im.load()
          assert im.size==(7424,256), im.size
          count=0
          for r in range(4):
              for c in range(116):
                  fr=im.crop((c*64,r*64,(c+1)*64,(r+1)*64))
                  a=fr.getchannel('A')
                  if a.getbbox(): count+=1
                  meaningful=sum(1 for v in a.getdata() if v>64)
                  assert 90 < meaningful < 64*64*.72, (r,c,meaningful)
          assert count==464,count
          print('validated 464 non-empty high-resolution chibi frames')
          PY

      - name: Activate V16 player
        run: python scripts/patch-v0737-activate-v16.py

      - name: Validate source and build
        run: |
          grep -q 'CHIBI_PLAYER_V16_RASTER_FRAMES = 464' src/game/graphics/playerChibiAtlasV16.ts
          grep -q 'drawChibiPlayerAtlasV16' src/game/render.ts
          grep -q 'PLAYER VISUAL LAB · v16 · 464 RASTER' src/game/graphics/playerVisualLab.ts
          grep -q '0.7.37-chibi-v16' index.html
          npx tsc --noEmit
          npx vite build --outDir /tmp/duck-heist-v0737 --emptyOutDir
          test -s /tmp/duck-heist-v0737/index.html
          grep -q '0.7.37-chibi-v16' /tmp/duck-heist-v0737/index.html
          grep -q '464-raster-chibi-v16' /tmp/duck-heist-v0737/index.html

      - name: Promote v0.7.37
        run: |
          npm version 0.7.37 --no-git-tag-version
          printf '0.7.37\n' > VERSION
          rm -rf web-release dist
          mkdir -p web-release
          cp -a /tmp/duck-heist-v0737/. web-release/
          node scripts/publish-release.mjs

      - name: Validate promoted release
        run: |
          test -s web-release/index.html
          test -s dist/index.html
          grep -q '"version": "0.7.37"' package.json
          grep -q '^0.7.37$' VERSION
          grep -q '0.7.37-chibi-v16' web-release/index.html
          grep -q '464-raster-chibi-v16' web-release/index.html
          cmp web-release/index.html dist/index.html

      - name: Commit v0.7.37
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A scripts/generate-player-chibi-v16.py src/assets/chibi/base-duck-chibi-v16-atlas.png src/game/graphics/playerChibiAtlasV16.ts src/game/graphics/playerVisualLab.ts src/game/render.ts index.html web-release dist VERSION package.json package-lock.json
          git commit -m 'Release Duck Heist v0.7.37 chibi player v16'
          git pull --rebase origin main
          git push origin HEAD:main
