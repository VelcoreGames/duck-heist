name: v0.8.0 branded auth email QA
on:
  push:
    branches: [feat/v080-branded-auth-emails]
    paths:
      - '.github/workflows/v080-branded-auth-email-qa.yml'

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v080-branded-auth-emails
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Guard v0.8.0
        run: |
          node -e "const p=require('./package.json'); if(p.version!=='0.8.0') throw new Error('version changed')"
          test "$(tr -d '\r\n' < VERSION)" = "0.8.0"
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Validate email templates
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const base='supabase/templates/';
          const req={
            'confirmation.html':['{{ .ConfirmationURL }}','VELCORE','GAMES ID','CONFIRMAR CORREO'],
            'recovery.html':['{{ .ConfirmationURL }}','CAMBIAR CONTRASEÑA'],
            'email_change.html':['{{ .ConfirmationURL }}','{{ .NewEmail }}','CONFIRMAR NUEVO CORREO'],
            'reauthentication.html':['{{ .Token }}','Verifica que eres tú'],
            'invite.html':['{{ .ConfirmationURL }}','ACEPTAR INVITACIÓN'],
            'magic_link.html':['{{ .ConfirmationURL }}','ENTRAR A VELCORE GAMES'],
            'password_changed_notification.html':['Tu contraseña cambió'],
            'email_changed_notification.html':['{{ .OldEmail }}','{{ .Email }}']
          };
          for(const [name,markers] of Object.entries(req)){
            const html=fs.readFileSync(base+name,'utf8');
            if(!/^<!doctype html>/i.test(html))throw new Error(name+' missing doctype');
            for(const marker of markers)if(!html.includes(marker))throw new Error(name+' missing '+marker);
            if(/powered by supabase|supabase auth/i.test(html))throw new Error(name+' leaks Supabase branding');
            if(/<img\b/i.test(html))throw new Error(name+' uses external image dependency');
            if(html.length>50000)throw new Error(name+' unexpectedly large');
          }
          const confirmation=fs.readFileSync(base+'confirmation.html','utf8');
          if(!confirmation.includes('Tu progreso te sigue a cualquier equipo.'))throw new Error('brand continuity missing');
          console.log(JSON.stringify({templates:Object.keys(req).length,branding:'Velcore Games',externalImages:0,supabaseBranding:0},null,2));
          JS
      - name: Detect Supabase management token
        shell: bash
        env:
          TOKEN_PRESENT: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
        run: echo "SUPABASE_ACCESS_TOKEN_AVAILABLE=$TOKEN_PRESENT"
      - name: Apply hosted Supabase templates
        if: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: nohiktjbysfkhtiqdbjy
        run: npm run email:apply
      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          rm -f .github/workflows/v080-branded-auth-email-qa.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'ci: remove branded auth email QA'
            git push origin HEAD:feat/v080-branded-auth-emails
          fi
