name: Inspect Duck Heist v0.7.53 Premium Menu UI

on:
  push:
    paths:
      - '.github/workflows/inspect-v0753-premium-menu-ui.yml'
      - 'scripts/patch-v0753-premium-menu-ui.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Apply premium menu UI candidate
        run: python scripts/patch-v0753-premium-menu-ui.py

      - name: Validate presentation-only scope
        run: |
          grep -q '0.7.53-premium-menu-ui-candidate' index.html
          grep -q 'export function drawPremiumBackdrop' src/game/ui.ts
          grep -q 'EXPEDIENTE DEL ATRACO' src/game/render.ts
          grep -q 'AUDIO · VIDEO · ACCESIBILIDAD' src/game/render.ts
          grep -q 'NIVEL DE SEGURIDAD' src/game/render.ts
          grep -q 'ALERTA DE SEGURIDAD' src/game/render.ts
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' index.html src/game/render.ts src/game/ui.ts | sort)"
          test "$changed" = "$expected"
          git diff --check

      - name: Add local-only QA engine hook
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/App.tsx');s=p.read_text()
          old='''    const engine = createEngine(wc, wctx, uctx);\n    engineRef.current = engine;\n'''
          new='''    const engine = createEngine(wc, wctx, uctx);\n    engineRef.current = engine;\n    (window as Window & { __duckQaEngine?: GameEngine }).__duckQaEngine = engine;\n'''
          if s.count(old)!=1: raise SystemExit('QA hook anchor mismatch')
          p.write_text(s.replace(old,new,1))
          PY

      - name: Validate TypeScript and build
        run: |
          npx tsc --noEmit
          rm -rf /tmp/v0753-build
          npx vite build --outDir /tmp/v0753-build --emptyOutDir
          grep -q '0.7.53-premium-menu-ui-candidate' /tmp/v0753-build/index.html
          grep -q 'canvas2d-chibi-atlas-v16' /tmp/v0753-build/index.html
          grep -q '464-raster-chibi-v16' /tmp/v0753-build/index.html

      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Capture premium front-end screens
        run: |
          mkdir -p /tmp/v0753-review
          cd /tmp/v0753-build
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/v0753-http.log 2>&1 &
          echo $! >/tmp/v0753-http.pid
          cd "$GITHUB_WORKSPACE"
          node <<'NODE'
          const {chromium}=require('playwright');const fs=require('fs'),assert=require('assert');
          const out='/tmp/v0753-review',expected='0.7.53-premium-menu-ui-candidate',sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const errors=[],failed=[],bad=[],samples={};
          async function meta(p){return p.evaluate(()=>({build:document.querySelector('meta[name="duck-heist-build"]')?.content||'',renderer:document.documentElement.dataset.duckHeistPlayerRenderer||'',frames:document.documentElement.dataset.duckHeistPlayerFrames||''}));}
          async function show(p,state,extra={}){await p.evaluate(({state,extra})=>{const e=window.__duckQaEngine;if(!e)throw new Error('engine missing');Object.assign(e,extra);e.state=state;}, {state,extra});await sleep(260);}
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({viewport:{width:1440,height:1000},deviceScaleFactor:1});
            const p=await context.newPage();
            p.on('console',m=>{if(m.type()==='error')errors.push(m.text())});p.on('pageerror',e=>errors.push(e.message));p.on('requestfailed',r=>failed.push(`${r.method()} ${r.url()} ${r.failure()?.errorText||''}`));p.on('response',r=>{if(r.status()>=400)bad.push(`${r.status()} ${r.url()}`)});
            await p.goto(`http://127.0.0.1:4173/?qa=v0753&t=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:60000});await sleep(1000);
            assert.strictEqual((await meta(p)).build,expected);assert.strictEqual(await p.locator('canvas[role="application"]').count(),1);
            await p.screenshot({path:`${out}/01-menu.png`,fullPage:true});
            await show(p,'SETTINGS',{settingsIndex:2});await p.screenshot({path:`${out}/02-settings.png`,fullPage:true});
            await show(p,'HOW_TO_PLAY');await p.screenshot({path:`${out}/03-how-to.png`,fullPage:true});
            await show(p,'UPGRADES',{upgradeIndex:1});await p.screenshot({path:`${out}/04-upgrades.png`,fullPage:true});
            await show(p,'PAUSED',{pauseIndex:0});await p.screenshot({path:`${out}/05-pause.png`,fullPage:true});
            await show(p,'FLOOR_INTRO',{floorIntroTimer:62});await p.screenshot({path:`${out}/06-floor-security.png`,fullPage:true});
            await show(p,'BOSS_INTRO',{bossIntroTimer:48,bossIntroName:'CAPITÁN HONK',bossIntroSubtitle:'Jefe de seguridad del banco'});await p.screenshot({path:`${out}/07-boss-alert.png`,fullPage:true});
            samples.final=await meta(p);
            assert.strictEqual(errors.length,0,errors.join(' | '));assert.strictEqual(failed.length,0,failed.join(' | '));assert.strictEqual(bad.length,0,bad.join(' | '));
            fs.writeFileSync(`${out}/qa.json`,JSON.stringify({scope:'presentation-only menu/settings/how-to/upgrades/pause/floor-security/boss-alert',samples,errors,failed,bad},null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          kill "$(cat /tmp/v0753-http.pid)" || true

      - name: Upload candidate review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duck-heist-v0753-premium-menu-ui-candidate
          path: /tmp/v0753-review
          if-no-files-found: warn
          retention-days: 7
