name: Publish Duck Heist v0.7.50 Chibi V16 World Interact

on:
  push:
    paths:
      - '.github/workflows/publish-v0750-chibi-v16-world-interact.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Apply approved world interaction gesture
        run: |
          python scripts/patch-v0750-v16-world-interact.py
          sed -i 's/0.7.50-chibi-v16-world-interact-candidate/0.7.50-chibi-v16-world-interact/g' index.html
          npm version 0.7.50 --no-git-tag-version
          printf '0.7.50\n' > VERSION

      - name: Validate release source
        run: |
          grep -q 'interactVisualTimer: number' src/game/types.ts
          grep -q 'switchAnim: 0, interactVisualTimer: 0' src/game/engine.ts
          grep -q 'if (player.interactVisualTimer > 0) player.interactVisualTimer--' src/game/engine.ts
          grep -q 'p.interactVisualTimer > 0 && !p.moving' src/game/render.ts
          ! grep -Eq 'if[[:space:]]*\([^\n]*interactVisualTimer|while[[:space:]]*\([^\n]*interactVisualTimer' src/game/engine.ts
          grep -q '0.7.50-chibi-v16-world-interact' index.html
          ! grep -q 'world-interact-candidate' index.html
          grep -q '"version": "0.7.50"' package.json
          grep -q 'const DRAW = 46' src/game/graphics/playerChibiAtlasV16.ts
          grep -q '464-raster-chibi-v16' src/game/graphics/playerChibiAtlasV16.ts
          grep -q 'v16.8-death-focus' src/game/graphics/playerChibiAtlasV16.ts
          grep -q 'no hair' scripts/generate-player-chibi-v16.py
          grep -q 'no glasses' scripts/generate-player-chibi-v16.py
          npx tsc --noEmit
          git diff --check

      - name: Build v0.7.50 web release
        run: |
          rm -rf /tmp/duck-heist-v0750 web-release dist
          npx vite build --outDir /tmp/duck-heist-v0750 --emptyOutDir
          test -s /tmp/duck-heist-v0750/index.html
          grep -q '0.7.50-chibi-v16-world-interact' /tmp/duck-heist-v0750/index.html
          grep -q '464-raster-chibi-v16' /tmp/duck-heist-v0750/index.html
          grep -q 'canvas2d-chibi-atlas-v16' /tmp/duck-heist-v0750/index.html
          grep -q 'v16.8-death-focus' /tmp/duck-heist-v0750/index.html
          mkdir -p web-release
          cp -a /tmp/duck-heist-v0750/. web-release/
          node scripts/publish-release.mjs

      - name: Validate publish artifacts
        run: |
          test -s web-release/index.html
          test -s dist/index.html
          grep -q '^0.7.50$' VERSION
          grep -q '0.7.50-chibi-v16-world-interact' web-release/index.html
          grep -q '0.7.50-chibi-v16-world-interact' dist/index.html
          cmp web-release/index.html dist/index.html
          git diff --check

      - name: Commit v0.7.50 to main
        run: |
          git config user.name 'VelcoreGames'
          git config user.email 'contacto@velcore.com.mx'
          git add src/game/types.ts src/game/engine.ts src/game/render.ts index.html package.json package-lock.json VERSION web-release dist
          git diff --cached --stat
          git diff --cached --quiet && { echo 'No release changes to commit'; exit 1; }
          git commit -m 'Release Duck Heist v0.7.50 Chibi V16 world interact'
          git pull --rebase origin main
          git push origin HEAD:main
