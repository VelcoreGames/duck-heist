name: Publish Duck Heist v0.6.0

on:
  push:
    paths:
      - '.github/workflows/publish-v060.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Activate definitive chibi art modules
        run: |
          python - <<'PY'
          from pathlib import Path

          # Retire the old procedural preview as an implementation. Any lingering import
          # now resolves to the definitive v3 renderer instead.
          Path('src/game/graphics/playerChibiPreview.ts').write_text(
              "export { drawChibiPlayerV3 as drawChibiPlayerPreview, clearChibiPlayerV3Cache as clearChibiPlayerFrameCache } from './playerChibiV3';\n"
              "export { CHIBI_PLAYER_V3_FRAME_SIZE } from './playerChibiV3';\n"
              "export { CHIBI_PLAYER_SUMMARY } from './chibiProduction';\n",
              encoding='utf-8'
          )

          # Remove constants left over from earlier iterations of the new art modules.
          player = Path('src/game/graphics/playerChibiV3.ts')
          p = player.read_text(encoding='utf-8').replace("const OUTLINE_SOFT = '#443947';\n", '')
          player.write_text(p, encoding='utf-8')

          lobby = Path('src/game/graphics/lobbyArtV3.ts')
          l = lobby.read_text(encoding='utf-8')
          l = l.replace("const CREAM_SHADE = '#cdbda5';\n", '')
          l = l.replace("const BRASS_LIGHT = '#efd88a';\n", '')
          lobby.write_text(l, encoding='utf-8')

          render = Path('src/game/render.ts')
          s = render.read_text(encoding='utf-8')
          replacements = [
            ("import { drawChibiPlayerPreview } from './graphics/playerChibiPreview';", "import { drawChibiPlayerV3 } from './graphics/playerChibiV3';"),
            ("import { drawChibiPoliceDuck } from './graphics/enemyChibi';", "import { drawChibiPoliceDuckV3 } from './graphics/enemyChibiV3';"),
            ("import { drawChibiLobbyObstacle } from './graphics/chibiProps';", "import { drawChibiLobbyObstacleV3 } from './graphics/chibiPropsV3';"),
            ("drawChibiLobbyObstacle(ctx, x * TILE_SIZE, y * TILE_SIZE, t - OBSTACLE_BASE, f);", "drawChibiLobbyObstacleV3(ctx, x * TILE_SIZE, y * TILE_SIZE, t - OBSTACLE_BASE, f);"),
            ("drawChibiPlayerPreview({", "drawChibiPlayerV3({"),
            ("drawChibiPoliceDuck({", "drawChibiPoliceDuckV3({"),
          ]
          for old, new in replacements:
            count = s.count(old)
            if count < 1:
              raise SystemExit(f'Missing render anchor: {old}')
            s = s.replace(old, new)
          render.write_text(s, encoding='utf-8')

          room = Path('src/game/roomArt.ts')
          r = room.read_text(encoding='utf-8')
          import_anchor = "import type { FloorTheme } from './constants';"
          if "./graphics/lobbyArtV3" not in r:
            r = r.replace(import_anchor, import_anchor + "\nimport { drawChibiLobbyTileV3, drawChibiLobbyAtmosphereV3 } from './graphics/lobbyArtV3';", 1)

          # Keep old lobby helpers exported only as compatibility/reference while v3 owns runtime rendering.
          r = r.replace('function drawLobbyWall(', 'export function drawLobbyWall(', 1)
          r = r.replace('function drawLobbyFloor(', 'export function drawLobbyFloor(', 1)
          r = r.replace('function drawLobbyAtmosphere(', 'export function drawLobbyAtmosphere(', 1)

          old_branch = '''  if (theme.deco === 'lobby') {\n    if (wall) {\n      drawLobbyWall(ctx, px, py, x, y, theme, h);\n      if (!cleanStartRoom) drawWallProp(ctx, px, py, theme.deco, h, frame, y === 0, x === 0 || x === ROOM_WIDTH - 1);\n    } else {\n      drawLobbyFloor(ctx, px, py, x, y, theme, h);\n    }\n    return;\n  }'''
          new_branch = '''  if (theme.deco === 'lobby') {\n    drawChibiLobbyTileV3(ctx, x, y, wall, gx, gy, frame);\n    return;\n  }'''
          if old_branch not in r:
            raise SystemExit('Lobby tile branch anchor missing')
          r = r.replace(old_branch, new_branch, 1)
          if "drawLobbyAtmosphere(ctx, frame);" not in r:
            raise SystemExit('Lobby atmosphere anchor missing')
          r = r.replace("drawLobbyAtmosphere(ctx, frame);", "drawChibiLobbyAtmosphereV3(ctx, frame);", 1)
          room.write_text(r, encoding='utf-8')
          PY

      - name: Validate source and graphics
        run: |
          npx tsc --noEmit --noUnusedLocals false --noUnusedParameters false
          npx tsc --noEmit --strict --noUnusedLocals false --noUnusedParameters false \
            --target ES2020 --module ESNext --moduleResolution bundler \
            --lib ES2020,DOM,DOM.Iterable --skipLibCheck \
            src/game/graphics/*.ts src/game/graphics/gpu/*.ts
          grep -q "drawChibiPlayerV3" src/game/render.ts
          grep -q "drawChibiPoliceDuckV3" src/game/render.ts
          grep -q "drawChibiLobbyObstacleV3" src/game/render.ts
          grep -q "drawChibiLobbyTileV3" src/game/roomArt.ts
          ! grep -q "drawChibiPlayerPreview({" src/game/render.ts
          npx vite build --outDir /tmp/duck-heist-v060 --emptyOutDir
          test -s /tmp/duck-heist-v060/index.html

      - name: Promote v0.6.0
        run: |
          npm version 0.6.0 --no-git-tag-version
          printf '0.6.0\n' > VERSION
          rm -rf web-release dist
          mkdir -p web-release
          cp -a /tmp/duck-heist-v060/. web-release/
          node scripts/publish-release.mjs

      - name: Validate promoted release
        run: |
          test -s web-release/index.html
          test -s dist/index.html
          grep -q 'Duck Heist' web-release/index.html
          ! grep -R -q 'v0.4.3' web-release
          grep -q '"version": "0.6.0"' package.json
          grep -q '^0.6.0$' VERSION
          cmp web-release/index.html dist/index.html

      - name: Commit v0.6.0 source and release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A src/game/render.ts src/game/roomArt.ts src/game/graphics/playerChibiPreview.ts src/game/graphics/playerChibiV3.ts src/game/graphics/lobbyArtV3.ts web-release dist VERSION package.json package-lock.json
          if git diff --cached --quiet; then
            echo 'Release already up to date.'
            exit 0
          fi
          git commit -m 'Release Duck Heist v0.6.0 definitive chibi art pass'
          git pull --rebase origin main
          git push origin HEAD:main
