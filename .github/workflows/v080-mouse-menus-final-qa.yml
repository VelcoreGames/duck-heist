name: v0.8.0 mouse-first menus final QA
on:
  push:
    branches: [feature/v080-mouse-first-menu-redesign]
    paths:
      - '.github/workflows/v080-mouse-menus-final-qa.yml'
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v080-mouse-first-menu-redesign
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Browser mouse menu QA
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/duck-menu-final.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in {1..40}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep .25; done
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1191,height:900}});
          const errors=[];
          page.on('pageerror',e=>errors.push(String(e)));
          page.on('console',m=>{if(m.type()==='error')errors.push(m.text());});
          await page.goto('http://127.0.0.1:4173/?auditoria=1',{waitUntil:'networkidle'});
          await page.waitForFunction(()=>window.duckHeistEngine);
          await page.evaluate(()=>{localStorage.clear();const e=window.duckHeistEngine;e.testing=false;e.endlessCheckpointRound=0;e.menuIndex=0;});
          const canvas=page.locator('canvas[role="application"]');
          const pt=async(x,y)=>{const b=await canvas.boundingBox();if(!b)throw new Error('no canvas');return{x:b.x+x/480*b.width,y:b.y+y/352*b.height};};
          const clickWorld=async(x,y)=>{const p=await pt(x,y);await page.mouse.click(p.x,p.y);await page.waitForTimeout(90);};
          const moveWorld=async(x,y)=>{const p=await pt(x,y);await page.mouse.move(p.x,p.y);await page.waitForTimeout(50);};
          const getState=()=>page.evaluate(()=>window.duckHeistEngine.state);
          const expectState=async(expected,label)=>{const got=await getState();if(got!==expected)throw new Error(label+' expected '+expected+' got '+got);};
          const back=()=>clickWorld(74,329);

          await expectState('MENU','initial');
          const initialIndex=await page.evaluate(()=>window.duckHeistEngine.menuIndex);
          await page.keyboard.press('ArrowDown');
          await page.keyboard.press('Enter');
          await page.waitForTimeout(80);
          const keyboardMenu=await page.evaluate(()=>({state:window.duckHeistEngine.state,index:window.duckHeistEngine.menuIndex}));
          if(keyboardMenu.state!=='MENU'||keyboardMenu.index!==initialIndex)throw new Error('keyboard menu navigation active '+JSON.stringify(keyboardMenu));

          await moveWorld(117,74+4*29+13);
          if((await page.evaluate(()=>window.duckHeistEngine.menuIndex))!==4)throw new Error('main hover failed');

          const expected=['DIFFICULTY','DIFFICULTY','DAILY_BRIEF','UPGRADES','WARDROBE','COLLECTION','HOW_TO_PLAY','SETTINGS'];
          for(let i=0;i<8;i++){
            await clickWorld(117,74+i*29+13);
            await expectState(expected[i],'main '+i);
            await back();
            await expectState('MENU','back main '+i);
          }

          await moveWorld(117,74+5*29+13);
          await clickWorld(336,284);
          await expectState('COLLECTION','main CTA');
          await back();
          await expectState('MENU','main CTA back');

          await clickWorld(117,87);
          await expectState('DIFFICULTY','difficulty');
          await clickWorld(339,121);
          const diff=await page.evaluate(()=>({state:window.duckHeistEngine.state,index:window.duckHeistEngine.difficultyIndex}));
          if(diff.state!=='DIFFICULTY'||diff.index!==1)throw new Error('difficulty card mismatch '+JSON.stringify(diff));
          await back();
          await expectState('MENU','difficulty back');

          await clickWorld(117,74+7*29+13);
          await expectState('SETTINGS','settings');
          await page.evaluate(()=>{const e=window.duckHeistEngine;e.settings.master=.5;e.settings.damageNumbers=true;});
          await clickWorld(55,223);
          if(!(await page.evaluate(()=>window.duckHeistEngine.settings.damageNumbers)))throw new Error('settings label changed value');
          await clickWorld(190,223);
          if(await page.evaluate(()=>window.duckHeistEngine.settings.damageNumbers))throw new Error('settings bool button failed');
          await clickWorld(223,95);
          const master=await page.evaluate(()=>window.duckHeistEngine.settings.master);
          if(Math.abs(master-.6)>.001)throw new Error('settings plus failed '+master);

          await clickWorld(400,159);
          await expectState('CONTROLS','controls');
          const beforeControl=await page.evaluate(()=>window.duckHeistEngine.controlIndex);
          await page.keyboard.press('ArrowDown');
          if((await page.evaluate(()=>window.duckHeistEngine.controlIndex))!==beforeControl)throw new Error('keyboard moved controls menu');
          await clickWorld(100,89);
          if(!(await page.evaluate(()=>window.duckHeistEngine.controlCapture)))throw new Error('control capture click failed');
          await back();
          await expectState('SETTINGS','controls back');
          if(await page.evaluate(()=>window.duckHeistEngine.controlCapture))throw new Error('control capture not cancelled by back');
          await back();
          await expectState('MENU','settings back');

          await page.evaluate(()=>{const e=window.duckHeistEngine;e.totalGoldenCrumbs=100;e.metaLevels.hp=0;});
          await clickWorld(117,74+3*29+13);
          await expectState('UPGRADES','upgrades');
          await clickWorld(80,101);
          if((await page.evaluate(()=>window.duckHeistEngine.metaLevels.hp))!==0)throw new Error('upgrade card body purchased');
          await clickWorld(376,101);
          if((await page.evaluate(()=>window.duckHeistEngine.metaLevels.hp))!==1)throw new Error('upgrade action failed');
          await back();
          await expectState('MENU','upgrade back');

          await clickWorld(117,74+5*29+13);
          await expectState('COLLECTION','collection');
          const filter0=await page.evaluate(()=>window.duckHeistEngine.collectionFilter);
          await clickWorld(235,91);
          const filter1=await page.evaluate(()=>window.duckHeistEngine.collectionFilter);
          if(filter1===filter0)throw new Error('collection filter failed');
          const sort0=await page.evaluate(()=>window.duckHeistEngine.collectionSort);
          await clickWorld(318,91);
          const sort1=await page.evaluate(()=>window.duckHeistEngine.collectionSort);
          if(sort1===sort0)throw new Error('collection sort failed');
          await clickWorld(130,68);
          if((await page.evaluate(()=>window.duckHeistEngine.collectionTab))==='items')throw new Error('collection tab failed');
          await clickWorld(407,91);
          await expectState('CAREER','career');
          await clickWorld(411,80);
          if((await page.evaluate(()=>window.duckHeistEngine.careerTab))!==5)throw new Error('career tab failed');
          await clickWorld(96,329);
          await expectState('COLLECTION','career back');
          await back();
          await expectState('MENU','collection back');

          await clickWorld(117,74+6*29+13);
          await expectState('HOW_TO_PLAY','how to');
          await clickWorld(240,190);
          await expectState('HOW_TO_PLAY','how to random click');
          await back();
          await expectState('MENU','how to back');

          await page.evaluate(()=>{const e=window.duckHeistEngine;e.state='PLAYING';e.gameMode='heist';e.onStateChange?.('PLAYING');});
          await clickWorld(374,14);
          await expectState('PAUSED','hud menu');
          const pauseIndex=await page.evaluate(()=>window.duckHeistEngine.pauseIndex);
          await page.keyboard.press('ArrowDown');
          if((await page.evaluate(()=>window.duckHeistEngine.pauseIndex))!==pauseIndex)throw new Error('keyboard moved pause menu');

          await clickWorld(138,134);
          await expectState('RUN_INFO','run info');
          await clickWorld(343,82);
          if((await page.evaluate(()=>window.duckHeistEngine.runInfoTab))!==1)throw new Error('run info tab failed');
          await clickWorld(91,329);
          await expectState('PAUSED','run info back');

          await clickWorld(338,91);
          await expectState('MAP','map');
          await clickWorld(240,200);
          await expectState('MAP','map inspect');
          await clickWorld(404,329);
          await expectState('PAUSED','map close');

          await clickWorld(338,134);
          await expectState('CONFIRM','restart confirm');
          await clickWorld(155,247);
          await expectState('PAUSED','cancel confirm');

          await clickWorld(138,91);
          await expectState('PLAYING','resume');

          const overflow=await page.evaluate(()=>({x:document.documentElement.scrollWidth>innerWidth,y:document.documentElement.scrollHeight>innerHeight}));
          if(overflow.x||overflow.y)throw new Error('document overflow '+JSON.stringify(overflow));
          if(errors.length)throw new Error('runtime errors '+errors.join(' | '));

          console.log(JSON.stringify({keyboardMenu,master,filter1,sort1,finalState:await getState()},null,2));
          await browser.close();
          JS
      - name: Cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/v080-mouse-menus-final-qa.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'chore: remove temporary final mouse menu QA'
            git push origin HEAD:feature/v080-mouse-first-menu-redesign
          fi
