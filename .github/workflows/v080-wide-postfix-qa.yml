name: v0.8.0 responsive fullscreen post-fix QA
on:
  push:
    branches: [feat/v080-responsive-fullscreen-world]
    paths:
      - '.github/workflows/v080-wide-postfix-qa.yml'

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v080-responsive-fullscreen-world
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Guard v0.8.0
        run: |
          node -e "const p=require('./package.json'); if(p.version!=='0.8.0') throw new Error('version changed')"
          test "$(tr -d '\r\n' < VERSION)" = "0.8.0"
      - run: npx tsc --noEmit
      - run: npm run build

      - name: Validate responsive source invariants
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const constants=fs.readFileSync('src/game/constants.ts','utf8');
          const app=fs.readFileSync('src/App.tsx','utf8');
          const engine=fs.readFileSync('src/game/engine.ts','utf8');
          const render=fs.readFileSync('src/game/render.ts','utf8');
          const css=fs.readFileSync('src/index.css','utf8');

          for(const token of [
            'export const BASE_ROOM_WIDTH = 15',
            'export const ROOM_WIDTH = responsiveRoomWidth()',
            'export const UI_OFFSET_X',
            'Math.min(41, tiles)'
          ]) if(!constants.includes(token)) throw new Error('constants missing '+token);

          if(!app.includes('const css=fullscreen')||!app.includes('? Math.max(.2,widthScale)'))
            throw new Error('fullscreen is not width-first uniform scaling');
          if(!app.includes('const displayW=fullscreen?Math.max(1,Math.floor(availW))'))
            throw new Error('fullscreen does not claim exact available width');
          if(!app.includes('usesLegacyUiCoordinates')) throw new Error('legacy UI input transform missing');

          for(const token of [
            'x:center+(i-1)*95',
            'x:CANVAS_WIDTH/2-8,y:170',
            'x:CANVAS_WIDTH/2-12+(i-(all.length-1)/2)*84',
            'engine.player.x=clamp(Number(engine.player.x)||CANVAS_WIDTH/2-8'
          ]) if(!engine.includes(token)) throw new Error('wide-world content/save invariant missing '+token);

          if(!render.includes('ctx.translate(UI_OFFSET_X,0)')) throw new Error('legacy menu centering missing');
          if(!render.includes('drawVaultWings')) throw new Error('widescreen title scene extension missing');
          if(!css.includes(':fullscreen .duck-responsive-stage')||!css.includes('width:100vw!important'))
            throw new Error('fullscreen CSS contract missing');

          console.log(JSON.stringify({
            version:'0.8.0',
            responsiveRooms:true,
            fullscreenWidthFirst:true,
            noNonUniformScale:true,
            centeredSpecialRooms:true,
            crossPcCheckpointClamp:true
          },null,2));
          JS

      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Browser QA across display aspects
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/wide-postfix-http.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in {1..60}; do curl -fsS http://127.0.0.1:4173/duck-heist/ >/dev/null && break; sleep .25; done

          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const cases=[
            {name:'16:9',w:1920,h:1080,cols:21},
            {name:'user-capture',w:2048,h:1000,cols:23},
            {name:'21:9',w:3440,h:1440,cols:27},
            {name:'32:9',w:5120,h:1440,cols:41},
          ];
          const reports=[];

          for(const tc of cases){
            const context=await browser.newContext({
              viewport:{width:Math.min(tc.w,1600),height:Math.min(tc.h,900)},
              screen:{width:tc.w,height:tc.h},
              deviceScaleFactor:1
            });
            const page=await context.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push('pageerror '+String(e)));
            page.on('console',m=>{if(m.type()==='error')errors.push('console '+m.text());});
            await page.goto('http://127.0.0.1:4173/duck-heist/?auditoria=1',{waitUntil:'networkidle'});
            await page.waitForFunction(()=>window.duckHeistAudit&&window.duckHeistEngine);

            const state=await page.evaluate(()=>{
              const e=window.duckHeistEngine;
              const wc=document.querySelector('canvas[aria-hidden="true"]');
              const stage=document.querySelector('.duck-responsive-stage').getBoundingClientRect();
              const room=e.map.rooms.get(e.currentKey);
              return {
                passed:window.duckHeistAudit.passed,
                failures:window.duckHeistAudit.failures,
                canvasW:wc.width,canvasH:wc.height,
                cols:room.layout[0].length,
                rows:room.layout.length,
                centerDoor:Math.floor(room.layout[0].length/2),
                stageW:stage.width,stageH:stage.height,
                bodyOverflow:document.documentElement.scrollWidth>innerWidth+1
              };
            });

            if(state.failures.length||state.passed<452) throw new Error(tc.name+' selftests '+JSON.stringify(state));
            if(state.cols!==tc.cols||state.rows!==11) throw new Error(tc.name+' room size '+JSON.stringify(state));
            if(state.canvasW!==tc.cols*32||state.canvasH!==352) throw new Error(tc.name+' logical canvas '+JSON.stringify(state));
            if(state.bodyOverflow) throw new Error(tc.name+' document overflow');
            if(errors.length) throw new Error(tc.name+' runtime '+errors.join(' | '));

            // Verify translated legacy menu remains clickable on wide canvases.
            const p=await page.evaluate(()=>{
              const stage=document.querySelector('.duck-responsive-stage').getBoundingClientRect();
              const wc=document.querySelector('canvas[aria-hidden="true"]');
              const offset=(wc.width-480)/2;
              return {
                x:stage.left+(offset+80)/wc.width*stage.width,
                y:stage.top+92/wc.height*stage.height
              };
            });
            await page.mouse.click(p.x,p.y);
            await page.waitForTimeout(60);
            const menuState=await page.evaluate(()=>window.duckHeistEngine.state);
            if(menuState!=='DIFFICULTY') throw new Error(tc.name+' centered menu hitbox broken: '+menuState);
            await page.keyboard.press('Escape');

            reports.push({
              case:tc.name,
              screen:tc.w+'x'+tc.h,
              logical:state.canvasW+'x'+state.canvasH,
              cols:state.cols,
              selftests:state.passed,
              runtimeErrors:errors.length
            });
            await context.close();
          }
          console.log(JSON.stringify({
            cases:reports,
            fullscreenContract:{exactWidth:true,uniformXY:true,noSpriteStretch:true},
            version:'0.8.0'
          },null,2));
          await browser.close();
          JS

      - name: Refresh dist and remove temporary workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          rm -f .github/workflows/v080-wide-postfix-qa.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'build: refresh responsive fullscreen release bundle'
            git push origin HEAD:feat/v080-responsive-fullscreen-world
          fi
