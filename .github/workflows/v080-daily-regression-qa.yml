name: v0.8.0 daily challenge regression QA
on:
  push:
    branches: [feature/v080-daily-challenge]
    paths:
      - '.github/workflows/v080-daily-regression-qa.yml'
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: feature/v080-daily-challenge, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Held fire plus dash regression
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/daily-regression.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in {1..40}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep .25; done
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1191,height:900}});
          const errors=[];page.on('pageerror',e=>errors.push(String(e)));
          await page.goto('http://127.0.0.1:4173/?auditoria=1',{waitUntil:'networkidle'});
          await page.waitForFunction(()=>window.duckHeistEngine);
          await page.evaluate(()=>{const e=window.duckHeistEngine;e.testing=false;e.menuIndex=2;});
          await page.keyboard.press('Enter');await page.waitForFunction(()=>window.duckHeistEngine.state==='DAILY_BRIEF');
          await page.keyboard.press('Enter');await page.waitForFunction(()=>window.duckHeistEngine.state==='PLAYING',{timeout:6500});
          const canvas=page.locator('canvas[role="application"]'),box=await canvas.boundingBox();
          if(!box)throw new Error('missing canvas');
          await page.evaluate(()=>{const e=window.duckHeistEngine;e.player.dashCooldown=0;e.player.dashTimer=0;e.transition.active=false;e.player.fireCooldown=0;e.projectiles=[];});
          await page.mouse.move(box.x+box.width*.72,box.y+box.height*.52);
          await page.mouse.down({button:'left'});await page.waitForTimeout(90);
          const before=await page.evaluate(()=>window.duckHeistEngine.projectiles.length);
          await page.evaluate(()=>{
            const canvas=document.querySelector('canvas[role="application"]'),r=canvas.getBoundingClientRect();
            canvas.dispatchEvent(new MouseEvent('mousedown',{button:2,buttons:3,bubbles:true,cancelable:true,clientX:r.left+r.width*.72,clientY:r.top+r.height*.52}));
          });
          await page.waitForTimeout(70);
          const v=await page.evaluate(()=>({mouseDown:window.duckHeistEngine.mouseDown,dash:window.duckHeistEngine.player.dashTimer,shots:window.duckHeistEngine.projectiles.length}));
          await page.mouse.up({button:'left'});
          if(!v.mouseDown||v.dash<=0||v.shots<before)throw new Error('dash/fire regression '+JSON.stringify({before,...v}));
          if(errors.length)throw new Error(errors.join(' | '));
          console.log(JSON.stringify({before,...v}));
          await browser.close();
          JS
      - name: Cleanup
        if: always()
        shell: bash
        run: |
          rm -f .github/workflows/v080-daily-regression-qa.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'chore: remove temporary daily regression QA'
            git push origin HEAD:feature/v080-daily-challenge
          fi
