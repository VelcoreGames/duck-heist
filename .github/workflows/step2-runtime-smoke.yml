name: Step 2 runtime smoke
on:
  push:
    branches: [step2-boss-redesign]
    paths:
      - '.github/workflows/step2-runtime-smoke.yml'
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: step2-boss-redesign
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save --package-lock=false playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Browser smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/duck-step2-server.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in {1..40}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep .25; done
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1191,height:900}});
          const errors=[];
          page.on('pageerror',e=>errors.push(String(e)));
          page.on('console',m=>{if(m.type()==='error') errors.push(m.text());});
          await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
          await page.waitForFunction(()=>document.querySelectorAll('canvas').length>=2);
          await page.waitForTimeout(400);
          const menu=await page.screenshot();
          await page.keyboard.press('Enter');
          await page.waitForTimeout(250);
          const diff=await page.screenshot();
          if(menu.equals(diff)) throw new Error('Difficulty screen did not change');
          await page.keyboard.press('Enter');
          await page.waitForTimeout(4300);
          const state=await page.evaluate(()=>({
            title:document.title,
            canvases:[...document.querySelectorAll('canvas')].map(c=>({w:c.width,h:c.height,rect:c.getBoundingClientRect().toJSON()})),
            text:document.body.innerText,
            overflowX:document.documentElement.scrollWidth>innerWidth,
            overflowY:document.documentElement.scrollHeight>innerHeight,
          }));
          if(errors.length) throw new Error('Runtime errors: '+errors.join(' | '));
          if(state.overflowX||state.overflowY) throw new Error('Unexpected page overflow');
          console.log(JSON.stringify(state,null,2));
          await browser.close();
          JS
      - name: Cleanup workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/step2-runtime-smoke.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: remove temporary Step 2 runtime smoke'
          git push origin HEAD:step2-boss-redesign
