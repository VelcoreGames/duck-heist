name: v0.8.0 controls career archive QA
on:
  push:
    branches: [feature/v080-controls-career-archive]
    paths:
      - '.github/workflows/v080-controls-career-archive-qa.yml'
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v080-controls-career-archive
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
      - name: Version and feature invariants
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = "0.8.0"
          grep -Fq '"version": "0.8.0"' package.json
          grep -Fq "const VERSION = 'v0.8.0';" dist/index.html
          grep -Fq "CONFIGURAR CONTROLES" src/game/engine.ts
          grep -Fq "PRESET ACCESIBLE" src/game/engine.ts
          grep -Fq "EXPEDIENTE DE CARRERA" src/game/careerUI.ts
          grep -Fq "cycleCollectionFilter" src/game/collectionUI.ts
          grep -Fq "recordRun(engine,'death')" src/game/engine.ts
          grep -Fq "recordRun(engine,'victory')" src/game/engine.ts
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Functional browser QA
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/duck-next-menu.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in {1..40}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep .25; done
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1191,height:900}});
          const errors=[];
          page.on('pageerror',e=>errors.push(String(e)));
          page.on('console',m=>{if(m.type()==='error')errors.push(m.text());});
          await page.goto('http://127.0.0.1:4173/?auditoria=1',{waitUntil:'networkidle'});
          await page.waitForFunction(()=>window.duckHeistEngine && document.querySelectorAll('canvas').length>=2);
          const read=()=>page.evaluate(()=>({
            state:window.duckHeistEngine.state,
            bindings:{...window.duckHeistEngine.bindings},
            settings:{...window.duckHeistEngine.settings},
            filter:window.duckHeistEngine.collectionFilter,
            sort:window.duckHeistEngine.collectionSort,
            career:{...window.duckHeistEngine.career},
            history:[...window.duckHeistEngine.runHistory],
            overflowX:document.documentElement.scrollWidth>innerWidth,
            overflowY:document.documentElement.scrollHeight>innerHeight
          }));
          const assertNoOverflow=async label=>{const v=await read();if(v.overflowX||v.overflowY)throw new Error(label+' overflow');return v;};

          // Settings -> controls.
          await page.evaluate(()=>window.duckHeistEngine.menuIndex=6);
          await page.keyboard.press('Enter');
          await page.waitForFunction(()=>window.duckHeistEngine.state==='SETTINGS');
          await page.evaluate(()=>window.duckHeistEngine.settingsIndex=8);
          await page.keyboard.press('Enter');
          await page.waitForFunction(()=>window.duckHeistEngine.state==='CONTROLS');
          await assertNoOverflow('controls');

          // Remap move up W -> Q.
          await page.evaluate(()=>window.duckHeistEngine.controlIndex=0);
          await page.keyboard.press('Enter');
          await page.keyboard.press('q');
          let v=await read();
          if(v.bindings.moveUp!=='q')throw new Error('moveUp remap failed');

          // Remap shoot up ArrowUp -> Z.
          await page.evaluate(()=>window.duckHeistEngine.controlIndex=4);
          await page.keyboard.press('Enter');
          await page.keyboard.press('z');
          v=await read();
          if(v.bindings.shootUp!=='z')throw new Error('shootUp remap failed');

          // Back to settings, activate accessible preset.
          await page.keyboard.press('Escape');
          await page.waitForFunction(()=>window.duckHeistEngine.state==='SETTINGS');
          await page.evaluate(()=>window.duckHeistEngine.settingsIndex=7);
          await page.keyboard.press('Enter');
          v=await read();
          if(!v.settings.reduceMotion||!v.settings.highContrast||v.settings.shake!==0||v.settings.uiScale!==3)throw new Error('accessible preset failed');
          const persisted=await page.evaluate(()=>JSON.parse(localStorage.getItem('duckheist_save')||'{}'));
          if(persisted?.bindings?.moveUp!=='q'||persisted?.bindings?.shootUp!=='z')throw new Error('bindings not persisted');

          // Return menu and verify collection tools.
          await page.keyboard.press('Escape');
          await page.waitForFunction(()=>window.duckHeistEngine.state==='MENU');
          await page.evaluate(()=>window.duckHeistEngine.menuIndex=4);
          await page.keyboard.press('Enter');
          await page.waitForFunction(()=>window.duckHeistEngine.state==='COLLECTION');
          const f0=(await read()).filter,s0=(await read()).sort;
          await page.keyboard.press('q');
          await page.keyboard.press('e');
          v=await read();
          if(v.filter===f0||v.sort===s0)throw new Error('collection filter/sort did not change');
          await page.keyboard.press('p');
          await page.waitForFunction(()=>window.duckHeistEngine.state==='CAREER');
          await assertNoOverflow('career');
          await page.keyboard.press('ArrowRight');
          if((await page.evaluate(()=>window.duckHeistEngine.careerTab))!==1)throw new Error('career history tab unreachable');
          await page.keyboard.press('Escape');
          await page.waitForFunction(()=>window.duckHeistEngine.state==='COLLECTION');
          await page.keyboard.press('Escape');
          await page.waitForFunction(()=>window.duckHeistEngine.state==='MENU');

          // Start normal game.
          await page.evaluate(()=>window.duckHeistEngine.menuIndex=0);
          await page.keyboard.press('Enter');
          await page.waitForFunction(()=>window.duckHeistEngine.state==='DIFFICULTY');
          await page.keyboard.press('Enter');
          await page.waitForTimeout(1800);
          if((await page.evaluate(()=>window.duckHeistEngine.state))==='HEIST_INTRO'){
            await page.keyboard.press('Enter');await page.waitForTimeout(1200);
          }
          await page.waitForFunction(()=>window.duckHeistEngine.state==='PLAYING',{timeout:6000});

          // Remapped movement works.
          const y0=await page.evaluate(()=>window.duckHeistEngine.player.y);
          await page.keyboard.down('q');await page.waitForTimeout(220);await page.keyboard.up('q');
          const y1=await page.evaluate(()=>window.duckHeistEngine.player.y);
          if(!(y1<y0))throw new Error('remapped movement did not move up');

          // Remapped directional shooting works.
          await page.evaluate(()=>{const e=window.duckHeistEngine;e.player.fireCooldown=0;e.projectiles=[];});
          await page.keyboard.down('z');await page.waitForTimeout(120);await page.keyboard.up('z');
          const shots=await page.evaluate(()=>window.duckHeistEngine.projectiles.length);
          if(shots<1)throw new Error('remapped shooting did not fire');

          // Held mouse fire + right-click dash still works.
          const canvas=page.locator('canvas[role="application"]'),box=await canvas.boundingBox();
          if(!box)throw new Error('no canvas');
          await page.evaluate(()=>{const e=window.duckHeistEngine;e.player.dashCooldown=0;e.player.dashTimer=0;e.transition.active=false;});
          await page.mouse.move(box.x+box.width*.72,box.y+box.height*.52);
          await page.mouse.down({button:'left'});await page.waitForTimeout(80);
          await page.evaluate(()=>{
            const canvas=document.querySelector('canvas[role="application"]'),rect=canvas.getBoundingClientRect();
            canvas.dispatchEvent(new MouseEvent('mousedown',{button:2,buttons:3,bubbles:true,cancelable:true,clientX:rect.left+rect.width*.72,clientY:rect.top+rect.height*.52}));
          });
          await page.waitForTimeout(50);
          const dash=await page.evaluate(()=>({mouseDown:window.duckHeistEngine.mouseDown,dash:window.duckHeistEngine.player.dashTimer}));
          await page.mouse.up({button:'left'});
          if(!dash.mouseDown||dash.dash<=0)throw new Error('dash/fire regression');

          // Real death records career + history once.
          const runs0=await page.evaluate(()=>window.duckHeistEngine.career.runs);
          await page.evaluate(()=>{window.duckHeistEngine.player.hp=0;});
          await page.waitForFunction(()=>window.duckHeistEngine.state==='GAME_OVER',{timeout:4000});
          v=await read();
          if(v.career.runs!==runs0+1)throw new Error('career run not recorded');
          if(v.history[0]?.outcome!=='death')throw new Error('death history entry missing');
          if(v.history.length<1)throw new Error('history empty');

          // Career screen can display recorded data.
          await page.keyboard.press('Escape');
          await page.waitForFunction(()=>window.duckHeistEngine.state==='MENU');
          await page.evaluate(()=>window.duckHeistEngine.menuIndex=4);
          await page.keyboard.press('Enter');
          await page.waitForFunction(()=>window.duckHeistEngine.state==='COLLECTION');
          await page.keyboard.press('p');
          await page.waitForFunction(()=>window.duckHeistEngine.state==='CAREER');
          await assertNoOverflow('career recorded');

          if(errors.length)throw new Error('Runtime errors: '+errors.join(' | '));
          console.log(JSON.stringify({bindings:v.bindings,settings:v.settings,career:v.career,historyHead:v.history[0],dash,shots},null,2));
          await browser.close();
          JS
      - name: Cleanup temporary QA
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/v080-controls-career-archive-qa.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'chore: remove temporary v0.8.0 controls career QA'
            git push origin HEAD:feature/v080-controls-career-archive
          fi
