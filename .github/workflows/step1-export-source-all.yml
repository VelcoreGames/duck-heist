name: Step 1 export full source

on:
  push:
    branches: [step1-source-sync]
    paths:
      - '.github/workflows/step1-export-source-all.yml'

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload current source tree
        uses: actions/upload-artifact@v4
        with:
          name: step1-full-source
          path: |
            src
            package.json
            package-lock.json
            tsconfig.json
            vite.config.ts
            index.html
            public
          retention-days: 1
