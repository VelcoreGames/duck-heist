name: Publish Duck Heist v0.7.40 Chibi V16 Hero Pass

on:
  push:
    paths:
      - '.github/workflows/publish-v0740-chibi-v16-hero-pass.yml'
      - 'scripts/patch-v0740-v16-hero-pass.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: pip install --disable-pip-version-check pillow

      - name: Apply V16.2 hero pass and regenerate atlas
        run: |
          python scripts/patch-v0740-v16-hero-pass.py
          python scripts/generate-player-chibi-v16.py

      - name: Validate all authored frames and build visual contact sheets
        run: |
          mkdir -p /tmp/v0740-art-qa
          python - <<'PY'
          from PIL import Image, ImageDraw
          from pathlib import Path

          src=Path('src/assets/chibi/base-duck-chibi-v16-atlas.png')
          im=Image.open(src).convert('RGBA'); im.load()
          assert im.size==(7424,256),im.size
          starts={'idle':0,'walk':12,'shoot':32,'dash':44,'hurt':60,'down':68,'interact':88,'celebrate':100}
          counts={'idle':12,'walk':20,'shoot':12,'dash':16,'hurt':8,'down':20,'interact':12,'celebrate':16}
          dirs=['down','up','left','right']
          worst=[]; nonempty=0
          for r in range(4):
              for c in range(116):
                  a=im.crop((c*64,r*64,(c+1)*64,(r+1)*64)).getchannel('A')
                  mask=a.point(lambda v:255 if v>64 else 0)
                  b=mask.getbbox(); assert b,(r,c)
                  nonempty+=1
                  if b[0] < 1 or b[1] < 1 or b[2] > 63 or b[3] > 63:
                      worst.append((r,c,b))
          assert nonempty==464,nonempty
          assert not worst,worst[:20]

          scale=3; cell=64*scale; labelw=112; top=34
          for r,direction in enumerate(dirs):
              sheet=Image.new('RGB',(labelw+cell*3,top+cell*len(starts)),(24,25,30))
              draw=ImageDraw.Draw(sheet)
              draw.text((8,8),f'V16.2 {direction} — start / middle / end',fill=(244,220,150))
              for row,(state,start) in enumerate(starts.items()):
                  count=counts[state]
                  idxs=[0,count//2,count-1]
                  y=top+row*cell
                  draw.text((8,y+cell//2-6),state,fill=(235,235,235))
                  for col,i in enumerate(idxs):
                      fr=im.crop(((start+i)*64,r*64,(start+i+1)*64,(r+1)*64))
                      tile=Image.new('RGBA',(64,64),(235,226,205,255)); tile.alpha_composite(fr)
                      tile=tile.convert('RGB').resize((cell,cell),Image.Resampling.NEAREST)
                      sheet.paste(tile,(labelw+col*cell,y))
              sheet.save(f'/tmp/v0740-art-qa/{direction}.png')
          im.save('/tmp/v0740-art-qa/base-duck-chibi-v16-atlas.png')
          print('validated 464 V16.2 frames, no meaningful-alpha clipping, contact sheets generated')
          PY
          grep -q "Smooth clean crown: the base duck has no hair, hat or eyewear" scripts/generate-player-chibi-v16.py
          ! grep -q 'tiny crown feathers' scripts/generate-player-chibi-v16.py
          grep -q 'const DRAW = 42' src/game/graphics/playerChibiAtlasV16.ts
          grep -q 'strideDistance = vertical ? 32 : 38' src/game/graphics/playerChibiAtlasV16.ts
          grep -q 'for (let i = 3; i >= 1; i--)' src/game/graphics/playerChibiAtlasV16.ts
          grep -q '0.7.40-chibi-v16-hero-pass' index.html

      - name: Upload authored visual QA
        uses: actions/upload-artifact@v4
        with:
          name: duck-heist-v0740-authored-art-qa
          path: /tmp/v0740-art-qa
          retention-days: 7

      - name: Validate TypeScript and production build
        run: |
          npx tsc --noEmit
          npx vite build --outDir /tmp/duck-heist-v0740 --emptyOutDir
          test -s /tmp/duck-heist-v0740/index.html
          grep -q '0.7.40-chibi-v16-hero-pass' /tmp/duck-heist-v0740/index.html
          grep -q '464-raster-chibi-v16' /tmp/duck-heist-v0740/index.html
          grep -q 'canvas2d-chibi-atlas-v16' /tmp/duck-heist-v0740/index.html

      - name: Promote v0.7.40
        run: |
          npm version 0.7.40 --no-git-tag-version
          printf '0.7.40\n' > VERSION
          rm -rf web-release dist
          mkdir -p web-release
          cp -a /tmp/duck-heist-v0740/. web-release/
          node scripts/publish-release.mjs

      - name: Validate promoted release
        run: |
          test -s web-release/index.html
          test -s dist/index.html
          grep -q '"version": "0.7.40"' package.json
          grep -q '^0.7.40$' VERSION
          grep -q '0.7.40-chibi-v16-hero-pass' web-release/index.html
          grep -q '464-raster-chibi-v16' web-release/index.html
          cmp web-release/index.html dist/index.html

      - name: Commit v0.7.40 to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A scripts/generate-player-chibi-v16.py src/game/graphics/playerChibiAtlasV16.ts src/assets/chibi/base-duck-chibi-v16-atlas.png index.html web-release dist VERSION package.json package-lock.json
          git commit -m 'Release Duck Heist v0.7.40 chibi V16 hero pass'
          git pull --rebase origin main
          git push origin HEAD:main
