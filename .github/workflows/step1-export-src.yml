name: Step 1 export current source

on:
  push:
    branches: [step1-source-sync]
    paths:
      - '.github/workflows/step1-export-src.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: step1-source-sync
      - name: Upload current source
        uses: actions/upload-artifact@v4
        with:
          name: step1-current-src
          path: |
            src
            index.html
            package.json
            tsconfig.json
            vite.config.ts
          retention-days: 1
