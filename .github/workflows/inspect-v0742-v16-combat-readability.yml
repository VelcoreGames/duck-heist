name: Inspect Duck Heist v0.7.42 V16 Combat Readability

on:
  push:
    paths:
      - '.github/workflows/inspect-v0742-v16-combat-readability.yml'
      - 'scripts/patch-v0742-v16-combat-readability.py'
      - 'scripts/patch-v0742-clipping-margin.py'
      - 'scripts/patch-v0742-depth-perspective-polish.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: pip install --disable-pip-version-check pillow

      - name: Apply candidate art/runtime pass
        run: |
          python scripts/patch-v0742-v16-combat-readability.py
          python scripts/patch-v0742-clipping-margin.py
          python scripts/patch-v0742-depth-perspective-polish.py
          python scripts/generate-player-chibi-v16.py

      - name: Validate atlas margins and create review sheets
        run: |
          mkdir -p /tmp/v0742-review
          python - <<'PY'
          from PIL import Image, ImageDraw
          im=Image.open('src/assets/chibi/base-duck-chibi-v16-atlas.png').convert('RGBA'); im.load()
          assert im.size==(7424,256),im.size
          starts={'idle':0,'walk':12,'shoot':32,'dash':44,'hurt':60,'down':68,'interact':88,'celebrate':100}
          counts={'idle':12,'walk':20,'shoot':12,'dash':16,'hurt':8,'down':20,'interact':12,'celebrate':16}
          dirs=['down','up','left','right']
          bad=[]
          for r in range(4):
            for c in range(116):
              a=im.crop((c*64,r*64,(c+1)*64,(r+1)*64)).getchannel('A')
              b=a.point(lambda v:255 if v>64 else 0).getbbox(); assert b,(r,c)
              if b[0]<1 or b[1]<1 or b[2]>63 or b[3]>63: bad.append((r,c,b))
          assert not bad,bad[:20]

          scale=4; cell=64*scale; labelw=122; top=38
          for r,direction in enumerate(dirs):
            sheet=Image.new('RGB',(labelw+cell*3,top+cell*len(starts)),(24,25,30)); d=ImageDraw.Draw(sheet)
            d.text((8,9),f'V16.4 {direction} — start / middle / end',fill=(244,220,150))
            for row,(state,start) in enumerate(starts.items()):
              n=counts[state]; ids=[0,n//2,n-1]; y=top+row*cell
              d.text((8,y+cell//2-6),state,fill=(235,235,235))
              for col,i in enumerate(ids):
                fr=im.crop(((start+i)*64,r*64,(start+i+1)*64,(r+1)*64))
                tile=Image.new('RGBA',(64,64),(235,226,205,255)); tile.alpha_composite(fr)
                sheet.paste(tile.convert('RGB').resize((cell,cell),Image.Resampling.NEAREST),(labelw+col*cell,y))
            sheet.save(f'/tmp/v0742-review/{direction}.png')

            start=starts['shoot']; n=counts['shoot']; ids=[0,2,4,6,8,11]
            strip=Image.new('RGB',(cell*len(ids),cell),(235,226,205))
            for col,i in enumerate(ids):
              fr=im.crop(((start+i)*64,r*64,(start+i+1)*64,(r+1)*64))
              tile=Image.new('RGBA',(64,64),(235,226,205,255)); tile.alpha_composite(fr)
              strip.paste(tile.convert('RGB').resize((cell,cell),Image.Resampling.NEAREST),(col*cell,0))
            strip.save(f'/tmp/v0742-review/{direction}-shoot-sequence.png')
          im.save('/tmp/v0742-review/base-duck-chibi-v16-atlas.png')
          print('candidate atlas validated: 464 frames, no meaningful-alpha clipping')
          PY
          grep -q 'front_gun_layer' scripts/generate-player-chibi-v16.py
          grep -q 'rear_gun_layer' scripts/generate-player-chibi-v16.py
          grep -q "no hair, hat or eyewear" scripts/generate-player-chibi-v16.py
          grep -q '0.7.42-chibi-v16-combat-readability' index.html

      - name: Validate TypeScript and candidate build
        run: |
          npx tsc --noEmit
          npx vite build --outDir /tmp/v0742-build --emptyOutDir
          grep -q '0.7.42-chibi-v16-combat-readability' /tmp/v0742-build/index.html
          grep -q '464-raster-chibi-v16' /tmp/v0742-build/index.html
          grep -q 'canvas2d-chibi-atlas-v16' /tmp/v0742-build/index.html

      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify candidate in game
        run: |
          mkdir -p /tmp/v0742-ingame
          cd /tmp/v0742-build
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/v0742-http.log 2>&1 &
          echo $! >/tmp/v0742-http.pid
          cd "$GITHUB_WORKSPACE"
          node <<'NODE'
          const { chromium }=require('playwright');
          const fs=require('fs'),assert=require('assert');
          const out='/tmp/v0742-ingame', expected='0.7.42-chibi-v16-combat-readability';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const errors=[],failed=[],bad=[],samples={};
          async function ds(p){return p.evaluate(()=>({build:document.querySelector('meta[name="duck-heist-build"]')?.content||'',renderer:document.documentElement.dataset.duckHeistPlayerRenderer||'',frames:document.documentElement.dataset.duckHeistPlayerFrames||'',state:document.documentElement.dataset.duckHeistPlayerState||'',visualFrame:document.documentElement.dataset.duckHeistPlayerVisualFrame||''}));}
          async function start(p){
            await p.goto(`http://127.0.0.1:4173/?qa=v0742-candidate&t=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:60000});await sleep(1800);
            assert.strictEqual((await ds(p)).build,expected);
            const c=p.locator('canvas[role="application"]');assert.strictEqual(await c.count(),1);await c.focus();await p.keyboard.press('Enter');
            for(let i=0;i<5;i++){await sleep(850);const d=await ds(p);if(d.renderer==='canvas2d-chibi-atlas-v16'&&d.frames==='464-raster-chibi-v16')break;await p.keyboard.press('Enter');}
            await sleep(3000);assert.strictEqual((await ds(p)).state,'idle');
          }
          async function move(p,key,label){await p.keyboard.down(key);await sleep(150);const a=await ds(p);await sleep(330);const b=await ds(p);await p.screenshot({path:`${out}/${label}.png`,fullPage:true});await p.keyboard.up(key);await sleep(180);assert.strictEqual(a.state,'walk');assert.strictEqual(b.state,'walk');assert.notStrictEqual(a.visualFrame,b.visualFrame);return {a,b};}
          async function shoot(p,key,label){await p.keyboard.down(key);let found=null;for(let i=0;i<35;i++){await sleep(16);const d=await ds(p);if(d.state==='shoot'){found=d;break;}}assert(found,`${label}: shoot state not observed`);await p.screenshot({path:`${out}/${label}.png`,fullPage:true});await p.keyboard.up(key);await sleep(420);return found;}
          (async()=>{
            const browser=await chromium.launch({headless:true});const context=await browser.newContext({viewport:{width:1440,height:1000},deviceScaleFactor:1});const p=await context.newPage();
            p.on('console',m=>{if(m.type()==='error')errors.push(m.text())});p.on('pageerror',e=>errors.push(e.message));p.on('requestfailed',r=>failed.push(`${r.method()} ${r.url()} ${r.failure()?.errorText||''}`));p.on('response',r=>{if(r.status()>=400)bad.push(`${r.status()} ${r.url()}`)});
            await start(p);samples.idle=await ds(p);await p.screenshot({path:`${out}/01-idle.png`,fullPage:true});
            samples.up=await move(p,'w','02-walk-up');samples.down=await move(p,'s','03-walk-down');samples.right=await move(p,'d','04-walk-right');
            await p.keyboard.down('d');await sleep(90);await p.keyboard.press('Shift');await sleep(55);samples.dash=await ds(p);assert.strictEqual(samples.dash.state,'dash');await p.screenshot({path:`${out}/05-dash-right.png`,fullPage:true});await p.keyboard.up('d');await sleep(900);
            await start(p);samples.shootRight=await shoot(p,'ArrowRight','06-shoot-right');samples.shootDown=await shoot(p,'ArrowDown','07-shoot-down');samples.shootUp=await shoot(p,'ArrowUp','08-shoot-up');samples.final=await ds(p);
            assert.strictEqual(samples.final.renderer,'canvas2d-chibi-atlas-v16');assert.strictEqual(samples.final.frames,'464-raster-chibi-v16');assert.strictEqual(errors.length,0,errors.join(' | '));assert.strictEqual(failed.length,0,failed.join(' | '));assert.strictEqual(bad.length,0,bad.join(' | '));
            fs.writeFileSync(`${out}/qa.json`,JSON.stringify({samples,errors,failed,bad},null,2));await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          kill "$(cat /tmp/v0742-http.pid)" || true

      - name: Upload candidate review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duck-heist-v0742-candidate-review
          path: |
            /tmp/v0742-review
            /tmp/v0742-ingame
          if-no-files-found: warn
          retention-days: 7
