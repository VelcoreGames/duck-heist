name: v0.8.0 Boss roster compile gate
on:
  push:
    branches: [feature/v080-boss-roster-expansion]
    paths:
      - '.github/workflows/v080-boss-roster-compile.yml'
permissions:
  contents: write
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v080-boss-roster-expansion
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Version guard
        run: node -e "const p=require('./package.json'); if(p.version!=='0.8.0') throw new Error('version changed')"
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          rm -f .github/workflows/v080-boss-roster-compile.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'build: refresh expanded boss roster bundle'
            git push origin HEAD:feature/v080-boss-roster-expansion
          fi
