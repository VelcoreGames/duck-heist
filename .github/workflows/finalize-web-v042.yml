name: Finalize Duck Heist web v0.4.2

on:
  push:
    paths:
      - '.github/workflows/finalize-web-v042.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Build neutral web release
        run: |
          set -euxo pipefail
          rm -rf web-release
          cp -R appdeploy-live web-release
          mkdir -p scripts
          cat > scripts/publish-release.mjs <<'EOF'
          import { cpSync, rmSync } from 'node:fs';

          rmSync('dist', { recursive: true, force: true });
          cpSync('web-release', 'dist', { recursive: true });
          console.log('Duck Heist web release copied to dist/');
          EOF

      - name: Patch v0.4.2 gameplay release
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          js_path = Path('web-release/assets/index-BgUNQzP_.js')
          js = js_path.read_text(encoding='utf-8')

          if 'DH_V0_4_2_BLINK' not in js:
              old = '''for(const b of f.pickups)b.type==="hp"||b.type==="sandwich"||b.type==="baguette"||b.type==="croissant"||b.type==="torta"||b.type==="pan_dorado"?(Sa(t,b.x-12,b.y-12+Math.round(Math.sin(c*.08)),b.type,24),t.globalAlpha=.16,t.fillStyle="#ff8f9f",t.beginPath(),t.arc(b.x,b.y,12,0,Math.PI*2),t.fill(),t.globalAlpha=1):ed(t,b.x,b.y,c,b.type==="golden_crumb");'''
              new = '''/*DH_V0_4_2_BLINK*/for(const b of f.pickups){const __dhBlink=(b.type==="crumb"||b.type==="golden_crumb")&&b.lifetime<99999&&b.lifetime<180,__dhPeriod=__dhBlink?(b.lifetime<45?4:b.lifetime<90?8:14):1;if(__dhBlink&&Math.floor(b.lifetime/__dhPeriod)%2===0)continue;b.type==="hp"||b.type==="sandwich"||b.type==="baguette"||b.type==="croissant"||b.type==="torta"||b.type==="pan_dorado"?(Sa(t,b.x-12,b.y-12+Math.round(Math.sin(c*.08)),b.type,24),t.globalAlpha=.16,t.fillStyle="#ff8f9f",t.beginPath(),t.arc(b.x,b.y,12,0,Math.PI*2),t.fill(),t.globalAlpha=1):ed(t,b.x,b.y,c,b.type==="golden_crumb")}'''
              count = js.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one pickup render loop, found {count}')
              js = js.replace(old, new, 1)
              js_path.write_text(js, encoding='utf-8')

          badge = r'''<script>
          /* DH_V0_4_2_CANVAS_BADGE */
          (() => {
            const VERSION = 'v0.4.2';
            const nativeRAF = window.requestAnimationFrame.bind(window);
            const drawVersion = () => {
              const canvas = document.querySelector('canvas');
              if (!canvas) return;
              const ctx = canvas.getContext('2d');
              if (!ctx) return;
              ctx.save();
              ctx.setTransform(1, 0, 0, 1, 0, 0);
              ctx.globalAlpha = 0.92;
              ctx.textAlign = 'left';
              ctx.textBaseline = 'top';
              ctx.font = '700 8px "Chakra Petch", monospace';
              ctx.fillStyle = '#e8d79a';
              ctx.shadowColor = 'rgba(0,0,0,.95)';
              ctx.shadowBlur = 2;
              ctx.fillText(VERSION, 10, 10);
              ctx.restore();
            };
            window.requestAnimationFrame = (callback) => nativeRAF((time) => {
              callback(time);
              drawVersion();
            });
            window.addEventListener('load', () => nativeRAF(drawVersion), { once: true });
          })();
          </script>'''

          html = f'''<!DOCTYPE html>
          <html lang="es">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
            <title>Duck Heist — El Banco del Pan</title>
            <meta name="description" content="Duck Heist — El Banco del Pan">
            <meta name="author" content="Velcore Games">
            {badge}
            <script type="module" crossorigin src="./assets/index-BgUNQzP_.js"></script>
            <link rel="stylesheet" crossorigin href="./assets/index-DK-Zlqzo.css">
          </head>
          <body>
            <div id="root"></div>
          </body>
          </html>
          '''
          Path('web-release/index.html').write_text(html, encoding='utf-8')

          Path('web-release/sw.js').unlink(missing_ok=True)
          Path('web-release/manifest.json').unlink(missing_ok=True)
          Path('web-release/assets/index-DuckHeist-v042.js').unlink(missing_ok=True)

          package_path = Path('package.json')
          package = json.loads(package_path.read_text(encoding='utf-8'))
          package['version'] = '0.4.2'
          package.setdefault('scripts', {})['build'] = 'node scripts/publish-release.mjs'
          package_path.write_text(json.dumps(package, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          Path('VERSION').write_text('0.4.2\n', encoding='utf-8')
          PY

      - name: Remove retired migration files
        run: |
          set -euxo pipefail
          rm -rf appdeploy-live
          rm -f scripts/publish-appdeploy.mjs
          rm -f inspection-v042.txt
          rm -rf .github/workflows

      - name: Validate exact Hostinger output
        run: |
          set -euxo pipefail
          node --check web-release/assets/index-BgUNQzP_.js
          grep -q 'DH_V0_4_2_CANVAS_BADGE' web-release/index.html
          grep -q 'ctx.fillText(VERSION, 10, 10)' web-release/index.html
          grep -q 'DH_V0_4_2_BLINK' web-release/assets/index-BgUNQzP_.js
          ! grep -q 'data-duck-heist-version' web-release/index.html
          test ! -e web-release/sw.js
          npm run build
          test -s dist/index.html
          test -s dist/assets/index-BgUNQzP_.js
          grep -q 'DH_V0_4_2_CANVAS_BADGE' dist/index.html
          grep -q 'DH_V0_4_2_BLINK' dist/assets/index-BgUNQzP_.js
          ! grep -q 'data-duck-heist-version' dist/index.html
          if grep -Rni --exclude-dir=.git --exclude='package-lock.json' 'appdeploy' .; then
            echo 'Retired deployment references remain in the current tree.' >&2
            exit 1
          fi

      - name: Commit final v0.4.2
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize Duck Heist v0.4.2 for Hostinger'
          git push origin HEAD:main
