name: v0.8.0 fullscreen regression QA
on:
  push:
    branches: [fix/v080-menu-fullscreen-escape]
    paths:
      - '.github/workflows/v080-fullscreen-regression.yml'
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v080-menu-fullscreen-escape
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Version, TypeScript and build
        run: |
          node -e "const p=require('./package.json'); if(p.version!=='0.8.0') throw new Error('version changed')"
          test "$(tr -d '\r\n' < VERSION)" = "0.8.0"
          npx tsc --noEmit
          npm run build
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Browser regression proof
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/fs-reg-http.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in {1..60}; do curl -fsS http://127.0.0.1:4173/duck-heist/ >/dev/null && break; sleep .25; done
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1920,height:1080},screen:{width:1920,height:1080}});
          const errors=[];
          page.on('pageerror',e=>errors.push(String(e)));
          page.on('console',m=>{if(m.type()==='error')errors.push(m.text());});
          await page.goto('http://127.0.0.1:4173/duck-heist/?auditoria=1',{waitUntil:'networkidle'});
          await page.waitForFunction(()=>window.duckHeistEngine&&window.duckHeistAudit);
          await page.evaluate(()=>{
            let fake=false;
            Object.defineProperty(document,'fullscreenElement',{configurable:true,get:()=>fake?document.documentElement:null});
            document.documentElement.requestFullscreen=async()=>{fake=true;document.dispatchEvent(new Event('fullscreenchange'));};
            document.exitFullscreen=async()=>{fake=false;document.dispatchEvent(new Event('fullscreenchange'));};
          });
          await page.locator('canvas[role="application"]').focus();

          await page.keyboard.press('f');
          await page.waitForFunction(()=>!!document.fullscreenElement);
          await page.waitForTimeout(100);
          const fs=await page.evaluate(()=>({
            state:window.duckHeistEngine.state,
            stageW:document.querySelector('.duck-responsive-stage').getBoundingClientRect().width,
            viewportW:window.innerWidth,
            logicalW:document.querySelector('canvas[aria-hidden="true"]').width
          }));
          if(fs.state!=='MENU')throw new Error('F changed menu state');
          if(Math.abs(fs.stageW-fs.viewportW)>2)throw new Error('menu not full width '+JSON.stringify(fs));

          const point=await page.evaluate(()=>{
            const stage=document.querySelector('.duck-responsive-stage').getBoundingClientRect();
            const wc=document.querySelector('canvas[aria-hidden="true"]');
            return {x:stage.left+200/wc.width*stage.width,y:stage.top+118/wc.height*stage.height};
          });
          await page.mouse.move(point.x,point.y);await page.waitForTimeout(80);
          const hover=await page.evaluate(()=>window.duckHeistEngine.menuIndex);
          if(hover!==1)throw new Error('wide menu hitbox inactive '+hover);

          await page.keyboard.press('f');
          await page.waitForFunction(()=>!document.fullscreenElement);
          if(await page.evaluate(()=>window.duckHeistEngine.state)!=='MENU')throw new Error('F exit altered menu');

          await page.evaluate(()=>{window.duckHeistEngine.state='PLAYING';window.duckHeistEngine.onStateChange?.('PLAYING');});
          await page.keyboard.press('f');await page.waitForFunction(()=>!!document.fullscreenElement);
          await page.keyboard.press('Escape');await page.waitForTimeout(80);
          const first=await page.evaluate(()=>window.duckHeistEngine.state);
          if(first!=='PLAYING')throw new Error('first ESC navigated game '+first);

          await page.evaluate(()=>document.exitFullscreen());await page.waitForFunction(()=>!document.fullscreenElement);
          await page.keyboard.press('Escape');await page.waitForTimeout(80);
          const second=await page.evaluate(()=>window.duckHeistEngine.state);
          if(second!=='PAUSED')throw new Error('second ESC did not pause '+second);

          const audit=await page.evaluate(()=>window.duckHeistAudit);
          if(audit.failures.length||audit.passed<452)throw new Error('selftests '+JSON.stringify(audit));
          if(errors.length)throw new Error('runtime '+errors.join(' | '));
          console.log(JSON.stringify({
            fFromMenu:true,
            fullscreenMenuUsesViewport:true,
            wideMenuHover:true,
            fAgainExits:true,
            firstEscape:first,
            secondEscape:second,
            selftests:audit.passed,
            runtimeErrors:0,
            version:'0.8.0'
          },null,2));
          await browser.close();
          JS
      - name: Cleanup and rebuild dist
        if: always()
        run: |
          npm run build
          rm -f .github/workflows/v080-fullscreen-regression.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'build: refresh fullscreen regression bundle'
            git push origin HEAD:fix/v080-menu-fullscreen-escape
          fi
