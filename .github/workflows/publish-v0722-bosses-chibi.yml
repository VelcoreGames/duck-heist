name: Publish Duck Heist v0.7.22 Chibi Bosses

on:
  push:
    paths:
      - '.github/workflows/publish-v0722-bosses-chibi.yml'
      - 'scripts/patch-v0722.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply v0.7.22 chibi bosses
        run: |
          sed -i 's/isToaster?.14:.11/isToaster ? .14 : .11/' scripts/patch-v0722.py
          sed -i 's/===0?.58:1/===0 ? .58 : 1/' scripts/patch-v0722.py
          sed -i 's/size>=38?1.08:size>=32?1:size>=28?.9:.82/size>=38 ? 1.08 : size>=32 ? 1 : size>=28 ? .9 : .82/' scripts/patch-v0722.py
          python3 scripts/patch-v0722.py
          sed -i "/const YELLOW_DARK=/d" src/game/graphics/chibiBossesV3.ts
          sed -i "s/,dark=goose?'#cabc9c':YELLOW_DARK//" src/game/graphics/chibiBossesV3.ts
          sed -i "s/function auditorBoss(c:Ctx,id:string,frame:number,ratio:number){/function auditorBoss(c:Ctx,id:string,frame:number,ratio:number){ void frame;/" src/game/graphics/chibiBossesV3.ts
          git restore scripts/patch-v0722.py
      - name: Validate source and build
        run: |
          grep -q 'drawChibiBossV3' src/game/graphics/chibiBossesV3.ts
          grep -q "captain_honk:32" src/game/graphics/chibiBossesV3.ts
          grep -q "bread_banker:40" src/game/graphics/chibiBossesV3.ts
          grep -q "cajero_3000:30" src/game/graphics/chibiBossesV3.ts
          grep -q "drawChibiBossV3 as drawBoss" src/game/render.ts
          grep -q '0.7.22-bosses-chibi-pass' index.html
          ! grep -q 'drawBoss, drawDoor' src/game/render.ts
          ! grep -q 'default: drawSecurityPigeon' src/game/render.ts
          npx tsc --noEmit
          npx vite build --outDir /tmp/duck-heist-v0722 --emptyOutDir
          test -s /tmp/duck-heist-v0722/index.html
          grep -q '0.7.22-bosses-chibi-pass' /tmp/duck-heist-v0722/index.html
      - name: Promote v0.7.22
        run: |
          npm version 0.7.22 --no-git-tag-version
          printf '0.7.22\n' > VERSION
          rm -rf web-release dist
          mkdir -p web-release
          cp -a /tmp/duck-heist-v0722/. web-release/
          node scripts/publish-release.mjs
      - name: Validate promoted release
        run: |
          test -s web-release/index.html
          test -s dist/index.html
          grep -q '"version": "0.7.22"' package.json
          grep -q '^0.7.22$' VERSION
          grep -q '0.7.22-bosses-chibi-pass' web-release/index.html
          cmp web-release/index.html dist/index.html
      - name: Commit v0.7.22
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A index.html src/game/graphics/chibiBossesV3.ts src/game/render.ts web-release dist VERSION package.json package-lock.json
          git commit -m 'Release Duck Heist v0.7.22 chibi bosses pass'
          git pull --rebase origin main
          git push origin HEAD:main
