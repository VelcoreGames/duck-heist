name: Test Base Duck Feet Separation

on:
  push:
    branches:
      - migration/cloudflare-pages
    paths:
      - 'duck-heist-playable-bfvyg1-1788926588197-src/**'
      - '.github/workflows/test-base-duck-feet-separation.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: duck-heist-playable-bfvyg1-1788926588197-src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - name: Verify separated feet animation
        run: |
          grep -q "function drawBaseDuckFootV2" src/visual-v2/materializeBaseDuckMotionV2.mjs
          grep -q "only the feet animate" src/visual-v2/materializeBaseDuckMotionV2.mjs
          grep -q "drawBaseDuckFootV2(ctx,lx,ly" src/visual-v2/materializeBaseDuckMotionV2.mjs
          grep -q "drawDuckAngryFaceV2" src/visual-v2/materializeBaseDuckMotionV2.mjs
          test -f dist/index.html
