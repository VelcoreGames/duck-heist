name: v0.8.0 username login QA
on:
  push:
    branches: [feat/v080-username-login]
    paths:
      - '.github/workflows/v080-username-login-qa.yml'

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v080-username-login
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Guard v0.8.0
        run: |
          node -e "const p=require('./package.json'); if(p.version!=='0.8.0') throw new Error('version changed')"
          test "$(tr -d '\r\n' < VERSION)" = "0.8.0"
      - run: npx tsc --noEmit
      - run: npm run build

      - name: Validate case-insensitive usernames and Admin
        env:
          PGPASSWORD: postgres
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          create role anon;
          create role authenticated;
          create schema auth;
          create function auth.uid() returns uuid language sql stable as $$
            select nullif(current_setting('request.jwt.claim.sub',true),'')::uuid
          $$;
          create table auth.users(id uuid primary key,email_confirmed_at timestamptz);
          SQL
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20260922_email_first_auth.sql
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20260922_explicit_deny_direct_auth_tables.sql
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20260922_username_login.sql
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          do $qa$
          declare
            u1 uuid:='11111111-1111-4111-8111-111111111111';
            u2 uuid:='22222222-2222-4222-8222-222222222222';
            r jsonb;
          begin
            insert into auth.users(id,email_confirmed_at) values(u1,now()),(u2,now());

            perform set_config('request.jwt.claim.sub',u1::text,true);
            r:=public.vg_auth_claim_username('Admin');
            if coalesce((r->>'ok')::boolean,false) is not true or r->>'username'<>'Admin' then
              raise exception 'Admin must be allowed %',r;
            end if;

            if not exists(select 1 from public.vg_auth_profiles where username_norm='admin' and username='Admin') then
              raise exception 'Admin normalization missing';
            end if;

            perform set_config('request.jwt.claim.sub',u2::text,true);
            r:=public.vg_auth_claim_username('ADMIN');
            if r->>'code'<>'username_taken' then
              raise exception 'ADMIN should collide with Admin %',r;
            end if;
            if jsonb_array_length(r->'suggestions')<1 then
              raise exception 'duplicate username suggestions missing %',r;
            end if;
          end
          $qa$;
          SQL

      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Browser login uses username only
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/vg-username-http.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in {1..60}; do curl -fsS http://127.0.0.1:4173/duck-heist/ >/dev/null && break; sleep .25; done
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1191,height:900}});
          const errors=[];
          page.on('pageerror',e=>errors.push(String(e)));
          page.on('console',m=>{if(m.type()==='error')errors.push(m.text());});

          let loginBody=null;
          await page.route('http://127.0.0.1:4173/velcore-cloud.json',r=>r.fulfill({
            status:200,contentType:'application/json',
            body:JSON.stringify({supabaseUrl:'https://cloud.test',anonKey:'sb_publishable_test_12345678901234567890'})
          }));
          await page.route('https://cloud.test/functions/v1/vg-login',async route=>{
            loginBody=route.request().postDataJSON();
            return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({
              ok:true,code:'ok',username:'Admin',
              access_token:'access-token',refresh_token:'refresh-token',expires_in:3600,
              user:{id:'11111111-1111-4111-8111-111111111111',email:'hidden@example.com',email_confirmed_at:'2026-09-22T21:00:00Z'}
            })});
          });
          await page.route('https://cloud.test/auth/v1/user',r=>r.fulfill({status:200,contentType:'application/json',body:JSON.stringify({
            id:'11111111-1111-4111-8111-111111111111',email:'hidden@example.com',email_confirmed_at:'2026-09-22T21:00:00Z'
          })}));
          await page.route('https://cloud.test/rest/v1/rpc/vg_auth_get_profile',r=>r.fulfill({status:200,contentType:'application/json',body:JSON.stringify({ok:true,code:'ok',username:'Admin'})}));
          await page.route('https://cloud.test/rest/v1/rpc/vg_auth_load_game_save',r=>r.fulfill({status:200,contentType:'application/json',body:JSON.stringify({ok:false,code:'not_found'})}));
          await page.route('https://cloud.test/rest/v1/rpc/vg_auth_save_game_save',r=>r.fulfill({status:200,contentType:'application/json',body:JSON.stringify({ok:true,code:'saved',revision:1,updated_at:'2026-09-22T21:00:00Z'})}));

          await page.goto('http://127.0.0.1:4173/duck-heist/',{waitUntil:'networkidle'});
          if((await page.locator('input[name="username"]').count())!==1)throw new Error('login username input missing');
          if(await page.locator('input[name="email"]').count())throw new Error('email must not appear on login');
          await page.locator('input[name="username"]').fill('aDmIn');
          await page.locator('input[name="password"]').fill('ExamplePass_123');
          await page.locator('.vg-account-primary').click();
          await page.getByText('Admin',{exact:true}).waitFor();
          if(loginBody?.username!=='aDmIn')throw new Error('username case was altered before server login');

          const signup=await browser.newPage({viewport:{width:1191,height:900}});
          await signup.route('http://127.0.0.1:4173/velcore-cloud.json',r=>r.fulfill({status:200,contentType:'application/json',body:JSON.stringify({supabaseUrl:'https://cloud.test',anonKey:'sb_publishable_test_12345678901234567890'})}));
          await signup.goto('http://127.0.0.1:4173/duck-heist/',{waitUntil:'networkidle'});
          await signup.getByRole('button',{name:'CREAR CUENTA',exact:true}).click();
          if((await signup.locator('input[name="email"]').count())!==1)throw new Error('signup email missing');
          if(await signup.locator('input[name="username"]').count())throw new Error('signup asks username before verification');

          const audit=await browser.newPage({viewport:{width:1191,height:900}});
          await audit.goto('http://127.0.0.1:4173/duck-heist/?auditoria=1',{waitUntil:'networkidle'});
          await audit.waitForFunction(()=>window.duckHeistAudit);
          const report=await audit.evaluate(()=>window.duckHeistAudit);
          if(report.failures.length)throw new Error(report.failures.join(' | '));
          if(report.passed<452)throw new Error('selftests regressed');
          if(errors.length)throw new Error(errors.join(' | '));
          console.log(JSON.stringify({loginByUsername:true,emailHiddenAtLogin:true,caseInsensitiveServerPath:true,signupEmailFirst:true,selftests:report.passed,runtimeErrors:errors},null,2));
          await browser.close();
          JS

      - name: Refresh dist and remove temporary workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          rm -f .github/workflows/v080-username-login-qa.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'build: refresh username login bundle'
            git push origin HEAD:feat/v080-username-login
          fi
