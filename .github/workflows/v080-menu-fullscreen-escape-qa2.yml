name: v0.8.0 fullscreen menu escape QA retry
on:
  push:
    branches: [fix/v080-menu-fullscreen-escape]
    paths:
      - '.github/workflows/v080-menu-fullscreen-escape-qa2.yml'

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v080-menu-fullscreen-escape
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Guard and compile
        run: |
          node -e "const p=require('./package.json'); if(p.version!=='0.8.0') throw new Error('version changed')"
          test "$(tr -d '\r\n' < VERSION)" = "0.8.0"
          npx tsc --noEmit
          npm run build
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Fullscreen F and double ESC proof
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/fs-menu-http.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in {1..60}; do curl -fsS http://127.0.0.1:4173/duck-heist/ >/dev/null && break; sleep .25; done
          cat > .fullscreen-menu-proof.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({
            headless:false,
            args:['--window-size=1920,1080','--disable-infobars','--no-first-run']
          });
          const context=await browser.newContext({viewport:null,screen:{width:1920,height:1080}});
          const page=await context.newPage();
          const errors=[];
          page.on('pageerror',e=>errors.push('pageerror '+String(e)));
          page.on('console',m=>{if(m.type()==='error')errors.push('console '+m.text());});
          await page.goto('http://127.0.0.1:4173/duck-heist/?auditoria=1',{waitUntil:'domcontentloaded'});
          await page.waitForFunction(()=>window.duckHeistEngine&&window.duckHeistAudit,{timeout:10000});
          await page.locator('canvas[role="application"]').focus();

          if(await page.evaluate(()=>window.duckHeistEngine.state)!=='MENU')throw new Error('not in MENU');

          await page.keyboard.press('f');
          await page.waitForFunction(()=>!!document.fullscreenElement,{timeout:5000});
          await page.waitForTimeout(180);
          const fsMenu=await page.evaluate(()=>{
            const stage=document.querySelector('.duck-responsive-stage').getBoundingClientRect();
            const wc=document.querySelector('canvas[aria-hidden="true"]');
            return {stageW:stage.width,innerW:innerWidth,logicalW:wc.width,logicalH:wc.height,state:window.duckHeistEngine.state};
          });
          if(Math.abs(fsMenu.stageW-fsMenu.innerW)>2)throw new Error('menu stage width '+JSON.stringify(fsMenu));

          const point=await page.evaluate(()=>{
            const stage=document.querySelector('.duck-responsive-stage').getBoundingClientRect();
            const wc=document.querySelector('canvas[aria-hidden="true"]');
            return {x:stage.left+200/wc.width*stage.width,y:stage.top+118/wc.height*stage.height};
          });
          await page.mouse.move(point.x,point.y);
          await page.waitForTimeout(100);
          const hoverIndex=await page.evaluate(()=>window.duckHeistEngine.menuIndex);
          if(hoverIndex!==1)throw new Error('wide fullscreen menu not active '+hoverIndex);

          await page.keyboard.press('f');
          await page.waitForFunction(()=>!document.fullscreenElement,{timeout:5000});
          if(await page.evaluate(()=>window.duckHeistEngine.state)!=='MENU')throw new Error('F exit altered menu');

          await page.evaluate(()=>{window.duckHeistEngine.state='PLAYING';window.duckHeistEngine.onStateChange?.('PLAYING');});
          await page.keyboard.press('f');
          await page.waitForFunction(()=>!!document.fullscreenElement,{timeout:5000});

          await page.keyboard.press('Escape');
          await page.waitForFunction(()=>!document.fullscreenElement,{timeout:5000});
          await page.waitForTimeout(100);
          const first=await page.evaluate(()=>window.duckHeistEngine.state);
          if(first!=='PLAYING')throw new Error('first ESC changed game state '+first);

          await page.keyboard.press('Escape');
          await page.waitForTimeout(100);
          const second=await page.evaluate(()=>window.duckHeistEngine.state);
          if(second!=='PAUSED')throw new Error('second ESC did not pause '+second);

          const audit=await page.evaluate(()=>window.duckHeistAudit);
          if(audit.failures.length||audit.passed<452)throw new Error('selftests '+JSON.stringify(audit));
          if(errors.length)throw new Error(errors.join(' | '));

          console.log(JSON.stringify({
            fWorksInMenu:true,
            fullscreenMenuWidth:fsMenu.stageW,
            viewportWidth:fsMenu.innerW,
            logicalCanvas:fsMenu.logicalW+'x'+fsMenu.logicalH,
            wideMenuHoverIndex:hoverIndex,
            fAgainExits:true,
            firstEscapeKeepsState:first,
            secondEscapeState:second,
            selftests:audit.passed,
            runtimeErrors:errors.length,
            version:'0.8.0'
          },null,2));
          await browser.close();
          JS
          xvfb-run -a -s "-screen 0 1920x1080x24" node .fullscreen-menu-proof.mjs
          rm -f .fullscreen-menu-proof.mjs
      - name: Cleanup workflow and refresh dist
        if: always()
        run: |
          npm run build
          rm -f .fullscreen-menu-proof.mjs .github/workflows/v080-menu-fullscreen-escape-qa2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'build: finalize fullscreen menu escape fix'
            git push origin HEAD:fix/v080-menu-fullscreen-escape
          fi
