name: Inspect v0.4.2 stable bundle

on:
  push:
    paths:
      - '.github/workflows/inspect-v042.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Inspect minified stable bundle
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('appdeploy-live/assets/index-BgUNQzP_.js')
          s = p.read_text(encoding='utf-8')
          terms = ['golden_crumb', '"crumb"', "'crumb'", 'lifetime', '99999']
          out = []
          for term in terms:
              start = 0
              count = 0
              while True:
                  i = s.find(term, start)
                  if i < 0:
                      break
                  count += 1
                  out.append(f'\n=== {term} #{count} at {i} ===\n{s[max(0, i-900):min(len(s), i+1200)]}\n')
                  start = i + 1
                  if count >= 20:
                      break
          Path('inspection-v042.txt').write_text('\n'.join(out), encoding='utf-8')
          print(f'Wrote {len(out)} snippets')
          PY

      - name: Commit inspection report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add inspection-v042.txt
          git commit -m 'Inspect stable bundle for v0.4.2 patch' || exit 0
          git push
