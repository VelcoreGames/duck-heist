name: Inspect Duck Heist v0.7.46 V16 Death Presentation

on:
  push:
    paths:
      - '.github/workflows/inspect-v0746-v16-death-presentation.yml'
      - 'scripts/patch-v0746-v16-death-presentation.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci

      - name: Apply V16.8 death presentation candidate
        run: python scripts/patch-v0746-v16-death-presentation.py

      - name: Add local-only QA engine hook
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/App.tsx'); s=p.read_text()
          old='''    const engine = createEngine(wc, wctx, uctx);\n    engineRef.current = engine;\n'''
          new='''    const engine = createEngine(wc, wctx, uctx);\n    engineRef.current = engine;\n    (window as Window & { __duckQaEngine?: GameEngine }).__duckQaEngine = engine;\n'''
          if s.count(old)!=1: raise SystemExit('QA engine hook anchor mismatch')
          p.write_text(s.replace(old,new,1))
          PY

      - name: Validate TypeScript and build
        run: |
          grep -q 'deathTimer >= 36' src/game/engine.ts
          grep -q 'player.deathTimer === 0' src/game/engine.ts
          grep -q 'engine.player.deathTimer > 0' src/App.tsx
          grep -q '0.7.46-chibi-v16-death-presentation-candidate' index.html
          grep -q 'v16.7-impact-fx' src/game/graphics/playerChibiAtlasV16.ts
          grep -q 'const DRAW = 46' src/game/graphics/playerChibiAtlasV16.ts
          npx tsc --noEmit
          npx vite build --outDir /tmp/v0746-build --emptyOutDir
          grep -q '0.7.46-chibi-v16-death-presentation-candidate' /tmp/v0746-build/index.html

      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify real down-to-game-over sequence
        run: |
          mkdir -p /tmp/v0746-review
          cd /tmp/v0746-build
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/v0746-http.log 2>&1 &
          echo $! >/tmp/v0746-http.pid
          cd "$GITHUB_WORKSPACE"
          node <<'NODE'
          const { chromium }=require('playwright');
          const fs=require('fs'),assert=require('assert');
          const out='/tmp/v0746-review', expected='0.7.46-chibi-v16-death-presentation-candidate';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms)); const errors=[],failed=[],bad=[],samples={};
          async function ds(p){return p.evaluate(()=>{const e=window.__duckQaEngine;return {build:document.querySelector('meta[name="duck-heist-build"]')?.content||'',renderer:document.documentElement.dataset.duckHeistPlayerRenderer||'',frames:document.documentElement.dataset.duckHeistPlayerFrames||'',fx:document.documentElement.dataset.duckHeistPlayerFx||'',playerState:document.documentElement.dataset.duckHeistPlayerState||'',visualFrame:document.documentElement.dataset.duckHeistPlayerVisualFrame||'',engineState:e?.state,frame:e?.frame,deathTimer:e?.player?.deathTimer,dashTimer:e?.player?.dashTimer,activeCooldown:e?.player?.activeItemCooldown,endFrame:e?.endFrame,hp:e?.player?.hp};});}
          async function waitFor(p,pred,timeout=1800){const start=Date.now();while(Date.now()-start<timeout){const d=await ds(p);if(pred(d))return d;await sleep(12);}throw new Error('waitFor timeout');}
          async function start(p){await p.goto(`http://127.0.0.1:4173/?qa=v0746&t=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:60000});await sleep(1500);assert.strictEqual((await ds(p)).build,expected);const c=p.locator('canvas[role="application"]');assert.strictEqual(await c.count(),1);await c.focus();await p.keyboard.press('Enter');for(let i=0;i<6;i++){await sleep(700);const d=await ds(p);if(d.renderer==='canvas2d-chibi-atlas-v16'&&d.frames==='464-raster-chibi-v16'&&d.playerState==='idle')return d;await p.keyboard.press('Enter');}throw new Error('game did not reach V16 idle');}
          async function kill(p){await p.evaluate(()=>{const e=window.__duckQaEngine;if(!e)throw new Error('QA engine missing');e.player.hp=0;});}
          (async()=>{const browser=await chromium.launch({headless:true});const context=await browser.newContext({viewport:{width:1440,height:1000},deviceScaleFactor:1});const p=await context.newPage();p.on('console',m=>{if(m.type()==='error')errors.push(m.text())});p.on('pageerror',e=>errors.push(e.message));p.on('requestfailed',r=>failed.push(`${r.method()} ${r.url()} ${r.failure()?.errorText||''}`));p.on('response',r=>{if(r.status()>=400)bad.push(`${r.status()} ${r.url()}`)});

          samples.idle=await start(p);assert.strictEqual(samples.idle.fx,'v16.7-impact-fx');const playingState=samples.idle.engineState,activeBefore=samples.idle.activeCooldown;await kill(p);
          samples.downFunctional=await waitFor(p,d=>d.engineState===playingState&&d.playerState==='down'&&d.deathTimer>=3&&d.deathTimer<18);assert(samples.downFunctional.deathTimer<18);
          await p.keyboard.press('Escape');await p.keyboard.press('Shift');await p.keyboard.press(' ');samples.inputLocked=await ds(p);assert.strictEqual(samples.inputLocked.engineState,playingState);assert.strictEqual(samples.inputLocked.playerState,'down');assert.strictEqual(samples.inputLocked.dashTimer,0);assert.strictEqual(samples.inputLocked.activeCooldown,activeBefore);
          samples.gameOver=await waitFor(p,d=>d.engineState!==playingState,1800);assert.strictEqual(samples.gameOver.deathTimer,36);assert(samples.gameOver.endFrame>0);assert(samples.gameOver.frame-samples.gameOver.endFrame<8);await p.screenshot({path:`${out}/03-game-over.png`,fullPage:true});

          samples.visualEarlyBase=await start(p);await kill(p);samples.visualEarly=await waitFor(p,d=>d.playerState==='down'&&d.deathTimer>=4&&d.deathTimer<14);await p.screenshot({path:`${out}/01-down-early.png`,fullPage:true});
          samples.visualMidBase=await start(p);await kill(p);samples.visualMid=await waitFor(p,d=>d.playerState==='down'&&d.deathTimer>=19&&d.deathTimer<29);await p.screenshot({path:`${out}/02-down-mid.png`,fullPage:true});

          assert.strictEqual(errors.length,0,errors.join(' | '));assert.strictEqual(failed.length,0,failed.join(' | '));assert.strictEqual(bad.length,0,bad.join(' | '));fs.writeFileSync(`${out}/qa.json`,JSON.stringify({samples,errors,failed,bad},null,2));await browser.close();})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          kill "$(cat /tmp/v0746-http.pid)" || true

      - name: Upload candidate review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duck-heist-v0746-death-presentation-candidate
          path: /tmp/v0746-review
          if-no-files-found: warn
          retention-days: 7
