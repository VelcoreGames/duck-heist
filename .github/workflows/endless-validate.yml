name: Endless Heist validation
on:
  push:
    branches: [feature/endless-heist]
    paths:
      - '.github/workflows/endless-validate.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/endless-heist
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Endless assertions
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = "0.6.0"
          grep -Fq "ATRACO SIN FIN" src/game/render.ts
          grep -Fq "startEndlessRound" src/game/engine.ts
          grep -Fq "endlessScale" src/game/endless.ts
          grep -Fq "const VERSION = 'v0.6.0';" dist/index.html
      - name: Cleanup workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/endless-validate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: remove temporary endless validation'
          git push origin HEAD:feature/endless-heist
