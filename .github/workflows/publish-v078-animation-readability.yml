name: Publish Duck Heist v0.7.8 Animation Readability

on:
  push:
    paths:
      - '.github/workflows/publish-v078-animation-readability.yml'
      - 'scripts/patch-v078.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Apply v0.7.8 player motion pass
        run: |
          python3 scripts/patch-v078.py
          sed -i 's/function poseFor(state: State, tick: number, frame: number, dir: DuckDir)/function poseFor(state: State, tick: number, _frame: number, dir: DuckDir)/' src/game/graphics/playerChibiRemastered.ts

      - name: Validate source and build
        run: |
          grep -q 'const DRAW_H = 36;' src/game/graphics/playerChibiRemastered.ts
          grep -q 'drawWalkStepAccent' src/game/graphics/playerChibiRemastered.ts
          grep -q 'canvas2d-chibi-remastered-v6' src/game/graphics/playerChibiRemastered.ts
          grep -q 'duckHeistPlayerVisualFrame' src/game/graphics/playerChibiRemastered.ts
          grep -q '0.7.8-motion-pass' index.html
          npx tsc --noEmit
          npx vite build --outDir /tmp/duck-heist-v078 --emptyOutDir
          test -s /tmp/duck-heist-v078/index.html
          grep -q '0.7.8-motion-pass' /tmp/duck-heist-v078/index.html
          grep -q 'canvas2d-chibi-remastered-v6' /tmp/duck-heist-v078/index.html

      - name: Promote v0.7.8
        run: |
          npm version 0.7.8 --no-git-tag-version
          printf '0.7.8\n' > VERSION
          rm -rf web-release dist
          mkdir -p web-release
          cp -a /tmp/duck-heist-v078/. web-release/
          node scripts/publish-release.mjs

      - name: Validate promoted release
        run: |
          test -s web-release/index.html
          test -s dist/index.html
          grep -q '"version": "0.7.8"' package.json
          grep -q '^0.7.8$' VERSION
          grep -q '0.7.8-motion-pass' web-release/index.html
          grep -q 'canvas2d-chibi-remastered-v6' web-release/index.html
          cmp web-release/index.html dist/index.html

      - name: Commit v0.7.8
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A index.html src/game/graphics/playerChibiRemastered.ts web-release dist VERSION package.json package-lock.json
          git commit -m 'Release Duck Heist v0.7.8 animation readability pass'
          git pull --rebase origin main
          git push origin HEAD:main
