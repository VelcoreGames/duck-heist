name: Endless v0.6.4 persistent arena QA
on:
  push:
    branches: [fix/endless-persistent-arena]
    paths:
      - '.github/workflows/endless-persistent-arena-qa.yml'
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/endless-persistent-arena
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
      - name: Static assertions
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = "0.6.4"
          grep -Fq "st===GameState.ENDLESS_REWARD" src/App.tsx
          grep -Fq "room.floorIndex=0" src/game/engine.ts
          grep -Fq "engine.map.floorIndex=0" src/game/engine.ts
          grep -Fq "room.doors=[]" src/game/engine.ts
          grep -Fq "MISMA ARENA" src/game/render.ts
          grep -Fq "const VERSION = 'v0.6.4';" dist/index.html
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Browser persistent-arena smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/duck-server.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in {1..40}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep .25; done
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1191,height:900}});
          const errors=[];
          page.on('pageerror',e=>errors.push(String(e)));
          page.on('console',m=>{if(m.type()==='error') errors.push(m.text());});
          await page.goto('http://127.0.0.1:4173/?auditoria=1',{waitUntil:'networkidle'});
          await page.waitForFunction(()=>window.duckHeistEngine && document.querySelectorAll('canvas').length>=2);
          await page.keyboard.press('ArrowDown');
          await page.keyboard.press('Enter');
          await page.waitForTimeout(180);
          await page.keyboard.press('Enter');
          // No more input. Intro + quick message must reach round 1.
          await page.waitForFunction(()=>window.duckHeistEngine?.gameMode==='endless' && window.duckHeistEngine?.endless?.round===1 && window.duckHeistEngine?.state==='PLAYING',{timeout:6500});
          const first=await page.evaluate(()=>{
            const e=window.duckHeistEngine;
            const room=e.map.rooms.get(e.currentKey);
            return {round:e.endless.round,key:e.currentKey,rooms:e.map.rooms.size,floor:e.map.floorIndex,roomFloor:room.floorIndex,doors:room.doors.length,x:e.player.x,y:e.player.y,state:e.state};
          });
          if(first.rooms!==1||first.key!=='0,0'||first.floor!==0||first.roomFloor!==0||first.doors!==0) throw new Error('Endless arena is not single/persistent: '+JSON.stringify(first));

          const injected=await page.evaluate(()=>{
            const e=window.duckHeistEngine;
            const c=e.contents.get(e.currentKey);
            e.player.x=155;e.player.y=177;e.player.vx=0;e.player.vy=0;
            const before={crumbs:e.player.crumbs,golden:e.totalGoldenCrumbs};
            c.pickups.push({x:100,y:100,type:'crumb',value:7,lifetime:99999});
            c.pickups.push({x:120,y:100,type:'golden_crumb',value:3,lifetime:99999});
            c.enemies=[];
            e.endless.pendingEnemies=[];
            e.endless.roundActive=true;
            e.endless.awaitingReward=false;
            e.endless.marketOpen=false;
            e.state='PLAYING';
            return before;
          });
          await page.waitForFunction(()=>window.duckHeistEngine?.endless?.round===2 && window.duckHeistEngine?.state==='PLAYING',{timeout:4000});
          const second=await page.evaluate(()=>{
            const e=window.duckHeistEngine;
            const room=e.map.rooms.get(e.currentKey),c=e.contents.get(e.currentKey);
            return {round:e.endless.round,key:e.currentKey,rooms:e.map.rooms.size,floor:e.map.floorIndex,roomFloor:room.floorIndex,doors:room.doors.length,x:e.player.x,y:e.player.y,pickups:c.pickups.length,items:c.items.length,crumbs:e.player.crumbs,golden:e.totalGoldenCrumbs};
          });
          if(second.key!=='0,0'||second.rooms!==1||second.floor!==0||second.roomFloor!==0||second.doors!==0) throw new Error('Arena changed: '+JSON.stringify(second));
          if(Math.abs(second.x-155)>.01||Math.abs(second.y-177)>.01) throw new Error('Player was repositioned: '+JSON.stringify(second));
          if(second.pickups!==0||second.items!==0) throw new Error('Old floor loot remained: '+JSON.stringify(second));
          if(second.crumbs<injected.crumbs+7) throw new Error('Crumbs were not auto-collected');
          if(second.golden<injected.golden+3) throw new Error('Golden crumbs were not auto-collected');
          if(errors.length) throw new Error('Runtime errors: '+errors.join(' | '));
          console.log(JSON.stringify({first,injected,second},null,2));
          await browser.close();
          JS
      - name: Cleanup temporary QA
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/endless-persistent-arena-qa.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: remove temporary v0.6.4 arena QA'
          git push origin HEAD:fix/endless-persistent-arena
