name: Publish Duck Heist v0.7.23 Themed World Props

on:
  push:
    paths:
      - '.github/workflows/publish-v0723-world-props.yml'
      - 'scripts/patch-v0723.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply v0.7.23 themed world props
        run: python3 scripts/patch-v0723.py
      - name: Validate source and build
        run: |
          test -s src/game/graphics/chibiWorldPropsV3.ts
          grep -q 'drawChibiThemedDoorV3' src/game/graphics/chibiWorldPropsV3.ts
          grep -q 'drawChibiThemedObstacleV3' src/game/graphics/chibiWorldPropsV3.ts
          grep -q 'drawChibiThemedDoorV3' src/game/render.ts
          grep -q 'drawChibiThemedObstacleV3' src/game/render.ts
          grep -q '0.7.23-world-props-chibi' index.html
          npx tsc --noEmit
          npx vite build --outDir /tmp/duck-heist-v0723 --emptyOutDir
          test -s /tmp/duck-heist-v0723/index.html
          grep -q '0.7.23-world-props-chibi' /tmp/duck-heist-v0723/index.html
      - name: Promote v0.7.23
        run: |
          npm version 0.7.23 --no-git-tag-version
          printf '0.7.23\n' > VERSION
          rm -rf web-release dist
          mkdir -p web-release
          cp -a /tmp/duck-heist-v0723/. web-release/
          node scripts/publish-release.mjs
      - name: Validate promoted release
        run: |
          test -s web-release/index.html
          test -s dist/index.html
          grep -q '"version": "0.7.23"' package.json
          grep -q '^0.7.23$' VERSION
          grep -q '0.7.23-world-props-chibi' web-release/index.html
          cmp web-release/index.html dist/index.html
      - name: Commit v0.7.23
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A index.html src/game/graphics/chibiWorldPropsV3.ts src/game/render.ts web-release dist VERSION package.json package-lock.json
          git commit -m 'Release Duck Heist v0.7.23 themed world props'
          git pull --rebase origin main
          git push origin HEAD:main
