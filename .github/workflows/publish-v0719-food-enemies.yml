name: Publish Duck Heist v0.7.19 Food Enemies Chibi

on:
  push:
    paths:
      - '.github/workflows/publish-v0719-food-enemies.yml'
      - 'scripts/patch-v0719.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Apply v0.7.19 chibi food enemies
        run: |
          python3 scripts/patch-v0719.py
          sed -i "/const METAL_LIGHT =/d" src/game/graphics/chibiFoodEnemiesV3.ts

      - name: Validate source and build
        run: |
          grep -q 'drawChibiFoodEnemyV3' src/game/graphics/chibiFoodEnemiesV3.ts
          grep -q "kind:'toaster'" src/game/render.ts
          grep -q "kind:'bagel'" src/game/render.ts
          grep -q "kind:'croissant'" src/game/render.ts
          grep -q "kind:'banker_chicken'" src/game/render.ts
          grep -q '0.7.19-food-enemies-chibi' index.html
          ! grep -q 'drawToasterTurret(ctx, e.x' src/game/render.ts
          ! grep -q 'drawRollingBagel(ctx, e.x' src/game/render.ts
          ! grep -q 'drawEvilCroissant(ctx, e.x' src/game/render.ts
          ! grep -q 'drawBankerChicken(ctx, e.x' src/game/render.ts
          npx tsc --noEmit
          npx vite build --outDir /tmp/duck-heist-v0719 --emptyOutDir
          test -s /tmp/duck-heist-v0719/index.html
          grep -q '0.7.19-food-enemies-chibi' /tmp/duck-heist-v0719/index.html
          grep -q 'drawChibiFoodEnemyV3' src/game/graphics/chibiFoodEnemiesV3.ts

      - name: Promote v0.7.19
        run: |
          npm version 0.7.19 --no-git-tag-version
          printf '0.7.19\n' > VERSION
          rm -rf web-release dist
          mkdir -p web-release
          cp -a /tmp/duck-heist-v0719/. web-release/
          node scripts/publish-release.mjs

      - name: Validate promoted release
        run: |
          test -s web-release/index.html
          test -s dist/index.html
          grep -q '"version": "0.7.19"' package.json
          grep -q '^0.7.19$' VERSION
          grep -q '0.7.19-food-enemies-chibi' web-release/index.html
          cmp web-release/index.html dist/index.html

      - name: Commit v0.7.19
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A index.html src/game/graphics/chibiFoodEnemiesV3.ts src/game/render.ts web-release dist VERSION package.json package-lock.json
          git commit -m 'Release Duck Heist v0.7.19 chibi food enemies'
          git pull --rebase origin main
          git push origin HEAD:main
