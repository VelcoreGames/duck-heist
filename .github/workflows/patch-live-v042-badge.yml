name: Patch live Duck Heist v0.4.2 badge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-live-v042-badge.yml'

permissions:
  contents: write

jobs:
  patch-live:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch the actually served AppDeploy mirror bundle
        shell: bash
        run: |
          set -euo pipefail
          SRC='appdeploy-live/assets/index-BgUNQzP_.js'
          DST='appdeploy-live/assets/index-DuckHeist-v042.js'
          cp "$SRC" "$DST"
          python - <<'PY'
          from pathlib import Path
          p=Path('appdeploy-live/assets/index-DuckHeist-v042.js')
          s=p.read_text(encoding='utf-8')
          needle='function aE(e){const t=e.ui;Bp(t,K/2,62,e.frame),j(t,"SE BUSCA UN CÓMPLICE",Wa.x+Wa.w/2,115,7,"#c9b27a","center",!0),ZA.forEach'
          repl='function aE(e){const t=e.ui;Bp(t,K/2,62,e.frame),j(t,"v0.4.2",8,10,5.4,"#d7d1b8","left",!0),j(t,"SE BUSCA UN CÓMPLICE",Wa.x+Wa.w/2,115,7,"#c9b27a","center",!0),ZA.forEach'
          if needle not in s:
              raise SystemExit('Expected main-menu renderer signature not found in served bundle')
          s=s.replace(needle,repl,1)
          if '"v0.4.2",8,10' not in s:
              raise SystemExit('Badge insertion validation failed')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Point served index to cache-busted patched bundle
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('appdeploy-live/index.html')
          s=p.read_text(encoding='utf-8')
          old='./assets/index-BgUNQzP_.js'
          new='./assets/index-DuckHeist-v042.js?v=042-live-2'
          if old not in s and 'index-DuckHeist-v042.js' not in s:
              raise SystemExit('Expected bundle reference not found in served index')
          s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
          grep -q 'index-DuckHeist-v042.js' appdeploy-live/index.html
          grep -q '"v0.4.2",8,10' appdeploy-live/assets/index-DuckHeist-v042.js

      - name: Commit live mirror fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add appdeploy-live/index.html appdeploy-live/assets/index-DuckHeist-v042.js
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Patch live mirror with v0.4.2 menu badge'
          git push origin main
