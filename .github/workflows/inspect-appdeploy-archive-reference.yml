name: Inspect archived AppDeploy reference UI

on:
  push:
    paths:
      - '.github/workflows/inspect-appdeploy-archive-reference.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout exact archived AppDeploy snapshot
        uses: actions/checkout@v4
        with:
          ref: fc214761adaedf60e8fe6a4dc3cedd3ea1b0d9e7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Capture exact archived AppDeploy UI
        run: |
          mkdir -p /tmp/appdeploy-reference
          cd appdeploy-live
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/appdeploy-ref-http.log 2>&1 &
          echo $! >/tmp/appdeploy-ref-http.pid
          cd "$GITHUB_WORKSPACE"
          node <<'NODE'
          const {chromium}=require('playwright');const fs=require('fs');
          const out='/tmp/appdeploy-reference';
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({viewport:{width:1440,height:1000},deviceScaleFactor:1});
            const p=await context.newPage();
            const errors=[],failed=[],bad=[];
            p.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
            p.on('pageerror',e=>errors.push(e.message));
            p.on('requestfailed',r=>failed.push(`${r.method()} ${r.url()} ${r.failure()?.errorText||''}`));
            p.on('response',r=>{if(r.status()>=400)bad.push(`${r.status()} ${r.url()}`)});
            await p.goto(`http://127.0.0.1:4173/?archive=fc214761&t=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:60000});
            await p.waitForTimeout(1800);
            await p.screenshot({path:`${out}/01-home-exact.png`,fullPage:true});
            const snapshot=await p.evaluate(()=>({
              title:document.title,
              text:(document.body.innerText||'').replace(/\n{3,}/g,'\n\n'),
              buttons:[...document.querySelectorAll('button')].map((b,i)=>({i,text:(b.innerText||b.textContent||'').trim(),aria:b.getAttribute('aria-label'),disabled:b.disabled})),
              links:[...document.querySelectorAll('a')].map((a,i)=>({i,text:(a.innerText||a.textContent||'').trim(),href:a.getAttribute('href')})),
              inputs:[...document.querySelectorAll('input')].map((e,i)=>({i,type:e.type,value:e.value,aria:e.getAttribute('aria-label')})),
              size:{w:innerWidth,h:innerHeight,scrollW:document.documentElement.scrollWidth,scrollH:document.documentElement.scrollHeight},
            }));
            fs.writeFileSync(`${out}/dom.json`,JSON.stringify({snapshot,errors,failed,bad},null,2));
            fs.writeFileSync(`${out}/body.txt`,snapshot.text);
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          kill "$(cat /tmp/appdeploy-ref-http.pid)" || true
      - name: Upload exact AppDeploy reference
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duck-heist-appdeploy-exact-reference
          path: /tmp/appdeploy-reference
          if-no-files-found: error
          retention-days: 7
