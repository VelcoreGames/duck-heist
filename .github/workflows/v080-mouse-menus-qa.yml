name: v0.8.0 mouse-first menus QA
on:
  push:
    branches: [feature/v080-mouse-first-menu-redesign]
    paths:
      - '.github/workflows/v080-mouse-menus-qa.yml'
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v080-mouse-first-menu-redesign
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
      - name: Menu invariants
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = "0.8.0"
          grep -Fq "ELIGE CON EL RATÓN" src/game/render.ts
          grep -Fq "HUD_MENU" src/game/render.ts
          grep -Fq "MAIN_OPEN" src/game/render.ts
          grep -Fq "COLLECTION_FILTER" src/game/collectionUI.ts
          grep -Fq "CONTROLS_RESET" src/game/controlsUI.ts
          grep -Fq "mouseOnlyMenu" src/App.tsx
          ! grep -Fq "PROBAR CUAC" src/game/engine.ts
          ! grep -Fq "PROBAR ESQUIVE" src/game/engine.ts
          ! grep -Fq "String(i+1).padStart(2,'0')" src/game/render.ts
          ! grep -Fq "'0'+String(i+1)" src/game/render.ts
          ! grep -Fq "String(i+1).padStart(2,'0')" src/game/controlsUI.ts
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Mouse navigation browser QA
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/duck-menu.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in {1..40}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep .25; done
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1191,height:900}});
          const errors=[];
          page.on('pageerror',e=>errors.push(String(e)));
          page.on('console',m=>{if(m.type()==='error')errors.push(m.text());});
          await page.goto('http://127.0.0.1:4173/?auditoria=1',{waitUntil:'networkidle'});
          await page.waitForFunction(()=>window.duckHeistEngine);
          await page.evaluate(()=>{localStorage.clear(); const e=window.duckHeistEngine;e.testing=false;e.endlessCheckpointRound=0;e.menuIndex=0;});
          const canvas=page.locator('canvas[role="application"]');
          const clickWorld=async(x,y)=>{
            const b=await canvas.boundingBox(); if(!b)throw new Error('no canvas box');
            await page.mouse.click(b.x+x/480*b.width,b.y+y/352*b.height);
            await page.waitForTimeout(90);
          };
          const moveWorld=async(x,y)=>{
            const b=await canvas.boundingBox(); if(!b)throw new Error('no canvas box');
            await page.mouse.move(b.x+x/480*b.width,b.y+y/352*b.height);
            await page.waitForTimeout(45);
          };
          const state=()=>page.evaluate(()=>window.duckHeistEngine.state);
          const expectState=async(v,label)=>{const got=await state();if(got!==v)throw new Error(label+': expected '+v+' got '+got);};
          const noOverflow=async label=>{
            const v=await page.evaluate(()=>({x:document.documentElement.scrollWidth>innerWidth,y:document.documentElement.scrollHeight>innerHeight}));
            if(v.x||v.y)throw new Error(label+' overflow '+JSON.stringify(v));
          };
          const back=()=>clickWorld(74,329);

          await expectState('MENU','initial');
          const keyboardBefore=await page.evaluate(()=>window.duckHeistEngine.menuIndex);
          await page.keyboard.press('ArrowDown');await page.keyboard.press('Enter');await page.waitForTimeout(80);
          const keyboardAfter=await page.evaluate(()=>({state:window.duckHeistEngine.state,index:window.duckHeistEngine.menuIndex}));
          if(keyboardAfter.state!=='MENU'||keyboardAfter.index!==keyboardBefore)throw new Error('keyboard still navigates menu '+JSON.stringify(keyboardAfter));

          // Hover follows the pointer; all eight main entries open and return by mouse.
          await moveWorld(117,74+4*29+13);
          if(await page.evaluate(()=>window.duckHeistEngine.menuIndex)!==4)throw new Error('main hover does not track mouse');
          const expected=['DIFFICULTY','DIFFICULTY','DAILY_BRIEF','UPGRADES','WARDROBE','COLLECTION','HOW_TO_PLAY','SETTINGS'];
          for(let i=0;i<8;i++){
            await clickWorld(117,74+i*29+13);
            await expectState(expected[i],'main item '+i);
            await noOverflow('main item '+i);
            await back();
            await expectState('MENU','back from main item '+i);
          }

          // Main dossier CTA is a real button, not decoration.
          await moveWorld(117,74+5*29+13);
          await clickWorld(336,284);
          await expectState('COLLECTION','main CTA');
          await back(); await expectState('MENU','CTA back');

          // Difficulty card only selects. Explicit start is a separate action.
          await clickWorld(117,87); await expectState('DIFFICULTY','difficulty enter');
          await clickWorld(339,121);
          const diff=await page.evaluate(()=>({state:window.duckHeistEngine.state,index:window.duckHeistEngine.difficultyIndex}));
          if(diff.state!=='DIFFICULTY'||diff.index!==1)throw new Error('difficulty card auto-started or failed '+JSON.stringify(diff));
          await back();await expectState('MENU','difficulty back');

          // Settings: label area selects but does not alter; only visible +/- or action buttons change values.
          await clickWorld(117,74+7*29+13); await expectState('SETTINGS','settings enter');
          await page.evaluate(()=>{const e=window.duckHeistEngine;e.settings.master=.5;e.settings.damageNumbers=true;});
          await clickWorld(55,223); // damageNumbers label side, row 4 left column
          if(!(await page.evaluate(()=>window.duckHeistEngine.settings.damageNumbers)))throw new Error('settings label changed boolean');
          await clickWorld(190,223); // visible action
          if(await page.evaluate(()=>window.duckHeistEngine.settings.damageNumbers))throw new Error('settings boolean button failed');
          await clickWorld(223,95); // master +
          const master=await page.evaluate(()=>window.duckHeistEngine.settings.master);
          if(Math.abs(master-.6)>.001)throw new Error('master plus failed '+master);

          // Controls opens by click. Menu arrows do nothing; reset and back are explicit mouse buttons.
          await clickWorld(400,159); await expectState('CONTROLS','controls enter');
          const ci=await page.evaluate(()=>window.duckHeistEngine.controlIndex);
          await page.keyboard.press('ArrowDown');
          if(await page.evaluate(()=>window.duckHeistEngine.controlIndex)!==ci)throw new Error('keyboard navigates controls menu');
          await clickWorld(100,89);
          if(!(await page.evaluate(()=>window.duckHeistEngine.controlCapture)))throw new Error('control row click did not enter capture');
          await back(); await expectState('SETTINGS','controls back');
          if(await page.evaluate(()=>window.duckHeistEngine.controlCapture)throw new Error('controls back did not cancel capture');
          await back(); await expectState('MENU','settings back');

          // Upgrades: selecting a card is harmless; the visible action button performs purchase.
          await page.evaluate(()=>{const e=window.duckHeistEngine;e.totalGoldenCrumbs=100;e.metaLevels.hp=0;});
          await clickWorld(117,74+3*29+13);await expectState('UPGRADES','upgrades enter');
          await clickWorld(80,101);
          if(await page.evaluate(()=>window.duckHeistEngine.metaLevels.hp)!==0)throw new Error('upgrade card body bought upgrade');
          await clickWorld(376,101);
          if(await page.evaluate(()=>window.duckHeistEngine.metaLevels.hp)!==1)throw new Error('upgrade action failed');
          await back();await expectState('MENU','upgrades back');

          // Collection filter/sort were previously visually clickable but could miss. Verify both plus Career and tabs.
          await clickWorld(117,74+5*29+13);await expectState('COLLECTION','collection enter');
          const f0=await page.evaluate(()=>window.duckHeistEngine.collectionFilter);
          await clickWorld(235,91);
          const f1=await page.evaluate(()=>window.duckHeistEngine.collectionFilter);
          if(f1===f0)throw new Error('collection filter click failed');
          const s0=await page.evaluate(()=>window.duckHeistEngine.collectionSort);
          await clickWorld(318,91);
          if(await page.evaluate(()=>window.duckHeistEngine.collectionSort)===s0)throw new Error('collection sort click failed');
          await clickWorld(100,68);
          if(await page.evaluate(()=>window.duckHeistEngine.collectionTab)==='items')throw new Error('collection tab click failed');
          await clickWorld(407,91);await expectState('CAREER','career enter');
          await clickWorld(411,80);
          if(await page.evaluate(()=>window.duckHeistEngine.careerTab)!==5)throw new Error('career tab click failed');
          await clickWorld(96,329);await expectState('COLLECTION','career back');
          await back();await expectState('MENU','collection back');

          // How-to ignores random clicks; only the visible back button exits.
          await clickWorld(117,74+6*29+13);await expectState('HOW_TO_PLAY','howto enter');
          await clickWorld(240,190);await expectState('HOW_TO_PLAY','howto random click');
          await back();await expectState('MENU','howto back');

          // Gameplay has a mouse-accessible MENU button; pause screens work entirely by click.
          await page.evaluate(()=>{const e=window.duckHeistEngine;e.state='PLAYING';e.gameMode='heist';e.onStateChange?.('PLAYING');});
          await clickWorld(374,14);await expectState('PAUSED','HUD menu click');
          const pi=await page.evaluate(()=>window.duckHeistEngine.pauseIndex);
          await page.keyboard.press('ArrowDown');
          if(await page.evaluate(()=>window.duckHeistEngine.pauseIndex)!==pi)throw new Error('keyboard navigates pause menu');

          // Open run info, switch tab, go back.
          await clickWorld(138,134);await expectState('RUN_INFO','run info click');
          await clickWorld(343,82);
          if(await page.evaluate(()=>window.duckHeistEngine.runInfoTab)!==1)throw new Error('run info tab click failed');
          await clickWorld(91,329);await expectState('PAUSED','run info back');

          // Map via pause, then explicit close button.
          await clickWorld(338,91);await expectState('MAP','map from pause');
          await clickWorld(240,200);await expectState('MAP','map inspection');
          await clickWorld(404,329);await expectState('PAUSED','map close');

          // Destructive pause action exposes clear cancel/confirm controls.
          await clickWorld(338,134);await expectState('CONFIRM','restart confirm');
          await clickWorld(155,247);await expectState('PAUSED','confirm cancel');

          // Resume with first pause card.
          await clickWorld(138,91);await expectState('PLAYING','resume click');

          await noOverflow('final');
          if(errors.length)throw new Error('runtime errors: '+errors.join(' | '));
          console.log(JSON.stringify({keyboardAfter,master,collectionFilter:f1,finalState:await state()},null,2));
          await browser.close();
          JS
      - name: Cleanup temporary QA
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/v080-mouse-menus-qa.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'chore: remove temporary mouse menu QA'
            git push origin HEAD:feature/v080-mouse-first-menu-redesign
          fi
