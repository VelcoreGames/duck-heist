name: v0.8.0 final mouse audit follow-up
on:
  push:
    branches: [feature/v080-mouse-first-menu-redesign]
    paths:
      - '.github/workflows/v080-mouse-menus-audit-followup.yml'
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v080-mouse-first-menu-redesign
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify version
        run: |
          node -e "const p=require('./package.json'); if(p.version!=='0.8.0') throw new Error('Version changed: '+p.version)"
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
      - name: Static audit assertions
        shell: bash
        run: |
          set -euo pipefail
          grep -q "CONSERVAR MIGAS · SIGUIENTE RONDA" src/game/render.ts
          grep -q "No son MONEDAS DORADAS" src/game/render.ts
          grep -q "else if (hit === 'cancel') cancelSwap(engine)" src/App.tsx
          ! grep -q "hit === 'cancel' || hit === -1" src/App.tsx
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Browser mouse QA
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/duck-final-audit.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in {1..50}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep .25; done
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1191,height:900}});
          const errors=[];
          page.on('pageerror',e=>errors.push(String(e)));
          page.on('console',m=>{if(m.type()==='error')errors.push(m.text());});
          await page.goto('http://127.0.0.1:4173/?auditoria=1',{waitUntil:'networkidle'});
          await page.waitForFunction(()=>window.duckHeistEngine);
          await page.evaluate(()=>localStorage.clear());
          await page.reload({waitUntil:'networkidle'});
          await page.waitForFunction(()=>window.duckHeistEngine);
          const canvas=page.locator('canvas[role="application"]');
          const pt=async(x,y)=>{const b=await canvas.boundingBox();if(!b)throw new Error('no canvas');return{x:b.x+x/480*b.width,y:b.y+y/352*b.height};};
          const click=async(x,y)=>{const p=await pt(x,y);await page.mouse.click(p.x,p.y);await page.waitForTimeout(90);};
          const move=async(x,y)=>{const p=await pt(x,y);await page.mouse.move(p.x,p.y);await page.waitForTimeout(50);};
          const wheel=async(delta)=>{const b=await canvas.boundingBox();if(!b)throw new Error('no canvas');await page.mouse.move(b.x+b.width*.7,b.y+b.height*.55);await page.mouse.wheel(0,delta);await page.waitForTimeout(90);};
          const q=fn=>page.evaluate(fn);
          const state=()=>q(()=>window.duckHeistEngine.state);
          const expectState=async(s,label)=>{const got=await state();if(got!==s)throw new Error(label+' expected '+s+' got '+got);};
          const back=()=>click(74,329);

          // Main: mouse-first, all eight entries, hover, and explicit return.
          await expectState('MENU','initial');
          const initialIndex=await q(()=>window.duckHeistEngine.menuIndex);
          await page.keyboard.press('ArrowDown');await page.keyboard.press('Enter');
          if((await state())!=='MENU'||(await q(()=>window.duckHeistEngine.menuIndex))!==initialIndex)throw new Error('keyboard still navigates main menu');
          const expected=['DIFFICULTY','DIFFICULTY','DAILY_BRIEF','UPGRADES','WARDROBE','COLLECTION','HOW_TO_PLAY','SETTINGS'];
          for(let i=0;i<8;i++){
            await move(117,74+i*29+13);
            if((await q(()=>window.duckHeistEngine.menuIndex))!==i)throw new Error('main hover '+i);
            await click(117,74+i*29+13);
            await expectState(expected[i],'main click '+i);
            await back();await expectState('MENU','main back '+i);
          }

          // Difficulty: outside clicks do nothing; cards select; start is separate.
          await click(117,87);await expectState('DIFFICULTY','difficulty open');
          await click(15,200);await expectState('DIFFICULTY','difficulty outside click');
          await click(339,121);
          if((await q(()=>window.duckHeistEngine.difficultyIndex))!==1)throw new Error('difficulty click did not select');
          await back();await expectState('MENU','difficulty back');

          // Settings: label area is inert, explicit controls work.
          await click(117,74+7*29+13);await expectState('SETTINGS','settings');
          await q(()=>{const e=window.duckHeistEngine;e.settings.master=.5;e.settings.damageNumbers=true;});
          await click(55,223);
          if(!(await q(()=>window.duckHeistEngine.settings.damageNumbers)))throw new Error('settings label changed toggle');
          await click(190,223);
          if(await q(()=>window.duckHeistEngine.settings.damageNumbers))throw new Error('settings action did not toggle');
          await click(223,95);
          if(Math.abs((await q(()=>window.duckHeistEngine.settings.master))-.6)>.001)throw new Error('settings plus failed');
          await back();await expectState('MENU','settings back');

          // Upgrades: card body only selects; explicit button buys.
          await q(()=>{const e=window.duckHeistEngine;e.totalGoldenCrumbs=100;e.metaLevels.hp=0;});
          await click(117,74+3*29+13);await expectState('UPGRADES','upgrades');
          await click(80,101);
          if((await q(()=>window.duckHeistEngine.metaLevels.hp))!==0)throw new Error('upgrade body purchased');
          await click(376,101);
          if((await q(()=>window.duckHeistEngine.metaLevels.hp))!==1)throw new Error('upgrade button failed');
          await back();await expectState('MENU','upgrade back');

          // Wardrobe: select, buy, equip, wheel, back.
          await q(()=>{const e=window.duckHeistEngine;e.totalGoldenCrumbs=9999;e.unlockedSkins=['robber'];e.equippedSkin='robber';});
          await click(117,74+4*29+13);await expectState('WARDROBE','wardrobe');
          await click(323,117);
          if((await q(()=>window.duckHeistEngine.wardrobeIndex))!==1)throw new Error('wardrobe select failed');
          await click(110,287);
          if((await q(()=>window.duckHeistEngine.unlockedSkins.length))<2)throw new Error('wardrobe buy failed');
          await click(110,287);
          if((await q(()=>window.duckHeistEngine.equippedSkin))==='robber')throw new Error('wardrobe equip failed');
          const ws0=await q(()=>window.duckHeistEngine.wardrobeScrollTarget);
          await wheel(640);
          const ws1=await q(()=>window.duckHeistEngine.wardrobeScrollTarget);
          if(ws1<ws0)throw new Error('wardrobe wheel moved wrong direction');
          await back();await expectState('MENU','wardrobe back');

          // Collection + Career tools.
          await click(117,74+5*29+13);await expectState('COLLECTION','collection');
          const f0=await q(()=>window.duckHeistEngine.collectionFilter);await click(235,91);
          if((await q(()=>window.duckHeistEngine.collectionFilter))===f0)throw new Error('collection filter failed');
          const s0=await q(()=>window.duckHeistEngine.collectionSort);await click(318,91);
          if((await q(()=>window.duckHeistEngine.collectionSort))===s0)throw new Error('collection sort failed');
          await click(130,68);
          await click(407,91);await expectState('CAREER','career');
          await click(411,80);
          if((await q(()=>window.duckHeistEngine.careerTab))!==5)throw new Error('career tab click failed');
          await click(96,329);await expectState('COLLECTION','career back');
          await back();await expectState('MENU','collection back');

          // Confirm overlay: outside click does not choose; cancel works.
          await q(()=>{const e=window.duckHeistEngine;e.state='PLAYING';e.gameMode='heist';e.onStateChange?.('PLAYING');});
          await click(374,14);await expectState('PAUSED','pause open');
          await click(338,134);await expectState('CONFIRM','restart confirm');
          await click(20,200);await expectState('CONFIRM','confirm outside');
          await click(155,247);await expectState('PAUSED','confirm cancel');

          // Active-item swap: outside click must NOT cancel; explicit Cancel and Change both work.
          await q(()=>{const e=window.duckHeistEngine;e.state='PLAYING';e.player.activeItem='emergency_quack';e.activeSwap={itemId:'bread_grenade',from:'floor',srcIndex:999,worldX:100,worldY:100,roomKey:e.currentKey};e.onStateChange?.('PLAYING');});
          await click(30,180);
          if(!(await q(()=>window.duckHeistEngine.activeSwap)))throw new Error('active swap cancelled from outside click');
          await click(307,242);
          if(await q(()=>window.duckHeistEngine.activeSwap))throw new Error('active swap cancel button failed');
          await q(()=>{const e=window.duckHeistEngine;e.activeSwap={itemId:'bread_grenade',from:'floor',srcIndex:999,worldX:100,worldY:100,roomKey:e.currentKey};});
          await click(173,242);
          if(await q(()=>window.duckHeistEngine.activeSwap))throw new Error('active swap change button failed');
          if((await q(()=>window.duckHeistEngine.player.activeItem))!=='bread_grenade')throw new Error('active item was not changed');

          // Weapon replacement: explicit cancel remains functional.
          await q(()=>{const e=window.duckHeistEngine;e.state='PLAYING';e.swap={itemId:'baguette_launcher',from:'endless',srcIndex:0,slot:0,worldX:0,worldY:0,roomKey:e.currentKey};e.swapSel=0;e.onStateChange?.('PLAYING');});
          await click(240,321);
          if(await q(()=>window.duckHeistEngine.swap))throw new Error('weapon swap cancel failed');

          // Endless reward: direct card selection and recycle-all button.
          await q(()=>{const e=window.duckHeistEngine;e.gameMode='endless';e.state='ENDLESS_REWARD';e.endless.round=3;e.endless.alert=2;e.endless.marketOpen=false;e.endless.awaitingReward=true;e.endless.rewardOptions=[{kind:'crumbs',amount:7,label:'A',description:'A'},{kind:'crumbs',amount:9,label:'B',description:'B'},{kind:'crumbs',amount:11,label:'C',description:'C'}];e.endless.rewardIndex=0;e.player.crumbs=0;e.onStateChange?.('ENDLESS_REWARD');});
          await click(374,174);
          if((await q(()=>window.duckHeistEngine.player.crumbs))!==11)throw new Error('endless direct reward card failed');
          await q(()=>{const e=window.duckHeistEngine;e.state='ENDLESS_REWARD';e.endless.round=3;e.endless.alert=2;e.endless.marketOpen=false;e.endless.awaitingReward=true;e.endless.rewardOptions=[{kind:'crumbs',amount:7,label:'A',description:'A'},{kind:'crumbs',amount:9,label:'B',description:'B'}];e.player.crumbs=5;e.onStateChange?.('ENDLESS_REWARD');});
          await click(240,294);
          if((await q(()=>window.duckHeistEngine.player.crumbs))!==23)throw new Error('endless recycle-all amount failed');

          // Endless market: buy card and continue while preserving run-only Migas.
          await q(()=>{const e=window.duckHeistEngine;e.state='ENDLESS_REWARD';e.gameMode='endless';e.endless.round=10;e.endless.alert=1;e.endless.marketOpen=true;e.endless.marketIndex=0;e.player.crumbs=100;e.player.hp=1;e.player.maxHp=Math.max(3,e.player.maxHp);e.onStateChange?.('ENDLESS_REWARD');});
          await click(106,174);
          if(await q(()=>window.duckHeistEngine.endless.marketOpen))throw new Error('endless market buy did not close market');
          if((await q(()=>window.duckHeistEngine.player.crumbs))!==79)throw new Error('endless market cost mismatch');
          await q(()=>{const e=window.duckHeistEngine;e.state='ENDLESS_REWARD';e.endless.round=10;e.endless.alert=1;e.endless.marketOpen=true;e.endless.marketIndex=0;e.player.crumbs=77;e.onStateChange?.('ENDLESS_REWARD');});
          await click(240,294);
          if((await q(()=>window.duckHeistEngine.player.crumbs))!==77)throw new Error('migas were not conserved');
          if(await q(()=>window.duckHeistEngine.endless.marketOpen))throw new Error('continue-with-migas failed');

          // Result buttons use the exact same shared geometry for draw/hover/click.
          await q(()=>{const e=window.duckHeistEngine;e.gameMode='heist';e.pendingMode='heist';e.state='GAME_OVER';e.pauseIndex=0;e.onStateChange?.('GAME_OVER');});
          await click(20,300);await expectState('GAME_OVER','game over outside click');
          await move(240,323);
          if((await q(()=>window.duckHeistEngine.pauseIndex))!==1)throw new Error('end result hover geometry mismatch');
          await click(240,323);await expectState('MENU','game over menu button');
          await q(()=>{const e=window.duckHeistEngine;e.gameMode='heist';e.state='VICTORY';e.pauseIndex=0;e.onStateChange?.('VICTORY');});
          await click(240,323);await expectState('MENU','victory menu button');
          await q(()=>{const e=window.duckHeistEngine;e.gameMode='daily';e.state='GAME_OVER';e.pauseIndex=0;e.onStateChange?.('GAME_OVER');});
          await click(240,323);await expectState('MENU','daily result menu button');

          const overflow=await q(()=>({x:document.documentElement.scrollWidth>innerWidth,y:document.documentElement.scrollHeight>innerHeight}));
          if(overflow.x||overflow.y)throw new Error('document overflow '+JSON.stringify(overflow));
          if(errors.length)throw new Error('runtime errors '+errors.join(' | '));
          console.log(JSON.stringify({ok:true,finalState:await state()},null,2));
          await browser.close();
          JS
      - name: Commit rebuilt bundle and remove temporary QA
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/v080-mouse-menus-audit-followup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'chore: rebuild v0.8.0 bundle after final mouse QA'
            git push origin HEAD:feature/v080-mouse-first-menu-redesign
          fi
