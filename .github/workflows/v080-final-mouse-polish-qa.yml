name: v0.8.0 final mouse polish QA
on:
  push:
    branches: [fix/v080-mouse-menu-final-polish]
    paths:
      - 'src/**'
      - 'package*.json'
      - '.github/workflows/v080-final-mouse-polish-qa.yml'
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v080-mouse-menu-final-polish
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Verify version remains v0.8.0
        run: |
          node -e "const p=require('./package.json'); if(p.version!=='0.8.0') process.exit(1);"
          grep -q "v0.8.0" src/game/render.ts
          grep -q "MIGAS · MONEDA TEMPORAL DE ESTA PARTIDA" src/game/render.ts
          grep -q "CONSERVAR MIGAS · SIGUIENTE RONDA" src/game/render.ts
          ! grep -q "GUARDAR MIGAJAS Y SEGUIR" src/game/render.ts
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Browser mouse QA
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/duck-final-polish.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in {1..40}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep .25; done
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1191,height:900}});
          const errors=[];
          page.on('pageerror',e=>errors.push(String(e)));
          page.on('console',m=>{if(m.type()==='error')errors.push(m.text());});
          await page.goto('http://127.0.0.1:4173/?auditoria=1',{waitUntil:'networkidle'});
          await page.waitForFunction(()=>window.duckHeistEngine);
          await page.evaluate(()=>localStorage.clear());
          const canvas=page.locator('canvas[role="application"]');
          const pt=async(x,y)=>{const b=await canvas.boundingBox();if(!b)throw new Error('no canvas');return{x:b.x+x/480*b.width,y:b.y+y/352*b.height};};
          const clickWorld=async(x,y)=>{const p=await pt(x,y);await page.mouse.click(p.x,p.y);await page.waitForTimeout(90);};
          const state=()=>page.evaluate(()=>window.duckHeistEngine.state);

          await page.evaluate(()=>{window.duckHeistEngine.testing=true;});

          // Armario: selección, compra, equipar, rueda y Volver.
          await page.evaluate(()=>{
            const e=window.duckHeistEngine;
            e.state='WARDROBE';e.wardrobeIndex=0;e.wardrobeScroll=0;e.wardrobeScrollTarget=0;
            e.totalGoldenCrumbs=9999;e.unlockedSkins=['robber'];e.equippedSkin='robber';e.onStateChange?.('WARDROBE');
          });
          await clickWorld(310,110);
          if((await page.evaluate(()=>window.duckHeistEngine.wardrobeIndex))!==1) throw new Error('wardrobe card selection failed');
          const beforeCoins=await page.evaluate(()=>window.duckHeistEngine.totalGoldenCrumbs);
          await clickWorld(110,287);
          const bought=await page.evaluate(()=>({n:window.duckHeistEngine.unlockedSkins.length,coins:window.duckHeistEngine.totalGoldenCrumbs}));
          if(bought.n<2||bought.coins>=beforeCoins) throw new Error('wardrobe buy failed '+JSON.stringify(bought));
          await clickWorld(110,287);
          if((await page.evaluate(()=>window.duckHeistEngine.equippedSkin))==='robber') throw new Error('wardrobe equip failed');
          const wp=await pt(330,220);await page.mouse.move(wp.x,wp.y);await page.mouse.wheel(0,450);await page.waitForTimeout(100);
          if((await page.evaluate(()=>window.duckHeistEngine.wardrobeScrollTarget))<=0) throw new Error('wardrobe wheel failed');
          await clickWorld(70,329);
          if((await state())!=='MENU') throw new Error('wardrobe back failed');

          // Mejoras: cuerpo de tarjeta no compra; insuficiente y máximo tampoco.
          await page.evaluate(()=>{
            const e=window.duckHeistEngine;e.state='UPGRADES';e.metaLevels.hp=0;e.totalGoldenCrumbs=0;e.onStateChange?.('UPGRADES');
          });
          await clickWorld(90,101);
          if((await page.evaluate(()=>window.duckHeistEngine.metaLevels.hp))!==0) throw new Error('upgrade body purchased');
          await clickWorld(376,101);
          if((await page.evaluate(()=>window.duckHeistEngine.metaLevels.hp))!==0) throw new Error('upgrade bought without funds');
          await page.evaluate(()=>{const e=window.duckHeistEngine;e.metaLevels.hp=99;e.totalGoldenCrumbs=99999;});
          await clickWorld(376,101);
          if((await page.evaluate(()=>window.duckHeistEngine.metaLevels.hp))!==99) throw new Error('upgrade max guard failed');
          await clickWorld(70,329);

          // Cambio de arma: ambos slots y cancelar.
          await page.evaluate(()=>{
            const e=window.duckHeistEngine;e.state='PLAYING';e.player.weapons[1]={...e.player.weapons[0]};
            const content=e.contents.get(e.currentKey);content.items=[{x:220,y:160,itemId:'breadcrumb_shotgun',isWeapon:true,isActive:false}];
            e.swap={itemId:'breadcrumb_shotgun',slot:0,from:'floor',srcIndex:0,worldX:220,worldY:160,roomKey:e.currentKey};e.swapSel=0;e.onStateChange?.('PLAYING');
          });
          await clickWorld(143,213);
          if((await page.evaluate(()=>window.duckHeistEngine.player.weapons[0]?.id))!=='breadcrumb_shotgun') throw new Error('weapon swap slot 1 failed');
          await page.evaluate(()=>{
            const e=window.duckHeistEngine;const content=e.contents.get(e.currentKey);
            content.items.unshift({x:220,y:160,itemId:'feather_gun',isWeapon:true,isActive:false});
            e.swap={itemId:'feather_gun',slot:1,from:'floor',srcIndex:0,worldX:220,worldY:160,roomKey:e.currentKey};e.swapSel=0;
          });
          await clickWorld(336,213);
          if((await page.evaluate(()=>window.duckHeistEngine.player.weapons[1]?.id))!=='feather_gun') throw new Error('weapon swap slot 2 failed');
          await page.evaluate(()=>{const e=window.duckHeistEngine;e.swap={itemId:'breadcrumb_shotgun',slot:0,from:'endless',srcIndex:0,worldX:220,worldY:160};});
          await clickWorld(240,321);
          if(await page.evaluate(()=>!!window.duckHeistEngine.swap)) throw new Error('weapon swap cancel failed');

          // Cambio de activo: confirmar funciona y clic fuera no actúa.
          await page.evaluate(()=>{
            const e=window.duckHeistEngine;e.player.activeItem='emergency_quack';
            const content=e.contents.get(e.currentKey);content.items.unshift({x:220,y:160,itemId:'bread_bomb',isWeapon:false,isActive:true});
            e.activeSwap={itemId:'bread_bomb',from:'floor',srcIndex:0,worldX:220,worldY:160,roomKey:e.currentKey};
          });
          await clickWorld(20,60);
          if(!(await page.evaluate(()=>!!window.duckHeistEngine.activeSwap))) throw new Error('active swap cancelled by outside click');
          await clickWorld(173,242);
          const active=await page.evaluate(()=>({swap:!!window.duckHeistEngine.activeSwap,id:window.duckHeistEngine.player.activeItem}));
          if(active.swap||active.id!=='bread_bomb') throw new Error('active swap confirm failed '+JSON.stringify(active));
          await page.evaluate(()=>{
            const e=window.duckHeistEngine;e.activeSwap={itemId:'emergency_quack',from:'endless',srcIndex:0,worldX:220,worldY:160,roomKey:e.currentKey};
          });
          await clickWorld(307,242);
          if(await page.evaluate(()=>!!window.duckHeistEngine.activeSwap)) throw new Error('active swap cancel button failed');

          // Resultado: la geometría visible y clicable comparte el mismo layout.
          await page.evaluate(()=>{
            const e=window.duckHeistEngine;e.gameMode='heist';e.pendingMode='heist';e.state='GAME_OVER';e.pauseIndex=0;e.onStateChange?.('GAME_OVER');
          });
          await clickWorld(240,297);
          if((await state())==='GAME_OVER') throw new Error('result first button failed');

          // Menú principal desde resultado, usando geometría compartida.
          await page.evaluate(()=>{
            const e=window.duckHeistEngine;e.gameMode='endless';e.state='GAME_OVER';e.pauseIndex=1;e.endless.round=3;e.onStateChange?.('GAME_OVER');
          });
          await clickWorld(240,312);
          if((await state())!=='MENU') throw new Error('endless result menu button failed');

          // Resultado diario comparte la misma geometría.
          await page.evaluate(()=>{
            const e=window.duckHeistEngine;e.gameMode='daily';e.state='GAME_OVER';e.pauseIndex=1;e.onStateChange?.('GAME_OVER');
          });
          await clickWorld(240,312);
          if((await state())!=='MENU') throw new Error('daily result menu button failed');

          // Mercado de Respiro: conservar migas avanza sin gastarlas.
          await page.evaluate(()=>{
            const e=window.duckHeistEngine;
            e.gameMode='endless';e.state='ENDLESS_REWARD';e.endless.round=10;e.endless.alert=1;
            e.endless.marketOpen=true;e.endless.awaitingReward=false;e.player.crumbs=73;e.onStateChange?.('ENDLESS_REWARD');
          });
          await clickWorld(240,282);
          const market=await page.evaluate(()=>({state:window.duckHeistEngine.state,open:window.duckHeistEngine.endless.marketOpen,crumbs:window.duckHeistEngine.player.crumbs}));
          if(market.open||market.crumbs!==73) throw new Error('conserve migas action incorrect '+JSON.stringify(market));

          // El clic fuera de una confirmación no ejecuta nada.
          await page.evaluate(()=>{
            const e=window.duckHeistEngine;e.state='PAUSED';e.confirmKind='restart';e.confirmReturnState='PAUSED';e.state='CONFIRM';e.onStateChange?.('CONFIRM');
          });
          await clickWorld(30,300);
          if((await state())!=='CONFIRM') throw new Error('confirmation reacted to outside click');

          const overflow=await page.evaluate(()=>({x:document.documentElement.scrollWidth>innerWidth,y:document.documentElement.scrollHeight>innerHeight}));
          if(overflow.x||overflow.y) throw new Error('document overflow '+JSON.stringify(overflow));
          if(errors.length) throw new Error('runtime errors '+errors.join(' | '));
          console.log(JSON.stringify({market,finalState:await state(),overflow},null,2));
          await browser.close();
          JS
      - name: Publish rebuilt bundle and remove temporary QA
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/v080-final-mouse-polish-qa.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist .github/workflows/v080-final-mouse-polish-qa.yml
          if ! git diff --cached --quiet; then
            git commit -m 'chore: publish verified v0.8.0 mouse menu polish'
            git push origin HEAD:fix/v080-mouse-menu-final-polish
          fi
