name: Inspect archived AppDeploy settings behavior

on:
  push:
    paths:
      - '.github/workflows/inspect-appdeploy-settings-behavior.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout exact archived AppDeploy snapshot
        uses: actions/checkout@v4
        with:
          ref: fc214761adaedf60e8fe6a4dc3cedd3ea1b0d9e7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extract bundle contexts
        run: |
          mkdir -p /tmp/appdeploy-settings-behavior
          python3 - <<'PY'
          from pathlib import Path
          s=Path('appdeploy-live/assets/index-BgUNQzP_.js').read_text()
          needles=['duckheist_locale','cursorStyle','IDIOMA','CURSOR','SILENCIAR TODO','settingMaster','muted']
          out=[]
          for needle in needles:
            out.append(f'\n===== {needle} =====\n')
            start=0;hits=0
            while True:
              i=s.find(needle,start)
              if i<0: break
              hits+=1;out.append(s[max(0,i-1400):min(len(s),i+2600)])
              start=i+len(needle)
              if hits>=8: break
            if not hits: out.append('NO MATCH\n')
          Path('/tmp/appdeploy-settings-behavior/bundle-contexts.txt').write_text('\n'.join(out))
          PY
      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Probe deployed settings behavior
        run: |
          cd appdeploy-live
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/appdeploy-settings-http.log 2>&1 &
          echo $! >/tmp/appdeploy-settings-http.pid
          cd "$GITHUB_WORKSPACE"
          node <<'NODE'
          const {chromium}=require('playwright');const fs=require('fs');
          const out='/tmp/appdeploy-settings-behavior',sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({viewport:{width:1440,height:1000},deviceScaleFactor:1});
            const p=await context.newPage();
            const errors=[];p.on('console',m=>{if(m.type()==='error')errors.push(m.text())});p.on('pageerror',e=>errors.push(e.message));
            await p.addInitScript(()=>{window.__storageWrites=[];const orig=Storage.prototype.setItem;Storage.prototype.setItem=function(k,v){window.__storageWrites.push({k,v});return orig.call(this,k,v)}});
            await p.goto(`http://127.0.0.1:4173/?settingsProbe=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:60000});await sleep(900);
            for(let i=0;i<5;i++){await p.keyboard.press('KeyS');await sleep(40)}await p.keyboard.press('Enter');await sleep(300);
            const rows=['IDIOMA','VOLUMEN GENERAL','MÚSICA','EFECTOS DE SONIDO','BRILLO','VIBRACIÓN DE PANTALLA','NÚMEROS DE DAÑO','PANTALLA COMPLETA','CURSOR','PROBAR CUAC','PROBAR ESQUIVE'];
            const cursorCycle=[];
            // Language is real and persisted independently.
            const langBefore=await p.evaluate(()=>({lang:document.documentElement.lang,locale:localStorage.getItem('duckheist_locale')}));
            await p.keyboard.press('ArrowRight');await sleep(120);
            const langAfter=await p.evaluate(()=>({lang:document.documentElement.lang,locale:localStorage.getItem('duckheist_locale')}));
            await p.keyboard.press('ArrowLeft');await sleep(120);
            // Cursor row = 8. Capture 16 successive values to identify wrap/count.
            for(let i=0;i<8;i++){await p.keyboard.press('ArrowDown');await sleep(25)}
            for(let i=0;i<16;i++){
              const state=await p.evaluate(()=>{const raw=localStorage.getItem('duckheist_save');let save=null;try{save=raw?JSON.parse(raw):null}catch{};return {cursorStyle:save?.settings?.cursorStyle??0,cursors:[...document.querySelectorAll('canvas')].map(c=>getComputedStyle(c).cursor)}});
              cursorCycle.push(state);
              if(i<12) await p.screenshot({path:`${out}/cursor-${String(i).padStart(2,'0')}.png`,fullPage:true});
              await p.keyboard.press('ArrowRight');await sleep(70);
            }
            fs.writeFileSync(`${out}/behavior.json`,JSON.stringify({rows,langBefore,langAfter,cursorCycle,writes:await p.evaluate(()=>window.__storageWrites||[]),errors},null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          kill "$(cat /tmp/appdeploy-settings-http.pid)" || true
      - name: Upload behavior probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duck-heist-appdeploy-settings-behavior
          path: /tmp/appdeploy-settings-behavior
          if-no-files-found: error
          retention-days: 7
