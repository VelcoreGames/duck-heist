name: v0.8.0 responsive fullscreen QA
on:
  push:
    branches: [feat/v080-responsive-fullscreen-world]
    paths:
      - '.github/workflows/v080-responsive-fullscreen-qa.yml'

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v080-responsive-fullscreen-world
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Guard v0.8.0
        run: |
          node -e "const p=require('./package.json'); if(p.version!=='0.8.0') throw new Error('version changed')"
          test "$(tr -d '\r\n' < VERSION)" = "0.8.0"
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Validate responsive source invariants
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const constants=fs.readFileSync('src/game/constants.ts','utf8');
          const app=fs.readFileSync('src/App.tsx','utf8');
          const mapgen=fs.readFileSync('src/game/mapgen.ts','utf8');
          if(!constants.includes('responsiveRoomWidth'))throw new Error('responsive room width missing');
          if(!constants.includes('if (tiles % 2 === 0) tiles += 1'))throw new Error('odd room width guard missing');
          if(!app.includes('const displayW=fullscreen?Math.max(1,Math.floor(availW))'))throw new Error('fullscreen width-first layout missing');
          if(!app.includes('const uiPoint='))throw new Error('legacy UI pointer transform missing');
          if(!mapgen.includes("const lx=(x:number)=>x+Math.floor((ROOM_WIDTH-15)/2)"))throw new Error('room template centering missing');
          console.log(JSON.stringify({responsiveWorld:true,uniformFullscreen:true,legacyUiTransform:true,version:'0.8.0'},null,2));
          JS
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Browser QA across aspect ratios
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/fullscreen-http.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in {1..60}; do curl -fsS http://127.0.0.1:4173/duck-heist/ >/dev/null && break; sleep .25; done

          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const cases=[
            {name:'16:9',w:1920,h:1080},
            {name:'capture',w:2048,h:1000},
            {name:'21:9',w:3440,h:1440},
            {name:'32:9',w:5120,h:1440},
          ];
          const reports=[];
          for(const tc of cases){
            const context=await browser.newContext({
              viewport:{width:Math.min(tc.w,1600),height:Math.min(tc.h,900)},
              screen:{width:tc.w,height:tc.h},
              deviceScaleFactor:1,
            });
            const page=await context.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push('pageerror '+e));
            page.on('console',m=>{if(m.type()==='error')errors.push('console '+m.text());});
            await page.goto('http://127.0.0.1:4173/duck-heist/?auditoria=1',{waitUntil:'networkidle'});
            await page.waitForFunction(()=>window.duckHeistAudit&&window.duckHeistEngine);
            const initial=await page.evaluate(()=> {
              const wc=document.querySelector('canvas[aria-hidden="true"]');
              const stage=document.querySelector('.duck-responsive-stage');
              const e=window.duckHeistEngine;
              return {
                canvasW:wc.width,canvasH:wc.height,
                roomCols:e.map.rooms.get(e.currentKey).layout[0].length,
                stageW:stage.getBoundingClientRect().width,
                stageH:stage.getBoundingClientRect().height,
                state:e.state,
                selftests:window.duckHeistAudit.passed,
                failures:window.duckHeistAudit.failures
              };
            });
            if(initial.failures.length)throw new Error(tc.name+' selftests '+initial.failures.join(' | '));
            if(initial.selftests<452)throw new Error(tc.name+' selftests regressed '+initial.selftests);
            if(initial.canvasW!==initial.roomCols*32)throw new Error(tc.name+' room/canvas mismatch '+JSON.stringify(initial));
            if(initial.roomCols<15||initial.roomCols%2===0)throw new Error(tc.name+' invalid room width '+initial.roomCols);

            // The legacy 480px menu is centered inside the wider logical arena.
            if(initial.roomCols>15){
              const clicked=await page.evaluate(()=>{
                const e=window.duckHeistEngine;
                const stage=document.querySelector('.duck-responsive-stage').getBoundingClientRect();
                const wc=document.querySelector('canvas[aria-hidden="true"]');
                const offset=(wc.width-480)/2;
                return {x:stage.left+(offset+80)/wc.width*stage.width,y:stage.top+92/wc.height*stage.height};
              });
              await page.mouse.click(clicked.x,clicked.y);
              await page.waitForTimeout(80);
              const state=await page.evaluate(()=>window.duckHeistEngine.state);
              if(state!=='DIFFICULTY')throw new Error(tc.name+' centered menu click failed, state='+state);
              await page.keyboard.press('Escape');
              await page.waitForTimeout(50);
            }

            // F must enter fullscreen and the stage must become exactly viewport-wide.
            await page.locator('canvas[role="application"]').focus();
            await page.keyboard.press('f');
            let fullscreenSupported=true;
            try{
              await page.waitForFunction(()=>!!document.fullscreenElement,{timeout:2500});
            }catch{
              fullscreenSupported=false;
            }
            let full=null;
            if(fullscreenSupported){
              await page.waitForTimeout(120);
              full=await page.evaluate(()=>{
                const stage=document.querySelector('.duck-responsive-stage').getBoundingClientRect();
                const wc=document.querySelector('canvas[aria-hidden="true"]');
                const sx=stage.width/wc.width,sy=stage.height/wc.height;
                return {
                  innerW:innerWidth,innerH:innerHeight,
                  stageW:stage.width,stageH:stage.height,
                  logicalW:wc.width,logicalH:wc.height,
                  sx,sy,
                  fullscreen:!!document.fullscreenElement
                };
              });
              if(Math.abs(full.stageW-full.innerW)>1.5)throw new Error(tc.name+' fullscreen is not viewport-wide '+JSON.stringify(full));
              if(Math.abs(full.sx-full.sy)>.015)throw new Error(tc.name+' nonuniform scaling '+JSON.stringify(full));
              if(full.stageH>full.innerH+2)throw new Error(tc.name+' fullscreen overflows vertically '+JSON.stringify(full));
              await page.keyboard.press('f');
              await page.waitForTimeout(80);
            }

            if(errors.length)throw new Error(tc.name+' runtime '+errors.join(' | '));
            reports.push({case:tc.name,screen:tc.w+'x'+tc.h,roomCols:initial.roomCols,logical:initial.canvasW+'x'+initial.canvasH,fullscreenSupported,full});
            await context.close();
          }
          console.log(JSON.stringify({cases:reports,runtimeErrors:[]},null,2));
          await browser.close();
          JS
      - name: Refresh dist and remove temporary workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          rm -f .github/workflows/v080-responsive-fullscreen-qa.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'build: refresh responsive fullscreen bundle'
            git push origin HEAD:feat/v080-responsive-fullscreen-world
          fi
