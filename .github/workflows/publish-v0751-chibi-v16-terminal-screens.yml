name: Publish Duck Heist v0.7.51 Chibi V16 Terminal Screens

on:
  push:
    paths:
      - '.github/workflows/publish-v0751-chibi-v16-terminal-screens.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Apply approved terminal V16 presentation
        run: |
          python scripts/patch-v0751-v16-terminal-screens.py
          sed -i 's/0.7.51-chibi-v16-terminal-screens-candidate/0.7.51-chibi-v16-terminal-screens/g' index.html
          npm version 0.7.51 --no-git-tag-version
          printf '0.7.51\n' > VERSION

      - name: Validate release source
        run: |
          grep -q 'celebrating: true' src/game/render.ts
          grep -q 'dead: true' src/game/render.ts
          grep -q 'ctx.scale(.78, .78)' src/game/render.ts
          grep -q 'ctx.scale(.75, .75)' src/game/render.ts
          grep -q 'ctx.translate(CANVAS_WIDTH / 2, 114)' src/game/render.ts
          ! grep -q 'drawDuck(ctx, 0, 0, f' src/game/render.ts
          ! grep -q "drawDuckSkin(ctx,0,Math.sin(f\*.05)\*1.5" src/game/render.ts
          grep -q '0.7.51-chibi-v16-terminal-screens' index.html
          ! grep -q 'terminal-screens-candidate' index.html
          grep -q '"version": "0.7.51"' package.json
          grep -q 'const DRAW = 46' src/game/graphics/playerChibiAtlasV16.ts
          grep -q '464-raster-chibi-v16' src/game/graphics/playerChibiAtlasV16.ts
          grep -q 'v16.8-death-focus' src/game/graphics/playerChibiAtlasV16.ts
          grep -q 'no hair' scripts/generate-player-chibi-v16.py
          grep -q 'no glasses' scripts/generate-player-chibi-v16.py
          npx tsc --noEmit
          git diff --check

      - name: Build v0.7.51 web release
        run: |
          rm -rf /tmp/duck-heist-v0751 web-release dist
          npx vite build --outDir /tmp/duck-heist-v0751 --emptyOutDir
          test -s /tmp/duck-heist-v0751/index.html
          grep -q '0.7.51-chibi-v16-terminal-screens' /tmp/duck-heist-v0751/index.html
          grep -q '464-raster-chibi-v16' /tmp/duck-heist-v0751/index.html
          grep -q 'canvas2d-chibi-atlas-v16' /tmp/duck-heist-v0751/index.html
          grep -q 'v16.8-death-focus' /tmp/duck-heist-v0751/index.html
          mkdir -p web-release
          cp -a /tmp/duck-heist-v0751/. web-release/
          node scripts/publish-release.mjs

      - name: Validate publish artifacts
        run: |
          test -s web-release/index.html
          test -s dist/index.html
          grep -q '^0.7.51$' VERSION
          grep -q '0.7.51-chibi-v16-terminal-screens' web-release/index.html
          grep -q '0.7.51-chibi-v16-terminal-screens' dist/index.html
          cmp web-release/index.html dist/index.html
          git diff --check

      - name: Commit v0.7.51 to main
        run: |
          git config user.name 'VelcoreGames'
          git config user.email 'contacto@velcore.com.mx'
          git add src/game/render.ts index.html package.json package-lock.json VERSION web-release dist
          git diff --cached --stat
          git diff --cached --quiet && { echo 'No release changes to commit'; exit 1; }
          git commit -m 'Release Duck Heist v0.7.51 Chibi V16 terminal screens'
          git pull --rebase origin main
          git push origin HEAD:main
