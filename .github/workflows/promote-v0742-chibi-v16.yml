name: Promote Duck Heist v0.7.42 Chibi V16

on:
  push:
    paths:
      - '.github/workflows/promote-v0742-chibi-v16.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: pip install --disable-pip-version-check pillow

      - name: Apply approved V16.4 candidate
        run: |
          python scripts/patch-v0742-v16-combat-readability.py
          python scripts/patch-v0742-clipping-margin.py
          python scripts/patch-v0742-depth-perspective-polish.py
          python scripts/generate-player-chibi-v16.py
          npm version 0.7.42 --no-git-tag-version

      - name: Validate release source
        run: |
          python - <<'PY'
          from PIL import Image
          im=Image.open('src/assets/chibi/base-duck-chibi-v16-atlas.png').convert('RGBA'); im.load()
          assert im.size==(7424,256),im.size
          bad=[]
          for r in range(4):
            for c in range(116):
              a=im.crop((c*64,r*64,(c+1)*64,(r+1)*64)).getchannel('A')
              b=a.point(lambda v:255 if v>64 else 0).getbbox(); assert b,(r,c)
              if b[0]<1 or b[1]<1 or b[2]>63 or b[3]>63: bad.append((r,c,b))
          assert not bad,bad[:20]
          print('464 V16.4 frames validated with clipping margin')
          PY
          grep -q '0.7.42-chibi-v16-combat-readability' index.html
          grep -q 'front_gun_layer' scripts/generate-player-chibi-v16.py
          grep -q 'rear_gun_layer' scripts/generate-player-chibi-v16.py
          grep -q "no hair, hat or eyewear" scripts/generate-player-chibi-v16.py
          grep -q '"version": "0.7.42"' package.json
          grep -q '"version": "0.7.42"' package-lock.json
          npx tsc --noEmit
          npx vite build --outDir /tmp/v0742-release-build --emptyOutDir
          grep -q '0.7.42-chibi-v16-combat-readability' /tmp/v0742-release-build/index.html
          git diff --check

      - name: Commit v0.7.42 release source to main
        run: |
          git config user.name 'VelcoreGames'
          git config user.email 'contacto@velcore.com.mx'
          git add index.html package.json package-lock.json scripts/generate-player-chibi-v16.py src/game/graphics/playerChibiAtlasV16.ts src/assets/chibi/base-duck-chibi-v16-atlas.png
          git diff --cached --stat
          git diff --cached --quiet && { echo 'No release changes to commit'; exit 1; }
          git commit -m 'Release Duck Heist v0.7.42 Chibi V16 combat polish'
          git push origin HEAD:main
