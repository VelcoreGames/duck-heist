name: Test Visual Repair

on:
  push:
    branches:
      - migration/cloudflare-pages
    paths:
      - 'duck-heist-playable-bfvyg1-1788926588197-src/**'
      - '.github/workflows/test-visual-repair.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: duck-heist-playable-bfvyg1-1788926588197-src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: duck-heist-playable-bfvyg1-1788926588197-src/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Verify visual repair hooks
        run: |
          grep -q "skinId==='robber'" src/visual-v2/materializeVisualEngineV2.mjs
          grep -q "logicalW:36,logicalH:36" src/visual-v2/materializeVisualEngineV2.mjs
          grep -q "renderW=34,renderH=40" src/gameplay/materializeMacroPatoSpriteAsset.mjs
          test -f dist/index.html
