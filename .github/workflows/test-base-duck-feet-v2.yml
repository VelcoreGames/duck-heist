name: Test Base Duck Feet V2

on:
  push:
    branches:
      - migration/cloudflare-pages
    paths:
      - 'duck-heist-playable-bfvyg1-1788926588197-src/**'
      - '.github/workflows/test-base-duck-feet-v2.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: duck-heist-playable-bfvyg1-1788926588197-src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - name: Verify feet animation and angry face
        run: |
          grep -q "Individual foot crops" src/visual-v2/materializeBaseDuckMotionV2.mjs
          grep -q "drawFoot(40,94,25,18" src/visual-v2/materializeBaseDuckMotionV2.mjs
          grep -q "drawDuckAngryFaceV2" src/visual-v2/materializeBaseDuckMotionV2.mjs
          test -f dist/index.html
