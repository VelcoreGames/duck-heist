name: Publish Duck Heist v0.7.45 Chibi V16 Impact FX

on:
  push:
    paths:
      - '.github/workflows/publish-v0745-chibi-v16-impact-fx.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Apply approved V16.7 impact FX pass
        run: |
          python scripts/patch-v0745-v16-impact-fx.py
          sed -i 's/0.7.45-chibi-v16-impact-fx-candidate/0.7.45-chibi-v16-impact-fx/g' index.html
          npm version 0.7.45 --no-git-tag-version
          printf '0.7.45\n' > VERSION

      - name: Validate release source
        run: |
          grep -q 'const DRAW = 46' src/game/graphics/playerChibiAtlasV16.ts
          grep -q 'v16.7-impact-fx' src/game/graphics/playerChibiAtlasV16.ts
          grep -q 'drawDownFx' src/game/graphics/playerChibiAtlasV16.ts
          grep -q '0.7.45-chibi-v16-impact-fx' index.html
          ! grep -q 'impact-fx-candidate' index.html
          grep -q '"version": "0.7.45"' package.json
          grep -q '464-raster-chibi-v16' src/game/graphics/playerChibiAtlasV16.ts
          grep -q 'no hair' scripts/generate-player-chibi-v16.py
          grep -q 'no glasses' scripts/generate-player-chibi-v16.py
          npx tsc --noEmit
          git diff --check

      - name: Build v0.7.45 web release
        run: |
          rm -rf /tmp/duck-heist-v0745 web-release dist
          npx vite build --outDir /tmp/duck-heist-v0745 --emptyOutDir
          test -s /tmp/duck-heist-v0745/index.html
          grep -q '0.7.45-chibi-v16-impact-fx' /tmp/duck-heist-v0745/index.html
          grep -q '464-raster-chibi-v16' /tmp/duck-heist-v0745/index.html
          grep -q 'canvas2d-chibi-atlas-v16' /tmp/duck-heist-v0745/index.html
          mkdir -p web-release
          cp -a /tmp/duck-heist-v0745/. web-release/
          node scripts/publish-release.mjs

      - name: Validate publish artifacts
        run: |
          test -s web-release/index.html
          test -s dist/index.html
          grep -q '^0.7.45$' VERSION
          grep -q '0.7.45-chibi-v16-impact-fx' web-release/index.html
          grep -q '0.7.45-chibi-v16-impact-fx' dist/index.html
          cmp web-release/index.html dist/index.html
          git diff --check

      - name: Commit v0.7.45 to main
        run: |
          git config user.name 'VelcoreGames'
          git config user.email 'contacto@velcore.com.mx'
          git add src/game/graphics/playerChibiAtlasV16.ts index.html package.json package-lock.json VERSION web-release dist
          git diff --cached --stat
          git diff --cached --quiet && { echo 'No release changes to commit'; exit 1; }
          git commit -m 'Release Duck Heist v0.7.45 Chibi V16 impact FX'
          git pull --rebase origin main
          git push origin HEAD:main
