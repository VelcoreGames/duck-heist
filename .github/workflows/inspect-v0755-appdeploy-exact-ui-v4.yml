name: Inspect Duck Heist v0.7.55 AppDeploy Exact UI v4

on:
  push:
    paths:
      - '.github/workflows/inspect-v0755-appdeploy-exact-ui-v4.yml'
      - 'scripts/patch-v0755-appdeploy-exact-ui-v4.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Apply v4 candidate
        run: python scripts/patch-v0755-appdeploy-exact-ui-v4.py

      - name: Validate restoration scope
        run: |
          grep -q '0.7.55-appdeploy-exact-ui-candidate-v4' index.html
          grep -q "key: 'language'" src/game/engine.ts
          grep -q "key: 'cursorStyle'" src/game/engine.ts
          grep -q "key: 'difficulty'" src/game/engine.ts
          grep -q 'SETTINGS_MUTE' src/game/layout.ts
          grep -q 'duckheist_locale' src/game/i18n.ts
          grep -q 'CURSOR_DATA_URIS' src/game/cursors.ts
          grep -q 'cursorStyle: number' src/game/types.ts
          grep -q 'BOCINA · SILENCIAR TODO' src/game/render.ts
          grep -q 'canvas2d-chibi-atlas-v16' src/game/graphics/playerChibiAtlasV16.ts
          grep -q '464-raster-chibi-v16' src/game/graphics/playerChibiAtlasV16.ts
          git diff --check

      - name: Add local-only QA engine hook
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/App.tsx');s=p.read_text()
          old='''    const engine = createEngine(wc, wctx, uctx);\n    engineRef.current = engine;\n'''
          new='''    const engine = createEngine(wc, wctx, uctx);\n    engineRef.current = engine;\n    (window as Window & { __duckQaEngine?: GameEngine }).__duckQaEngine = engine;\n'''
          if s.count(old)!=1: raise SystemExit('QA hook anchor mismatch')
          p.write_text(s.replace(old,new,1))
          PY

      - name: TypeScript and build
        run: |
          npx tsc --noEmit
          rm -rf /tmp/v0755-v4-build
          npx vite build --outDir /tmp/v0755-v4-build --emptyOutDir
          grep -q '0.7.55-appdeploy-exact-ui-candidate-v4' /tmp/v0755-v4-build/index.html
          grep -q 'canvas2d-chibi-atlas-v16' /tmp/v0755-v4-build/index.html
          grep -q '464-raster-chibi-v16' /tmp/v0755-v4-build/index.html

      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Functional and visual QA
        run: |
          mkdir -p /tmp/v0755-v4-review
          cd /tmp/v0755-v4-build
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/v0755-v4-http.log 2>&1 &
          echo $! >/tmp/v0755-v4-http.pid
          cd "$GITHUB_WORKSPACE"
          node <<'NODE'
          const {chromium}=require('playwright');const fs=require('fs'),assert=require('assert');
          const out='/tmp/v0755-v4-review',sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const errors=[],failed=[],bad=[],samples={};
          async function E(p){return p.evaluate(()=>{const e=window.__duckQaEngine;if(!e)throw new Error('engine missing');return {state:e.state,menuIndex:e.menuIndex,settingsIndex:e.settingsIndex,settings:e.settings,lang:document.documentElement.lang,locale:localStorage.getItem('duckheist_locale'),cursor:getComputedStyle(document.querySelector('canvas[role="application"]')).cursor,renderer:document.documentElement.dataset.duckHeistRenderer||'',frames:document.documentElement.dataset.duckHeistPlayerFrames||''};});}
          (async()=>{
            const browser=await chromium.launch({headless:true});const context=await browser.newContext({viewport:{width:1440,height:1000},deviceScaleFactor:1});const p=await context.newPage();
            p.on('console',m=>{if(m.type()==='error')errors.push(m.text())});p.on('pageerror',e=>errors.push(e.message));p.on('requestfailed',r=>failed.push(`${r.method()} ${r.url()} ${r.failure()?.errorText||''}`));p.on('response',r=>{if(r.status()>=400)bad.push(`${r.status()} ${r.url()}`)});
            await p.goto(`http://127.0.0.1:4173/?qa=v0755v4&t=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:60000});await sleep(1000);
            assert.strictEqual(await p.evaluate(()=>document.querySelector('meta[name="duck-heist-build"]')?.content),'0.7.55-appdeploy-exact-ui-candidate-v4');
            let s=await E(p);assert.strictEqual(s.renderer,'canvas2d-chibi-atlas-v16');assert.strictEqual(s.frames,'464-raster-chibi-v16');
            await p.screenshot({path:`${out}/01-menu-es.png`,fullPage:true});

            // Open settings through the real six-item menu.
            for(let i=0;i<5;i++){await p.keyboard.press('KeyS');await sleep(45)}await p.keyboard.press('Enter');await sleep(250);
            s=await E(p);assert.strictEqual(s.state,'SETTINGS');assert.strictEqual(s.settingsIndex,0);samples.settingsStart=s;
            await p.screenshot({path:`${out}/02-settings-es.png`,fullPage:true});

            // New difficulty remains real.
            await p.keyboard.press('ArrowRight');await sleep(100);s=await E(p);assert.strictEqual(s.settings.difficulty,'hard');samples.hard=s;
            await p.screenshot({path:`${out}/03-settings-hard.png`,fullPage:true});

            // Historical language row returns and visibly/persistently switches.
            await p.keyboard.press('ArrowDown');await p.keyboard.press('ArrowRight');await sleep(180);s=await E(p);assert.strictEqual(s.locale,'en-US');assert.strictEqual(s.lang,'en');samples.english=s;
            await p.screenshot({path:`${out}/04-settings-en.png`,fullPage:true});

            // Mute is the separate speaker action, not a row.
            await p.keyboard.press('KeyM');await sleep(120);s=await E(p);assert.strictEqual(s.settings.muted,true);samples.muted=s;
            await p.screenshot({path:`${out}/05-settings-en-muted.png`,fullPage:true});

            // Cursor row: from index 1 move to index 9 and cycle. Verify actual CSS and persistence.
            for(let i=0;i<8;i++){await p.keyboard.press('ArrowDown');await sleep(25)}
            s=await E(p);assert.strictEqual(s.settingsIndex,9);const c0=s.settings.cursorStyle;
            await p.keyboard.press('ArrowRight');await sleep(120);s=await E(p);assert.strictEqual(s.settings.cursorStyle,(c0+1)%12);assert.ok(s.cursor.includes('data:image/png;base64'));samples.cursor=s;
            await p.screenshot({path:`${out}/06-settings-cursor.png`,fullPage:true});

            // Reload persistence for all newly restored controls.
            await p.reload({waitUntil:'domcontentloaded'});await sleep(700);s=await E(p);assert.strictEqual(s.settings.difficulty,'hard');assert.strictEqual(s.settings.muted,true);assert.strictEqual(s.locale,'en-US');assert.strictEqual(s.settings.cursorStyle,(c0+1)%12);samples.reloaded=s;

            // Main navigation remains usable after locale/settings changes.
            await p.evaluate(()=>{const e=window.__duckQaEngine;e.state='MENU';e.menuIndex=0;});await sleep(180);await p.screenshot({path:`${out}/07-menu-en.png`,fullPage:true});
            assert.strictEqual(errors.length,0,errors.join(' | '));assert.strictEqual(failed.length,0,failed.join(' | '));assert.strictEqual(bad.length,0,bad.join(' | '));
            fs.writeFileSync(`${out}/qa.json`,JSON.stringify({samples,errors,failed,bad},null,2));await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          kill "$(cat /tmp/v0755-v4-http.pid)" || true

      - name: Upload review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duck-heist-v0755-appdeploy-exact-ui-candidate-v4
          path: /tmp/v0755-v4-review
          if-no-files-found: warn
          retention-days: 7
