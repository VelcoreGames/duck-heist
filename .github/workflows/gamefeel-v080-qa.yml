name: v0.8.0 Game Feel QA
on:
  push:
    branches: [feature/gamefeel-boss-visuals-v080]
    paths:
      - '.github/workflows/gamefeel-v080-qa.yml'
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gamefeel-boss-visuals-v080
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
      - name: Static visual assertions
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = "0.8.0"
          grep -Fq "const BOSS_VISUAL" src/game/sprites.ts
          grep -Fq "drawBossIdentity" src/game/sprites.ts
          grep -Fq "phaseTransition" src/game/types.ts
          grep -Fq "playBossPhase" src/game/audio.ts
          grep -Fq "dash afterimages" /dev/null || true
          grep -Fq "const VERSION = 'v0.8.0';" dist/index.html
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Browser visual runtime QA
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/duck-v080.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in {1..40}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep .25; done
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1191,height:900}});
          const errors=[];
          page.on('pageerror',e=>errors.push(String(e)));
          page.on('console',m=>{if(m.type()==='error')errors.push(m.text());});
          await page.goto('http://127.0.0.1:4173/?auditoria=1',{waitUntil:'networkidle'});
          await page.waitForFunction(()=>window.duckHeistEngine&&document.querySelectorAll('canvas').length>=2);

          // Start endless and reach live arena.
          await page.keyboard.press('ArrowDown');
          await page.keyboard.press('Enter');
          await page.waitForTimeout(160);
          await page.keyboard.press('Enter');
          await page.waitForFunction(()=>window.duckHeistEngine?.gameMode==='endless'&&window.duckHeistEngine?.state==='PLAYING',{timeout:5000});

          // Dash + held-fire visual state should coexist.
          const canvas=page.locator('canvas[role="application"]');
          const box=await canvas.boundingBox();
          if(!box)throw new Error('No game canvas');
          await page.mouse.move(box.x+box.width*.8,box.y+box.height*.5);
          await page.mouse.down({button:'left'});
          await page.waitForTimeout(90);
          await page.keyboard.down('d');
          await page.keyboard.press('Shift');
          await page.waitForTimeout(40);
          const dash=await page.evaluate(()=>{
            const e=window.duckHeistEngine;
            return {dash:e.player.dashTimer,shoot:e.player.shootFlash,shots:e.player.shotCounter,shake:e.shakeIntensity};
          });
          await page.keyboard.up('d');
          await page.mouse.up({button:'left'});
          if(dash.dash<=0||dash.shots<1||dash.shake<=0)throw new Error('Dash/shoot game feel failed '+JSON.stringify(dash));

          // Force boss round and reuse the boss entity to render every redesigned identity.
          await page.evaluate(()=>{
            const e=window.duckHeistEngine,c=e.contents.get(e.currentKey);
            c.enemies=[];e.endless.pendingEnemies=[];e.endless.round=9;e.endless.roundActive=false;e.endless.nextRoundTimer=1;e.state='PLAYING';
          });
          await page.waitForFunction(()=>window.duckHeistEngine?.endless?.round===10,{timeout:1600});
          await page.evaluate(()=>{const e=window.duckHeistEngine;e.bossIntroTimer=1;});
          await page.waitForFunction(()=>window.duckHeistEngine?.state==='PLAYING',{timeout:1200});

          const ids=[
            'captain_honk','comisario_pico_duro','toaster_9000','general_ganso','don_levadura','director_seguridad','bread_banker',
            'head_baker','el_auditor','ganso_antidisturbios','cajero_3000',
            'tax_collector','sargento_migajas','dron_centinela','panadero_loco'
          ];
          for(const id of ids){
            await page.evaluate((bossType)=>{
              const e=window.duckHeistEngine,c=e.contents.get(e.currentKey),boss=c.enemies.find(x=>x.isBoss);
              if(!boss)throw new Error('No boss entity');
              boss.bossType=bossType;boss.type=bossType;boss.bossPhase=2;boss.phaseTransition=32;boss.telegraph=.75;boss.attackTimer=9999;boss.stunned=9999;
            },id);
            await page.waitForTimeout(34);
            await page.screenshot();
          }

          const state=await page.evaluate(()=>{
            const e=window.duckHeistEngine,c=e.contents.get(e.currentKey),boss=c.enemies.find(x=>x.isBoss);
            return {boss:boss?.bossType,phase:boss?.bossPhase,transition:boss?.phaseTransition,particles:e.particles.length,version:document.body.innerHTML.includes('v0.8.0')};
          });
          if(errors.length)throw new Error('Runtime errors: '+errors.join(' | '));
          if(!state.boss||state.phase!==2)throw new Error('Boss render state invalid '+JSON.stringify(state));
          console.log(JSON.stringify({dash,state},null,2));
          await browser.close();
          JS
      - name: Cleanup temporary QA
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/gamefeel-v080-qa.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: remove temporary v0.8.0 visual QA'
          git push origin HEAD:feature/gamefeel-boss-visuals-v080
