name: Inspect Player Atlas Silhouettes

on:
  push:
    paths:
      - 'scripts/player_atlas_ascii.py'
      - '.github/workflows/inspect-player-atlas-ascii.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python scripts/player_atlas_ascii.py
      - run: test -s docs/PLAYER_ATLAS_ASCII.txt
      - name: Commit inspection
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/PLAYER_ATLAS_ASCII.txt
          git commit -m 'docs: inspect remastered player atlas silhouettes'
          git pull --rebase origin main
          git push origin HEAD:main
