name: QA Production v0.7.52 Chibi Skins

on:
  push:
    paths:
      - '.github/workflows/qa-production-v0752-chibi-skins.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wait for Hostinger production build
        run: |
          expected='0.7.52-chibi-skin-coherence'
          mkdir -p /tmp/v0752-production-qa
          for i in $(seq 1 30); do
            curl -fsSL --retry 2 --retry-delay 2 "https://velcoregames.com/?qa=v0752&t=$(date +%s%N)" -o /tmp/v0752-production.html || true
            if grep -Fq "$expected" /tmp/v0752-production.html 2>/dev/null; then
              cp /tmp/v0752-production.html /tmp/v0752-production-qa/index.html
              echo "Hostinger production is on $expected"
              exit 0
            fi
            echo "Attempt $i/30: production has not switched yet"
            sleep 10
          done
          echo 'Hostinger did not expose v0.7.52 in time'
          exit 1

      - name: Verify exact released inline app is deployed
        run: |
          python - <<'PY'
          from pathlib import Path
          prod=Path('/tmp/v0752-production.html').read_bytes().rstrip(b'\r\n')
          rel=Path('web-release/index.html').read_bytes().rstrip(b'\r\n')
          if prod != rel:
              raise SystemExit('Hostinger HTML does not byte-match web-release after trailing newline normalization')
          PY
          grep -q '0.7.52-chibi-skin-coherence' /tmp/v0752-production.html
          grep -q '464-raster-chibi-v16' /tmp/v0752-production.html
          grep -q 'canvas2d-chibi-atlas-v16' /tmp/v0752-production.html
          grep -q 'v16.8-death-focus' /tmp/v0752-production.html
          grep -q 'const DRAW_SCALE = .66' src/game/graphics/playerChibiV3.ts
          grep -q "case 'fedora'" src/game/graphics/playerChibiV3.ts
          grep -q "case 'king'" src/game/graphics/playerChibiV3.ts
          grep -q "if (input.celebrating) return 'celebrate'" src/game/graphics/playerChibiV3.ts
          grep -q "if (input.interacting) return 'interact'" src/game/graphics/playerChibiV3.ts
          ! grep -q 'drawDuckSkin' src/game/render.ts
          echo 'Hostinger is serving the exact released v0.7.52 inline app'

      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify base V16 and real non-default skin gameplay
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');const fs=require('fs'),assert=require('assert'),crypto=require('crypto');
          const out='/tmp/v0752-production-qa',expected='0.7.52-chibi-skin-coherence',sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const errors=[],failed=[],bad=[],samples={};
          const hash=b=>crypto.createHash('sha256').update(b).digest('hex');
          async function ds(p){return p.evaluate(()=>({build:document.querySelector('meta[name="duck-heist-build"]')?.content||'',renderer:document.documentElement.dataset.duckHeistPlayerRenderer||'',frames:document.documentElement.dataset.duckHeistPlayerFrames||'',fx:document.documentElement.dataset.duckHeistPlayerFx||'',state:document.documentElement.dataset.duckHeistPlayerState||'',visualFrame:document.documentElement.dataset.duckHeistPlayerVisualFrame||''}));}
          async function startBase(p){await p.goto(`https://velcoregames.com/?qa=v0752-base&t=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:60000});await sleep(1800);assert.strictEqual((await ds(p)).build,expected);const c=p.locator('canvas[role="application"]');assert.strictEqual(await c.count(),1);await c.focus();await p.keyboard.press('Enter');for(let i=0;i<6;i++){await sleep(850);const d=await ds(p);if(d.state==='idle'&&d.frames==='464-raster-chibi-v16')break;await p.keyboard.press('Enter');}await sleep(3200);const d=await ds(p);assert.strictEqual(d.state,'idle');assert.strictEqual(d.renderer,'canvas2d-chibi-atlas-v16');assert.strictEqual(d.frames,'464-raster-chibi-v16');assert.strictEqual(d.fx,'v16.8-death-focus');return d;}
          async function moveBase(p,key,label){await p.keyboard.down(key);await sleep(160);const a=await ds(p);await sleep(320);const b=await ds(p);await p.keyboard.up(key);await sleep(180);assert.strictEqual(a.state,'walk',`${label}: first walk sample`);assert.strictEqual(b.state,'walk',`${label}: second walk sample`);return {a,b};}
          async function shootBase(p,key,label){await p.keyboard.down(key);let hit=null;for(let i=0;i<35;i++){await sleep(16);const d=await ds(p);if(d.state==='shoot'){hit=d;break;}}await p.keyboard.up(key);assert(hit,`${label}: shoot not observed`);await sleep(420);return hit;}
          async function startSkin(p){await p.goto(`https://velcoregames.com/?qa=v0752-gangster&t=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:60000});await sleep(1800);assert.strictEqual((await ds(p)).build,expected);const saved=await p.evaluate(()=>JSON.parse(localStorage.getItem('duckheist_save')||'{}'));assert.strictEqual(saved.equippedSkin,'gangster');assert(saved.unlockedSkins.includes('gangster'));const c=p.locator('canvas[role="application"]');assert.strictEqual(await c.count(),1);await c.focus();await p.keyboard.press('Enter');await sleep(5200);const d=await ds(p);assert(['webgl2-chibi-v3','canvas2d-fallback'].includes(d.renderer),`gangster renderer ${d.renderer}`);return d;}
          (async()=>{const browser=await chromium.launch({headless:true});
          const base=await browser.newContext({viewport:{width:1440,height:1000},deviceScaleFactor:1});const p=await base.newPage();p.on('console',m=>{if(m.type()==='error')errors.push(m.text())});p.on('pageerror',e=>errors.push(e.message));p.on('requestfailed',r=>failed.push(`${r.method()} ${r.url()} ${r.failure()?.errorText||''}`));p.on('response',r=>{if(r.status()>=400)bad.push(`${r.status()} ${r.url()}`)});
          samples.baseIdle=await startBase(p);samples.baseUp=await moveBase(p,'w','base-up');samples.baseDown=await moveBase(p,'s','base-down');samples.baseRight=await moveBase(p,'d','base-right');await p.keyboard.down('d');await sleep(90);await p.keyboard.press('Shift');await sleep(55);samples.baseDash=await ds(p);await p.keyboard.up('d');assert.strictEqual(samples.baseDash.state,'dash');await sleep(850);samples.baseShootRight=await shootBase(p,'ArrowRight','base-right');samples.baseShootDown=await shootBase(p,'ArrowDown','base-down');samples.baseShootUp=await shootBase(p,'ArrowUp','base-up');await p.screenshot({path:`${out}/01-base-v16-smoke.png`,fullPage:true});await base.close();
          const skin=await browser.newContext({viewport:{width:1440,height:1000},deviceScaleFactor:1});await skin.addInitScript(()=>{localStorage.setItem('duckheist_save',JSON.stringify({version:4,unlockedSkins:['robber','gangster'],equippedSkin:'gangster'}));});const q=await skin.newPage();q.on('console',m=>{if(m.type()==='error')errors.push(m.text())});q.on('pageerror',e=>errors.push(e.message));q.on('requestfailed',r=>failed.push(`${r.method()} ${r.url()} ${r.failure()?.errorText||''}`));q.on('response',r=>{if(r.status()>=400)bad.push(`${r.status()} ${r.url()}`)});
          samples.gangsterReady=await startSkin(q);const before=await q.screenshot({fullPage:true});await q.keyboard.down('d');await sleep(520);const walking=await q.screenshot({fullPage:true});await q.keyboard.up('d');assert.notStrictEqual(hash(before),hash(walking),'gangster movement produced no visual change');samples.gangsterWalk={renderer:(await ds(q)).renderer,before:hash(before),after:hash(walking)};await sleep(220);await q.keyboard.down('ArrowRight');await sleep(95);const shooting=await q.screenshot({fullPage:true});await q.keyboard.up('ArrowRight');assert.notStrictEqual(hash(walking),hash(shooting),'gangster shooting produced no visual change');samples.gangsterShoot={renderer:(await ds(q)).renderer,frame:hash(shooting)};await sleep(500);await q.keyboard.down('d');await sleep(90);await q.keyboard.press('Shift');await sleep(75);const dash=await q.screenshot({fullPage:true});await q.keyboard.up('d');assert.notStrictEqual(hash(shooting),hash(dash),'gangster dash produced no visual change');samples.gangsterDash={renderer:(await ds(q)).renderer,frame:hash(dash)};assert(['webgl2-chibi-v3','canvas2d-fallback'].includes(samples.gangsterDash.renderer));fs.writeFileSync(`${out}/02-gangster-gameplay.png`,dash);await skin.close();
          assert.strictEqual(errors.length,0,errors.join(' | '));assert.strictEqual(failed.length,0,failed.join(' | '));assert.strictEqual(bad.length,0,bad.join(' | '));fs.writeFileSync(`${out}/qa.json`,JSON.stringify({scope:'v0.7.52 exact Hostinger bundle + base V16 deterministic smoke + real saved gangster V3 renderer/input visual smoke. All wardrobe identities and king interaction were screenshot-verified in candidate run 34796762451.',samples,errors,failed,bad},null,2));await browser.close();})().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Upload production QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duck-heist-v0752-production-qa
          path: /tmp/v0752-production-qa
          if-no-files-found: warn
          retention-days: 7
