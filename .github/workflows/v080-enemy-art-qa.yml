name: v0.8.0 Enemy art overhaul QA
on:
  push:
    branches: [art/v080-enemy-visual-overhaul]
    paths:
      - '.github/workflows/v080-enemy-art-qa.yml'
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: art/v080-enemy-visual-overhaul
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Version guard
        run: node -e "const p=require('./package.json'); if(p.version!=='0.8.0') throw new Error('version changed')"
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Browser art regression audit
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/duck-enemy-art.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in {1..40}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep .25; done
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1191,height:900}});
          const errors=[];
          page.on('pageerror',e=>errors.push(String(e)));
          page.on('console',m=>{if(m.type()==='error')errors.push(m.text());});
          await page.goto('http://127.0.0.1:4173/?auditoria=1',{waitUntil:'networkidle'});
          await page.waitForFunction(()=>window.duckHeistAudit && window.duckHeistEngine);
          const audit=await page.evaluate(()=>window.duckHeistAudit);
          if(audit.failures.length)throw new Error('self audit: '+audit.failures.join(' | '));
          const renderStates=await page.evaluate(async()=>{
            const e=window.duckHeistEngine, wait=()=>new Promise(r=>requestAnimationFrame(()=>r()));
            const out=[];
            for(const tab of ['enemies','bosses']){
              e.collectionTab=tab;e.collectionFilter='all';e.collectionIndex=0;e.collectionScroll=0;e.state='COLLECTION';e.onStateChange?.('COLLECTION');await wait();
              const c=e.ui;
              if(!c)throw new Error('missing ui context');
              const img=c.getImageData(0,0,c.canvas.width,c.canvas.height).data;
              let opaque=0;for(let i=3;i<img.length;i+=16)if(img[i]>0)opaque++;
              out.push({tab,opaque});
            }
            return out;
          });
          if(renderStates.some(x=>x.opaque<1000))throw new Error('collection render too sparse '+JSON.stringify(renderStates));
          const overflow=await page.evaluate(()=>({x:document.documentElement.scrollWidth>innerWidth,y:document.documentElement.scrollHeight>innerHeight}));
          if(overflow.x||overflow.y)throw new Error('overflow '+JSON.stringify(overflow));
          if(errors.length)throw new Error('runtime '+errors.join(' | '));
          console.log(JSON.stringify({auditPassed:audit.passed,renderStates,failures:[],overflow},null,2));
          await browser.close();
          JS
      - name: Refresh dist and cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          rm -f .github/workflows/v080-enemy-art-qa.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'build: refresh v0.8.0 enemy art overhaul bundle'
            git push origin HEAD:art/v080-enemy-visual-overhaul
          fi
