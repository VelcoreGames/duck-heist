name: Publish Duck Heist v0.6.2 Premium Player

on:
  push:
    paths:
      - '.github/workflows/publish-v062-premium-player.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore premium V5 atlas from official project history
        run: |
          git fetch origin fix/base-duck-png-v5:refs/remotes/origin/fix/base-duck-png-v5
          mkdir -p src/assets/chibi
          git show "origin/fix/base-duck-png-v5:duck-heist-playable-bfvyg1-1788926588197-src/public/assets-v2/base-duck-final-atlas.png" > src/assets/chibi/base-duck-final-atlas.png
          node <<'NODE'
          const fs=require('fs');
          const p='src/assets/chibi/base-duck-final-atlas.png';
          const b=fs.readFileSync(p);
          if (b.length < 4096 || b[0]!==0x89 || b[1]!==0x50 || b[2]!==0x4e || b[3]!==0x47) throw new Error('Invalid premium V5 PNG atlas');
          const w=b.readUInt32BE(16), h=b.readUInt32BE(20);
          if (w!==1040 || h!==208) throw new Error(`Unexpected premium atlas dimensions ${w}x${h}; expected 1040x208`);
          console.log(`Premium V5 atlas OK: ${w}x${h}, ${b.length} bytes, 80 authored frames`);
          NODE

      - name: Activate premium V5 player renderer
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('src/game/render.ts')
          s=path.read_text(encoding='utf-8')
          old_import="import { drawChibiPlayerAtlasV4 } from './graphics/playerChibiAtlasV4';"
          new_import="import { drawChibiPlayerAtlasV5 } from './graphics/playerChibiAtlasV5';"
          if old_import in s:
              s=s.replace(old_import,new_import,1)
          elif new_import not in s:
              raise SystemExit('V5 player renderer import anchor missing')
          if 'drawChibiPlayerAtlasV4({' in s:
              s=s.replace('drawChibiPlayerAtlasV4({','drawChibiPlayerAtlasV5({',1)
          elif 'drawChibiPlayerAtlasV5({' not in s:
              raise SystemExit('V5 player renderer call anchor missing')
          path.write_text(s,encoding='utf-8')
          PY

      - name: Validate premium player source
        run: |
          npx tsc --noEmit
          npx tsc --noEmit --strict --target ES2020 --module ESNext \
            --moduleResolution bundler --lib ES2020,DOM,DOM.Iterable \
            --skipLibCheck src/game/graphics/*.ts src/game/graphics/gpu/*.ts
          grep -q "drawChibiPlayerAtlasV5" src/game/render.ts
          ! grep -q "drawChibiPlayerAtlasV4({" src/game/render.ts
          grep -q "CHIBI_BASE_DUCK_V5_AUTHORED_FRAMES = 80" src/game/graphics/playerChibiAtlasV5.ts
          grep -q "CHIBI_BASE_DUCK_V5_RUNTIME_POSES = 368" src/game/graphics/playerChibiAtlasV5.ts
          test -s src/assets/chibi/base-duck-final-atlas.png
          npx vite build --outDir /tmp/duck-heist-v062 --emptyOutDir
          test -s /tmp/duck-heist-v062/index.html

      - name: Promote v0.6.2
        run: |
          npm version 0.6.2 --no-git-tag-version
          printf '0.6.2\n' > VERSION
          rm -rf web-release dist
          mkdir -p web-release
          cp -a /tmp/duck-heist-v062/. web-release/
          node scripts/publish-release.mjs

      - name: Validate promoted release
        run: |
          test -s web-release/index.html
          test -s dist/index.html
          grep -q 'Duck Heist' web-release/index.html
          grep -q '"version": "0.6.2"' package.json
          grep -q '^0.6.2$' VERSION
          ! grep -R -q 'v0.4.3' web-release
          cmp web-release/index.html dist/index.html
          echo "v0.6.2 premium player release ready"

      - name: Commit v0.6.2 release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A src/game/render.ts src/assets/chibi/base-duck-final-atlas.png web-release dist VERSION package.json package-lock.json
          if git diff --cached --quiet; then
            echo 'Release already up to date.'
            exit 0
          fi
          git commit -m 'Release Duck Heist v0.6.2 premium chibi player'
          git pull --rebase origin main
          git push origin HEAD:main
