name: Inspect Duck Heist v0.7.51 V16 Terminal Screens

on:
  push:
    paths:
      - '.github/workflows/inspect-v0751-v16-terminal-screens.yml'
      - 'scripts/patch-v0751-v16-terminal-screens.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Apply terminal V16 candidate
        run: python scripts/patch-v0751-v16-terminal-screens.py

      - name: Validate candidate scope and source
        run: |
          grep -q '0.7.51-chibi-v16-terminal-screens-candidate' index.html
          grep -q 'celebrating: true' src/game/render.ts
          grep -q 'dead: true' src/game/render.ts
          grep -q 'ctx.scale(.78, .78)' src/game/render.ts
          grep -q 'ctx.scale(.75, .75)' src/game/render.ts
          grep -q 'ctx.translate(CANVAS_WIDTH / 2, 114)' src/game/render.ts
          ! grep -q 'drawDuck(ctx, 0, 0, f' src/game/render.ts
          ! grep -q "drawDuckSkin(ctx,0,Math.sin(f\*.05)\*1.5" src/game/render.ts
          grep -q 'drawDuckSkin' src/game/render.ts
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' index.html src/game/render.ts | sort)"
          test "$changed" = "$expected"
          git diff --check

      - name: Add local-only QA engine hook
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/App.tsx');s=p.read_text()
          old='''    const engine = createEngine(wc, wctx, uctx);\n    engineRef.current = engine;\n'''
          new='''    const engine = createEngine(wc, wctx, uctx);\n    engineRef.current = engine;\n    (window as Window & { __duckQaEngine?: GameEngine }).__duckQaEngine = engine;\n'''
          if s.count(old)!=1: raise SystemExit('QA hook anchor mismatch')
          p.write_text(s.replace(old,new,1))
          PY

      - name: Validate TypeScript and build
        run: |
          npx tsc --noEmit
          rm -rf /tmp/v0751-build
          npx vite build --outDir /tmp/v0751-build --emptyOutDir
          grep -q '0.7.51-chibi-v16-terminal-screens-candidate' /tmp/v0751-build/index.html
          grep -q '464-raster-chibi-v16' /tmp/v0751-build/index.html
          grep -q 'canvas2d-chibi-atlas-v16' /tmp/v0751-build/index.html

      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify terminal V16 presentation
        run: |
          mkdir -p /tmp/v0751-review
          cd /tmp/v0751-build
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/v0751-http.log 2>&1 &
          echo $! >/tmp/v0751-http.pid
          cd "$GITHUB_WORKSPACE"
          node <<'NODE'
          const {chromium}=require('playwright');const fs=require('fs'),assert=require('assert');
          const out='/tmp/v0751-review',expected='0.7.51-chibi-v16-terminal-screens-candidate',sleep=ms=>new Promise(r=>setTimeout(r,ms));const errors=[],failed=[],bad=[],samples={};
          async function ds(p){return p.evaluate(()=>({build:document.querySelector('meta[name="duck-heist-build"]')?.content||'',renderer:document.documentElement.dataset.duckHeistPlayerRenderer||'',frames:document.documentElement.dataset.duckHeistPlayerFrames||'',state:document.documentElement.dataset.duckHeistPlayerState||'',visualFrame:document.documentElement.dataset.duckHeistPlayerVisualFrame||''}));}
          async function boot(p,label){await p.goto(`http://127.0.0.1:4173/?qa=v0751-${label}&t=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:60000});await sleep(800);assert.strictEqual((await ds(p)).build,expected);assert.strictEqual(await p.locator('canvas[role="application"]').count(),1);}
          async function waitV16(p,state){for(let i=0;i<60;i++){await sleep(50);const d=await ds(p);if(d.renderer==='canvas2d-chibi-atlas-v16'&&d.frames==='464-raster-chibi-v16'&&d.state===state)return d;}throw new Error(`V16 ${state} terminal state not reached`);}
          (async()=>{const browser=await chromium.launch({headless:true});const context=await browser.newContext({viewport:{width:1440,height:1000},deviceScaleFactor:1});const p=await context.newPage();p.on('console',m=>{if(m.type()==='error')errors.push(m.text())});p.on('pageerror',e=>errors.push(e.message));p.on('requestfailed',r=>failed.push(`${r.method()} ${r.url()} ${r.failure()?.errorText||''}`));p.on('response',r=>{if(r.status()>=400)bad.push(`${r.status()} ${r.url()}`)});
          await boot(p,'gameover');await p.evaluate(()=>{const e=window.__duckQaEngine;if(!e)throw new Error('engine missing');e.player.hp=0;e.player.deathTimer=36;e.state='GAME_OVER';});samples.gameover=await waitV16(p,'down');await sleep(450);samples.gameoverSettled=await ds(p);assert.strictEqual(samples.gameoverSettled.state,'down');await p.screenshot({path:`${out}/01-game-over-v16.png`,fullPage:true});
          await boot(p,'victory');await p.evaluate(()=>{const e=window.__duckQaEngine;if(!e)throw new Error('engine missing');e.player.hp=e.player.maxHp;e.player.deathTimer=0;e.state='VICTORY';});samples.victoryA=await waitV16(p,'celebrate');await sleep(240);samples.victoryB=await ds(p);assert.strictEqual(samples.victoryB.state,'celebrate');assert.notStrictEqual(samples.victoryA.visualFrame,samples.victoryB.visualFrame,'victory celebrate frame did not advance');await p.screenshot({path:`${out}/02-victory-v16.png`,fullPage:true});
          assert.strictEqual(errors.length,0,errors.join(' | '));assert.strictEqual(failed.length,0,failed.join(' | '));assert.strictEqual(bad.length,0,bad.join(' | '));fs.writeFileSync(`${out}/qa.json`,JSON.stringify({samples,errors,failed,bad},null,2));await browser.close();})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          kill "$(cat /tmp/v0751-http.pid)" || true

      - name: Upload candidate review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duck-heist-v0751-terminal-v16-candidate
          path: /tmp/v0751-review
          if-no-files-found: warn
          retention-days: 7
