name: Test Player Animation V3

on:
  push:
    branches:
      - feature/player-animation-v3
    paths:
      - 'duck-heist-playable-bfvyg1-1788926588197-src/**'
      - '.github/workflows/test-player-animation-v3.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: duck-heist-playable-bfvyg1-1788926588197-src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - name: Verify animation state machine
        run: |
          grep -q "DUCK_PLAYER_ANIMATION_V3" src/visual-v2/materializeBaseDuckMotionV2.mjs
          grep -q "walk:12" src/visual-v2/materializeBaseDuckMotionV2.mjs
          grep -q "shoot:6" src/visual-v2/materializeBaseDuckMotionV2.mjs
          grep -q "pickup:8" src/visual-v2/materializeBaseDuckMotionV2.mjs
          grep -q "triggerPlayerPickupAnim" src/visual-v2/materializeBaseDuckMotionV2.mjs
          test -f dist/index.html
