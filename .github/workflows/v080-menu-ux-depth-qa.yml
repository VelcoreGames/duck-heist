name: v0.8.0 menu UX depth QA
on:
  push:
    branches: [feature/v080-menu-ux-depth]
    paths:
      - '.github/workflows/v080-menu-ux-depth-qa.yml'
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v080-menu-ux-depth
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
      - name: UX and version invariants
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = "0.8.0"
          grep -Fq '"version": "0.8.0"' package.json
          grep -Fq "const VERSION = 'v0.8.0';" dist/index.html
          grep -Fq "RUN_INFO = 'RUN_INFO'" src/game/constants.ts
          grep -Fq "CONFIRM = 'CONFIRM'" src/game/constants.ts
          grep -Fq "REDUCIR MOVIMIENTO UI" src/game/engine.ts
          grep -Fq "CANCELAR ES LA OPCIÓN PREDETERMINADA" src/game/render.ts
          grep -Fq "CONTINUAR SIN FIN" src/game/render.ts
          grep -Fq "INFO DE RUN" src/game/render.ts
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Menu UX and combat regression smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/duck-menu-ux.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in {1..40}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep .25; done
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1191,height:900}});
          const errors=[];
          page.on('pageerror',e=>errors.push(String(e)));
          page.on('console',m=>{if(m.type()==='error')errors.push(m.text());});
          await page.goto('http://127.0.0.1:4173/?auditoria=1',{waitUntil:'networkidle'});
          await page.waitForFunction(()=>window.duckHeistEngine && document.querySelectorAll('canvas').length>=2);
          const snap=async label=>{
            await page.waitForTimeout(70);
            const v=await page.evaluate(()=>({
              state:window.duckHeistEngine.state,
              pauseIndex:window.duckHeistEngine.pauseIndex,
              runInfoTab:window.duckHeistEngine.runInfoTab,
              confirmIndex:window.duckHeistEngine.confirmIndex,
              confirmKind:window.duckHeistEngine.confirmKind,
              reduceMotion:window.duckHeistEngine.settings.reduceMotion,
              overflowX:document.documentElement.scrollWidth>innerWidth,
              overflowY:document.documentElement.scrollHeight>innerHeight
            }));
            if(v.overflowX||v.overflowY) throw new Error(label+' overflow');
            return v;
          };

          // Ensure saved Endless context is surfaced without changing normal-save behavior.
          await page.evaluate(()=>{
            const e=window.duckHeistEngine;
            e.endlessCheckpointRound=23;
            e.endlessCheckpointDifficulty='normal';
            e.menuIndex=1;
          });
          const main=await snap('main checkpoint');
          if(main.state!=='MENU')throw new Error('not in menu');

          // Settings: reduced-motion toggle exists and can be changed through input.
          await page.evaluate(()=>{const e=window.duckHeistEngine;e.menuIndex=6;});
          await page.keyboard.press('Enter');
          await page.waitForFunction(()=>window.duckHeistEngine.state==='SETTINGS');
          await page.evaluate(()=>{window.duckHeistEngine.settingsIndex=5;});
          const beforeMotion=await page.evaluate(()=>window.duckHeistEngine.settings.reduceMotion);
          await page.keyboard.press('Enter');
          const afterMotion=await page.evaluate(()=>window.duckHeistEngine.settings.reduceMotion);
          if(beforeMotion===afterMotion)throw new Error('reduce motion did not toggle');
          await page.keyboard.press('Escape');

          // Start a run.
          await page.evaluate(()=>{const e=window.duckHeistEngine;e.menuIndex=0;e.pendingMode='heist';});
          await page.keyboard.press('Enter');
          await page.waitForFunction(()=>window.duckHeistEngine.state==='DIFFICULTY');
          await page.keyboard.press('Enter');
          await page.waitForTimeout(1800);
          if((await page.evaluate(()=>window.duckHeistEngine.state))==='HEIST_INTRO'){
            await page.keyboard.press('Enter');await page.waitForTimeout(1200);
          }
          await page.waitForFunction(()=>window.duckHeistEngine.state==='PLAYING',{timeout:6000});

          // Combat regression: held fire survives right-click dash.
          const canvas=page.locator('canvas[role="application"]');
          const box=await canvas.boundingBox();
          if(!box)throw new Error('no application canvas');
          await page.evaluate(()=>{const e=window.duckHeistEngine;e.player.dashCooldown=0;e.player.dashTimer=0;e.transition.active=false;});
          await page.mouse.move(box.x+box.width*.72,box.y+box.height*.52);
          await page.mouse.down({button:'left'});
          await page.waitForTimeout(100);
          await page.evaluate(()=>{
            const canvas=document.querySelector('canvas[role="application"]');
            const rect=canvas.getBoundingClientRect();
            canvas.dispatchEvent(new MouseEvent('mousedown',{button:2,buttons:3,bubbles:true,cancelable:true,clientX:rect.left+rect.width*.72,clientY:rect.top+rect.height*.52}));
          });
          await page.waitForTimeout(70);
          const dash=await page.evaluate(()=>({mouseDown:window.duckHeistEngine.mouseDown,dash:window.duckHeistEngine.player.dashTimer}));
          await page.mouse.up({button:'left'});
          if(!dash.mouseDown||dash.dash<=0)throw new Error('dash/fire regression');

          // Pause -> Run Info -> second tab -> back.
          await page.keyboard.press('Escape');
          await page.waitForFunction(()=>window.duckHeistEngine.state==='PAUSED');
          await page.evaluate(()=>{window.duckHeistEngine.pauseIndex=2;});
          await page.keyboard.press('Enter');
          await page.waitForFunction(()=>window.duckHeistEngine.state==='RUN_INFO');
          let info=await snap('run info build');
          if(info.runInfoTab!==0)throw new Error('run info build tab not selected');
          await page.keyboard.press('ArrowRight');
          info=await snap('run info performance');
          if(info.runInfoTab!==1)throw new Error('run info second tab not reachable');
          await page.keyboard.press('Escape');
          await page.waitForFunction(()=>window.duckHeistEngine.state==='PAUSED');

          // Restart is protected and defaults to Cancel.
          await page.evaluate(()=>{window.duckHeistEngine.pauseIndex=3;});
          await page.keyboard.press('Enter');
          await page.waitForFunction(()=>window.duckHeistEngine.state==='CONFIRM');
          let confirm=await snap('restart confirm');
          if(confirm.confirmKind!=='restart'||confirm.confirmIndex!==1)throw new Error('unsafe restart confirmation default');
          await page.keyboard.press('Escape');
          await page.waitForFunction(()=>window.duckHeistEngine.state==='PAUSED');

          // Quit is protected and cancel returns to pause.
          await page.evaluate(()=>{window.duckHeistEngine.pauseIndex=6;});
          await page.keyboard.press('Enter');
          await page.waitForFunction(()=>window.duckHeistEngine.state==='CONFIRM');
          confirm=await snap('quit confirm');
          if(confirm.confirmKind!=='quit'||confirm.confirmIndex!==1)throw new Error('unsafe quit confirmation default');
          await page.keyboard.press('Enter'); // default cancel
          await page.waitForFunction(()=>window.duckHeistEngine.state==='PAUSED');

          // Endless reward escape is also protected and returns to its origin after cancel.
          await page.evaluate(()=>{
            const e=window.duckHeistEngine;e.state='ENDLESS_REWARD';e.gameMode='endless';
            e.endless.round=12;e.endless.alert=3;e.endless.pressure=42;e.endless.awaitingReward=true;
            e.endless.rewardOptions=[];
          });
          await page.keyboard.press('Escape');
          await page.waitForFunction(()=>window.duckHeistEngine.state==='CONFIRM');
          confirm=await snap('endless quit confirm');
          if(confirm.confirmKind!=='quit')throw new Error('endless quit not protected');
          await page.keyboard.press('Escape');
          await page.waitForFunction(()=>window.duckHeistEngine.state==='ENDLESS_REWARD');

          if(errors.length)throw new Error('Runtime errors: '+errors.join(' | '));
          console.log(JSON.stringify({main,beforeMotion,afterMotion,dash,info,confirm},null,2));
          await browser.close();
          JS
      - name: Cleanup temporary QA
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/v080-menu-ux-depth-qa.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'chore: remove temporary v0.8.0 menu UX QA'
            git push origin HEAD:feature/v080-menu-ux-depth
          fi
