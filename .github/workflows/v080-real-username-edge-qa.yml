name: v0.8.0 real username login edge QA
on:
  push:
    branches: [feat/v080-username-login]
    paths:
      - '.github/workflows/v080-real-username-edge-qa.yml'
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v080-username-login
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Real Edge Function rejects unknown username generically
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const cfg=JSON.parse(fs.readFileSync('public/velcore-cloud.json','utf8'));
          const res=await fetch(cfg.supabaseUrl+'/functions/v1/vg-login',{
            method:'POST',
            headers:{'Content-Type':'application/json','apikey':cfg.anonKey},
            body:JSON.stringify({username:'DefinitelyMissingUser987',password:'ExamplePass_123'})
          });
          const body=await res.json();
          console.log(JSON.stringify({status:res.status,code:body.code,hasEmail:Object.prototype.hasOwnProperty.call(body,'email')},null,2));
          if(res.status!==400)throw new Error('expected 400');
          if(body.code!=='invalid_credentials')throw new Error('unexpected code '+body.code);
          if(Object.prototype.hasOwnProperty.call(body,'email'))throw new Error('email leaked');
          JS
      - name: Remove temporary workflow
        if: always()
        run: |
          rm -f .github/workflows/v080-real-username-edge-qa.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'ci: remove real username edge QA'
            git push origin HEAD:feat/v080-username-login
          fi
