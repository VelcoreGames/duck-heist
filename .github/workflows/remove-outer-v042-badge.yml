name: Remove outer v0.4.2 badge

on:
  push:
    paths:
      - '.github/workflows/remove-outer-v042-badge.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Remove only the outer canvas injection
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('web-release/index.html')
          s = p.read_text(encoding='utf-8')
          pattern = r'\s*<script>\s*/\* DH_V0_4_2_CANVAS_BADGE \*/.*?</script>\s*'
          s2, n = re.subn(pattern, '\n', s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'Expected exactly one outer badge script, removed {n}')
          p.write_text(s2, encoding='utf-8')
          PY

      - name: Rebuild Hostinger output
        run: |
          set -euxo pipefail
          npm run build
          node --check web-release/assets/duck-heist-v042.js
          grep -q 'DH_V0_4_2_MENU_BADGE' web-release/assets/duck-heist-v042.js
          grep -q 'DH_V0_4_2_BLINK' web-release/assets/duck-heist-v042.js
          ! grep -q 'DH_V0_4_2_CANVAS_BADGE' web-release/index.html
          ! grep -q 'DH_V0_4_2_CANVAS_BADGE' dist/index.html
          grep -q 'duck-heist-v042.js' dist/index.html

      - name: Clean temporary inspection files
        run: |
          rm -f inspection-duplicate-v042.txt
          rm -f .github/workflows/inspect-duplicate-v042.yml
          rm -f .github/workflows/remove-outer-v042-badge.yml

      - name: Commit fix
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove duplicate outer v0.4.2 badge'
          git push origin HEAD:main
