name: v0.8.0 real email auth stage 1
on:
  push:
    branches: [feat/v080-email-first-accounts]
    paths:
      - '.github/workflows/v080-real-email-auth-stage1.yml'

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v080-email-first-accounts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify hosted Auth requires email confirmation
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const cfg=JSON.parse(fs.readFileSync('public/velcore-cloud.json','utf8'));
          const headers={'Content-Type':'application/json','apikey':cfg.anonKey};
          const settingsRes=await fetch(cfg.supabaseUrl+'/auth/v1/settings',{headers:{apikey:cfg.anonKey}});
          const settings=await settingsRes.json();
          console.log('AUTH_SETTINGS',JSON.stringify({
            external:settings.external,
            disable_signup:settings.disable_signup,
            mailer_autoconfirm:settings.mailer_autoconfirm,
          }));

          const email='qa.email.first@example.com';
          const password='PanSeguro_Email_123';
          const res=await fetch(cfg.supabaseUrl+'/auth/v1/signup?redirect_to='+encodeURIComponent('https://velcoregames.com/duck-heist'),{
            method:'POST',headers,body:JSON.stringify({email,password})
          });
          const body=await res.json();
          console.log('SIGNUP_STATUS',res.status);
          console.log('SIGNUP_RESULT',JSON.stringify({
            id:body.id||body.user?.id||null,
            email:body.email||body.user?.email||null,
            email_confirmed_at:body.email_confirmed_at||body.user?.email_confirmed_at||null,
            has_access_token:!!body.access_token,
            message:body.msg||body.message||null,
            code:body.error_code||body.code||null,
          }));
          if(!res.ok)throw new Error('real signup failed '+JSON.stringify(body));
          if(body.access_token)throw new Error('hosted Auth unexpectedly skipped email verification');
          const id=body.id||body.user?.id;
          if(!id)throw new Error('signup did not return user id');
          JS
      - name: Remove temporary workflow
        if: always()
        run: |
          rm -f .github/workflows/v080-real-email-auth-stage1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'ci: remove real email auth stage 1'
            git push origin HEAD:feat/v080-email-first-accounts
          fi
