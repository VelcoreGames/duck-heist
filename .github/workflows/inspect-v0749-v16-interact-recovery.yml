name: Inspect Duck Heist v0.7.49 V16 Interact Recovery

on:
  push:
    paths:
      - '.github/workflows/inspect-v0749-v16-interact-recovery.yml'
      - 'scripts/patch-v0749-v16-interact-recovery.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Apply V16 interact recovery candidate
        run: python scripts/patch-v0749-v16-interact-recovery.py

      - name: Validate candidate scope and source
        run: |
          grep -q "return Math.min(COUNT.interact - 1, tick)" src/game/graphics/playerChibiAtlasV16.ts
          grep -q "rt.state === 'interact' && wanted === 'idle' && age < COUNT.interact" src/game/graphics/playerChibiAtlasV16.ts
          grep -q '0.7.49-chibi-v16-interact-recovery-candidate' index.html
          grep -q 'const DRAW = 46' src/game/graphics/playerChibiAtlasV16.ts
          grep -q '464-raster-chibi-v16' src/game/graphics/playerChibiAtlasV16.ts
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' index.html src/game/graphics/playerChibiAtlasV16.ts | sort)"
          test "$changed" = "$expected"
          test -z "$(git diff -- src/game/engine.ts src/App.tsx src/game/types.ts src/game/constants.ts)"
          git diff --check

      - name: Add local-only QA engine hook
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/App.tsx');s=p.read_text()
          old='''    const engine = createEngine(wc, wctx, uctx);\n    engineRef.current = engine;\n'''
          new='''    const engine = createEngine(wc, wctx, uctx);\n    engineRef.current = engine;\n    (window as Window & { __duckQaEngine?: GameEngine }).__duckQaEngine = engine;\n'''
          if s.count(old)!=1: raise SystemExit('QA hook anchor mismatch')
          p.write_text(s.replace(old,new,1))
          PY

      - name: Validate TypeScript and build
        run: |
          npx tsc --noEmit
          npx vite build --outDir /tmp/v0749-build --emptyOutDir
          grep -q '0.7.49-chibi-v16-interact-recovery-candidate' /tmp/v0749-build/index.html
          grep -q '464-raster-chibi-v16' /tmp/v0749-build/index.html

      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify interact pacing and action interruption
        run: |
          mkdir -p /tmp/v0749-review
          cd /tmp/v0749-build
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/v0749-http.log 2>&1 &
          echo $! >/tmp/v0749-http.pid
          cd "$GITHUB_WORKSPACE"
          node <<'NODE'
          const {chromium}=require('playwright');const fs=require('fs'),assert=require('assert');
          const out='/tmp/v0749-review',expected='0.7.49-chibi-v16-interact-recovery-candidate',sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const errors=[],failed=[],bad=[],samples={};
          async function ds(p){return p.evaluate(()=>{const e=window.__duckQaEngine;return {build:document.querySelector('meta[name="duck-heist-build"]')?.content||'',renderer:document.documentElement.dataset.duckHeistPlayerRenderer||'',frames:document.documentElement.dataset.duckHeistPlayerFrames||'',fx:document.documentElement.dataset.duckHeistPlayerFx||'',state:document.documentElement.dataset.duckHeistPlayerState||'',visualFrame:document.documentElement.dataset.duckHeistPlayerVisualFrame||'',engineState:e?.state,switchAnim:e?.player.switchAnim,moving:e?.player.moving,dashTimer:e?.player.dashTimer,hurtTimer:e?.player.hurtTimer};});}
          async function start(p){await p.goto(`http://127.0.0.1:4173/?qa=v0749&t=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:60000});await sleep(1500);assert.strictEqual((await ds(p)).build,expected);const c=p.locator('canvas[role="application"]');await c.focus();await p.keyboard.press('Enter');for(let i=0;i<10;i++){await sleep(650);const d=await ds(p);if(d.engineState==='PLAYING'&&d.state==='idle')return d;await p.keyboard.press('Enter');}throw new Error('did not reach PLAYING idle');}
          async function setSwitch(p,n){await p.evaluate(n=>{const e=window.__duckQaEngine;if(!e)throw new Error('engine missing');e.keys={};e.mouseDown=false;e.player.moving=false;e.player.shootFlash=0;e.player.dashTimer=0;e.player.hurtTimer=0;e.player.switchAnim=n;},n);}
          async function observe(p,ms=420){const seen=[];const t0=Date.now();while(Date.now()-t0<ms){seen.push(await ds(p));await sleep(10);}return seen;}
          (async()=>{const browser=await chromium.launch({headless:true});const context=await browser.newContext({viewport:{width:1440,height:1000},deviceScaleFactor:1});const p=await context.newPage();p.on('console',m=>{if(m.type()==='error')errors.push(m.text())});p.on('pageerror',e=>errors.push(e.message));p.on('requestfailed',r=>failed.push(`${r.method()} ${r.url()} ${r.failure()?.errorText||''}`));p.on('response',r=>{if(r.status()>=400)bad.push(`${r.status()} ${r.url()}`)});
          samples.idle=await start(p);assert.strictEqual(samples.idle.renderer,'canvas2d-chibi-atlas-v16');assert.strictEqual(samples.idle.frames,'464-raster-chibi-v16');

          // Normal 12-tick weapon cycle must expose all authored interact frames and settle to idle.
          await setSwitch(p,12);await sleep(28);await p.screenshot({path:`${out}/01-interact-early.png`,fullPage:true});samples.normal=await observe(p,360);
          const normalFrames=new Set(samples.normal.filter(x=>x.state==='interact').map(x=>x.visualFrame));
          assert(normalFrames.has('interact:0')||normalFrames.has('interact:1')||normalFrames.has('interact:2'),'interact did not start near authored beginning');
          assert(normalFrames.has('interact:11'),'normal switch never reached authored interact frame 11');
          assert(samples.normal.some(x=>x.state==='idle'),'normal switch did not recover to idle');
          await p.screenshot({path:`${out}/02-interact-recovered.png`,fullPage:true});

          // Short 10-tick equip gets only the two missing visual recovery ticks when stationary.
          await setSwitch(p,10);samples.short=await observe(p,320);const shortFrames=new Set(samples.short.filter(x=>x.state==='interact').map(x=>x.visualFrame));
          assert(shortFrames.has('interact:11'),'short stationary equip did not finish authored recovery');
          assert(samples.short.some(x=>x.switchAnim===0&&x.state==='interact'),'short equip did not use visual-only recovery after gameplay timer ended');
          assert(samples.short.some(x=>x.state==='idle'),'short equip did not settle to idle');

          // Movement must win as soon as the gameplay switch timer expires; no visual sliding hold.
          await setSwitch(p,10);await p.keyboard.down('d');samples.move=await observe(p,300);await p.keyboard.up('d');
          const zeroAt=samples.move.findIndex(x=>x.switchAnim===0);assert(zeroAt>=0,'moving switch never reached zero');
          assert(samples.move.slice(zeroAt).some(x=>x.state==='walk'),'movement did not take over after switch timer');

          // Hurt always has higher presentation priority than interact.
          await setSwitch(p,12);await sleep(35);await p.evaluate(()=>{const e=window.__duckQaEngine;if(!e)throw new Error('engine missing');e.player.hurtTimer=8;});await sleep(35);samples.hurt=await ds(p);assert.strictEqual(samples.hurt.state,'hurt');

          // Dash always has higher presentation priority than interact.
          await setSwitch(p,12);await p.keyboard.down('d');await sleep(30);await p.keyboard.press('Shift');await sleep(35);samples.dash=await ds(p);await p.keyboard.up('d');assert.strictEqual(samples.dash.state,'dash');
          await p.screenshot({path:`${out}/03-interrupt-dash.png`,fullPage:true});

          assert.strictEqual(errors.length,0,errors.join(' | '));assert.strictEqual(failed.length,0,failed.join(' | '));assert.strictEqual(bad.length,0,bad.join(' | '));fs.writeFileSync(`${out}/qa.json`,JSON.stringify({samples:{idle:samples.idle,normalFrames:[...normalFrames],shortFrames:[...shortFrames],move:samples.move.slice(-8),hurt:samples.hurt,dash:samples.dash},errors,failed,bad},null,2));await browser.close();})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          kill "$(cat /tmp/v0749-http.pid)" || true

      - name: Upload candidate review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duck-heist-v0749-interact-recovery-candidate
          path: /tmp/v0749-review
          if-no-files-found: warn
          retention-days: 7
