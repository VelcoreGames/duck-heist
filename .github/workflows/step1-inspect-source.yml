name: Step 1 inspect bundled source

on:
  push:
    branches: [step1-source-sync]
    paths:
      - '.github/workflows/step1-inspect-source.yml'
      - 'dist/resources/duck-heist-source.zip'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect bundled source archive
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/bundled-src
          mkdir -p /tmp/bundled-src
          unzip -q dist/resources/duck-heist-source.zip -d /tmp/bundled-src
          echo '=== TOP LEVEL ==='
          find /tmp/bundled-src -maxdepth 2 -type f | sort | head -120
          echo '=== PACKAGE FILES ==='
          find /tmp/bundled-src -name package.json -print
          echo '=== SOURCE FILES ==='
          find /tmp/bundled-src -path '*/src/App.tsx' -o -path '*/src/game/render.ts' -o -path '*/src/game/engine.ts' -o -path '*/src/game/itemRules.ts' -o -path '*/src/game/mapgen.ts'
          echo '=== PACKAGE CONTENT ==='
          while IFS= read -r p; do echo "--- $p"; cat "$p"; done < <(find /tmp/bundled-src -name package.json -print)
          echo '=== HASHES bundled/current ==='
          ROOT=$(dirname "$(find /tmp/bundled-src -path '*/src/App.tsx' -print -quit)")
          ROOT=$(dirname "$ROOT")
          for f in src/App.tsx src/game/render.ts src/game/engine.ts src/game/itemRules.ts src/game/mapgen.ts package.json index.html; do
            if [ -f "$ROOT/$f" ]; then printf '%s bundled ' "$f"; sha256sum "$ROOT/$f" | cut -d' ' -f1; fi
            if [ -f "$f" ]; then printf '%s current  ' "$f"; sha256sum "$f" | cut -d' ' -f1; fi
          done
      - name: Upload extracted source
        uses: actions/upload-artifact@v4
        with:
          name: bundled-source-inspection
          path: /tmp/bundled-src
          retention-days: 1
