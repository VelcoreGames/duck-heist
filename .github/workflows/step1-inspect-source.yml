name: Step 1 inspect bundled source

on:
  push:
    branches: [step1-source-sync]
    paths:
      - '.github/workflows/step1-inspect-source.yml'
      - 'scripts/step1-sync-v043-source.py'
      - 'dist/resources/duck-heist-source.zip'
      - 'src/**'
      - 'package.json'
      - 'vite.config.ts'
      - 'index.html'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply guarded v0.4.3 source sync
        run: python scripts/step1-sync-v043-source.py
      - name: Commit synced source on isolated branch
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- src; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src
            git commit -m 'Sync v0.4.3 production behavior into source'
            git push origin HEAD:step1-source-sync
          fi
      - name: Inspect approved bundle event and parity contexts
        shell: python
        run: |
          from pathlib import Path
          s=Path('web-release/assets/index-BgUNQzP_.js').read_text(encoding='utf-8')
          terms=['DH_SPAWN_EVENT_SECURITY','dangerEventStarted','dangerEventActive','dangerEventTotal','dangerEventPressure','cafe','EVENTO DE ALTO RIESGO','Primero sobrevive al operativo.','security_terminal','field_medic','weapon_forge','SOBREVIVE','visualViewport','duck-responsive-shell','ESTADÍSTICAS DE LA RUN','remoteBomb','remote_bomb']
          for term in terms:
              print(f'\n===== {term} total={s.count(term)} =====')
              start=0
              for n in range(12):
                  i=s.find(term,start)
                  if i<0: break
                  print(f'\n--- hit {n+1} at {i} ---')
                  print(s[max(0,i-6500):min(len(s),i+8500)])
                  start=i+len(term)
      - name: Inspect event-room construction around cafe flags
        shell: python
        run: |
          from pathlib import Path
          s=Path('web-release/assets/index-BgUNQzP_.js').read_text(encoding='utf-8')
          for term in ['cafe=', '.cafe', 'cafe:', 'EVENT', 'event={', 'kind:']:
              print(f'\n===== ROOM TERM {term} total={s.count(term)} =====')
              start=0
              for n in range(20):
                  i=s.find(term,start)
                  if i<0: break
                  ctx=s[max(0,i-3200):min(len(s),i+5200)]
                  if 'cafe' in ctx or 'dangerEvent' in ctx or 'EVENT' in ctx:
                      print(f'\n--- relevant hit {n+1} at {i} ---')
                      print(ctx)
                  start=i+len(term)
      - name: Inspect source contexts
        shell: bash
        run: |
          set -euo pipefail
          for term in dangerEventActive dangerEventStarted cafe 'EVENTO DE ALTO RIESGO' visualViewport 'ESTADÍSTICAS DE LA RUN' remoteBomb remote_bomb activeItemCooldown alarmTimer rewardChance; do
            echo "=== SOURCE $term ==="
            grep -RFn --exclude='*.map' -- "$term" src index.html package.json vite.config.ts 2>/dev/null || true
          done
      - name: Install, typecheck and source-build smoke test
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx tsc --noEmit
          rm -rf /tmp/source-build
          npx vite build --outDir /tmp/source-build
          test -f /tmp/source-build/index.html
          echo '=== SOURCE BUILD FILES ==='
          find /tmp/source-build -maxdepth 2 -type f | sort | head -100
      - name: Upload source build
        uses: actions/upload-artifact@v4
        with:
          name: step1-current-source-build
          path: /tmp/source-build
          retention-days: 1
