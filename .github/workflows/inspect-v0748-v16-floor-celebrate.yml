name: Inspect Duck Heist v0.7.48 V16 Floor Celebrate

on:
  push:
    paths:
      - '.github/workflows/inspect-v0748-v16-floor-celebrate.yml'
      - 'scripts/patch-v0748-v16-floor-celebrate.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply floor celebrate candidate
        run: python scripts/patch-v0748-v16-floor-celebrate.py
      - name: Validate candidate scope and source
        run: |
          grep -q "'celebrate'" src/game/graphics/playerChibiAtlasV16.ts
          grep -q 'celebrating?: boolean' src/game/graphics/playerChibiRemastered.ts
          grep -q 'celebrating: engine.state === GameState.FLOOR_CLEAR' src/game/render.ts
          grep -q "state === 'celebrate'" src/game/graphics/playerChibiAtlasV16.ts
          grep -q '0.7.48-chibi-v16-floor-celebrate-candidate' index.html
          grep -q 'const DRAW = 46' src/game/graphics/playerChibiAtlasV16.ts
          grep -q '464-raster-chibi-v16' src/game/graphics/playerChibiAtlasV16.ts
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' index.html src/game/graphics/playerChibiAtlasV16.ts src/game/graphics/playerChibiRemastered.ts src/game/render.ts | sort)"
          test "$changed" = "$expected"
          git diff --check
      - name: Add local-only QA engine hook
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/App.tsx');s=p.read_text()
          old='''    const engine = createEngine(wc, wctx, uctx);\n    engineRef.current = engine;\n'''
          new='''    const engine = createEngine(wc, wctx, uctx);\n    engineRef.current = engine;\n    (window as Window & { __duckQaEngine?: GameEngine }).__duckQaEngine = engine;\n'''
          if s.count(old)!=1: raise SystemExit('QA hook anchor mismatch')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Validate TypeScript and build
        run: |
          npx tsc --noEmit
          npx vite build --outDir /tmp/v0748-build --emptyOutDir
          grep -q '0.7.48-chibi-v16-floor-celebrate-candidate' /tmp/v0748-build/index.html
      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify floor-clear celebration
        run: |
          mkdir -p /tmp/v0748-review
          cd /tmp/v0748-build
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/v0748-http.log 2>&1 &
          echo $! >/tmp/v0748-http.pid
          cd "$GITHUB_WORKSPACE"
          node <<'NODE'
          const {chromium}=require('playwright');const fs=require('fs'),assert=require('assert');
          const out='/tmp/v0748-review',expected='0.7.48-chibi-v16-floor-celebrate-candidate',sleep=ms=>new Promise(r=>setTimeout(r,ms));const errors=[],failed=[],bad=[],samples={};
          async function ds(p){return p.evaluate(()=>{const e=window.__duckQaEngine;return {build:document.querySelector('meta[name="duck-heist-build"]')?.content||'',renderer:document.documentElement.dataset.duckHeistPlayerRenderer||'',frames:document.documentElement.dataset.duckHeistPlayerFrames||'',fx:document.documentElement.dataset.duckHeistPlayerFx||'',playerState:document.documentElement.dataset.duckHeistPlayerState||'',visualFrame:document.documentElement.dataset.duckHeistPlayerVisualFrame||'',engineState:e?.state,floorClearTimer:e?.floorClearTimer};});}
          async function start(p){await p.goto(`http://127.0.0.1:4173/?qa=v0748&t=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:60000});await sleep(1500);assert.strictEqual((await ds(p)).build,expected);const c=p.locator('canvas[role="application"]');await c.focus();await p.keyboard.press('Enter');for(let i=0;i<10;i++){await sleep(650);const d=await ds(p);if(d.engineState==='PLAYING'&&d.playerState==='idle')return d;await p.keyboard.press('Enter');}throw new Error('did not reach PLAYING idle');}
          (async()=>{const browser=await chromium.launch({headless:true});const context=await browser.newContext({viewport:{width:1440,height:1000},deviceScaleFactor:1});const p=await context.newPage();p.on('console',m=>{if(m.type()==='error')errors.push(m.text())});p.on('pageerror',e=>errors.push(e.message));p.on('requestfailed',r=>failed.push(`${r.method()} ${r.url()} ${r.failure()?.errorText||''}`));p.on('response',r=>{if(r.status()>=400)bad.push(`${r.status()} ${r.url()}`)});
          samples.idle=await start(p);assert.strictEqual(samples.idle.renderer,'canvas2d-chibi-atlas-v16');assert.strictEqual(samples.idle.frames,'464-raster-chibi-v16');assert.strictEqual(samples.idle.fx,'v16.8-death-focus');
          await p.evaluate(()=>{const e=window.__duckQaEngine;if(!e)throw new Error('engine missing');e.state='FLOOR_CLEAR';e.floorClearTimer=120;e.player.moving=false;e.player.shootFlash=0;e.player.dashTimer=0;e.player.hurtTimer=0;});
          await sleep(100);samples.a=await ds(p);assert.strictEqual(samples.a.engineState,'FLOOR_CLEAR');assert.strictEqual(samples.a.playerState,'celebrate');await p.screenshot({path:`${out}/01-celebrate-a.png`,fullPage:true});
          await sleep(220);samples.b=await ds(p);assert.strictEqual(samples.b.playerState,'celebrate');assert.notStrictEqual(samples.a.visualFrame,samples.b.visualFrame);await p.screenshot({path:`${out}/02-celebrate-b.png`,fullPage:true});
          assert.strictEqual(errors.length,0,errors.join(' | '));assert.strictEqual(failed.length,0,failed.join(' | '));assert.strictEqual(bad.length,0,bad.join(' | '));fs.writeFileSync(`${out}/qa.json`,JSON.stringify({samples,errors,failed,bad},null,2));await browser.close();})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          kill "$(cat /tmp/v0748-http.pid)" || true
      - name: Upload candidate review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duck-heist-v0748-floor-celebrate-candidate
          path: /tmp/v0748-review
          if-no-files-found: warn
          retention-days: 7
