name: Step 1 sync v0.4.3 commerce parity

on:
  push:
    branches: [step1-source-sync]
    paths:
      - '.github/workflows/step1-sync-commerce.yml'

permissions:
  contents: write

jobs:
  sync-commerce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: step1-source-sync
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Port approved v0.4.3 shop, gun van and cafe behavior to source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def patch(path, old, new, label):
              p=Path(path); s=p.read_text(encoding='utf-8')
              if new in s: return
              count=s.count(old)
              if count!=1: raise SystemExit(f'{label}: expected 1 match, found {count}')
              p.write_text(s.replace(old,new,1),encoding='utf-8')

          # Room type present in approved v0.4.3 bundle.
          patch('src/game/constants.ts',
                "  SHOP = 'SHOP',\n  CHALLENGE = 'CHALLENGE',",
                "  SHOP = 'SHOP',\n  GUN_VAN = 'GUN_VAN',\n  CHALLENGE = 'CHALLENGE',",
                'GUN_VAN enum')

          # Exact approved generation order/chances.
          patch('src/game/mapgen.ts',
                "  // Tienda: distancia media\n  assignMiddle(remaining(), RoomType.SHOP);\n  // Tesoro: preferentemente callejón sin salida\n  assignDeadEndOrRandom(remaining(), RoomType.TREASURE,random);",
                "  // Tienda: distancia media\n  assignMiddle(remaining(), RoomType.SHOP);\n  // Camioneta del mercado negro: aparece solo en mapas suficientemente grandes.\n  if (remaining().length > 7 && random() < 0.42) assignDeadEndOrRandom(remaining(), RoomType.GUN_VAN, random);\n  // Tesoro: preferentemente callejón sin salida\n  assignDeadEndOrRandom(remaining(), RoomType.TREASURE,random);",
                'gun van map chance')
          patch('src/game/mapgen.ts',
                "  if(remaining().length>6) assignDeadEndOrRandom(remaining(),RoomType.EVENT,random);",
                "  if(remaining().length>6 && random()<0.38) assignDeadEndOrRandom(remaining(),RoomType.EVENT,random);",
                'event room chance')

          # Approved normal shop: three passive/active products; weapons live in GUN_VAN.
          p=Path('src/game/engine.ts'); s=p.read_text(encoding='utf-8')
          old='''    case RoomType.SHOP: {\n      const first=pickPassive(engine) ?? fallbackActive(engine);\n      const second=Math.random()<.5?fallbackActive(engine):(pickPassive(engine,undefined,[first]) ?? fallbackActive(engine));\n      const itemPool=[first,second];\n      const shop = [];\n      for (let i = 0; i < 2; i++) {\n        const id = itemPool[i];\n        if (!id) continue;\n        shop.push({\n          itemId: id, cost: (ITEMS[id] ?? ACTIVE_ITEMS[id]).cost, sold: false, isWeapon: false,\n          x: CANVAS_WIDTH * (0.28 + i * 0.22), y: CANVAS_HEIGHT * 0.58,\n        });\n      }\n      const w = rollWeapon(engine);\n      shop.push({ itemId: w, cost: WEAPONS[w].cost, sold: false, isWeapon: true, x: CANVAS_WIDTH * 0.72, y: CANVAS_HEIGHT * 0.58 });\n      content.shopItems = shop;\n      break;\n    }\n'''
          new='''    case RoomType.SHOP: {\n      const first=pickPassive(engine) ?? fallbackActive(engine);\n      const second=pickPassive(engine,undefined,[first]) ?? fallbackActive(engine);\n      const third=pickPassive(engine,undefined,[first,second]) ?? fallbackActive(engine);\n      const itemPool=[first,second,third].filter(Boolean);\n      content.shopItems=itemPool.map((id,i)=>({\n        itemId:id,cost:(ITEMS[id] ?? ACTIVE_ITEMS[id]).cost,sold:false,isWeapon:false,\n        x:CANVAS_WIDTH*(0.28+i*0.22),y:CANVAS_HEIGHT*0.58,\n      }));\n      break;\n    }\n    case RoomType.GUN_VAN: {\n      const owned=new Set(engine.player.weapons.filter(Boolean).map(w=>w!.id));\n      let pool=Object.keys(WEAPONS).filter(id=>id!=='quack_blaster'&&!owned.has(id));\n      if(pool.length<3) pool=Object.keys(WEAPONS).filter(id=>id!=='quack_blaster');\n      const selected:string[]=[];\n      while(selected.length<3 && pool.length) {\n        const index=Math.floor(Math.random()*pool.length);\n        selected.push(pool.splice(index,1)[0]);\n      }\n      content.shopItems=selected.map((id,i)=>({\n        itemId:id,cost:Math.max(8,WEAPONS[id].cost),sold:false,isWeapon:true,x:145+i*95,y:235,\n      }));\n      break;\n    }\n'''
          if new not in s:
              if s.count(old)!=1: raise SystemExit(f'commerce room content: expected 1 match, found {s.count(old)}')
              s=s.replace(old,new,1)
          s=s.replace("room.type===RoomType.SHOP?'green':room.type===RoomType.TREASURE?'purple':'silver'",
                      "room.type===RoomType.SHOP?'green':room.type===RoomType.GUN_VAN?'orange':room.type===RoomType.TREASURE?'purple':'silver'",1)
          s=s.replace("if(room.type===RoomType.SHOP && (content.merchantUntil ?? 0)<engine.frame) merchantSpeak(engine,pick(['Todo legal. Probablemente.','No tengo factura.','Eso cayó de un camión.','El pan está caro.','No hago devoluciones.','Ese objeto no estaba aquí ayer.']));",
                      "if((room.type===RoomType.SHOP||room.type===RoomType.GUN_VAN) && (content.merchantUntil ?? 0)<engine.frame) merchantSpeak(engine,room.type===RoomType.GUN_VAN?pick(['Tres fierros. Cero preguntas.','La camioneta no existe.','Mira rápido y paga en migajas.','No preguntes de dónde salieron.']):pick(['Todo legal. Probablemente.','No tengo factura.','Eso cayó de un camión.','El pan está caro.','No hago devoluciones.','Ese objeto no estaba aquí ayer.']));",1)
          s=s.replace("    case RoomType.SHOP: return 'TIENDA CLANDESTINA';",
                      "    case RoomType.SHOP: return 'TIENDA CLANDESTINA';\n    case RoomType.GUN_VAN: return 'CAMIONETA DEL MERCADO NEGRO';",1)
          p.write_text(s,encoding='utf-8')

          # Full-map parity: style, GPS and shop-reveal include GUN_VAN; exact van glyph.
          p=Path('src/game/floorMap.ts'); s=p.read_text(encoding='utf-8')
          s=s.replace("  [RoomType.SHOP]:{label:'TIENDA',color:'#71c799',symbol:'shop'},",
                      "  [RoomType.SHOP]:{label:'TIENDA',color:'#71c799',symbol:'shop'},\n  [RoomType.GUN_VAN]:{label:'CAMIONETA',color:'#e79a45',symbol:'van'},",1)
          s=s.replace("return type==='shop'?r.type===RoomType.SHOP:type==='boss'?r.type===RoomType.BOSS:!!e.contents.get(id)?.stairs;",
                      "return type==='shop'?(r.type===RoomType.SHOP||r.type===RoomType.GUN_VAN):type==='boss'?r.type===RoomType.BOSS:!!e.contents.get(id)?.stairs;",1)
          s=s.replace("if(b.shopReveal) for(const [id,r]of rooms) if(r.type===RoomType.SHOP) reveal(id);",
                      "if(b.shopReveal) for(const [id,r]of rooms) if(r.type===RoomType.SHOP||r.type===RoomType.GUN_VAN) reveal(id);",1)
          s=s.replace("    case 'shop':rect(2,2,8,2);rect(2,3,2,3);rect(3,5,7,2);rect(8,6,2,3);rect(2,9,8,2);rect(5,0,2,12);break;",
                      "    case 'shop':rect(2,2,8,2);rect(2,3,2,3);rect(3,5,7,2);rect(8,6,2,3);rect(2,9,8,2);rect(5,0,2,12);break;\n    case 'van':rect(1,4,10,5);rect(3,2,5,3);c.fillStyle='#111820';rect(4,3,3,2);c.fillStyle=style.color;rect(2,9,2,2);rect(8,9,2,2);break;",1)
          p.write_text(s,encoding='utf-8')

          # World rendering: orange doors, black-market van, cafe counter and shop stands.
          p=Path('src/game/render.ts'); s=p.read_text(encoding='utf-8')
          s=s.replace("      : target?.type === RoomType.BOSS ? 'boss' : target?.type===RoomType.SHOP?'green'\n      :target?.type===RoomType.MINIBOSS?'orange'",
                      "      : target?.type === RoomType.BOSS ? 'boss' : target?.type===RoomType.SHOP?'green'\n      :target?.type===RoomType.GUN_VAN||target?.type===RoomType.MINIBOSS?'orange'",1)
          old_block='''  if (room.type === RoomType.SHOP && content.shopItems) {\n    drawShopPigeon(ctx, CANVAS_WIDTH / 2 - 8, CANVAS_HEIGHT * 0.22, f);\n    for (const it of content.shopItems) {\n      if (it.sold) continue;\n      if (it.isWeapon) drawWeaponIcon(ctx, it.x - 8, it.y - 8, it.itemId);\n      else drawItem(ctx, it.x - 8, it.y - 8, it.itemId, f);\n    }\n  }\n'''
          new_block='''  if ((room.type === RoomType.SHOP || room.type === RoomType.GUN_VAN || content.cafe) && content.shopItems) {\n    if(room.type===RoomType.GUN_VAN) drawGunVanScene(ctx,f);\n    else if(content.cafe) drawCafeScene(ctx,f);\n    else drawShopPigeon(ctx, CANVAS_WIDTH / 2 - 8, CANVAS_HEIGHT * 0.22, f);\n    for (const it of content.shopItems) {\n      if (it.sold) continue;\n      drawShopStand(ctx,it.x,it.y,room.type===RoomType.GUN_VAN?'van':content.cafe?'cafe':'shop');\n      if(it.isFood) drawItemIcon(ctx,it.x-12,it.y-12,it.itemId,24);\n      else if (it.isWeapon) drawWeaponIcon(ctx, it.x - 8, it.y - 8, it.itemId);\n      else drawItem(ctx, it.x - 8, it.y - 8, it.itemId, f);\n    }\n  }\n'''
          if new_block not in s:
              if s.count(old_block)!=1: raise SystemExit('shop render block anchor missing')
              s=s.replace(old_block,new_block,1)

          # Room tint used by approved GUN_VAN room.
          s=s.replace("  } else if (room.type === RoomType.SHOP) {\n    ctx.fillStyle = 'rgba(120,72,30,0.28)';",
                      "  } else if (room.type === RoomType.GUN_VAN) {\n    ctx.fillStyle='rgba(3,5,8,.38)';ctx.fillRect(TILE_SIZE,TILE_SIZE,CANVAS_WIDTH-TILE_SIZE*2,CANVAS_HEIGHT-TILE_SIZE*2);\n    ctx.fillStyle='rgba(231,154,69,.12)';for(let x=90;x<410;x+=70)ctx.fillRect(x,286,34,3);\n  } else if (room.type === RoomType.SHOP) {\n    ctx.fillStyle = 'rgba(120,72,30,0.28)';",1)

          # Approved merchant heading for normal shop / cafe / gun van.
          s=s.replace("    text(ctx, 'DON MIGAJÓN', CANVAS_WIDTH / 2, CANVAS_HEIGHT * 0.16, 11, '#f4d03f', 'center', true);",
                      "    text(ctx, room.type===RoomType.GUN_VAN?'EL PROVEEDOR':content.cafe?'BARISTA MIGAJÓN':'DON MIGAJÓN', CANVAS_WIDTH/2, CANVAS_HEIGHT*.16, 11, room.type===RoomType.GUN_VAN?'#e79a45':content.cafe?'#e7b978':'#f4d03f', 'center', true);",1)

          helper='''\nfunction drawGunVanScene(ctx:CanvasRenderingContext2D,f:number) {\n  ctx.save();ctx.fillStyle='rgba(0,0,0,.45)';ctx.beginPath();ctx.ellipse(240,161,100,14,0,0,Math.PI*2);ctx.fill();\n  ctx.fillStyle='#05070a';ctx.fillRect(148,89,158,57);ctx.fillStyle='#0d1217';ctx.fillRect(157,80,105,11);ctx.fillRect(262,86,52,60);\n  ctx.fillStyle='#27343d';ctx.fillRect(269,93,35,20);ctx.fillStyle='#56747f';ctx.globalAlpha=.48;ctx.fillRect(273,96,27,14);ctx.globalAlpha=1;\n  ctx.fillStyle='#020304';ctx.fillRect(167,96,87,44);ctx.fillStyle='#171e23';ctx.fillRect(182,104,57,31);\n  ctx.fillStyle='#d28a3c';ctx.globalAlpha=.13+.04*Math.sin(f*.06);ctx.fillRect(185,107,51,25);ctx.globalAlpha=1;\n  ctx.fillStyle='#4a555d';for(let i=0;i<3;i++){ctx.fillRect(190+i*17,111,13,3);ctx.fillRect(193+i*17,106,7,2);}\n  for(const x of [179,293]){ctx.fillStyle='#020304';ctx.beginPath();ctx.arc(x,148,14,0,Math.PI*2);ctx.fill();ctx.fillStyle='#47515a';ctx.beginPath();ctx.arc(x,148,6,0,Math.PI*2);ctx.fill();}\n  ctx.fillStyle='#d99a4b';ctx.fillRect(230,141,24,3);ctx.fillStyle='#d8e2e6';ctx.fillRect(310,106,5,4);ctx.fillStyle='#a52e31';ctx.fillRect(148,109,4,9);\n  drawShopPigeon(ctx,323,118,f);ctx.restore();\n}\n\nfunction drawCafeScene(ctx:CanvasRenderingContext2D,f:number) {\n  ctx.save();ctx.fillStyle='#4d3124';ctx.fillRect(136,106,208,38);ctx.fillStyle='#8a5b3d';ctx.fillRect(136,106,208,4);ctx.fillStyle='#e1b779';ctx.fillRect(142,112,196,3);\n  ctx.fillStyle='#20262c';ctx.fillRect(296,80,34,27);ctx.fillStyle='#9aa6ab';ctx.fillRect(300,84,26,11);ctx.fillStyle='#dce5e7';ctx.fillRect(303,87,20,6);\n  ctx.fillStyle='#efe0bf';ctx.fillRect(152,80,58,24);ctx.fillStyle='#2d2520';ctx.fillRect(156,84,50,16);ctx.fillStyle='#e4b768';ctx.fillRect(161,88,24,2);ctx.fillRect(161,93,32,2);\n  drawShopPigeon(ctx,230,92,f);ctx.fillStyle='#f0ece2';ctx.fillRect(234,110,8,11);ctx.restore();\n}\n\nfunction drawShopStand(ctx:CanvasRenderingContext2D,x:number,y:number,kind:'van'|'cafe'|'shop') {\n  ctx.fillStyle=kind==='van'?'#0a0d10':kind==='cafe'?'#6f4934':'#25382f';ctx.fillRect(x-18,y+9,36,10);\n  ctx.fillStyle=kind==='van'?'#d58e42':kind==='cafe'?'#e7c493':'#66ba89';ctx.fillRect(x-14,y+10,28,2);\n}\n'''
          anchor='// ===========================================================================\n// CAPA DE MUNDO\n// ===========================================================================\n'
          if 'function drawGunVanScene' not in s:
              if anchor not in s: raise SystemExit('render helper anchor missing')
              s=s.replace(anchor,helper+'\n'+anchor,1)
          p.write_text(s,encoding='utf-8')
          PY
          grep -q "GUN_VAN = 'GUN_VAN'" src/game/constants.ts
          grep -q 'random() < 0.42' src/game/mapgen.ts
          grep -q 'random()<0.38' src/game/mapgen.ts
          grep -q 'case RoomType.GUN_VAN' src/game/engine.ts
          grep -q "symbol:'van'" src/game/floorMap.ts
          grep -q 'drawGunVanScene' src/game/render.ts
          grep -q 'drawCafeScene' src/game/render.ts
      - run: npm ci
      - name: TypeScript validation
        run: npx tsc --noEmit
      - name: Vite source build
        run: npx vite build
      - name: Upload validated commerce build
        uses: actions/upload-artifact@v4
        with:
          name: step1-commerce-parity-build
          path: dist
          retention-days: 1
      - name: Commit approved commerce parity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game/constants.ts src/game/mapgen.ts src/game/engine.ts src/game/floorMap.ts src/game/render.ts
          git commit -m 'Restore v0.4.3 commerce and gun van source parity'
          git push origin HEAD:step1-source-sync
